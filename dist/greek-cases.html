is possession; family is relationship.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-relationship","set":"genitive","group":"genitive-adjectival","name":"Relationship","pic":"👨‍👦","eli5":"It is family, and Greek left the family word out. “James of Zebedee” means Zebedee’s son.","formula":{"pattern":["head noun","of X"],"filled":["James","of Zebedee"],"note":"→ James, the SON of Zebedee. The kin word is missing."},"short":"Relationship","gist":"family, kin word missing","tile":"R","oneLine":"X’s son, wife or parent — with the family word left out.","mnemonic":"SWAMP RD — R: supply the missing kin word.","mnemonicWhy":"Greek leaves out “son” or “wife” and expects you to know. Ἰάκωβον τὸν τοῦ Ζεβεδαίου is “James the [son] of Zebedee.”","spotIt":"A name in the genitive with no thing to own? Try slotting in “son of” or “wife of”.","bookDef":"Denotes a family relationship such as a person’s parent or spouse. The word indicating the relationship is often omitted and must be inferred.","examples":[{"ref":"Matt 4:21","greek":"Ἰάκωβον τὸν *τοῦ Ζεβεδαίου*","english":"James the son *of Zebedee*","note":"“Son” is nowhere in the Greek. You supply it."}],"watchOut":"Possession is owning a thing. Relationship is family, with the kin word usually left out.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-description","set":"genitive","group":"genitive-adjectival","name":"Description","pic":"🗑️","eli5":"The leftovers bin. Nobody owns it, it is not made of it — it just describes.","formula":{"pattern":["head noun","of X"],"filled":["a baptism","of repentance"],"note":"Nothing more specific fits."},"short":"Description","gist":"nothing else fits","tile":"D","oneLine":"It describes the head word, and nothing more specific fits.","mnemonic":"SWAMP RD — D: the ditch at the end of the road.","mnemonicWhy":"Walk the ladder first. When nothing more specific fits, this catches it. A baptism of repentance is not owned by repentance, not made of it — just described by it.","spotIt":"Run the ladder. If no other category fits, it is description.","bookDef":"Further limits or describes the head noun, but other common genitival categories do not capture the specific nuance.","examples":[{"ref":"Mark 1:4","greek":"βάπτισμα *μετανοίας*","english":"a baptism *of repentance*","note":"Not possessed, not made of, not from. Just described."}],"watchOut":"Do not reach for this first. It is the bottom of the ladder, not the top.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-subjective","set":"genitive","group":"genitive-verbal","name":"Subjective","pic":"➡️","eli5":"The “of” word is doing it. “The love of Christ” — Christ is doing the loving.","formula":{"pattern":["head noun","of X"],"filled":["the love","of Christ"],"note":"→ Christ loves. X does the action."},"short":"Subjective","gist":"X does the action","tile":"Does it","oneLine":"X is doing the action hidden in the head word.","mnemonic":"Subject does it.","mnemonicWhy":"Turn the head noun back into a verb. “The love of Christ” → Christ loves. X is the one doing it.","spotIt":"Make the head noun a verb, then ask: is X doing it?","bookDef":"Functions semantically as the subject of the verbal idea implied in the head noun, producing the action.","examples":[{"ref":"Rom 8:35","greek":"τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης *τοῦ Χριστοῦ*;","english":"Who can separate us from the love *of Christ*?","note":"Christ is the one loving. Make the noun a verb and X is doing it."}],"tags":["genitive","verbal","ch-3"]},{"id":"genitive-objective","set":"genitive","group":"genitive-verbal","name":"Objective","pic":"⬅️","eli5":"The “of” word is getting it. “Faith of God” means faith IN God.","formula":{"pattern":["head noun","of X"],"filled":["faith","in God"],"note":"→ you believe God. X receives the action."},"short":"Objective","gist":"X receives the action","tile":"Gets it","oneLine":"X is receiving the action hidden in the head word.","mnemonic":"Object gets it.","mnemonicWhy":"Same move, other direction. “Faith of God” means faith IN God — God is on the receiving end.","spotIt":"Make the head noun a verb, then ask: is X getting it?","bookDef":"Functions semantically as the direct object of the verbal idea implicit in the head noun, receiving the action.","examples":[{"ref":"Mark 11:22","greek":"ἔχετε πίστιν *θεοῦ*","english":"Have faith *in God*","note":"God is believed in, not believing. X is receiving the action."}],"watchOut":"Subjective and objective look identical in Greek. Only the sense decides which one it is.","tags":["genitive","verbal","ch-3"]},{"id":"genitive-price","set":"genitive","group":"genitive-adverbial","name":"Price","pic":"💰","eli5":"How much did it cost? “Bought with a price.”","formula":{"pattern":["verb","X (gen.)"],"filled":["bought","with a price"],"note":"for how much?"},"short":"Price","gist":"what it cost","tile":"P","oneLine":"What it cost, or what it is worth.","mnemonic":"PACTS — P: for how much?","mnemonicWhy":"PACTS opens with the price, because the first thing any pact settles is what it costs. ἠγοράσθητε τιμῆς — you were bought at a price.","spotIt":"Ask: at what price? worth how much?","bookDef":"Indicates the price that is paid or the value that attaches to a given item.","examples":[{"ref":"1 Cor 6:20 NASB","greek":"ἠγοράσθητε … *τιμῆς*","english":"you have been bought *with a price*","note":"τιμῆς is what was paid."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-agency","set":"genitive","group":"genitive-adverbial","name":"Means or Agency","pic":"✋","eli5":"Who did it, or what did it. “Blessed BY my Father” — Dad did the blessing.","formula":{"pattern":["verb","X (gen.)"],"filled":["blessed","by my Father"],"note":"by what? by whom?"},"short":"Means or agency","gist":"by whom, by what","tile":"A","oneLine":"By what, or by whom, the action was done.","mnemonic":"PACTS — A: by what? by whom?","mnemonicWhy":"A thing did it (means) or a person did it (agency). Both come out as “by”.","spotIt":"Ask: by what, or by whom? A thing = means. A person = agency.","bookDef":"Conveys the impersonal means or personal agent by which a given action is carried out (“by”).","examples":[{"ref":"Jas 1:13","greek":"ὁ γὰρ θεὸς ἀπείραστός ἐστιν *κακῶν*","english":"Since God is not tempted *by evil*","note":"Means — evil is a thing, not a person."},{"ref":"Matt 25:34","greek":"δεῦτε, οἱ εὐλογημένοι *τοῦ πατρός μου*","english":"Come, you who are blessed *by my Father*","note":"Agency — the Father is a person."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-comparison","set":"genitive","group":"genitive-adverbial","name":"Comparison","pic":"⚖️","eli5":"This is the thing being beaten. “God is greater THAN our heart” — the heart is what he beat.","formula":{"pattern":["comparative","X (gen.)"],"filled":["greater","than our heart"],"note":"than what?"},"short":"Comparison","gist":"than what","tile":"C","oneLine":"What something is being measured against.","mnemonic":"PACTS — C: than what?","mnemonicWhy":"Find a comparative — greater, better, more — and the genitive beside it is the thing being beaten.","spotIt":"See a comparative adjective? The genitive next to it is the “than”.","bookDef":"Used to denote comparison in conjunction with a comparative adjective (“than”).","examples":[{"ref":"1 John 3:20","greek":"μείζων ἐστὶν ὁ θεὸς *τῆς καρδίας* ἡμῶν","english":"God is greater *than our heart*","note":"μείζων is the comparative; the genitive is what he is greater than."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-time-place","set":"genitive","group":"genitive-adverbial","name":"Time or Place","pic":"🕐","eli5":"When it happened, or where. “He came AT NIGHT” — night is the when.","formula":{"pattern":["verb","X (gen.)"],"filled":["came","at night"],"note":"when? where?"},"short":"Time/Place","gist":"when, where","tile":"T","oneLine":"When or where the action happened.","mnemonic":"PACTS — T: when? where?","mnemonicWhy":"The one with a clock and a map on it. Note the focus is the kind of time, not a point on a clock.","spotIt":"Ask: when did it happen? where did it happen?","bookDef":"Indicates the location in time or space where an action occurs. The focus is on kind or quality.","examples":[{"ref":"John 19:39","greek":"ὁ ἐλθὼν πρὸς αὐτὸν *νυκτὸς* τὸ πρῶτον","english":"who had previously come to him *at night*","note":"Time — night is the kind of time it happened in."},{"ref":"Matt 1:12 NIV","greek":"μετὰ δὲ τὴν μετοικεσίαν *Βαβυλῶνος*","english":"After the exile *to Babylon*","note":"Place — where the exile went."}],"tags":["genitive","adverbial","ch-3"],"kindsLabel":"The axes it works on","kinds":[{"name":"Time","note":"when — and the stress is on what kind of time, not how long"},{"name":"Place","note":"where — the kind of place, not the exact spot"}]},{"id":"genitive-separation","set":"genitive","group":"genitive-adverbial","name":"Separation","pic":"🚪","eli5":"Moving away. “They walked away from the faith.”","formula":{"pattern":["verb","X (gen.)"],"filled":["depart","from the faith"],"note":"away from what?"},"short":"Separation","gist":"away from what","tile":"S","oneLine":"What the action moves away from.","mnemonic":"PACTS — S: away from what?","mnemonicWhy":"Movement away, real or figurative — walking away from a place, or away from the faith.","spotIt":"Ask: away from what? Does “from” fit?","bookDef":"Indicates motion away from or distance, whether literally or figuratively (“from”).","examples":[{"ref":"1 Tim 4:1","greek":"ἀποστήσονταί τινες *τῆς πίστεως*","english":"some will depart *from the faith*","note":"Movement away from — figurative, but still away."}],"watchOut":"Source also translates “from”. Separation moves away from something; source is where a noun came from.","tags":["genitive","adverbial","ch-3"],"kindsLabel":"Kinds of distance","kinds":[{"name":"Literal","note":"actual motion away, or actual distance"},{"name":"Figurative","note":"cut off from, free of, estranged from"}]},{"id":"genitive-apposition","set":"genitive","group":"genitive-other","name":"Apposition","pic":"🏷️","eli5":"Two stickers, third time. “Jeremiah the prophet.” One man, two names.","formula":{"pattern":["head noun,","X (gen.)"],"filled":["Jeremiah","the prophet"],"note":"X is another name for the head noun."},"short":"Apposition (gen.)","gist":"another name for it","tile":"Another name","oneLine":"A second name for the head word.","mnemonic":"The name tag again — third case running.","mnemonicWhy":"You have met this in the nominative and the accusative. Same move: the second word renames the first.","spotIt":"Ask: is the genitive another name for the head noun? “Jeremiah, who is the prophet.” “The gift, which is the Holy Spirit.”","bookDef":"The genitive of apposition provides an alternate designation (simple) of a genitive head noun or provides an explanatory (epexegetical) restatement of a head noun in any case.","examples":[{"ref":"Matt 2:17","greek":"διὰ Ἰερεμίου *τοῦ προφήτου*","english":"through Jeremiah *the prophet*","note":"Simple — the head noun Ἰερεμίου is itself genitive."},{"ref":"Acts 2:38","greek":"τὴν δωρεὰν *τοῦ ἁγίου πνεύματος*","english":"the gift *of the Holy Spirit*","note":"Epexegetical — the gift IS the Spirit. The head noun here is accusative."}],"watchOut":"Simple: the head noun is genitive too. Epexegetical: the head noun can be any case.","tags":["genitive","other","ch-3"]},{"id":"genitive-direct-object","set":"genitive","group":"genitive-other","name":"Direct Object","pic":"🧲","eli5":"Some doing-words are picky. Hearing, wanting, sharing, bossing and leaving all want their catcher dressed like this.","formula":{"pattern":["certain verbs","X (gen.)"],"filled":["you did not lack","anything"],"note":"The verb wanted a genitive, not an accusative."},"short":"Direct object (gen.)","gist":"verb wants a genitive","tile":"Genitive DO","oneLine":"The object of a verb that wants the genitive instead of the accusative.","mnemonic":"Feel it, want it, share it, rule it, leave it.","mnemonicWhy":"Six kinds of verb do this: sensation and emotion (feel it), volition (want it), sharing, ruling, separation (leave it). It is a habit of the verb, not a meaning.","spotIt":"A genitive sitting where you expected an accusative? Check the verb: sensing, feeling, wanting, sharing, ruling, separating?","bookDef":"Verbs of sensation, emotion or volition, sharing, ruling, or separation take their direct object in the genitive case (instead of the accusative case).","examples":[{"ref":"Luke 22:35 NASB","greek":"μή *τινος* ὑστερήσατε","english":"you did not lack *anything*, did you?","note":"ὑστερέω takes its object in the genitive."},{"ref":"John 5:25","greek":"οἱ νεκροὶ ἀκούσουσιν *τῆς φωνῆς* τοῦ υἱοῦ τοῦ θεοῦ","english":"the dead will hear *the voice* of the Son of God","note":"Sensation — hearing. Feel it."},{"ref":"Acts 20:33","greek":"*ἀργυρίου* ἢ *χρυσίου* ἢ *ἱματισμοῦ* οὐδενὸς ἐπεθύμησα","english":"I have not coveted anyone’s *silver* or *gold* or *clothing*","note":"Emotion and volition — coveting. Want it."},{"ref":"1 Cor 10:21","greek":"οὐ δύνασθε *τραπέζης* κυρίου μετέχειν","english":"You cannot share in the Lord’s *table*","note":"Sharing. Share it."},{"ref":"Rom 6:14","greek":"ἁμαρτία γὰρ *ὑμῶν* οὐ κυριεύσει","english":"For sin will not rule over *you*","note":"Ruling. Rule it."}],"watchOut":"This one follows a VERB. The objective genitive follows a NOUN.","tags":["genitive","other","ch-3"],"kindsLabel":"Which verbs take it","kinds":[{"name":"Sensation","note":"hear it, taste it, touch it"},{"name":"Emotion or volition","note":"want it, long for it"},{"name":"Sharing","note":"partake of it, have a share in it"},{"name":"Ruling","note":"rule over it, be lord of it"},{"name":"Separation","note":"leave it, be free of it"}]},{"id":"dative-personal-interest","set":"dative","group":"dative-pure","name":"Personal Interest","pic":"💝","eli5":"Someone gains, or someone loses. “A bride dressed up FOR her husband.” “She had it IN for him.”","formula":{"pattern":["verb","X (dat.)"],"filled":["adorned","for her husband"],"note":"Good for X, or bad for X."},"short":"Personal interest","gist":"helps or hurts them","tile":"P","oneLine":"Who benefits, or who suffers.","mnemonic":"PORT — P: for him, or against him.","mnemonicWhy":"Two directions, one use. Rev 21:2 is for somebody; Mark 6:19 is against somebody.","spotIt":"Ask: does this help someone, or hurt someone?","bookDef":"Denotes the person (or rarely, the thing) to whose benefit or detriment a verbal action occurs.","examples":[{"ref":"Rev 21:2","greek":"ὡς νύμφην κεκοσμημένην *τῷ ἀνδρὶ αὐτῆς*","english":"like a bride adorned *for her husband*","note":"Advantage — she is dressed for his benefit."},{"ref":"Mark 6:19","greek":"ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν *αὐτῷ*","english":"So Herodias held a grudge *against him*","note":"Disadvantage — the grudge is to his cost."},{"ref":"Matt 23:31","greek":"ὥστε μαρτυρεῖτε *ἑαυτοῖς* ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας","english":"So you testify *against yourselves* that you are descendants of those who murdered the prophets","note":"Disadvantage — the obverse of advantage. The testimony lands on them, and not in their favour."},{"ref":"Jas 5:3","greek":"ὁ ἰὸς αὐτῶν εἰς μαρτύριον *ὑμῖν* ἔσται","english":"their corrosion will be a witness *against you*","note":"Not “a witness to you” but “against you”. When the dative names who suffers, “against” is usually the word."},{"ref":"Matt 6:19","greek":"μὴ θησαυρίζετε *ὑμῖν* θησαυροὺς ἐπὶ τῆς γῆς","english":"Don't store up *for yourselves* treasures on earth","note":"Advantage. The storing up was meant to benefit them — “for” is the word that carries it."},{"ref":"2 Cor 5:15","greek":"ἵνα οἱ ζῶντες μηκέτι *ἑαυτοῖς* ζῶσιν ἀλλὰ *τῷ* ὑπὲρ αὐτῶν *ἀποθανόντι* καὶ *ἐγερθέντι*","english":"so that those who live should no longer live *for themselves*, but *for the one who died* for them and was raised","note":"Two advantages set against each other in one clause: no longer for yourselves, but for him."}],"tags":["dative","pure","ch-4"],"kindsLabel":"Which way it points","kinds":[{"name":"Advantage — “for”","note":"a favourable personal relation: the action is meant to benefit them"},{"name":"Disadvantage — “against”","note":"the obverse: the action happens to their detriment"}],"watchOut":"The chapter is candid that this is not a clean line. Brooks and Winbery: “All datives of advantage or disadvantage are in fact indirect objects, and all indirect objects to a greater or lesser degree express advantage or disadvantage.” Porter adds that the label combines syntax with context — it has to be inferred from the passage rather than read off the form. Expect a judgement call, not a test."},{"id":"dative-possession","set":"dative","group":"dative-pure","name":"Possession","pic":"🔑","eli5":"It is theirs, said backwards. “To you is the promise” means “you have the promise.”","formula":{"pattern":["X (dat.)","is","the thing"],"filled":["to you","is","the promise"],"note":"= X has it."},"short":"Possession","gist":"they Own it","tile":"O","oneLine":"The dative owns the subject of a to-be verb.","mnemonic":"PORT — O: owns it.","mnemonicWhy":"Greek says “to me is a book” where we say “I have a book”. Flip it round and the owner appears.","spotIt":"A dative sitting next to εἰμί or γίνομαι? Try flipping it into “X has”.","bookDef":"Unique construction in which the dative possesses the subject of an equative verb (such as εἰμι or γίνομαι).","examples":[{"ref":"Acts 2:39","greek":"*ὑμῖν* γάρ ἐστιν ἡ ἐπαγγελία","english":"For the promise is *for you*","note":"“To you is the promise” = you have the promise."},{"ref":"Luke 8:30","greek":"τί *σοι* ὄνομά ἐστιν","english":"What is *your* name?","note":"More literally, “what name is to you?” The dative owns the subject of ἐστιν."},{"ref":"Luke 12:24","greek":"*οἷς* οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη","english":"*they* don't have a storeroom or a barn","note":"Literally “to them there is not a storeroom”. English turns the dative into the subject; Greek does not."},{"ref":"John 18:39","greek":"ἔστιν δὲ συνήθεια *ὑμῖν*","english":"*You have* a custom","note":"Literally “there is a custom to you”. Flip it round and the owner appears."},{"ref":"1 Pet 4:11","greek":"*ᾧ* ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων","english":"*To him* be the glory and the power forever and ever","note":"A doxology built on the same construction: the glory is the subject, and the dative owns it."}],"watchOut":"It needs an equative verb — εἰμί, γίνομαι, ὑπάρχω — and the dative owns that verb's subject. Dana and Mantey call it “personal interest particularized to the point of ownership”. Against the genitive of possession the emphasis flips: the genitive stresses the person who owns, the dative stresses the thing owned.","tags":["dative","pure","ch-4"]},{"id":"dative-reference","set":"dative","group":"dative-pure","name":"Reference or Respect","pic":"✉️","eli5":"Only true about one thing. “He died TO SIN” — dead as far as sin goes, not dead all over.","formula":{"pattern":["verb","X (dat.)"],"filled":["died","to sin"],"note":"= with reference to X."},"short":"Reference","gist":"Re: this only","tile":"R","oneLine":"The one respect in which the statement holds.","mnemonic":"PORT — R: re:, like the subject line of an email.","mnemonicWhy":"“Re: sin — he died.” The dative names what the sentence is about, and the claim is only true about that. Robertson's rule of thumb for the whole pure dative: applied to a person it comes out as interest, applied to a thing it usually comes out as reference.","spotIt":"Put “with reference to” in front. Does the sentence stop being odd?","bookDef":"Limits the extent to which something is presented as true, qualifying a statement that would otherwise not be true.","examples":[{"ref":"Rom 6:10","greek":"*τῇ ἁμαρτίᾳ* ἀπέθανεν ἐφάπαξ","english":"he died *to sin* once for all","note":"Not dead altogether — dead with reference to sin."},{"ref":"Mark 12:40","greek":"οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ *προφάσει* μακρὰ προσευχόμενοι","english":"they devour widows' houses and say long prayers *just for show*","note":"With reference to appearance. The prayers are long only in that one respect."},{"ref":"Luke 18:31","greek":"πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν *τῷ υἱῷ* τοῦ ἀνθρώπου","english":"everything written by the prophets *about the Son* of Man (ESV)","note":"“About” is the giveaway: the writing is with reference to him, not given to him."},{"ref":"1 Cor 6:12","greek":"πάντα *μοι* ἔξεστιν","english":"Everything is permissible *for me*","note":"With reference to me. It sets the boundary of the claim — permissible in my case."},{"ref":"2 Cor 11:6","greek":"εἰ δὲ καὶ ἰδιώτης *τῷ λόγῳ*","english":"Even if I am untrained *in public speaking*","note":"Untrained in one respect only. Paul limits the admission to speech and no further."}],"watchOut":"The accusative has a respect use too (Acts 2:37, “cut with respect to the heart”) — same job, different case. This one also travels under a pile of other names: dative of respect, frame of reference dative, limiting dative, qualifying dative, contextualizing dative.","tags":["dative","pure","ch-4"]},{"id":"dative-indirect-object","set":"dative","group":"dative-pure","name":"Indirect Object","pic":"🎁","eli5":"Who you gave it to. “Give glory to God.” God is the one getting it.","formula":{"pattern":["verb","the thing","to X (dat.)"],"filled":["give","glory","to God"],"note":"The one who receives it."},"short":"Indirect object","gist":"who it goes To","tile":"T","oneLine":"The one to whom, or for whom, the act is done.","mnemonic":"PORT — T: to whom. The plain one.","mnemonicWhy":"The commonest dative there is, and the one English already taught you: you give it TO someone.","spotIt":"A giving or telling verb, a direct object, and a dative — that dative is the receiver.","bookDef":"Indicates the one for whom or in whose interest an act is performed.","examples":[{"ref":"John 9:24","greek":"δὸς δόξαν *τῷ θεῷ*","english":"Give glory *to God*","note":"Glory is what is given; God is who it goes to."},{"ref":"Matt 13:3","greek":"καὶ ἐλάλησεν *αὐτοῖς* πολλὰ ἐν παραβολαῖς","english":"Then he told *them* many things in parables","note":"A telling verb, an accusative object (πολλά) and a dative — and the dative is who received the telling."},{"ref":"Acts 16:32","greek":"καὶ ἐλάλησαν *αὐτῷ* τὸν λόγον τοῦ κυρίου","english":"Then they spoke the word of the Lord *to him*","note":"Same shape again: τὸν λόγον is what was spoken, αὐτῷ is who it was spoken to."},{"ref":"1 Tim 1:18","greek":"ταύτην τὴν παραγγελίαν παρατίθεμαί *σοι*, τέκνον Τιμόθεε","english":"This charge I entrust *to you*, Timothy, my child (ESV)","note":"Paul entrusts the charge — the direct object — to Timothy, the indirect object."},{"ref":"1 Pet 4:19","greek":"οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ θεοῦ *πιστῷ κτίστῃ* παρατιθέσθωσαν τὰς ψυχὰς αὐτῶν","english":"let those who suffer according to God's will entrust themselves *to a faithful Creator*","note":"The same verb as 1 Tim 1:18, and the dative is personal again: it names the one the trust is placed in."}],"tags":["dative","pure","ch-4"],"watchOut":"Personal interest is widely treated as a specialised use of this one, so a dative that clearly benefits or harms someone can be labelled either way. Where the sentence hands something over and says nothing about gain or loss, indirect object is the safe answer."},{"id":"dative-place","set":"dative","group":"dative-locative","name":"Place","pic":"📍","eli5":"Where it literally is. “Sitting in a circle.”","formula":{"pattern":["verb","X (dat.)"],"filled":["sitting","in a circle"],"note":"A real spot you could point at."},"short":"Place","gist":"Here, a real spot","tile":"H","oneLine":"The literal physical location.","mnemonic":"HIT — H: here, a real spot.","mnemonicWhy":"If you could stand there, it is place. If you could not, it is sphere.","spotIt":"Ask: could I actually point at this location?","bookDef":"Pinpoints the literal physical location of a noun in the dative case.","examples":[{"ref":"Mark 3:34","greek":"τοὺς περὶ αὐτὸν *κύκλῳ* καθημένους","english":"those sitting *in a circle* around him","note":"A real ring of people on real ground."},{"ref":"Matt 27:48","greek":"λαβὼν σπόγγον … περιθεὶς *καλάμῳ* ἐπότιζεν αὐτόν","english":"he took a sponge … put it *on a stick*, and offered him a drink","note":"Not “to or for a stick”, and not “by means of a stick” — on a stick. A physical location."},{"ref":"John 19:2","greek":"πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ *τῇ κεφαλῇ*","english":"they twisted a crown of thorns and put it *on* his *head*","note":"A literal head. You could point at it, so it is place and not sphere."},{"ref":"Acts 5:31","greek":"τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν *τῇ δεξιᾷ* αὐτοῦ","english":"God exalted this man *to his right hand* as ruler and Savior","note":"The chapter files this under place — exalted to a position. Some read it as means, “by his right hand”, so it is worth knowing both are on the table."},{"ref":"1 Cor 9:13","greek":"οἱ *τῷ θυσιαστηρίῳ* παρεδρεύοντες","english":"those who serve *at the altar* (ESV)","note":"Where the serving happened. Note the English preposition changes — in, on, among, at, to, by — while the Greek stays a bare dative."}],"tags":["dative","locative","ch-4"],"kindsLabel":"Prepositions English has to pick from","kinds":[{"name":"in · on · among","note":"περιθεὶς καλάμῳ, on a stick"},{"name":"at · to · by","note":"τῷ θυσιαστηρίῳ, at the altar"}],"watchOut":"Greek leaves it a bare dative and English has to choose the preposition — in, on, among, at, to or by. Picking the wrong one is what makes a place dative look like means."},{"id":"dative-sphere","set":"dative","group":"dative-locative","name":"Sphere","pic":"☁️","eli5":"Where it is, but not really. “Sighing deeply in his spirit” — you cannot point at that.","formula":{"pattern":["verb","X (dat.)"],"filled":["sighing","in his spirit"],"note":"A place you cannot point at."},"short":"Sphere","gist":"In a realm, not a spot","tile":"I","oneLine":"The figurative realm the action happens in.","mnemonic":"HIT — I: in what realm.","mnemonicWhy":"Place is a spot on a map. Sphere is a spot you can only imagine — in the spirit, in the flesh, in Christ.","spotIt":"It reads like a location, but nobody could stand there.","bookDef":"Identifies the figurative or metaphorical location (i.e., sphere or realm) of a noun in the dative case.","examples":[{"ref":"Mark 8:12","greek":"ἀναστενάξας *τῷ πνεύματι* αὐτοῦ","english":"sighing deeply *in* his *spirit*","note":"A realm, not a room."},{"ref":"Eph 4:18","greek":"ἐσκοτωμένοι *τῇ διανοίᾳ* ὄντες","english":"they are darkened *in their understanding*","note":"Understanding is not a place you could stand. The darkness is bounded logically, not spatially."},{"ref":"Heb 3:5","greek":"καὶ Μωϋσῆς μὲν πιστὸς ἐν *ὅλῳ τῷ οἴκῳ* αὐτοῦ","english":"Moses was faithful as a servant *in all* God's *household*","note":"A household here is a sphere of belonging rather than a building, even with ἐν written in front of it."},{"ref":"Heb 3:10","greek":"ἀεὶ πλανῶνται *τῇ καρδίᾳ*","english":"they always go astray *in their heart* (ESV)","note":"The heart is the realm the straying happens in. Nobody wanders about inside an actual heart."},{"ref":"1 Pet 3:18","greek":"θανατωθεὶς μὲν *σαρκὶ* ζωοποιηθεὶς δὲ *πνεύματι*","english":"being put to death *in the flesh* but made alive *in the spirit*","note":"Two spheres set against each other in one line. Neither is a location you could visit."}],"watchOut":"Place and sphere are one word doing literal and figurative duty, and the test is whether you could point at it. Two further warnings from the chapter: some grammarians fold sphere into “dative of place” altogether, and some examples filed under sphere really belong under reference.","tags":["dative","locative","ch-4"]},{"id":"dative-time","set":"dative","group":"dative-locative","name":"Time","pic":"🕐","eli5":"When it happened. “On the third day.”","formula":{"pattern":["verb","X (dat.)"],"filled":["a wedding took place","on the third day"],"note":"A point in time, not a stretch."},"short":"Time","gist":"Then — when it happened","tile":"T","oneLine":"The point in time at which it happened.","mnemonic":"HIT — T: then.","mnemonicWhy":"Location again, but on a calendar instead of a map. A moment, not a duration.","spotIt":"Ask: when? And check it is a moment rather than a length of time.","bookDef":"Indicates the point in time (location in time) at which the action of a verb is accomplished.","examples":[{"ref":"John 2:1","greek":"καὶ *τῇ ἡμέρᾳ τῇ τρίτῃ* γάμος ἐγένετο","english":"*On the third day*, a wedding took place","note":"A point on the calendar."},{"ref":"Matt 12:1","greek":"ἐπορεύθη ὁ Ἰησοῦς *τοῖς σάββασιν* διὰ τῶν σπορίμων","english":"Jesus passed through the grainfields *on the Sabbath*","note":"The point in time at which he passed through — not how long it took."},{"ref":"Luke 2:38","greek":"καὶ *αὐτῇ τῇ ὥρᾳ* ἐπιστᾶσα ἀνθωμολογεῖτο τῷ θεῷ","english":"*At that very moment* she came up and began to thank God","note":"A moment, as sharp as the dative of time ever gets."},{"ref":"Acts 12:6","greek":"*τῇ νυκτὶ ἐκείνῃ* ἦν ὁ Πέτρος κοιμώμενος","english":"*on that very night* Peter was sleeping","note":"A night can be a stretch, but here it pins down which night. Point, not duration."},{"ref":"1 Cor 10:8","greek":"καὶ ἔπεσαν *μιᾷ ἡμέρᾳ* εἴκοσι τρεῖς χιλιάδες","english":"and *in a single day* twenty-three thousand people died","note":"One day named as the point it happened on. Had the stress been on how long it lasted, Greek would reach for the accusative."}],"watchOut":"Luke 23:56b–24:1a puts all three in one sentence: καὶ τὸ μὲν σάββατον ἡσύχασαν — accusative, how long they rested; τῇ δὲ μιᾷ τῶν σαββάτων — dative, the day they came; ὄρθρου βαθέως — genitive, what kind of hour. Learn that one verse and the three cases of time are done.","tags":["dative","locative","ch-4"],"kindsLabel":"How the cases split time","kinds":[{"name":"Genitive — kind of time","note":"what sort of time, or time during which: ὄρθρου βαθέως, “very early”"},{"name":"Dative — point in time","note":"when it happened: τῇ μιᾷ τῶν σαββάτων, “on the first day”"},{"name":"Accusative — extent of time","note":"how long it went on: τὸ σάββατον, “[through] the Sabbath”"}]},{"id":"dative-means","set":"dative","group":"dative-instrumental","name":"Means","pic":"🔨","eli5":"The thing you used. “Cutting himself with stones.” The stones did not choose to.","formula":{"pattern":["verb","X (dat.)"],"filled":["cutting himself","with stones"],"note":"A thing, not a person."},"short":"Means","gist":"the tool used","tile":"M","oneLine":"The impersonal thing the action was done with.","mnemonic":"MAMA — M: means, the tool.","mnemonicWhy":"A tool has no will of its own. If the dative could have refused, it is agency, not means.","spotIt":"Ask: with what? And check the answer is a thing.","bookDef":"Denotes the impersonal means by which the action of a given verb is accomplished.","examples":[{"ref":"Mark 5:5","greek":"κατακόπτων ἑαυτὸν *λίθοις*","english":"cutting himself *with stones*","note":"Stones are a tool. They did not decide anything."},{"ref":"Matt 13:40","greek":"ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ *πυρὶ* κατακαίεται","english":"just as the weeds are gathered and burned *with fire* (ESV)","note":"Fire is the instrument, and fire has no will. Impersonal, so means rather than agency."},{"ref":"Luke 7:38","greek":"*τοῖς δάκρυσιν* ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ καὶ *ταῖς θριξὶν* … ἐξέμασσεν","english":"she began to wet his feet *with her tears* and wiped them *with the hair* of her head (ESV)","note":"Two instruments in one sentence. She is the agent; the tears and the hair are what she used."},{"ref":"Acts 12:2","greek":"ἀνεῖλεν δὲ Ἰάκωβον τὸν ἀδελφὸν Ἰωάννου *μαχαίρῃ*","english":"and he executed James, John's brother, *with the sword*","note":"The sword did not decide anything. Herod is the agent; the sword is the means."},{"ref":"Rom 1:29","greek":"πεπληρωμένους *πάσῃ ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ*","english":"filled *with all unrighteousness, evil, greed, and wickedness*","note":"Four datives in a row, all means: what they are filled with."}],"tags":["dative","instrumental","ch-4"],"watchOut":"Brooks and Winbery call this the most common, the simplest and the most obvious use of the instrumental case, so it is the one to try first. The rule that settles it against agency: means is always impersonal."},{"id":"dative-agency","set":"dative","group":"dative-instrumental","name":"Agency","pic":"✋","eli5":"The person who did it. “Led by the Spirit.”","formula":{"pattern":["verb","X (dat.)"],"filled":["led","by the Spirit"],"note":"A person, not a thing."},"short":"Agency","gist":"the person who did it","tile":"A","oneLine":"The personal agent by whom the action was done.","mnemonic":"MAMA — A: agency, the doer.","mnemonicWhy":"Same “by”, but somebody chose it. Means is the hammer; agency is the carpenter.","spotIt":"Ask: by whom? And check the answer is a person.","bookDef":"Denotes the personal agency by which the action of a given verb is accomplished.","examples":[{"ref":"Gal 5:18","greek":"εἰ δὲ *πνεύματι* ἄγεσθε","english":"But if you are led *by the Spirit*","note":"The Spirit chooses. That makes it agency."},{"ref":"Matt 6:1","greek":"προσέχετε … μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι *αὐτοῖς*","english":"be careful not to practise your righteousness in front of others, to be seen *by them*","note":"Passive verb, personal agent. That pair is the signature of agency."},{"ref":"Luke 23:15","greek":"οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον *αὐτῷ*","english":"nothing deserving death has been done *by him* (ESV)","note":"Perfect passive, and the dative names who did it. A deed has a doer; a tool does not."},{"ref":"Acts 5:34","greek":"νομοδιδάσκαλος τίμιος *παντὶ τῷ λαῷ*","english":"a teacher of the Law, respected *by all the people* (NASB)","note":"The people are the ones doing the respecting, so they are the agent, not the means."},{"ref":"1 Tim 3:16","greek":"ὤφθη *ἀγγέλοις*","english":"seen *by angels*","note":"Short and easy to misread. Greek usually says agency with ὑπό and the genitive, so a bare dative agent is worth stopping over."}],"watchOut":"Means and agency are the same shape on the page, and the only test is whether the dative has a will. Two more tells: the verb is usually passive, and dative agency is uncommon — Greek normally says it with ὑπό and the genitive, so a bare dative agent is doing something unusual.","tags":["dative","instrumental","ch-4"]},{"id":"dative-manner","set":"dative","group":"dative-instrumental","name":"Manner","pic":"🎭","eli5":"How you did it. “He spoke openly.”","formula":{"pattern":["verb","X (dat.)"],"filled":["spoke","openly"],"note":"Turn it into an -ly word."},"short":"Manner","gist":"the style of it","tile":"M","oneLine":"The style in which the action was done.","mnemonic":"MAMA — M: manner, the how.","mnemonicWhy":"Not what you used, but the style you did it in. If an -ly word is the natural English, this is it.","spotIt":"Ask: how? Check that an -ly adverb fits.","bookDef":"Denotes the manner in which the action of a given verb is accomplished.","examples":[{"ref":"Mark 8:32","greek":"*παρρησίᾳ* τὸν λόγον ἐλάλει","english":"He spoke *openly* about this","note":"Openly is a style, not a tool."},{"ref":"Matt 26:4","greek":"καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν *δόλῳ*","english":"and they conspired to arrest Jesus *in a treacherous way*","note":"Treachery is the style of the arrest, not the tool of it. Manner answers how."},{"ref":"Acts 11:23","greek":"ἐχάρη καὶ παρεκάλει πάντας *τῇ προθέσει* τῆς καρδίας προσμένειν τῷ κυρίῳ","english":"he encouraged them all to remain true to the Lord *with devoted hearts*","note":"How they were to remain: with purpose of heart. Note τῷ κυρίῳ in the same verse is the object of προσμένω."},{"ref":"1 Cor 10:30","greek":"εἰ ἐγὼ *χάριτι* μετέχω","english":"If I partake *with thankfulness* (ESV)","note":"Turn it into an adverb — thankfully — and manner is usually what you are holding."},{"ref":"2 Cor 3:18","greek":"ἡμεῖς δὲ πάντες *ἀνακεκαλυμμένῳ προσώπῳ* … κατοπτριζόμενοι","english":"We all, *with unveiled faces*, are looking as in a mirror","note":"With unveiled face: the manner of the looking. A face is not the instrument you look with."}],"watchOut":"Means answers “with what tool”. Manner answers “in what style”.","tags":["dative","instrumental","ch-4"]},{"id":"dative-association","set":"dative","group":"dative-instrumental","name":"Association","pic":"👫","eli5":"Who came along. “Buried with him.” You went together.","formula":{"pattern":["verb","X (dat.)"],"filled":["buried","with him"],"note":"Alongside — not used as a tool."},"short":"Association","gist":"who came along","tile":"A","oneLine":"The one the action is done alongside.","mnemonic":"MAMA — A: association, the company.","mnemonicWhy":"Also “with”, but company rather than tool. The verb often starts with συν-, which gives it away.","spotIt":"Ask: with whom, in the sense of together with? Look for a συν- verb.","bookDef":"Denotes the person or thing with which a person is associated or by which a person is accompanied.","examples":[{"ref":"Col 2:12 ESV","greek":"*συν*ταφέντες *αὐτῷ* ἐν τῷ βαπτισμῷ","english":"Having been buried *with him* in baptism","note":"συν- on the verb, and you were buried alongside him, not using him."},{"ref":"Luke 8:19","greek":"καὶ οὐκ ἠδύναντο *συν*τυχεῖν *αὐτῷ* διὰ τὸν ὄχλον","english":"they could not meet *with him* because of the crowd","note":"The συν- on the verb is what governs the dative. Spot the prefix and association is nearly always the answer."},{"ref":"1 Cor 4:8","greek":"ἵνα καὶ ἡμεῖς *ὑμῖν* *συμ*βασιλεύσωμεν","english":"so that we could also reign *with you*","note":"συμβασιλεύω — reign together with. The σύν prefix again, assimilated to συμ- before the β."},{"ref":"1 Cor 7:11","greek":"ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ *τῷ ἀνδρὶ* καταλλαγήτω","english":"she must remain unmarried or be reconciled *to her husband*","note":"No σύν prefix on this one, but reconciling is a joining word and the husband is the party joined to."},{"ref":"Heb 4:2","greek":"μὴ *συγ*κεκερασμένους τῇ πίστει *τοῖς ἀκούσασιν*","english":"they were not united *with those who heard it* in faith","note":"συγκεράννυμι — mixed together with. τῇ πίστει sitting beside it is means, so one clause carries two dative jobs."}],"watchOut":"Three uses come out as “with”: means (a tool), manner (a style), association (company).","tags":["dative","instrumental","ch-4"],"kindsLabel":"Ways of being together","kinds":[{"name":"Associated with","note":"the party you belong to"},{"name":"Accompanied by","note":"the person who came along"}]},{"id":"dative-cause","set":"dative","group":"dative-other","name":"Cause","pic":"🔥","eli5":"Why it happened. “I am dying of hunger.” Hunger is the reason.","formula":{"pattern":["verb","X (dat.)"],"filled":["dying","of hunger"],"note":"= because of X."},"short":"Cause","gist":"Because of it","tile":"B","oneLine":"The reason or basis for the action.","mnemonic":"BEAD — B: because.","mnemonicWhy":"Slot “because of” in front and the sense holds. The reason can be outside you or inside you.","spotIt":"Ask: why? Then try “because of”.","bookDef":"Indicates the basis or reason of the action of a given verb, whether external (occasion) or internal (motivation).","examples":[{"ref":"Luke 15:17","greek":"ἐγὼ δὲ *λιμῷ* ὧδε ἀπόλλυμαι","english":"here I am dying [because] *of hunger*!","note":"Hunger is the reason, not the tool."},{"ref":"1 Cor 8:7","greek":"τινὲς δὲ *τῇ συνηθείᾳ* ἕως ἄρτι τοῦ εἰδώλου ὡς εἰδωλόθυτον ἐσθίουσιν","english":"but some, *being accustomed* to the idol until now, eat food as if it were sacrificed to an idol (NASB)","note":"They eat that way because of what they are used to. The dative gives the basis, not the method."},{"ref":"2 Cor 2:7","greek":"μή πως τῇ περισσοτέρᾳ *λύπῃ* καταποθῇ ὁ τοιοῦτος","english":"otherwise he may be overwhelmed *by excessive grief*","note":"Grief is why he is overwhelmed, not a tool somebody used on him. Cause, not means."},{"ref":"Gal 6:12","greek":"μόνον ἵνα *τῷ σταυρῷ* τοῦ Χριστοῦ μὴ διώκωνται","english":"only to avoid being persecuted *for the cross* of Christ","note":"The cross is the reason for the persecution, not the instrument of it."},{"ref":"Heb 2:15","greek":"ὅσοι *φόβῳ* θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας","english":"those held in slavery all their lives *by the fear* of death","note":"Fear is the grounds of the slavery. Wallace's test: means answers how, cause answers on what basis."}],"tags":["dative","other","ch-4"],"kindsLabel":"Where a cause comes from","kinds":[{"name":"External — the occasion","note":"what happened to bring it about"},{"name":"Internal — the motivation","note":"what moved them from inside"}],"watchOut":"Cause and means both come out as “by” in English. Wallace's line is the one to keep: means says how the action was performed, cause says what it was performed on the basis of."},{"id":"dative-cognate","set":"dative","group":"dative-other","name":"Cognate Dative","pic":"🔁","eli5":"The word says the doing-word again. “They were astounded with a great astoundment.”","formula":{"pattern":["verb","its own noun (dat.)"],"filled":["they were astounded","with great astoundment"],"note":"Same stem, said twice."},"short":"Cognate","gist":"Echoes its verb","tile":"E","oneLine":"A dative built from the same stem as its verb.","mnemonic":"BEAD — E: echo, second case running.","mnemonicWhy":"You met the echo in the accusative. Greek doubles the word for force where English just says “utterly”.","spotIt":"Say the verb and the dative out loud. Same root, or same idea?","bookDef":"Use of a dative noun that is a cognate (of the same stem) to the verb it modifies either formally or conceptually.","examples":[{"ref":"Mark 5:42","greek":"ἐξέστησαν *ἐκστάσει μεγάλῃ*","english":"they were *utterly* astounded","note":"ἐξέστησαν and ἐκστάσει are the same stem. English flattens it to “utterly”."},{"ref":"Matt 15:4","greek":"ὁ κακολογῶν πατέρα ἢ μητέρα *θανάτῳ* τελευτάτω","english":"Whoever reviles father or mother must *surely* die (ESV)","note":"θανάτῳ with τελευτάτω — death beside a dying verb. The echo comes out in English as an intensifier."},{"ref":"John 3:29","greek":"ὁ δὲ φίλος τοῦ νυμφίου … *χαρᾷ* χαίρει","english":"the groom's friend … *rejoices greatly*","note":"χαρᾷ χαίρει: joy beside a rejoicing verb. Same root twice, and the effect is intensity, not repetition."},{"ref":"Acts 5:28","greek":"*παραγγελίᾳ* παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ","english":"We *strictly* charged you not to teach in this name (ESV)","note":"A charge beside a charging verb. The ESV turns the doubling into the single word “strictly”."},{"ref":"Acts 23:14","greek":"*ἀναθέματι* ἀνεθεματίσαμεν ἑαυτούς","english":"We have *strictly* bound ourselves (ESV)","note":"An oath beside an oath-verb. This is the one sometimes called the Hebraic dative, because Hebrew does the same."}],"tags":["dative","other","ch-4"],"watchOut":"Also called the Hebraic dative, because Hebrew builds the same doubling. Do not translate it twice — English wants one intensifying word: utterly, fervently, earnestly, strictly."},{"id":"dative-apposition","set":"dative","group":"dative-other","name":"Apposition","pic":"🏷️","eli5":"Two stickers, fourth time. “Beelzebul, the ruler of the demons.” One person, two names.","formula":{"pattern":["X (dat.),","Y (dat.)"],"filled":["Beelzebul,","the ruler of the demons"],"note":"Same person, second name."},"short":"Apposition","gist":"Alias — another name","tile":"A","oneLine":"A second dative renaming the first.","mnemonic":"BEAD — A: alias, fourth case running.","mnemonicWhy":"Nominative, accusative, genitive, dative — the name tag turns up in all four. Learn it once, keep it forever.","spotIt":"Two datives side by side, no verb between them, both pointing at the same thing.","bookDef":"Two related substantives refer to the same person or thing.","examples":[{"ref":"Matt 12:24","greek":"ἐν τῷ Βεελζεβοὺλ *ἄρχοντι* τῶν δαιμονίων","english":"by Beelzebul, *the ruler* of the demons","note":"ἄρχοντι renames Βεελζεβούλ."},{"ref":"Col 1:3","greek":"εὐχαριστοῦμεν τῷ θεῷ *πατρὶ* τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε","english":"We always thank God, *the Father* of our Lord Jesus Christ","note":"Two datives side by side and the second renames the first: “the Father” says which God."},{"ref":"Jude 25","greek":"μόνῳ θεῷ *σωτῆρι* ἡμῶν","english":"to the only God, our *Savior*","note":"σωτῆρι renames θεῷ. No verb between them — the second dative just identifies the first more exactly."},{"ref":"John 4:5","greek":"πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ Ἰωσὴφ [τῷ] *υἱῷ αὐτοῦ*","english":"near the property Jacob had given Joseph, *his son*","note":"“His son” renames Joseph. The dative here is doing nothing of its own; it is only matching the word it renames."},{"ref":"Acts 9:43","greek":"ἐγένετο δὲ ἡμέρας ἱκανὰς μεῖναι ἐν Ἰόππῃ παρά τινι Σίμωνι *βυρσεῖ*","english":"Peter stayed some time in Joppa with Simon, *a leather tanner*","note":"βυρσεῖ renames Σίμωνι — which Simon, exactly. The trade is the identifier."}],"tags":["dative","other","ch-4"],"watchOut":"Strictly this is a fact about the syntax rather than about the dative case itself: the second word is dative only because the word it renames is. Nothing about the dative's own meaning is in play."},{"id":"dative-direct-object","set":"dative","group":"dative-other","name":"Direct Object","pic":"🙏","eli5":"Some doing-words want it dressed this way: trusting, obeying, serving, worshipping, thanking, following.","formula":{"pattern":["devoted verb","X (dat.)"],"filled":["we thank","God"],"note":"The dative is the object."},"short":"Direct object","gist":"Devoted verbs","tile":"D","oneLine":"The object of a verb that takes the dative instead of the accusative.","mnemonic":"BEAD — D: devoted verbs.","mnemonicWhy":"Look at the list — trusting, obeying, serving, worshipping, thanking, following. Every one is a verb of devotion. That is the whole category in one word.","spotIt":"A dative where you expected an accusative? Check whether the verb is one of devotion.","bookDef":"The dative occurs after certain verbs of trusting, obeying, serving, worshiping, thanksgiving, or following and functions as the direct object.","examples":[{"ref":"Col 1:3","greek":"εὐχαριστοῦμεν *τῷ θεῷ* … πάντοτε","english":"We always thank *God*","note":"εὐχαριστέω takes its object in the dative."},{"ref":"Matt 4:20","greek":"οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν *αὐτῷ*","english":"Immediately they left their nets and followed *him*","note":"ἀκολουθέω is a following verb, and following verbs take their object in the dative."},{"ref":"Mark 4:41","greek":"ὁ ἄνεμος καὶ ἡ θάλασσα ὑπακούει *αὐτῷ*","english":"the wind and the sea obey *him*","note":"ὑπακούω is an obeying verb. English gives it a plain object; Greek gives it a dative."},{"ref":"Rom 7:25","greek":"αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω *νόμῳ* θεοῦ τῇ δὲ σαρκὶ *νόμῳ* ἁμαρτίας","english":"with my mind I serve *the law* of God, but with my flesh *the law* of sin","note":"δουλεύω is a serving verb, so both νόμῳ are its objects. Watch the other two datives in the same verse — τῷ νοΐ and τῇ σαρκί are means, not objects."},{"ref":"Gal 3:6","greek":"Ἀβραὰμ ἐπίστευσεν *τῷ θεῷ*","english":"Abraham believed *God* (ESV)","note":"πιστεύω is a trusting verb. “Believed God”, and the dative is what he believed."}],"watchOut":"The genitive has a fussy-verb list too — feel it, want it, share it, rule it, leave it. The dative's list is devotion.","tags":["dative","other","ch-4"],"kindsLabel":"The verbs of devotion","kinds":[{"name":"Trusting","note":"πιστεύω"},{"name":"Obeying","note":"ὑπακούω, πείθομαι"},{"name":"Serving","note":"διακονέω, δουλεύω"},{"name":"Worshipping","note":"προσκυνέω"},{"name":"Thanksgiving","note":"εὐχαριστέω"},{"name":"Following","note":"ἀκολουθέω"}]},{"id":"article-articular","set":"article","group":"article-terms","name":"Articular","pic":"🦴","type":"rule","eli5":"It has its “the”. ὁ λόγος — the word, with the little word in front.","formula":{"pattern":["ὁ / ἡ / τό","+ noun"],"filled":["the","word"],"note":"The article is present. That is all the word means."},"short":"Articular","gist":"has the article","tile":"Articular","oneLine":"A noun with the article on it.","mnemonic":"Articular — the joint is there.","mnemonicWhy":"ἄρθρον is Greek for a joint, and it is also the Greek word for the article. Arthritis is a complaint about joints. Articular means the joint is in place — the article is there.","spotIt":"ὁ, ἡ, τό or one of their forms sitting in front of the noun.","examples":[{"ref":"John 1:1","greek":"ἐν ἀρχῇ ἦν *ὁ* λόγος","english":"In the beginning was *the* Word","note":"ὁ λόγος is articular — and in the same verse θεός is not, which is the whole argument."},{"ref":"John 4:22","greek":"*ἡ* σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν","english":"*salvation* is from the Jews","note":"Articular in Greek even though English drops the “the”."}],"watchOut":"The chart uses this word rather than defining it — “the articular or non-articular vocative”, “the articular noun in the genitive”. It assumes you already know it.","tags":["article","terms","ch-5"]},{"id":"article-anarthrous","set":"article","group":"article-terms","name":"Anarthrous","pic":"🕳️","type":"rule","eli5":"No “the” at all. λόγος standing on its own.","formula":{"pattern":["∅","+ noun"],"filled":["—","word"],"note":"The article is absent. That is all the word means — not what the absence implies."},"short":"Anarthrous","gist":"no article","tile":"Anarthrous","oneLine":"A noun with no article on it.","mnemonic":"Anarthrous — ἀν- no, ἄρθρον joint. No joint, no article.","mnemonicWhy":"The same ἄρθρον, with the alpha privative bolted on the front — the same ἀν- that turns a theist into an atheist. No joint means no article.","spotIt":"A noun standing bare, with no ὁ, ἡ or τό in front of it.","examples":[{"ref":"John 1:1","greek":"καὶ *θεὸς* ἦν ὁ λόγος","english":"and the Word was *God*","note":"θεός is anarthrous. That is the fact; what it means is a separate question, and the answer is not “a god”."},{"ref":"Acts 16:25","greek":"*Παῦλος* καὶ *Σιλᾶς* προσευχόμενοι","english":"*Paul* and *Silas* were praying","note":"Anarthrous and still perfectly definite — a proper name needs no article."}],"watchOut":"Two things this word does not mean. It is not the chart's word — the chart says “the absence of the article”, so that is the phrasing an exam will use. And it never means “a”: what an absent article conveys is the three-way question under Poof.","tags":["article","terms","ch-5"]},{"id":"article-monadic","set":"article","group":"article-point","name":"Monadic Article","pic":"🌑","eli5":"There is only one of him. “The only Son” — there is no second one to confuse him with.","formula":{"pattern":["ὁ","+ word"],"filled":["the","monadic"]},"short":"Monadic","gist":"the only one there is","tile":"M","oneLine":"The article on something one-of-a-kind.","mnemonic":"MAGPIE — M: Monadic, the only one there is.","mnemonicWhy":"Not “the best of several” — there are no several. The sun, the devil, the only Son.","spotIt":"Ask whether a second one could even exist. If not, monadic.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"John 3:16 ESV","greek":"*τὸν* υἱὸν *τὸν* μονογενῆ ἔδωκεν","english":"that he gave *his* only Son","note":"Monadic — there is only one of him."}],"tags":["article","point","ch-5"]},{"id":"article-abstract","set":"article","group":"article-point","name":"Abstract Article","pic":"💭","eli5":"It points at the idea, not at one example of it. “Salvation” — the whole thing, not one rescue.","formula":{"pattern":["ὁ","+ word"],"filled":["the","abstract"]},"short":"Abstract","gist":"the idea itself","tile":"A","oneLine":"The article on an abstract noun, naming the concept.","mnemonic":"MAGPIE — A: Abstract, the idea itself.","mnemonicWhy":"English usually drops the “the” here, which is why it is easy to miss: ἡ σωτηρία is just “salvation”.","spotIt":"An abstract noun with an article that English would not translate.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"John 4:22","greek":"*ἡ* σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν","english":"*salvation* is from the Jews","note":"Abstract — the idea itself, not one instance of it."}],"tags":["article","point","ch-5"]},{"id":"article-generic","set":"article","group":"article-point","name":"Generic Article","pic":"🗂️","eli5":"It points at all of them at once. “Beware of false prophets” — the whole breed, not particular men.","formula":{"pattern":["ὁ","+ word"],"filled":["the","generic"]},"short":"Generic","gist":"the whole class","tile":"G","oneLine":"The article on a class as a class, rather than on one member of it.","mnemonic":"MAGPIE — G: Generic, all of them at once.","mnemonicWhy":"The one letter of MAGPIE that is not particularising. The chart's sentence has two halves — “particularizes … or uses it generically” — and this is the second half.","spotIt":"Swap in “that kind of thing” and see if it still works. If it does, generic.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"Matt 7:15","greek":"Προσέχετε ἀπὸ *τῶν* ψευδοπροφητῶν","english":"Be on your guard against *false prophets*","note":"Generic — the whole class of them, not particular ones."}],"watchOut":"This is the odd one out. The other five particularise; this one generalises.","tags":["article","point","ch-5"]},{"id":"article-par-excellence","set":"article","group":"article-point","name":"Par Excellence","pic":"👑","eli5":"Not a prophet — THE Prophet. The one who deserves the name more than anyone.","formula":{"pattern":["ὁ","+ word"],"filled":["the","par excellence"]},"short":"Par excellence","gist":"THE one, the best","tile":"P","oneLine":"The article marking the one that best deserves the title.","mnemonic":"MAGPIE — P: Par excellence, the one worth the name.","mnemonicWhy":"Say it out loud with the stress on “the”. If “THE Prophet” sounds right, that is this one.","spotIt":"Try putting the stress on “the”. THE Christ, THE Prophet, THE day.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"John 1:21","greek":"*ὁ* προφήτης εἶ σύ;","english":"Are you *the* Prophet?","note":"Par excellence — not a prophet, THE prophet."}],"watchOut":"Close to monadic. Monadic means there is only one; par excellence means there are several and this is the one that counts.","tags":["article","point","ch-5"]},{"id":"article-identification","set":"article","group":"article-point","name":"Simple Identification","pic":"🔦","eli5":"It just picks out which one you mean. The plain job, and the commonest.","formula":{"pattern":["ὁ","+ word"],"filled":["the","identification"]},"short":"Identification","gist":"this particular one","tile":"I","oneLine":"The article singling out one particular person or thing.","mnemonic":"MAGPIE — I: Identification, this one here.","mnemonicWhy":"The default. If none of the other five fit, it is doing the plain job of saying which one.","spotIt":"Nothing clever going on — it just tells you which one is meant.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"Matt 2:2","greek":"ποῦ ἐστιν *ὁ* τεχθεὶς βασιλεὺς τῶν Ἰουδαίων","english":"Where is *he* who has been born King of the Jews?","note":"Identification — it picks out one particular person."}],"tags":["article","point","ch-5"]},{"id":"article-anaphoric","set":"article","group":"article-point","name":"Anaphoric Article","pic":"↩️","eli5":"It means “that one, the one I just said”. The water he was talking about a moment ago.","formula":{"pattern":["ὁ","+ word"],"filled":["the","earlier"]},"short":"Earlier","gist":"the one just mentioned","tile":"E","oneLine":"The article pointing back at something already named.","mnemonic":"MAGPIE — E: Earlier, the one already mentioned.","mnemonicWhy":"Translate it “that” instead of “the” and see if the sentence improves. If it does, it is anaphoric — and E is for Earlier, because the thing was named earlier.","spotIt":"Look backwards. Was this noun introduced a sentence or two ago without an article? Then this article is pointing at it.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"John 4:11 ESV","greek":"πόθεν οὖν ἔχεις *τὸ* ὕδωρ τὸ ζῶν","english":"So where do You get *that* ‘living water’?","note":"Anaphoric — the water already mentioned. Translate it “that”."}],"watchOut":"The most common of the five in narrative, and the easiest to read straight past.","tags":["article","point","ch-5"]},{"id":"article-pron-personal","set":"article","group":"article-pronoun-kinds","name":"Article as Personal Pronoun","pic":"🧔","eli5":"The article is the subject all by itself. “And they said to him.”","formula":{"pattern":["article","(no noun)"],"filled":["personal","he, she, they"]},"short":"Personal","gist":"he, she, they","tile":"Personal","oneLine":"ὁ / οἱ standing alone as he, she or they — usually with δέ.","mnemonic":"Pronoun — Personal: ὁ δέ means “and he”.","mnemonicWhy":"ὁ δέ and οἱ δέ are so common in narrative they are worth learning as a phrase: “and he …”, “and they …”.","spotIt":"An article with no noun, carrying δέ, at the head of a clause.","bookDef":"The article functions as a personal, relative, possessive, demonstrative, or alternate pronoun.","examples":[{"ref":"Matt 2:5","greek":"*οἱ* δὲ εἶπαν αὐτῷ","english":"*They* told him","note":"Personal — the article is the subject on its own."}],"tags":["article","pronoun","ch-5"]},{"id":"article-pron-relative","set":"article","group":"article-pronoun-kinds","name":"Article as Relative Pronoun","pic":"⛓️","eli5":"The article starts a “who” clause. “Your Father who is in heaven.”","formula":{"pattern":["article","(no noun)"],"filled":["relative","who, which"]},"short":"Relative","gist":"who, which","tile":"Relative","oneLine":"The article introducing a phrase that describes the noun before it.","mnemonic":"Pronoun — Relative: the article that means “who”.","mnemonicWhy":"It is a chain link: the article hooks the phrase behind it onto the noun in front of it.","spotIt":"An article repeated after a noun, with a phrase rather than a noun after it.","bookDef":"The article functions as a personal, relative, possessive, demonstrative, or alternate pronoun.","examples":[{"ref":"Matt 5:16 ESV","greek":"τὸν πατέρα ὑμῶν *τὸν* ἐν τοῖς οὐρανοῖς","english":"your Father *who* is in heaven","note":"Relative — the article introduces the clause."}],"tags":["article","pronoun","ch-5"]},{"id":"article-pron-possessive","set":"article","group":"article-pronoun-kinds","name":"Article as Possessive Pronoun","pic":"💼","eli5":"The article means “his”. Greek does not bother with αὐτοῦ when it is obvious.","formula":{"pattern":["article","(no noun)"],"filled":["possessive","his, her, their"]},"short":"Possessive","gist":"his, her, their","tile":"Possessive","oneLine":"The article doing the work of a possessive pronoun.","mnemonic":"Pronoun — Possessive: the article that means “his”.","mnemonicWhy":"If the owner is obvious from the sentence, Greek leaves the possessive out and lets the article carry it. English has to put it back.","spotIt":"An article where English needs “his”, “her” or “their” and there is no genitive pronoun to supply it.","bookDef":"The article functions as a personal, relative, possessive, demonstrative, or alternate pronoun.","examples":[{"ref":"Luke 15:12 ESV","greek":"ὁ δὲ διεῖλεν αὐτοῖς *τὸν* βίον","english":"And he divided *his* property between them","note":"Possessive — no αὐτοῦ needed, the article carries it."}],"tags":["article","pronoun","ch-5"]},{"id":"article-pron-demonstrative","set":"article","group":"article-pronoun-kinds","name":"Article as Demonstrative Pronoun","pic":"👆","eli5":"The article means “those”. “Those in the boat worshipped him.”","formula":{"pattern":["article","(no noun)"],"filled":["demonstrative","this, those"]},"short":"Demonstrative","gist":"this, those","tile":"Demonstrative","oneLine":"The article standing in for this, that, these or those.","mnemonic":"Pronoun — Demonstrative: the article that means “those”.","mnemonicWhy":"Usually with a phrase hanging off it: οἱ ἐν τῷ πλοίῳ — “those in the boat”.","spotIt":"An article with no noun, followed by a prepositional phrase.","bookDef":"The article functions as a personal, relative, possessive, demonstrative, or alternate pronoun.","examples":[{"ref":"Matt 14:33","greek":"*οἱ* ἐν τῷ πλοίῳ προσεκύνησαν αὐτῷ","english":"*those* in the boat worshiped him","note":"Demonstrative — “those”."}],"tags":["article","pronoun","ch-5"]},{"id":"article-pron-alternate","set":"article","group":"article-pronoun-kinds","name":"Article as Alternate Pronoun","pic":"👬","eli5":"Two articles taking turns. “Some as apostles… others as prophets.”","formula":{"pattern":["article","(no noun)"],"filled":["alternate","some… others"]},"short":"Alternate","gist":"some… others","tile":"Alternate","oneLine":"ὁ μέν … ὁ δέ, dividing a group into some and others.","mnemonic":"Pronoun — Alternate: μέν … δέ, some … others.","mnemonicWhy":"The tell is the pair of little words. μέν sets up “on the one hand”, δέ answers “on the other”.","spotIt":"μέν on one article and δέ on another, splitting a list in two.","bookDef":"The article functions as a personal, relative, possessive, demonstrative, or alternate pronoun.","examples":[{"ref":"Eph 4:11 NASB","greek":"αὐτὸς ἔδωκεν *τοὺς* μὲν ἀποστόλους","english":"He gave *some* as apostles","note":"Alternate — μέν … δέ, some … others."}],"tags":["article","pronoun","ch-5"]},{"id":"article-none-indefinite","set":"article","group":"article-absence-kinds","name":"Absence — Indefinite","pic":"🫥","eli5":"No “the”, and it really does mean “a”. A boat. Any boat.","formula":{"pattern":["no article","→"],"filled":["∅","genuinely “a”"]},"short":"Indefinite","gist":"genuinely “a”","tile":"Indefinite","oneLine":"The missing article marking something non-particular: one of many.","mnemonic":"Poof — Indefinite: it really is “a”.","mnemonicWhy":"This is the reading everyone reaches for first, and it is right about a third of the time. Ask the other two before settling.","spotIt":"Would “a” or “some” read naturally? Then indefinite.","bookDef":"The absence of the article may convey that a given substantive is non-particular (indefinite or qualitative) or definite. If definite, this may be in conjunction with a proper name, a prepositional object, ordinal numbers, in predicate nominatives, as the complement in an object, complement construction, with monadic (one-of-a-kind) nouns, with abstract or generic nouns, with a pronominal adjective, or with technical expressions.","examples":[{"ref":"Mark 3:9","greek":"ἵνα *πλοιάριον* προσκαρτερῇ αὐτῷ","english":"to have *a small boat* ready for him","note":"Indefinite — genuinely “a”."}],"tags":["article","absence","ch-5"]},{"id":"article-none-qualitative","set":"article","group":"article-absence-kinds","name":"Absence — Qualitative","pic":"💎","eli5":"No “the”, and it is pointing at the quality itself. “Full of grace” — grace-ness, not a portion of grace.","formula":{"pattern":["no article","→"],"filled":["∅","what kind of thing"]},"short":"Qualitative","gist":"what kind of thing","tile":"Qualitative","oneLine":"The missing article stressing the nature of the thing rather than its identity.","mnemonic":"Poof — Qualitative: the stuff itself, not a piece of it.","mnemonicWhy":"Also non-particular, like indefinite — but the emphasis is on what kind, not on which one. Add “the very nature of” in your head and see if it fits.","spotIt":"Would “the quality of” or “the very nature of” fit in front of it? Then qualitative.","bookDef":"The absence of the article may convey that a given substantive is non-particular (indefinite or qualitative) or definite. If definite, this may be in conjunction with a proper name, a prepositional object, ordinal numbers, in predicate nominatives, as the complement in an object, complement construction, with monadic (one-of-a-kind) nouns, with abstract or generic nouns, with a pronominal adjective, or with technical expressions.","examples":[{"ref":"John 1:14","greek":"πλήρης *χάριτος* καὶ *ἀληθείας*","english":"full of *grace* and *truth*","note":"Qualitative — the qualities themselves."}],"tags":["article","absence","ch-5"]},{"id":"article-none-definite","set":"article","group":"article-absence-kinds","name":"Absence — Definite Anyway","pic":"🔒","eli5":"No “the”, and it still means THE. Paul does not need an article to be Paul.","formula":{"pattern":["no article","→"],"filled":["∅","still THE"]},"short":"Definite","gist":"still THE","tile":"Definite","oneLine":"The missing article where the noun is definite regardless — and the chart lists nine places it happens.","mnemonic":"Poof — Definite: gone, and still THE.","mnemonicWhy":"This is the reading that settles John 1:1. Anarthrous does not mean indefinite; there are nine standard places where the article is simply not needed.","spotIt":"Run the list: is it a name, after a preposition, an ordinal, a predicate nominative, a complement, one-of-a-kind, abstract or generic, a pronominal adjective, or a technical term? Any of those and it is definite.","bookDef":"The absence of the article may convey that a given substantive is non-particular (indefinite or qualitative) or definite. If definite, this may be in conjunction with a proper name, a prepositional object, ordinal numbers, in predicate nominatives, as the complement in an object, complement construction, with monadic (one-of-a-kind) nouns, with abstract or generic nouns, with a pronominal adjective, or with technical expressions.","examples":[{"ref":"Acts 16:25","greek":"*Παῦλος* καὶ *Σιλᾶς* προσευχόμενοι","english":"*Paul* and *Silas* were praying","note":"Definite — a proper name needs no article."},{"ref":"Phil 4:4","greek":"Χαίρετε ἐν *κυρίῳ*","english":"Rejoice in *the Lord*","note":"Definite — object of a preposition."},{"ref":"Matt 27:43 ESV","greek":"θεοῦ εἰμι *υἱός*","english":"I am *the Son* of God!","note":"Definite — a predicate nominative with no article, and still THE Son."}],"watchOut":"This is the row that settles John 1:1. Anarthrous does not mean indefinite.","tags":["article","absence","ch-5"],"kindsLabel":"Where gone still means definite","kinds":[{"name":"With a proper name","note":"Παῦλος does not need one"},{"name":"Object of a preposition","note":"ἐν κυρίῳ — in THE Lord"},{"name":"Ordinal numbers","note":"first, second, third"},{"name":"In predicate nominatives","note":"θεοῦ εἰμι υἱός — and this is Colwell's territory"},{"name":"As the complement in an object-complement construction","note":"what the object is called"},{"name":"With monadic nouns","note":"one-of-a-kind things"},{"name":"With abstract or generic nouns","note":"the idea, or the whole class"},{"name":"With a pronominal adjective","note":"πᾶς, ὅλος and the like"},{"name":"With technical expressions","note":"set phrases that have dropped it"}]},{"id":"granville-sharp","set":"article","group":"article-rules","name":"Granville Sharp Rule","pic":"🔗","eli5":"One “the” over two names joined by “and” — usually one person, not two.","formula":{"pattern":["ὁ","A","καὶ","B"],"filled":["our great","God","and","Savior"],"note":"One article ⇒ one person."},"short":"Granville Sharp","gist":"one article, one person","tile":"Sharp","oneLine":"One article governing two joined substantives points at a single person.","mnemonic":"Sharp joins.","mnemonicWhy":"The conditions are the rule: singular, personal, not proper names, same case, joined by καί. Miss one condition and it does not apply.","spotIt":"One article, then καί, then two singular personal non-proper nouns in the same case.","bookDef":"When a single article governs two singular, personal, non-proper substantives of the same case that are joined by καί, they frequently refer to the same person.","examples":[{"ref":"Titus 2:13","greek":"*τοῦ* μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ","english":"our great *God and Savior*, Jesus Christ","note":"One article covers both, so God and Savior are one person."}],"watchOut":"Proper names are excluded, and so are plurals. The rule is narrow on purpose.","tags":["article","rules","ch-5"]},{"id":"colwell","set":"article","group":"article-rules","name":"Colwell's Rule","pic":"⬇️","eli5":"Put a “the” word in front of “is” and it drops its “the”. That is why John 1:1 has no “the” on God.","formula":{"pattern":["Y (no article)","ἦν","ὁ X"],"filled":["θεός","was","ὁ λόγος"],"note":"Definite, and the article is gone anyway."},"short":"Colwell's Rule","gist":"definite drops the article","tile":"Colwell","oneLine":"A definite predicate nominative before the copula usually goes without the article.","mnemonic":"Colwell drops.","mnemonicWhy":"This is why John 1:1 reads θεὸς ἦν ὁ λόγος with nothing in front of θεός — and why “a god” does not follow from the missing article.","spotIt":"A predicate nominative, no article, sitting in front of the to-be verb.","bookDef":"A definite predicate nominative does not usually take the article when preceding the copula (linking verb).","examples":[{"ref":"John 1:1","greek":"*θεὸς* ἦν ὁ λόγος","english":"the Word was *God*","note":"θεός is definite and drops the article because it comes first."}],"watchOut":"Read the rule in the direction it is written. It says definite nouns usually drop the article. It does not say every article-less noun before a copula is definite.","tags":["article","rules","ch-5"]},{"id":"apollonius","set":"article","group":"article-rules","name":"Apollonius's Canon","pic":"🟰","eli5":"“The Word of the God”, or “Word of God”. Never one of each.","formula":{"pattern":["ὁ λόγος","τοῦ θεοῦ"],"filled":["both have it","or neither does"],"note":"λόγος θεοῦ works too. One of each does not."},"short":"Apollonius's Canon","gist":"both or neither","tile":"Apollonius","oneLine":"In a genitive chain, head noun and genitive both take the article or both go without.","mnemonic":"Apollonius matches.","mnemonicWhy":"They dress alike. ὁ λόγος τοῦ θεοῦ, or λόγος θεοῦ — you do not get one of each.","spotIt":"A noun with a genitive after it. Check whether both carry the article, or neither.","bookDef":"When two nouns are in a genitive construction, both the head noun and the noun in the genitive case either have or lack the article.","examples":[{"ref":"John 10:35","greek":"ὁ λόγος *τοῦ* θεοῦ","english":"*the* Word of God","note":"Both have the article."},{"ref":"1 Pet 1:23","greek":"λόγος θεοῦ","english":"word of God","note":"Neither has it. Still the same construction."}],"tags":["article","rules","ch-5"]},{"id":"adj-agreement","set":"adjective","group":"adjective-agreement","name":"Agreement — Case, Number, Gender","pic":"🎰","type":"rule","eli5":"The describing word has to dress like the word it describes. Same case, same number, same gender — all three.","formula":{"pattern":["adjective","must match","its noun"],"filled":["καλούς","case · number · gender","καρπούς"],"note":"Two out of three is not a match."},"short":"Agreement","gist":"all three must match","tile":"Agreement","oneLine":"An adjective agrees with its noun in case, number and gender.","mnemonic":"Three reels, and all three have to line up.","mnemonicWhy":"A fruit machine pays out only when every reel matches. An adjective describes a noun only when case, number and gender all agree — and that is what tells you which noun it belongs to when Greek word order scatters them across the clause.","spotIt":"Found an adjective? Check case, number and gender against the noun before you decide what it modifies. Then look at where the article sits, which is what separates attributive from predicate.","kindsLabel":"Every reel has to line up","kinds":[{"name":"Case","note":"nominative with nominative, dative with dative"},{"name":"Number","note":"singular with singular, plural with plural"},{"name":"Gender","note":"masculine with masculine, feminine with feminine, neuter with neuter"}],"examples":[{"ref":"Matt 7:17","greek":"πᾶν *δένδρον* *ἀγαθὸν* *καρποὺς* *καλοὺς* ποιεῖ","english":"every *good tree* produces *good fruit*","note":"Two adjectives, each matching its own noun and not the other: δένδρον ἀγαθόν is neuter singular, καρποὺς καλούς masculine plural accusative. The endings are what keep them apart."},{"ref":"John 10:11","greek":"ἐγώ εἰμι *ὁ* ποιμὴν *ὁ* *καλός*","english":"I am the *good* shepherd","note":"Masculine singular nominative all the way through, article included. Agreement plus the repeated article is what makes it attributive rather than a claim."}],"watchOut":"Agreement is not in the summary chart — it is assumed there. Every row describes what an adjective does once it already agrees. And the substantival adjective is the exception that proves it: with no noun to agree with, its own gender and number tell you who is meant — οἱ ἅγιοι, masculine plural, is “the holy ones”.","tags":["adjective","agreement","ch-5"]},{"id":"adj-position","set":"adjective","group":"adjective-agreement","name":"The Article's Position","pic":"🧭","type":"rule","eli5":"Where the little word “the” sits tells you which kind it is. In front of the describing word, it describes. Only in front of the thing, it is a claim. In front of neither, you cannot tell.","formula":{"pattern":["the","good","man"],"filled":["ὁ","ἀγαθὸς","ἄνθρωπος"],"note":"Same three words, four orders, three different answers."},"short":"Position","gist":"where the article sits","tile":"Position","oneLine":"Where the article sits decides attributive or predicate — unless there is no article at all.","mnemonic":"Follow the article. If it reaches the adjective, the adjective sticks.","mnemonicWhy":"The article is a hand. If it reaches past the noun and takes the adjective too, they come out as one phrase. If it only ever holds the noun, the adjective is left outside with nothing to do but assert. If it is holding nothing, nobody can tell you which was meant.","spotIt":"Find the article. Immediately before the adjective — directly, or by being repeated? Attributive. Before the noun and never before the adjective? Predicate. On neither word? Genuinely either, and only context decides.","kindsLabel":"Same words, reordered","kinds":[{"name":"ὁ ἀγαθὸς ἄνθρωπος","note":"attributive — “the good man”. The article runs straight into the adjective."},{"name":"ὁ ἄνθρωπος ὁ ἀγαθός","note":"attributive — “the good man”. A second article picks the adjective up again."},{"name":"ἀγαθὸς ὁ ἄνθρωπος","note":"predicate — “the man is good”. The article is on the noun and never reaches the adjective."},{"name":"ἄνθρωπος ἀγαθός","note":"either — no article on either word, so the form cannot settle it. Context decides."}],"examples":[{"ref":"1 John 5:20","greek":"*ὁ* *ἀληθινὸς* θεός","english":"the *true* God","note":"Article straight into the adjective. Attributive, and it labels."},{"ref":"1 Cor 1:9","greek":"*πιστὸς* *ὁ* θεός","english":"God is *faithful*","note":"Adjective out in front, article on the noun. Predicate, and there is no verb written at all."}],"watchOut":"The one case the test cannot settle is no article on either word. ἄνθρωπος ἀγαθός is “a good man” or “a man is good” — the form will not tell you, and only the context will.","tags":["adjective","agreement","position","ch-5"]},{"id":"adj-attributive","set":"adjective","group":"adjective-use","name":"Attributive","pic":"🖌️","eli5":"It describes the noun. “The TRUE God.”","formula":{"pattern":["ὁ","adj","noun"],"filled":["the","true","God"],"note":"The adjective sticks to the noun."},"short":"Attributive","gist":"sticks to the noun","tile":"A","oneLine":"The adjective giving the noun a quality.","mnemonic":"ASAP — A: attributive, it sticks to the noun.","mnemonicWhy":"The article reaches past the noun and takes hold of the adjective, which is why they come out as one phrase: the true God. Say adjective and noun together and nothing is being claimed — it is a label.","spotIt":"Look at where the article is. Attributive when the article precedes the adjective — ὁ ἀγαθὸς λόγος, or ὁ λόγος ὁ ἀγαθός. Then confirm it reads as “the ___ noun”.","bookDef":"An adjective that ascribes a particular quality to a noun or substantive.","examples":[{"ref":"1 John 5:20","greek":"ὁ *ἀληθινὸς* θεός","english":"the *true* God","note":"With the article. One phrase, one idea."},{"ref":"Matt 10:31","greek":"*πολλῶν* στρουθίων διαφέρετε ὑμεῖς","english":"you are worth more than *many* sparrows","note":"Without the article, and still attributive."}],"tags":["adjective","use","ch-5"],"kindsLabel":"Word orders that are attributive","kinds":[{"name":"article · adjective · noun","note":"ὁ ἀγαθὸς λόγος — the article leads straight into the adjective"},{"name":"article · noun · article · adjective","note":"ὁ λόγος ὁ ἀγαθός — a second article picks the adjective up again"}],"watchOut":"The position test needs an article to read. With none on either word — πολλῶν στρουθίων, Matt 10:31 — the form is genuinely ambiguous and context is what settles it, not a quick look at whether it labels or claims."},{"id":"adj-substantival","set":"adjective","group":"adjective-use","name":"Substantival","pic":"🧍","eli5":"The adjective becomes the noun. “The Holy One” — no noun needed.","formula":{"pattern":["ὁ","adj"],"filled":["the","Holy One"],"note":"The noun is missing and nobody minds."},"short":"Substantival","gist":"becomes the noun","tile":"S","oneLine":"The adjective acting as a noun.","mnemonic":"ASAP — S: substantival, it becomes the noun.","mnemonicWhy":"It usually takes the article, and that is the giveaway: ὁ ἅγιος, the Holy One.","spotIt":"An adjective with an article and no noun anywhere for it to describe.","bookDef":"The adjective normally takes on the characteristics of a noun (e.g., the article) and functions as a noun or substantive in a given phrase.","examples":[{"ref":"John 6:69 NASB","greek":"σὺ εἶ *ὁ ἅγιος*","english":"You are *the Holy One*","note":"No noun after it. The adjective is the noun."}],"tags":["adjective","use","ch-5"]},{"id":"adj-adverbial","set":"adjective","group":"adjective-use","name":"Adverbial","pic":"🦘","eli5":"The adjective jumps to the doing-word. “Going a little farther.”","formula":{"pattern":["verb","adj (neut. acc. sg.)"],"filled":["going","a little farther"],"note":"It modifies the verb, not a noun."},"short":"Adverbial","gist":"jumps to the verb","tile":"A","oneLine":"The adjective modifying a verb.","mnemonic":"ASAP — A: adverbial, it jumps to the verb.","mnemonicWhy":"Usually neuter accusative singular — and you have met this exact word before, as the accusative of measure. Same μικρόν, same verse.","spotIt":"An adjective answering how or how far, describing no noun at all.","bookDef":"Use of an adjective (usually in the neuter accusative singular) to modify a verb rather than noun.","examples":[{"ref":"Matt 26:39","greek":"καὶ προελθὼν *μικρὸν* ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ","english":"Going *a little farther*, he fell facedown","note":"The same word the accusative chapter files under measure. Two chapters, one form."}],"tags":["adjective","use","ch-5"]},{"id":"adj-predicate","set":"adjective","group":"adjective-use","name":"Predicate","pic":"💬","eli5":"It says something about the subject. “God is faithful.”","formula":{"pattern":["adj","(is)","noun"],"filled":["faithful","—","ὁ θεός"],"note":"A claim, not a label."},"short":"Predicate","gist":"makes a claim","tile":"P","oneLine":"The adjective asserting a quality of the subject.","mnemonic":"ASAP — P: predicate, it makes a claim.","mnemonicWhy":"The article stays on the noun and never reaches the adjective, which leaves the adjective
