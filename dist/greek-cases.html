okDef":"An adjective that predicates a certain quality to the subject, frequently by way of a copulative (linking) verb.","examples":[{"ref":"1 Cor 1:9","greek":"*πιστὸς* ὁ θεός","english":"God is *faithful*","note":"No verb written. The adjective still makes the claim."},{"ref":"Rom 4:8 ESV","greek":"*μακάριος* ἀνὴρ οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν","english":"*blessed* is the man against whom the Lord will not count his sin","note":"Without the article, and still a claim."}],"watchOut":"Attributive and predicate is the pair that gets missed, and the article's position settles it whenever there is one. With none on either word — μακάριος ἀνήρ, Rom 4:8 — it could be either as far as the form goes, and only context decides.","tags":["adjective","use","ch-5"],"kindsLabel":"Word orders that are predicate","kinds":[{"name":"adjective · article · noun","note":"πιστὸς ὁ θεός — the adjective out in front, article on the noun"},{"name":"article · noun · adjective","note":"ὁ λόγος ἀγαθός — the adjective trailing, and still no article on it"}]},{"id":"adj-superlative","set":"adjective","group":"adjective-degree","name":"Superlative","pic":"🥇","eli5":"Best of three or more. “Most High God.”","formula":{"ladder":["Take the positive: μέγας, great.","Add -ιστος: μέγιστος, greatest.","Or add -τατος: ἅγιος holy → ἁγιώτατος, holiest."]},"short":"Superlative","gist":"best of three or more","tile":"S","oneLine":"Comparing three or more.","mnemonic":"SPECS — S: superlative, the -est.","mnemonicWhy":"Two endings, both meaning -est. -ιστος even looks like it if you squint: μέγιστος, great-est. -τατος is the other one, and it is the comparative's -τερος with the vowels swapped — τερος for two, τατος for the top.","spotIt":"Ask how many are being compared. Three or more ⇒ superlative.","bookDef":"Compares the qualities of three or more entities.","examples":[{"ref":"Luke 8:28","greek":"Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ *ὑψίστου*","english":"Jesus, Son of the *Most High* God","note":"Highest of all, not higher than one other."},{"ref":"Matt 13:32","greek":"*μικρότερον* μέν ἐστιν πάντων τῶν σπερμάτων","english":"it is the *smallest* of all the seeds","note":"A comparative form doing superlative work — “smaller than all” is how Greek often says “smallest”."}],"tags":["adjective","degree","ch-5"],"kindsLabel":"How it gets built","kinds":[{"name":"-ιστος on a positive adjective","note":"μέγας great → μέγιστος greatest · πολύς much → πλεῖστος most · μικρός small → ἐλάχιστος smallest · ὕψιστος highest, which has no positive form in the New Testament at all."},{"name":"-τατος on a positive adjective","note":"ἅγιος holy → ἁγιώτατος holiest · τίμιος valuable → τιμιώτατος most valuable · ἀκριβής strict → ἀκριβέστατος strictest."}],"watchOut":"Two of the -ιστος words are not built off the adjective beside them: πλεῖστος does not come from πολύς's stem and ἐλάχιστος does not come from μικρός's. Those pairs are learned whole, like good and best. And a superlative form with nothing to compare it against is elative — it just means “very”."},{"id":"adj-positive","set":"adjective","group":"adjective-degree","name":"Positive","pic":"1️⃣","eli5":"Nothing is being compared. “The law is spiritual” — just what sort of thing it is.","formula":{"pattern":["adj"],"filled":["spiritual"],"note":"Kind, not degree."},"short":"Positive","gist":"plain, no comparing","tile":"P","oneLine":"The plain form, describing kind rather than degree.","mnemonic":"SPECS — P: positive, the plain one.","mnemonicWhy":"No -er, no -est, nothing to measure against. It just says what sort of thing it is.","spotIt":"No comparison anywhere in sight? Positive.","bookDef":"Focuses on the properties of a noun in terms of kind rather than degree.","examples":[{"ref":"Rom 7:14","greek":"ὁ νόμος *πνευματικός* ἐστιν","english":"the law is *spiritual*","note":"Not more spiritual than anything. Just spiritual."}],"tags":["adjective","degree","ch-5"],"watchOut":"This is the form the other two are built from: add -τερος for the comparative, -ιστος or -τατος for the superlative. A few words have no positive to build from — ὕψιστος, “most high”, never appears as a positive in the New Testament."},{"id":"adj-elative","set":"adjective","group":"adjective-degree","name":"Elative","pic":"🔊","eli5":"Not comparing at all — just turning it up. “A very large crowd.”","formula":{"pattern":["-er or -est form","= very ___"],"filled":["πλεῖστος","very large"],"note":"No comparison. Just louder."},"short":"Elative","gist":"just means “very”","tile":"E","oneLine":"A comparative or superlative used to intensify, not to compare.","mnemonic":"SPECS — E: elative, the volume knob.","mnemonicWhy":"A -er or -est form with nothing to compare it against. Translate it “very”.","spotIt":"See a comparative or superlative, then look for what it is compared to. Nothing there? Elative.","bookDef":"Use of the comparative or superlative adjective to describe an intensification of the positive notion.","examples":[{"ref":"2 Cor 8:17","greek":"*σπουδαιότερος* … ἐξῆλθεν","english":"[he] being *very diligent*, went out","note":"Comparative form, elative sense — not more diligent than someone."},{"ref":"Mark 4:1","greek":"ὄχλος *πλεῖστος*","english":"a *very large* crowd","note":"Superlative form, elative sense."}],"tags":["adjective","degree","ch-5"]},{"id":"adj-comparative","set":"adjective","group":"adjective-degree","name":"Comparative","pic":"2️⃣","eli5":"More than one other. “More powerful than I am.”","formula":{"ladder":["Take the positive: ἰσχυρός, strong.","Add -τερος: ἰσχυρότερος, stronger.","Or, for the handful that have no such form, learn the word: μείζων, greater."]},"short":"Comparative","gist":"more than one other","tile":"C","oneLine":"Comparing two, by degree.","mnemonic":"SPECS — C: comparative, the -er.","mnemonicWhy":"Greek builds it the way English does. Regular: bolt an ending on — μικρός small becomes μικρότερος smaller, and -τερος is doing the job of -er, which is also roughly what it sounds like. Irregular: a different word you simply learn, exactly like good → better and bad → worse.","spotIt":"Ask what it is being compared to. If there is an answer, comparative. If not, look at elative.","bookDef":"Focuses on the properties of a noun in terms of degree rather than kind.","examples":[{"ref":"Mark 1:7","greek":"ἔρχεται ὁ *ἰσχυρότερός* μου ὀπίσω μου","english":"One who is *more powerful* than I am is coming after me","note":"μου is what he is more powerful than."}],"tags":["adjective","degree","ch-5"],"kindsLabel":"How it gets built","kinds":[{"name":"-τερος on a positive adjective","note":"ἀσθενής weak → ἀσθενέστερος weaker · ἰσχυρός strong → ἰσχυρότερος stronger · μικρός small → μικρότερος smaller · πρέσβυς old → πρεσβύτερος older. Hear the -er in -τερος and the rest follows."},{"name":"A third declension form, learned whole","note":"μείζων greater · πλέον more · χείρων worse · κρεῖσσον and κρείττων both better. Nothing to build them from — these are the good → better, bad → worse of Greek."}],"watchOut":"πρεσβύτερος is literally “older”, and it is where presbyter and elder come from — the office is named with a comparative. And a comparative form does not always compare: with nothing on the other side of the scale it is elative, and means “very”."},{"id":"adj-special-cases","set":"adjective","group":"adjective-degree","name":"Special Cases","pic":"🔀","eli5":"The words swap jobs. “More” can mean “most”: 1 Cor 13:13 says “greater” and means “greatest”.","formula":{"pattern":["one form","doing another's job"],"filled":["μείζων (“more”)","= “greatest”"],"note":"Everyday speech blurred the three."},"short":"Special cases","gist":"forms swap jobs","tile":"S","oneLine":"One degree standing in for another.","mnemonic":"SPECS — S: special cases, the swaps.","mnemonicWhy":"Three swaps to know: positive for comparative, positive for superlative, and comparative for superlative. 1 Cor 13:13 literally says “more” and means “most”.","spotIt":"The form and the sense disagree. Translate by sense and name the swap.","bookDef":"Instances where popular speech and/or Semitic influence affected the use of the positive, comparative and superlative for one another.","examples":[{"ref":"Matt 18:8","greek":"*καλόν* σοί ἐστιν","english":"It is *better* for you","note":"Positive form, comparative sense."},{"ref":"Matt 22:38","greek":"ἡ *μεγάλη* καὶ πρώτη ἐντολή","english":"the *greatest* and most important command","note":"Positive form, superlative sense."},{"ref":"1 Cor 13:13","greek":"*μείζων* δὲ τούτων ἡ ἀγάπη","english":"but the *greatest* of these is love","note":"Comparative form, superlative sense. Three are in view, so “greater” means “greatest”."}],"tags":["adjective","degree","ch-5"]},{"id":"pron-ego","set":"person","group":"person-pronouns","name":"First Person Singular","pic":"🙋","eli5":"The one talking. Me.","formula":{"pattern":["ἐγώ","I"],"filled":["the Greek","the English"]},"short":"I","gist":"I","tile":"I","oneLine":"ἐγώ — “I”.","mnemonic":"Roll call — I: ἐγώ.","mnemonicWhy":"ἐγώ is “ego”. Your ego is all about you — I.","spotIt":"A nominative pronoun standing on its own: ἐγώ.","bookDef":"ἐγώ (“I”)","examples":[{"ref":"The form","greek":"ἐγώ","english":"I","note":"ἐγώ εἰμι — “I am”. The verb ending already says “I”; the pronoun adds weight."}],"tags":["person","pronoun","ch-6"]},{"id":"pron-su","set":"person","group":"person-pronouns","name":"Second Person Singular","pic":"👤","eli5":"The one you are looking at. Just the one.","formula":{"pattern":["σύ","you (one person)"],"filled":["the Greek","the English"]},"short":"You","gist":"you (one person)","tile":"You","oneLine":"σύ — “you (one person)”.","mnemonic":"Roll call — You: σύ.","mnemonicWhy":"σύ is one finger, pointed at one face. One person, not a room.","spotIt":"A nominative pronoun standing on its own: σύ.","bookDef":"σύ (“you” sg)","examples":[{"ref":"The form","greek":"σύ","english":"you (one person)","note":"Σὺ τίς εἶ; — “Who are YOU?” John 1:19. The pronoun is there to press."}],"tags":["person","pronoun","ch-6"]},{"id":"pron-autos","set":"person","group":"person-pronouns","name":"Third Person Singular","pic":"🚗","eli5":"Somebody else, one of them. He, she or it.","formula":{"pattern":["αὐτός, –ή, –ό","he, she, it"],"filled":["the Greek","the English"]},"short":"He","gist":"he, she, it","tile":"He","oneLine":"αὐτός, –ή, –ό — “he, she, it”.","mnemonic":"Roll call — He: αὐτός, –ή, –ό.","mnemonicWhy":"αὐτός sounds like AUTO — and an auto drives itSELF. That second meaning, “himself”, is the one you meet everywhere.","spotIt":"A nominative pronoun standing on its own: αὐτός, –ή, –ό.","bookDef":"αὐτός, –ή, –ό (“he,” “she,” “it”)","examples":[{"ref":"The form","greek":"αὐτός, –ή, –ό","english":"he, she, it","note":"Three endings for three genders: –ός he, –ή she, –ό it."}],"tags":["person","pronoun","ch-6"]},{"id":"pron-hemeis","set":"person","group":"person-pronouns","name":"First Person Plural","pic":"🫂","eli5":"My lot. Me and the people with me.","formula":{"pattern":["ἡμεῖς","we"],"filled":["the Greek","the English"]},"short":"We","gist":"we","tile":"We","oneLine":"ἡμεῖς — “we”.","mnemonic":"Roll call — We: ἡμεῖς.","mnemonicWhy":"ἡμεῖς has the H. H for Home team — us.","spotIt":"A nominative pronoun standing on its own: ἡμεῖς.","bookDef":"ἡμεῖς (“we”)","examples":[{"ref":"The form","greek":"ἡμεῖς","english":"we","note":"One letter from ὑμεῖς, and the two mean opposite sides."}],"tags":["person","pronoun","ch-6"],"watchOut":"ἡμεῖς and ὑμεῖς differ by one letter and mean opposite sides. ὑ = the u of YOU; ἡ = us."},{"id":"pron-hymeis","set":"person","group":"person-pronouns","name":"Second Person Plural","pic":"👥","eli5":"Your lot. The whole room you are talking to.","formula":{"pattern":["ὑμεῖς","you (more than one)"],"filled":["the Greek","the English"]},"short":"You all","gist":"you (more than one)","tile":"You all","oneLine":"ὑμεῖς — “you (more than one)”.","mnemonic":"Roll call — You all: ὑμεῖς.","mnemonicWhy":"ὑμεῖς starts with ὑ — the u of YOU.","spotIt":"A nominative pronoun standing on its own: ὑμεῖς.","bookDef":"ὑμεῖς (“you” pl)","examples":[{"ref":"The form","greek":"ὑμεῖς","english":"you (more than one)","note":"English hides this and Greek does not. Most New Testament “you” is this one — plural, the church, not you personally."}],"tags":["person","pronoun","ch-6"],"watchOut":"ἡμεῖς and ὑμεῖς differ by one letter and mean opposite sides. ὑ = the u of YOU; ἡ = us."},{"id":"pron-autoi","set":"person","group":"person-pronouns","name":"Third Person Plural","pic":"🚙","eli5":"Their lot. The other crowd.","formula":{"pattern":["αὐτοί, –αί, –ά","they"],"filled":["the Greek","the English"]},"short":"They","gist":"they","tile":"They","oneLine":"αὐτοί, –αί, –ά — “they”.","mnemonic":"Roll call — They: αὐτοί, –αί, –ά.","mnemonicWhy":"The autos, plural. αὐτός becomes αὐτοί.","spotIt":"A nominative pronoun standing on its own: αὐτοί, –αί, –ά.","bookDef":"αὐτοί, –αί, –ά (they)","examples":[{"ref":"The form","greek":"αὐτοί, –αί, –ά","english":"they","note":"Same three genders again: –οί, –αί, –ά."}],"tags":["person","pronoun","ch-6"]},{"id":"voice-active-simple","set":"voice","group":"voice-active","name":"Simple Active","pic":"⚡","eli5":"He does it. Full stop. “God loved the world.”","formula":{"pattern":["subject","does it","to something"],"filled":["God","loved","the world"]},"short":"Simple (act.)","gist":"he just does it","tile":"Do","oneLine":"The subject performs the action himself.","mnemonic":"Active — Do: he does it, and that is all.","mnemonicWhy":"The plain one, and the one you meet most. If nothing bends back and nothing is being allowed, it is simple.","spotIt":"Ask: is the subject doing it, and does none of it come back on him? Simple active.","bookDef":"The subject directly performs the action of the verb.","examples":[{"ref":"John 3:16","greek":"*ἠγάπησεν* ὁ θεὸς τὸν κόσμον","english":"God *loved* the world","note":"God does the loving; it lands on the world, not on God."}],"tags":["voice","active","ch-6"]},{"id":"voice-active-causative","set":"voice","group":"voice-active","name":"Causative Active","pic":"🌅","eli5":"He does not do it himself — he makes it happen. God makes the sun come up.","formula":{"pattern":["subject","causes","X","to happen"],"filled":["God","causes","his sun","to rise"]},"short":"Causative","gist":"he makes it happen","tile":"Make","oneLine":"The subject is the reason it happens, not the one doing it.","mnemonic":"Active — Make: he makes it happen.","mnemonicWhy":"God does not personally shove the sun over the hill. He causes it to rise. Slip “causes … to” into your translation and see if it fits better.","spotIt":"Try “causes X to …” in English. If that reads better than the plain active, it is causative.","bookDef":"The subject is the cause behind the action of the verb.","examples":[{"ref":"Matt 5:45","greek":"τὸν ἥλιον αὐτοῦ *ἀνατέλλει*","english":"God *causes* his sun *to rise*","note":"Active form, but the subject is the cause, not the doer."}],"watchOut":"The form is ordinary active. Nothing marks it — only the sense does.","tags":["voice","active","ch-6"]},{"id":"voice-active-reflexive","set":"voice","group":"voice-active","name":"Reflexive Active","pic":"🏋️","eli5":"He does it to himself — and says so with an extra word. “Train yourself.”","formula":{"pattern":["active verb","+ self-pronoun"],"filled":["γύμναζε","σεαυτόν"],"note":"Two words doing what the middle does in one."},"short":"Reflexive (act.)","gist":"he does it to himself","tile":"Me","oneLine":"An active verb plus a reflexive pronoun: σεαυτόν, ἑαυτόν.","mnemonic":"Active — Me: active verb, and a spare “self” lying next to it.","mnemonicWhy":"This is how the active does reflexive: it has to borrow a pronoun. The middle does not — that is the whole difference.","spotIt":"Active verb, and a reflexive pronoun (σεαυτόν, ἑαυτόν) sitting beside it.","bookDef":"The subject performs the action to himself.","examples":[{"ref":"1 Tim 4:7","greek":"*γύμναζε* *σεαυτὸν* πρὸς εὐσέβειαν","english":"*Train* *yourself* in godliness","note":"γύμναζε is active. σεαυτόν is doing the reflexive work."}],"watchOut":"Not the middle. The middle reflexive carries it in the verb and needs no pronoun.","tags":["voice","active","ch-6"]},{"id":"voice-middle-reflexive","set":"voice","group":"voice-middle","name":"Reflexive Middle","pic":"🪃","eli5":"It comes straight back to him, and the verb says so on its own. Judas hanged himself.","formula":{"pattern":["middle verb"],"filled":["ἀπήγξατο"],"note":"One word: he hanged himself."},"short":"Reflexive (mid.)","gist":"to himself, no pronoun","tile":"To me","oneLine":"A middle verb whose action lands on the subject — no reflexive pronoun needed.","mnemonic":"Middle — To me: the boomerang. It comes back.","mnemonicWhy":"The middle carries the “self” inside the ending. Where the active had to add σεαυτόν, the middle just is reflexive.","spotIt":"A middle-form verb, and the action clearly lands on the subject, with no reflexive pronoun in sight.","bookDef":"The subject performs the action to himself.","examples":[{"ref":"Matt 27:5","greek":"ἀπελθὼν *ἀπήγξατο*","english":"he went out and *hanged himself*","note":"One middle verb. The “himself” is in the ending."}],"watchOut":"Compare 1 Tim 4:7: same idea, active verb, borrowed pronoun. The voice is the difference.","tags":["voice","middle","ch-6"]},{"id":"voice-middle-interest","set":"voice","group":"voice-middle","name":"Middle of Special Interest","pic":"🛒","eli5":"He does it, and he is the one who gets the good of it. Mary picked the good bit for herself.","formula":{"pattern":["subject","does it","for himself"],"filled":["Mary","chose","the good portion"]},"short":"Special interest","gist":"for himself","tile":"For me","oneLine":"The subject does the action for his own benefit.","mnemonic":"Middle — For me: he did it, and he keeps the benefit.","mnemonicWhy":"Not to himself — for himself. The action goes out; the profit comes back.","spotIt":"The subject acts, and the person who gains by it is the subject. Try “for himself” in the translation.","bookDef":"The subject performs the action for himself.","examples":[{"ref":"Luke 10:42","greek":"Μαριὰμ τὴν ἀγαθὴν μερίδα *ἐξελέξατο*","english":"Mary has *chosen* the good portion","note":"She chose, and she is the one who has it."}],"watchOut":"“To himself” is reflexive; “for himself” is special interest. One lands on him, one profits him.","tags":["voice","middle","ch-6"]},{"id":"voice-middle-permissive","set":"voice","group":"voice-middle","name":"Permissive Middle","pic":"🤲","eli5":"He does not do it and it is not forced on him — he lets it happen to him. “Get baptised.”","formula":{"pattern":["subject","lets it be done","to him"],"filled":["you","be baptised","—"]},"short":"Permissive (mid.)","gist":"he lets it be done to him","tile":"Let me","oneLine":"The subject consents to the action happening to or for him.","mnemonic":"Middle — Let me: open hands. He allows it.","mnemonicWhy":"You do not baptise yourself and you are not ambushed either. You submit to it. That is the middle's permission.","spotIt":"Try “let himself be …” or “have it done”. If that is the sense, it is permissive.","bookDef":"The subject allows something to be done to or for himself.","examples":[{"ref":"Acts 22:16","greek":"ἀναστὰς *βάπτισαι* καὶ *ἀπόλουσαι* τὰς ἁμαρτίας σου","english":"Get up, *be baptised*, and *wash away* your sins","note":"Both middle. Paul is told to let it be done to him."}],"tags":["voice","middle","ch-6"]},{"id":"voice-passive-simple","set":"voice","group":"voice-passive","name":"Simple Passive","pic":"📥","eli5":"It happens to him. He did nothing. “The righteousness of God is revealed.”","formula":{"pattern":["subject","is done to"],"filled":["the righteousness of God","is revealed"]},"short":"Simple (pass.)","gist":"he receives it","tile":"Done to me","oneLine":"The subject receives the action instead of doing it.","mnemonic":"Passive — Done to me: it arrives whether he moved or not.","mnemonicWhy":"The plain passive, and the easy one. The subject is the target, and somebody or something else did it.","spotIt":"The subject is not doing it. Ask “by whom?” and the answer is somewhere else, or nowhere.","bookDef":"The subject receives the action of the verb.","examples":[{"ref":"Rom 1:17","greek":"δικαιοσύνη θεοῦ … *ἀποκαλύπτεται*","english":"The righteousness of God *is revealed*","note":"It does not reveal itself. It is revealed."}],"tags":["voice","passive","ch-6"]},{"id":"voice-passive-permissive","set":"voice","group":"voice-passive","name":"Permissive Passive","pic":"🕊️","eli5":"It is done to him — but only because he says yes. “Be filled with the Spirit.”","formula":{"pattern":["subject","consents","to it being done"],"filled":["you","be filled","with the Spirit"]},"short":"Permissive (pass.)","gist":"he consents to it","tile":"Let it be done","oneLine":"A passive where the subject is being asked to consent, not just to receive.","mnemonic":"Passive — Let it be done: he opens the door.","mnemonicWhy":"A passive you can be commanded to do only makes sense if you have a say in it. That is the tell.","spotIt":"A passive form, but the sense is consent — often an imperative you are told to allow.","bookDef":"The subject gives consent or permission regarding the action of the verb.","examples":[{"ref":"Eph 5:18","greek":"*πληροῦσθε* ἐν πνεύματι","english":"*Be filled* with the Spirit","note":"You do not fill yourself. You are told to let yourself be filled."}],"watchOut":"Very close to the middle permissive. The middle is “he lets it be done to himself”; the passive is “he consents to what is done to him”.","tags":["voice","passive","ch-6"]},{"id":"mood-potential","set":"mood","group":"mood-indicative","name":"Potential Indicative","pic":"💭","eli5":"Somebody wants something. “I want them to marry.” The wanting is the fact.","formula":{"pattern":["want-verb","+ infinitive"],"filled":["βούλομαι","γαμεῖν"]},"short":"Potential (ind.)","gist":"want, ought, wish","tile":"W","oneLine":"A verb of wishing, wanting or obligation, with an infinitive hanging off it.","mnemonic":"WAIFS — W: Want.","mnemonicWhy":"The wanting really is happening, so the verb is indicative. What is wanted sits in the infinitive after it.","spotIt":"A verb like βούλομαι, θέλω or δεῖ, followed by an infinitive.","bookDef":"Used with verbs of obligation, wish, or desire, followed by a complementary infinitive.","examples":[{"ref":"1 Tim 5:14","greek":"*βούλομαι* οὖν νεωτέρας γαμεῖν","english":"So I *want* younger women to marry","note":"βούλομαι is the indicative; γαμεῖν is the infinitive it wants."}],"tags":["mood","indicative","ch-6"],"kindsLabel":"The verbs that trigger it","kinds":[{"name":"Obligation","note":"δεῖ, ὀφείλω — one ought to"},{"name":"Wish","note":"θέλω — one wants to"},{"name":"Desire","note":"βούλομαι — one intends to"}]},{"id":"mood-interrogative","set":"mood","group":"mood-indicative","name":"Interrogative","pic":"❓","eli5":"It asks something — and the answer will be a plain fact too. “Who are you?”","formula":{"pattern":["question word","indicative verb"],"filled":["τίς","εἶ"]},"short":"Interrogative","gist":"asks a real question","tile":"A","oneLine":"A question expecting an answer in the indicative.","mnemonic":"WAIFS — A: Ask.","mnemonicWhy":"A question about what is actually the case. Not “should we?” — that is a different mood — but “who are you?”","spotIt":"A question mark, and the answer would be a statement of fact.","bookDef":"A question that will also be answered in the indicative mood.","examples":[{"ref":"John 1:19","greek":"Σὺ τίς *εἶ*;","english":"Who *are* you?","note":"The answer comes back in the indicative too: “I am not the Christ.”"}],"tags":["mood","indicative","ch-6"]},{"id":"mood-conditional-ind","set":"mood","group":"mood-indicative","name":"Conditional Indicative","pic":"🚦","eli5":"“If this is true — and let us say it is.” The if-half is treated as a fact.","formula":{"ladder":["First class — εἰ + indicative: if this is so, and it is.","Second class — εἰ + indicative, ἄν in the apodosis: if this were so, but it is not."]},"short":"Conditional (ind.)","gist":"εἰ + indicative","tile":"I","oneLine":"The “if” half of a first or second class conditional, after εἰ.","mnemonic":"WAIFS — I: If.","mnemonicWhy":"εἰ takes you to the indicative. First class assumes the if is true; second class assumes it is false. Either way the speaker is treating it as settled.","spotIt":"εἰ plus an indicative verb. First class: assumed true. Second class: contrary to fact, and ἄν usually shows up in the second half.","bookDef":"First Class: The protasis (“if” clause) of a first class conditional sentence. · Second Class: The protasis of a second class conditional sentence.","examples":[{"ref":"Col 3:1 — first class","greek":"εἰ οὖν *συνηγέρθητε* τῷ Χριστῷ, τὰ ἄνω ζητεῖτε","english":"So if you *have been raised* with Christ, seek the things above","note":"Assumed true: you have been raised. So — seek."},{"ref":"John 5:46 — second class","greek":"εἰ γὰρ *ἐπιστεύετε* Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί","english":"For if you *believed* Moses, you would believe me","note":"Contrary to fact: they do not believe Moses. Note the ἄν in the second half."}],"watchOut":"εἰ + indicative is first or second class. ἐάν + subjunctive is third class, and that is a different card in a different mood.","tags":["mood","indicative","ch-6"],"kindsLabel":"The classes εἰ takes","kinds":[{"name":"First class","note":"εἰ + indicative — if this is so, and it is"},{"name":"Second class","note":"εἰ + indicative, ἄν in the second half — if it were so, but it is not"}]},{"id":"mood-declarative","set":"mood","group":"mood-indicative","name":"Declarative","pic":"📰","eli5":"It just says what is. “In the beginning was the Word.”","formula":{"pattern":["subject","indicative verb"],"filled":["ὁ λόγος","ἦν"]},"short":"Declarative","gist":"states a plain fact","tile":"F","oneLine":"A plain statement, with nothing hedged.","mnemonic":"WAIFS — F: Fact.","mnemonicWhy":"The default, and the reason the indicative exists. If nothing else is going on, this is it.","spotIt":"A statement with no “if”, no question mark, and no wanting.","bookDef":"An unqualified assertion or statement.","examples":[{"ref":"John 1:1","greek":"ἐν ἀρχῇ *ἦν* ὁ λόγος","english":"In the beginning *was* the Word","note":"No hedge, no condition. It simply was."}],"tags":["mood","indicative","ch-6"]},{"id":"mood-cohortative","set":"mood","group":"mood-indicative","name":"Cohortative","pic":"📜","eli5":"A future that is really an order. “You shall love your neighbour.”","formula":{"pattern":["future indicative","= a command"],"filled":["ἀγαπήσεις","love him"]},"short":"Cohortative","gist":"future used as a command","tile":"S","oneLine":"A future indicative doing the work of a command.","mnemonic":"WAIFS — S: Shall.","mnemonicWhy":"This is how the Ten Commandments sound: “you shall not”. It is grammatically a prediction and functionally an order.","spotIt":"A future indicative where the sense is “do this”, not “this will happen”.","bookDef":"A future indicative that is used as a command.","examples":[{"ref":"Jas 2:8","greek":"*ἀγαπήσεις* τὸν πλησίον σου","english":"You *shall love* your neighbour","note":"Future in form. An order in force."}],"watchOut":"Not the imperative mood. The form is future indicative — only the use is a command.","tags":["mood","indicative","ch-6"]},{"id":"mood-subj-purpose","set":"mood","group":"mood-subjunctive","name":"Purpose","pic":"🏹","eli5":"Why he did it. “He came SO THAT he could tell people about the light.”","formula":{"pattern":["ἵνα","subjunctive"],"filled":["in order that","he might testify"]},"short":"Purpose","gist":"so that — intended","tile":"Aim","oneLine":"ἵνα (or ὅπως) plus subjunctive, giving the aim.","mnemonic":"Subjunctive — Aim: the arrow, before it lands.","mnemonicWhy":"Purpose is about intention. It might not even come off; it is what was aimed at.","spotIt":"ἵνα or ὅπως, and the sense is “in order to”.","bookDef":"Follows the particle ἵνα (or ὅπως) and expresses purpose (intended result).","examples":[{"ref":"John 1:7","greek":"ἵνα *μαρτυρήσῃ* περὶ τοῦ φωτός","english":"in order to *testify* about the light","note":"That is what he came for. The aim."}],"watchOut":"Same word, ἵνα, as result. Only the sense separates them: aimed at, or actually happened.","tags":["mood","subjunctive","ch-6"]},{"id":"mood-subj-result","set":"mood","group":"mood-subjunctive","name":"Result","pic":"💥","eli5":"What actually came of it. “…that he was born blind.” Nobody aimed at that.","formula":{"pattern":["ἵνα","subjunctive"],"filled":["with the result that","he was born blind"]},"short":"Result","gist":"so that — it happened","tile":"Outcome","oneLine":"ἵνα (or ὅπως) plus subjunctive, giving what actually followed.","mnemonic":"Subjunctive — Outcome: the bang, after it lands.","mnemonicWhy":"Same word as purpose. The test is whether anyone intended it. Nobody intends a baby to be born blind, so ἵνα there is result.","spotIt":"ἵνα, and “with the result that” reads better than “in order that”.","bookDef":"Follows the particle ἵνα (or ὅπως) and expresses result (actual result).","examples":[{"ref":"John 9:2","greek":"τίς ἥμαρτεν … ἵνα τυφλὸς *γεννηθῇ*;","english":"Who sinned … that *he was born* blind?","note":"The blindness is the outcome, not anybody's aim."}],"tags":["mood","subjunctive","ch-6"]},{"id":"mood-subj-conditional","set":"mood","group":"mood-subjunctive","name":"Conditional Subjunctive","pic":"🎲","eli5":"A real maybe. “If anyone keeps my word” — some will, some will not.","formula":{"pattern":["ἐάν","subjunctive"],"filled":["if (maybe)","he keeps"]},"short":"Conditional (subj.)","gist":"ἐάν + subjunctive","tile":"If","oneLine":"The “if” half of a third class conditional, after ἐάν.","mnemonic":"Subjunctive — If: the dice. Genuinely open.","mnemonicWhy":"ἐάν is εἰ + ἄν, and the ἄν is the uncertainty. εἰ alone goes with the indicative; ἐάν goes with the subjunctive.","spotIt":"ἐάν or ἐὰν μή, plus a subjunctive verb.","bookDef":"Follows the particle ἐάν or ἐὰν μή and is used in the protasis of a third class conditional sentence.","examples":[{"ref":"John 8:51","greek":"ἐάν τις τὸν ἐμὸν λόγον *τηρήσῃ*","english":"If anyone *keeps* my word","note":"Third class. Open — some will, some will not."}],"watchOut":"εἰ + indicative is first or second class. ἐάν + subjunctive is third. The particle tells you before the verb does.","tags":["mood","subjunctive","ch-6"]},{"id":"mood-subj-relative","set":"mood","group":"mood-subjunctive","name":"Indefinite Relative","pic":"🎟️","eli5":"Not one named person — anybody at all. “Whoever calls on the name of the Lord.”","formula":{"pattern":["ὃς ἄν","subjunctive"],"filled":["whoever","calls on him"]},"short":"Indef. relative","gist":"whoever, anyone who","tile":"Whoever","oneLine":"After an indefinite relative pronoun with ἄν, the verb goes subjunctive.","mnemonic":"Subjunctive — Whoever: a ticket with no name on it.","mnemonicWhy":"The ἄν is what makes it indefinite. ὅς is “who”; ὃς ἄν is “whoever it turns out to be”.","spotIt":"ὅστις (ἄν/ἐάν) or ὃς (δ᾿) ἄν, then a subjunctive.","bookDef":"Used after the indefinite relative pronouns ὅστις (ἄν/ἐάν) or ὃς (δ᾿) ἄν.","examples":[{"ref":"Acts 2:21","greek":"ὃς ἂν *ἐπικαλέσηται* τὸ ὄνομα κυρίου σωθήσεται","english":"*whoever* calls on the name of the Lord will be saved","note":"No particular person is meant. Anyone who does it."}],"tags":["mood","subjunctive","ch-6"]},{"id":"mood-subj-temporal","set":"mood","group":"mood-subjunctive","name":"Indefinite Temporal","pic":"⏰","eli5":"Not one particular time — any time it happens. “Whenever someone says…”","formula":{"pattern":["ὅταν","subjunctive"],"filled":["whenever","someone says"]},"short":"Indef. temporal","gist":"whenever, every time","tile":"Whenever","oneLine":"After ὅταν or another temporal word, the verb goes subjunctive.","mnemonic":"Subjunctive — Whenever: the alarm that could go off any time.","mnemonicWhy":"ὅταν is ὅτε + ἄν — “when” plus the same ἄν that made “whoever” indefinite. Same trick, applied to time.","spotIt":"ὅταν, or an “until” word: ἕως, ἄχρι, μέχρι. Then a subjunctive.","bookDef":"Used after the temporal conjunction ὅταν or after a temporal adverb or preposition (e.g., ἕως, ἄχρι, μέχρι).","examples":[{"ref":"1 Cor 3:4","greek":"ὅταν γὰρ *λέγῃ* τις","english":"For *whenever* someone *says*","note":"Not one occasion. Every time it happens."}],"watchOut":"ὅταν is the common one, but ἕως, ἄχρι and μέχρι — “until” words — pull the subjunctive too.","tags":["mood","subjunctive","ch-6"]},{"id":"mood-subj-hortatory","set":"mood","group":"mood-subj-main","name":"Hortatory Subjunctive","pic":"🙌","eli5":"“Let us do good.” He is telling you to do it, and putting himself in with you.","formula":{"pattern":["1st person plural subjunctive"],"filled":["ἐργαζώμεθα — let us work"]},"short":"Hortatory","gist":"let us — and me too","tile":"Let us","oneLine":"A first person plural subjunctive: the speaker orders the room and joins it.","mnemonic":"On its own — Let us: he gives the order and stands in the queue with you.","mnemonicWhy":"This is why it is not an imperative. An imperative points at you; the hortatory says “us”, and the speaker is inside the command.","spotIt":"A first person plural subjunctive, translated “let us …”.","bookDef":"The author commands his audience but also includes himself in the command.","examples":[{"ref":"Gal 6:10","greek":"*ἐργαζώμεθα* τὸ ἀγαθὸν πρὸς πάντας","english":"*Let us do* good to everyone","note":"Paul is not exempt from it. That is the whole point of the form."}],"watchOut":"Not the imperative. The imperative commands you; the hortatory commands us.","tags":["mood","subj-main","ch-6"]},{"id":"mood-subj-deliberative","set":"mood","group":"mood-subj-main","name":"Deliberative Subjunctive","pic":"🤔","eli5":"“Should we keep sinning?” It asks — sometimes for an answer, sometimes to make a point.","formula":{"pattern":["subjunctive","as a question"],"filled":["ἐπιμένωμεν;","should we continue?"]},"short":"Deliberative (subj.)","gist":"should we? — a real question","tile":"Should we","oneLine":"A subjunctive asking a question, real or rhetorical.","mnemonic":"On its own — Should we: the raised eyebrow.","mnemonicWhy":"The indicative asks what is the case; the subjunctive asks what we should do about it. Rom 6:1 is not looking for information.","spotIt":"A question, and the verb is subjunctive rather than indicative.","bookDef":"Asks a real or rhetorical question.","examples":[{"ref":"Rom 6:1","greek":"*ἐπιμένωμεν* τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ","english":"*Should we continue* in sin so that grace may multiply?","note":"Rhetorical. The answer is coming in the next verse, and it is no."}],"watchOut":"The interrogative indicative asks about facts (“who are you?”). This one asks about what should be done.","tags":["mood","subj-main","ch-6"]},{"id":"mood-subj-emphatic","set":"mood","group":"mood-subj-main","name":"Emphatic Negation","pic":"🚫","eli5":"Two “no” words at once. Not just no — never, not a chance.","formula":{"pattern":["οὐ μή","+ subjunctive"],"filled":["never","will you enter"]},"short":"Emphatic negation","gist":"οὐ μή — never, ever","tile":"Never","oneLine":"The double negative οὐ μή with a subjunctive: the strongest denial Greek has.","mnemonic":"On its own — Never: two negatives stacked, and they do not cancel.","mnemonicWhy":"In English two negatives make a positive. In Greek they make a shout. οὐ μή is the strongest no in the language.","spotIt":"The two words οὐ μή sitting together, then a subjunctive.","bookDef":"Expressed by the double negative οὐ μή, it strongly denies that something will happen.","examples":[{"ref":"Matt 5:20","greek":"*οὐ μὴ* *εἰσέλθητε* εἰς τὴν βασιλείαν τῶν οὐρανῶν","english":"you will *never* *enter* the kingdom of heaven","note":"Not “probably not”. Never."}],"tags":["mood","subj-main","ch-6"]},{"id":"mood-subj-prohibitory","set":"mood","group":"mood-subj-main","name":"Prohibitory Subjunctive","pic":"🙅","eli5":"“Do not think that…” A “don't”, told with a subjunctive instead of a command.","formula":{"ladder":["μή — the command is negated.","aorist subjunctive — not present, not imperative.","Both, or it is not this."]},"short":"Prohibitory (subj.)","gist":"μή + aorist — don't start","tile":"Don't","oneLine":"A negated aorist subjunctive doing the work of “do not”.","mnemonic":"On its own — Don't: μή out front, aorist behind.","mnemonicWhy":"Two conditions, both required: the command is negated, and the subjunctive is aorist. Miss either and it is something else.","spotIt":"μή plus an aorist subjunctive. Both parts have to be there.","bookDef":"Used when two conditions are met: (1) the command is negated, and (2) the subjunctive uses the aorist tense-form.","examples":[{"ref":"Matt 5:17","greek":"*μὴ* *νομίσητε* ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας","english":"*Do not think* that I have come to abolish the Law or the Prophets","note":"μή, and νομίσητε is aorist subjunctive. Both boxes ticked."}],"watchOut":"Compare the imperative's prohibition (μὴ ἀγαπᾶτε, 1 John 2:15). Same idea, different mood — the tell is which form follows the μή.","tags":["mood","subj-main","ch-6"],"kindsLabel":"What it takes to be this","kinds":[{"name":"The command is negated","note":"μή out in front"},{"name":"The subjunctive is aorist","note":"not present, and not an imperative"}]},{"id":"mood-impv-request","set":"mood","group":"mood-imperative","name":"Request","pic":"🙇","eli5":"It is shaped like an order but you are talking to somebody above you, so it lands as “please”.","formula":{"pattern":["imperative","to a superior"],"filled":["βοήθησον","please help us"]},"short":"Request","gist":"an order, softened","tile":"P","oneLine":"An imperative aimed at a superior, which turns it into a request.","mnemonic":"PHONIC — P: Please.","mnemonicWhy":"Grammar cannot tell you this one. Who is being spoken to can. Nobody orders Jesus about; “help us” is a plea.","spotIt":"An imperative addressed to someone above the speaker.","bookDef":"A command that is given to a superior and is thus weakened to a request.","examples":[{"ref":"Mark 9:22","greek":"εἴ τι δύνῃ, *βοήθησον* ἡμῖν","english":"If you can do anything … *help* us","note":"Imperative in form. Begging in force."}],"tags":["mood","imperative","ch-6"]},{"id":"mood-impv-greeting","set":"mood","group":"mood-imperative","name":"Greeting","pic":"👋","eli5":"“Greetings!” Nobody is being ordered to do anything. It is just how you say hello.","formula":{"pattern":["frozen imperative","= hello"],"filled":["χαῖρε","greetings"]},"short":"Greeting","gist":"hello, in imperative clothes","tile":"H","oneLine":"A set phrase that happens to be an imperative.","mnemonic":"PHONIC — H: Hi.","mnemonicWhy":"χαῖρε literally means “rejoice”, but nobody hears it that way — it is Greek for “hello”. A frozen form, like English “goodbye”.","spotIt":"χαῖρε or χαίρετε used to open a conversation.","bookDef":"Greetings are often expressed with a stereotyped imperative.","examples":[{"ref":"Matt 26:49","greek":"*Χαῖρε*, ῥαββί","english":"*Greetings*, Rabbi!","note":"Judas is not commanding Jesus to rejoice."}],"tags":["mood","imperative","ch-6"]},{"id":"mood-impv-permission","set":"mood","group":"mood-imperative","name":"Permission","pic":"👌","eli5":"Not an order — a shrug. “If he wants to go, let him go.”","formula":{"pattern":["imperative","= allowance"],"filled":["χωριζέσθω","let him leave"]},"short":"Permission","gist":"let him, if he must","tile":"O","oneLine":"An imperative that allows something rather than demanding it.","mnemonic":"PHONIC — O: OK.","mnemonicWhy":"Paul is not commanding anybody to leave. He is saying: if that is what happens, let it.","spotIt":"Try “let him …” in the translation. If that is the sense, it is permission, not command.","bookDef":"Used to convey permission, allowance, or toleration.","examples":[{"ref":"1 Cor 7:15","greek":"εἰ ὁ ἄπιστος χωρίζεται, *χωριζέσθω*","english":"If the unbeliever leaves, *let him leave*","note":"Allowance, not instruction."}],"tags":["mood","imperative","ch-6"]},{"id":"mood-impv-prohibition","set":"mood","group":"mood-imperative","name":"Prohibition","pic":"❌","eli5":"A command with a “not” in front. “Do not love the world.”","formula":{"pattern":["μή","+ imperative"],"filled":["do not","love the world"]},"short":"Prohibition (impv.)","gist":"μή — do not","tile":"N","oneLine":"A negated imperative: it forbids.","mnemonic":"PHONIC — N: No.","mnemonicWhy":"Greek negates commands with μή, never οὐ. See μή in front of an imperative and it is a prohibition.","spotIt":"μή plus an imperative.","bookDef":"A negative command that forbids an action.","examples":[{"ref":"1 John 2:15","greek":"*μὴ* *ἀγαπᾶτε* τὸν κόσμον","english":"*Do not love* the world","note":"μή plus a present imperative."}],"watchOut":"μή + present imperative is this. μή + aorist subjunctive is the prohibitory subjunctive. The form after μή decides.","tags":["mood","imperative","ch-6"]},{"id":"mood-impv-conditional","set":"mood","group":"mood-imperative","name":"Conditional Imperative","pic":"👣","eli5":"It looks like two orders, but the first is really an “if”. “Come and see” means “if you come, you will see”.","formula":{"pattern":["imperative","καί","result"],"filled":["come","and","you will see"]},"short":"Conditional (impv.)","gist":"come and see = if you come","tile":"I","oneLine":"An imperative standing in for the “if” half of a condition.","mnemonic":"PHONIC — I: If.","mnemonicWhy":"Two imperatives joined by καί, where the first is the condition of the second. English does it too: “touch that and you're dead.”","spotIt":"Two imperatives with καί, and the sense is “if the first, then the second”.","bookDef":"Like the subjunctive, an imperative can be used to state a condition.","examples":[{"ref":"John 1:46","greek":"*ἔρχου* καὶ ἴδε","english":"*Come* and see — that is, if you come, you will see","note":"Philip is not barking two orders. He is offering a deal."}],"tags":["mood","imperative","ch-6"]},{"id":"mood-impv-command","set":"mood","group":"mood-imperative","name":"Command","pic":"🫡","eli5":"Just do it. “Rejoice always!”","formula":{"pattern":["plain imperative"],"filled":["χαίρετε — rejoice!"]},"short":"Command","gist":"the plain order","tile":"C","oneLine":"The plain imperative: an exhortation or a charge.","mnemonic":"PHONIC — C: Charge.","mnemonicWhy":"The default. If nobody is being softened, allowed, greeted or conditioned, it is a straight command.","spotIt":"An imperative with no μή, no καί-condition, and no superior being addressed.","bookDef":"An exhortation or charge.","examples":[{"ref":"1 Thess 5:16","greek":"πάντοτε *χαίρετε*","english":"*Rejoice* always!","note":"The same verb as the greeting — here it means it."}],"watchOut":"Same word as the greeting card (χαίρω). Context decides whether it is “hello” or “rejoice”.","tags":["mood","imperative","ch-6"]},{"id":"mood-opt-voluntative","set":"mood","group":"mood-optative","name":"Voluntative Optative","pic":"🕯️","eli5":"A wish said over somebody. “May grace and peace be multiplied to you.”","formula":{"pattern":["optative","= may it be"],"filled":["πληθυνθείη","may it be multiplied"]},"short":"Voluntative","gist":"a prayer or blessing","tile":"May","oneLine":"The optative of prayer, blessing and benediction.","mnemonic":"Optative — May: the candle you light over somebody.","mnemonicWhy":"This is where you actually meet the optative: the openings and closings of letters. If it reads like a benediction, it is this one.","spotIt":"Translate with “may …”. Prayers, blessings and the famous μὴ γένοιτο.","bookDef":"Expresses a prayer, benediction, blessing, or wish.","examples":[{"ref":"1 Pet 1:2","greek":"χάρις ὑμῖν καὶ εἰρήνη *πληθυνθείη*","english":"*May* grace and peace *be multiplied* to you","note":"A blessing, not a prediction."}],"tags":["mood","optative","ch-6"],"kindsLabel":"What the wish is for","kinds":[{"name":"A prayer","note":"asking God for it"},{"name":"A benediction","note":"the blessing at the end of a letter"},{"name":"A blessing or wish","note":"and μὴ γένοιτο — “may it never be!” — is the same form saying no"}]},{"id":"mood-opt-deliberative","set":"mood","group":"mood-optative","name":"Deliberative Optative","pic":"❔","eli5":"Somebody wonders what something means. “They asked what this parable might be.”","formula":{"pattern":["asking verb","+ optative"],"filled":["ἐπηρώτων","τίς εἴη"]},"short":"Deliberative (opt.)","gist":"an indirect question","tile":"Might","oneLine":"The optative in an indirect or rhetorical question.","mnemonic":"Optative — Might: the question you ask sideways.","mnemonicWhy":"Not a direct question. It is reported: they asked what it might be. English does the same softening.","spotIt":"A reported question, usually after a verb of asking, with “might” fitting the translation.","bookDef":"Used with indirect (rhetorical) questions.","examples":[{"ref":"Luke 8:9","greek":"ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ αὐτοῦ τίς αὕτη *εἴη* ἡ παραβολή","english":"His disciples questioned him as to what this parable *might be*","note":"The question is reported, not quoted. Hence the optative."}],"watchOut":"The deliberative subjunctive asks directly, “should we?”. This one is reported: “they asked what it might be.”","tags":["mood","optative","ch-6"]},{"id":"mood-opt-potential","set":"mood","group":"mood-optative","name":"Potential Optative","pic":"🍀","eli5":"The furthest-out maybe there is. “Even if you should suffer…” — unlikely, but suppose it.","formula":{"ladder":["First class — εἰ + indicative: and it is so.","Second class — εἰ + indicative + ἄν: but it is not.","Third class — ἐάν + subjunctive: it may well be.","Fourth class — εἰ + optative: it probably is not, but suppose."]},"short":"Potential (opt.)","gist":"fourth class — if you should","tile":"Should","oneLine":"The optative in a fourth class conditional.","mnemonic":"Optative — Should: the four-leaf clover. Fourth class, and about as common.","mnemonicWhy":"First class assumes true, second contrary to fact, third a real maybe, fourth a remote one — and the fourth needs the optative. The clover is your reminder that it is number four and it is rare.","spotIt":"εἰ plus an optative. Translate “if … should”.","bookDef":"Involves a fourth class conditional clause.","examples":[{"ref":"1 Pet 3:14","greek":"εἰ καὶ *πάσχοιτε* διὰ δικαιοσύνην, μακάριοι","english":"Even if *you should suffer* for righteousness, you are blessed","note":"Remote. Peter is not saying it will happen."}],"watchOut":"Now you have all four: εἰ + indicative (1st, 2nd), ἐάν + subjunctive (3rd), εἰ + optative (4th).","tags":["mood","optative","ch-6"]},{"id":"tense-present","set":"tense","group":"tense-forms","name":"Present","pic":"🎬","eli5":"Happening now, and still rolling. “I am loosing.”","formula":{"pattern":["λύω","“I am loosing”"],"filled":["the form","the helper"]},"short":"Present","gist":"I am loosing","tile":"Am","oneLine":"λύω — “I am loosing”.","mnemonic":"Clock tower — Am: λύω.","mnemonicWhy":"Am — the helper English reaches for when something is going on right now.","spotIt":"No augment, no sigma, no reduplication — the bare stem.","bookDef":"PRESENT · λύω · “I am loosing”","examples":[{"ref":"The paradigm","greek":"λύω","english":"I am loosing","note":"The default. Every other form is this one with something added to it."}],"tags":["tense","ch-6"]},{"id":"tense-future","set":"tense","group":"tense-forms","name":"Future","pic":"🔮","eli5":"Not yet. “I will loose.”","formula":{"pattern":["λύσω","“I will loose”"],"filled":["the form","the helper"]},"short":"Future","gist":"I will loose","tile":"Will","oneLine":"λύσω — “I will loose”.","mnemonic":"Clock tower — Will: λύσω.","mnemonicWhy":"Will — the helper for what has not happened yet. The σ is the promise.","spotIt":"A σ after the stem and no augment in front.","bookDef":"FUTURE · λύσω · “I will loose”","examples":[{"ref":"The paradigm","greek":"λύσω","english":"I will loose","note":"The same σ as the aorist. The augment is what separates them: the aorist has one, the future does not."}],"tags":["tense","ch-6"]},{"id":"tense-imperfect","set":"tense","group":"tense-forms","name":"Imperfect","pic":"🎞️","eli5":"Was going on, back then. “I was loosing.”","formula":{"pattern":["ἔλυον","“I was loosing”"],"filled":["the form","the helper"]},"short":"Imperfect","gist":"I was loosing","tile":"Was","oneLine":"ἔλυον — “I was loosing”.","mnemonic":"Clock tower — Was: ἔλυον.","mnemonicWhy":"Was — the helper for something that kept going, back then.","spotIt":"An ἐ- augment on the front and no σ.","bookDef":"IMPERFECT · ἔλυον · “I was loosing”","examples":[{"ref":"The paradigm","greek":"ἔλυον","english":"I was loosing","note":"Past and still rolling. Compare the aorist, which is past and done with."}],"tags":["tense","ch-6"]},{"id":"tense-aorist","set":"tense","group":"tense-forms","name":"Aorist","pic":"📸","eli5":"It happened. One snapshot, no comment. “I loosed.”","formula":{"pattern":["ἔλυσα","“I loosed”"],"filled":["the form","the helper"]},"short":"Aorist","gist":"I loosed","tile":"Did","oneLine":"ἔλυσα — “I loosed”.","mnemonic":"Clock tower — Did: ἔλυσα.","mnemonicWhy":"Did — no fuss and no duration. One snapshot of the whole thing.","spotIt":"Augment and σ together: ἔ-λυ-σα.","bookDef":"AORIST · ἔλυσα · “I loosed”","examples":[{"ref":"The paradigm","greek":"ἔλυσα","english":"I loosed","note":"The workhorse of narrative. It says that it happened, not how long it took."}],"tags":["tense","ch-6"]},{"id":"tense-perfect","set":"tense","group":"tense-forms","name":"Perfect","pic":"🧱","eli5":"Done, and it still stands. “I have loosed.”","formula":{"pattern":["λέλυκα","“I have loosed”"],"filled":["the form","the helper"]},"short":"Perfect","gist":"I have loosed","tile":"Have","oneLine":"λέλυκα — “I have loosed”.","mnemonic":"Clock tower — Have: λέλυκα.","mnemonicWhy":"Have — finished, and you are still holding what it left behind.","spotIt":"The stem said twice at the front — λέ-λυκα.","bookDef":"PERFECT · λέλυκα · “I have loosed”","examples":[{"ref":"The paradigm","greek":"λέλυκα","english":"I have loosed","note":"Reduplication is the perfect's fingerprint. Once you see the doubled front you can stop looking."}],"tags":["tense","ch-6"]},{"id":"tense-pluperfect","set":"tense","group":"tense-forms","name":"Pluperfect","pic":"🕰️","eli5":"Done before the thing you are already talking about. “I had loosed.”","formula":{"pattern":["ἐλελύκειν","“I had loosed”"],"filled":["the form","the helper"]},"short":"Pluperfect","gist":"I had loosed","tile":"Had","oneLine":"ἐλελύκειν — “I had loosed”.","mnemonic":"Clock tower — Had: ἐλελύκειν.","mnemonicWhy":"Had — finished before the thing you were already talking about.","spotIt":"Reduplication and an augment together: ἐ-λε-λύκειν.","bookDef":"PLUPERFECT · ἐλελύκειν · “I had loosed”","examples":[{"ref":"The paradigm","greek":"ἐλελύκειν","english":"I had loosed","note":"The perfect pushed one step further back, and rare in the New Testament."}],"tags":["tense","ch-6"],"watchOut":"The chart is only the indicative. Outside the indicative there is no time — only aspect, which is what the chapter says is the dominant force anyway."}],"confusions":[{"id":"pn-vs-apposition","pair":["predicate-nominative","nominative-apposition"],"question":"Predicate nominative or apposition?","test":"Is there a verb?","answer":"Verb ⇒ predicate nominative, a claim. Comma only ⇒ apposition, a label.","example":"“Ivan is the student” (claim) vs “Ivan, the student, came to class” (label)."},{"id":"absolute-vs-hanging","pair":["nominative-absolute","hanging-nominative"],"question":"Absolute or hanging?","test":"Does a pronoun later in the sentence pick the word back up?","answer":"No rope ⇒ absolute. Hangs by a pronoun ⇒ hanging.","example":"Mark 1:1 “The beginning of the gospel…” (a headline) vs Matt. 13:38 “the good seed — THESE are the sons…” (a rope)."},{"id":"address-vs-subject","pair":["nominative-address","subject"],"question":"Address or subject?","test":"Talked about, or talked to?","answer":"About ⇒ subject. To ⇒ address, however much it looks like a subject.","example":"“Husbands love their wives” (subject) vs “Husbands, love your wives” (address)."},{"id":"which-nominative-is-subject","pair":["pecking-order","predicate-nominative"],"question":"Two nominatives, one verb — which is the subject?","test":"Run PAP: pronoun, then article, then proper name.","answer":"First yes wins. In John 1:1c ὁ λόγος has the article, so it is the subject and θεός is the predicate — definite, not “a god”.","example":"καὶ θεὸς ἦν ὁ λόγος."},{"id":"cognate-vs-plain-object","pair":["cognate-accusative","direct-object"],"question":"Cognate or plain direct object?","test":"Does the object echo the verb — same root, or same idea?","answer":"Echo ⇒ cognate. No echo ⇒ just the object. Either way it is still the object.","example":"“Fight the good fight” (echo) vs “I hit Ivan” (no echo)."},{"id":"double-which-kind","pair":["double-accusative-complement","accusative-apposition"],"question":"Two accusatives side by side — renamed, or called something?","test":"Is there a verb doing the naming?","answer":"A verb calls, makes or gives it something ⇒ complement. No verb between them, the second just says which one exactly ⇒ apposition.","example":"“I have called you FRIENDS” · “they chose Stephen, a man full of faith”."},{"id":"respect-vs-object","pair":["accusative-respect","direct-object"],"question":"Accusative of respect or direct object?","test":"Put “with respect to” in front of it.","answer":"Better ⇒ respect. Worse ⇒ direct object.","example":"“pierced WITH RESPECT TO the heart” — better. “I hit WITH RESPECT TO Ivan” — worse."},{"id":"subjective-vs-objective","pair":["genitive-subjective","genitive-objective"],"question":"Subjective or objective?","test":"Turn the head noun into a verb. Is X doing it, or getting it?","answer":"Doing it ⇒ subjective. Getting it ⇒ objective.","example":"“the love of Christ” — Christ loving (subjective) or Christ being loved (objective). The Greek is identical either way."},{"id":"source-vs-separation","pair":["genitive-source","genitive-separation"],"question":"Source or separation? Both say “from”.","test":"Is the “from” attached to a noun or to a verb?","answer":"Where a noun came from ⇒ source. What a verb moves away from ⇒ separation.","example":"“the righteousness from God” (source) vs “depart from the faith” (separation)."},{"id":"gendo-vs-objective","pair":["genitive-direct-object","genitive-objective"],"question":"Genitive direct object or objective genitive?","test":"What is the genitive hanging off — a verb or a noun?","answer":"Off a verb ⇒ genitive direct object. Off a noun ⇒ objective genitive.","example":"“you did not lack anything” (verb) vs “faith in God” (noun)."},{"id":"partitive-whole-or-part","pair":["genitive-partitive","genitive-material"],"question":"Partitive or material/content?","test":"Is the genitive the whole the head noun is a slice of, or the stuff the head noun is made of?","answer":"Whole ⇒ partitive. Stuff ⇒ material or content.","example":"“one of the boats” (a slice of the fleet) vs “a cup of water” (what fills the cup)."},{"id":"possession-vs-relationship","pair":["genitive-possession","genitive-relationship"],"question":"Possession or relationship?","test":"Is the genitive owning a thing, or being kin to a person?","answer":"Owns a thing ⇒ possession. Family, with “son of” or “wife of” left out ⇒ relationship.","example":"“the house of Philip” (owns it) vs “James the [son] of Zebedee” (kin)."},{"id":"attributive-vs-description","pair":["genitive-attributive","genitive-description"],"question":"Attributive or description?","test":"Can the genitive be rewritten as an adjective?","answer":"Becomes a real adjective ⇒ attributive. Nothing more specific fits ⇒ description, the catch-all.","example":"“the word of his power” → “his powerful word” (attributive) vs “a baptism of repentance” (description)."},{"id":"vocative-vs-nominative-address","pair":["vocative-direct-address","nominative-address"],"question":"Vocative, or nominative of address?","test":"What shape is the word in?","answer":"Vocative shape ⇒ vocative of direct address. Nominative shape doing the same job ⇒ nominative of address.","example":"Λάζαρε (vocative) vs οἱ ἄνδρες, “Husbands…” (nominative doing a vocative’s work)."},{"id":"means-vs-agency","pair":["dative-means","dative-agency"],"question":"Means or agency?","test":"Could the dative have refused?","answer":"A thing with no will ⇒ means. A person who chose ⇒ agency.","example":"“cutting himself with stones” (means) vs “led by the Spirit” (agency)."},{"id":"three-withs","pair":["dative-means","dative-association"],"question":"Three uses all come out “with”. Which one?","test":"Tool, style, or company?","answer":"A tool ⇒ means. A style ⇒ manner. Company ⇒ association, often with a συν- verb.","example":"“with stones” · “openly” · “buried with him”."},{"id":"place-vs-sphere","pair":["dative-place","dative-sphere"],"question":"Place or sphere?","test":"Could you point at it?","answer":"A real spot ⇒ place. A realm you can only imagine ⇒ sphere.","example":"“sitting in a circle” (place) vs “sighing in his spirit” (sphere)."},{"id":"indirect-vs-interest","pair":["dative-indirect-object","dative-personal-interest"],"question":"Indirect object or personal interest?","test":"Does the sentence hand something over, or say who gains and loses by it?","answer":"Something is handed over and nothing is said about gain ⇒ indirect object. Somebody plainly benefits or suffers ⇒ personal interest. But the chapter says outright that every dative of advantage is also an indirect object, and that the label has to be inferred from context — so this one is a judgement call and worth saying so in class rather than answering flatly.","example":"“give glory to God” (handed over) · “adorned for her husband” (benefits) · “don't store up for yourselves” (benefits)."},{"id":"attributive-vs-predicate","pair":["adj-attributive","adj-predicate"],"question":"Attributive or predicate?","test":"Where is the article? Does it precede the adjective, or only the noun?","answer":"The article precedes the adjective ⇒ attributive: ὁ ἀγαθὸς ἄνθρωπος, ὁ ἄνθρωπος ὁ ἀγαθός. The article precedes the noun and not the adjective ⇒ predicate: ἀγαθὸς ὁ ἄνθρωπος. No article on either word ⇒ it could be either, and context decides: ἄνθρωπος ἀγαθός.","example":"ὁ ἀγαθὸς ἄνθρωπος “the good man” · ἀγαθὸς ὁ ἄνθρωπος “the man is good” · ἄνθρωπος ἀγαθός — either."},{"id":"comparative-vs-elative","pair":["adj-comparative","adj-elative"],"question":"Comparative or elative?","test":"Is there anything on the other side of the scale?","answer":"Something to compare against ⇒ comparative. Nothing ⇒ elative, and translate it “very”.","example":"“more powerful than I” (comparative) vs “a very large crowd” (elative)."},{"id":"absence-vs-colwell","pair":["article-none-definite","colwell"],"question":"No article — indefinite, or Colwell?","test":"Is it a predicate nominative sitting in front of the to-be verb?","answer":"In front of the copula ⇒ Colwell explains the missing article, and the noun can still be definite. Elsewhere, run the three questions: a? quality? or still THE?","example":"θεὸς ἦν ὁ λόγος — Colwell, definite. πλοιάριον in Mark 3:9 — genuinely “a”."},{"id":"double-kinds","pair":["double-accusative-complement","double-accusative-person-thing"],"question":"Two accusative objects — which double is it?","test":"Slip “as” between them.","answer":"“As” fits ⇒ object + complement. “As” is nonsense and one of them is a person ⇒ person + thing.","example":"“gave his life AS a ransom” · “asks him for bread”."},{"id":"reflexive-which-voice","pair":["voice-active-reflexive","voice-middle-reflexive"],"question":"He did it to himself — active or middle?","test":"Is there a reflexive pronoun sitting next to the verb?","answer":"A spare σεαυτόν / ἑαυτόν doing the work ⇒ active reflexive. The verb carries it alone, no pronoun ⇒ middle reflexive.","example":"“γύμναζε σεαυτόν” (1 Tim 4:7, active) · “ἀπήγξατο” (Matt 27:5, middle)."},{"id":"hina-purpose-or-result","pair":["mood-subj-purpose","mood-subj-result"],"question":"ἵνα + subjunctive — purpose or result?","test":"Did anybody aim at this?","answer":"Somebody intended it ⇒ purpose, “in order that”. It just turned out that way ⇒ result, “with the result that”.","example":"“came to testify” (John 1:7) · “that he was born blind” (John 9:2)."},{"id":"ei-or-ean","pair":["mood-conditional-ind","mood-subj-conditional"],"question":"An “if” clause — which class?","test":"Look at the particle before you look at the verb.","answer":"εἰ + indicative ⇒ first class (assumed true) or second class (contrary to fact, with ἄν later). ἐάν + subjunctive ⇒ third class, a real maybe.","example":"“εἰ συνηγέρθητε” (Col 3:1) · “ἐάν τις τηρήσῃ” (John 8:51)."},{"id":"we-or-you","pair":["pron-hemeis","pron-hymeis"],"question":"ἡμεῖς or ὑμεῖς?","test":"Look at the first letter, and say it.","answer":"ὑ has the u of YOU — ὑμεῖς is you all. ἡ is us — ἡμεῖς is we.","example":"ἡμεῖς = we · ὑμεῖς = you all."},{"id":"permissive-which-voice","pair":["voice-middle-permissive","voice-passive-permissive"],"question":"He allowed it — middle or passive?","test":"Is he letting it be done to himself, or consenting to what is being done?","answer":"Middle: he puts himself under it, “let yourself be baptised”. Passive: he gives way to it, “be filled”. Close cousins — the form decides.","example":"“βάπτισαι” (Acts 22:16, middle) · “πληροῦσθε” (Eph 5:18, passive)."},{"id":"prohibition-which-mood","pair":["mood-subj-prohibitory","mood-impv-prohibition"],"question":"μή plus a verb — prohibitory subjunctive, or imperative prohibition?","test":"Look at what comes after the μή.","answer":"μή + aorist subjunctive ⇒ prohibitory subjunctive. μή + imperative ⇒ prohibition. The form after the μή is the whole tell.","example":"“μὴ νομίσητε” (Matt 5:17, aorist subj.) · “μὴ ἀγαπᾶτε” (1 John 2:15, pres. impv.)."},{"id":"deliberative-which-mood","pair":["mood-subj-deliberative","mood-opt-deliberative"],"question":"A question — deliberative subjunctive or optative?","test":"Is the question being asked, or being reported?","answer":"Asked straight out, “should we …?” ⇒ subjunctive. Reported, “they asked what it might be” ⇒ optative.","example":"“ἐπιμένωμεν;” (Rom 6:1) · “τίς εἴη ἡ παραβολή” (Luke 8:9)."},{"id":"hortatory-or-command","pair":["mood-subj-hortatory","mood-impv-command"],"question":"An order — hortatory subjunctive or plain imperative?","test":"Is the speaker inside the command?","answer":"“Let us …”, speaker included ⇒ hortatory subjunctive. “Do this”, pointed at you ⇒ imperative.","example":"“ἐργαζώμεθα” (Gal 6:10, let us) · “χαίρετε” (1 Thess 5:16, you)."},{"id":"which-conditional-class","pair":["mood-subj-conditional","mood-opt-potential"],"question":"Which class of conditional?","test":"Look at the particle, then the mood of the verb.","answer":"εἰ + indicative ⇒ 1st (true) or 2nd (contrary to fact, ἄν later). ἐάν + subjunctive ⇒ 3rd, a real maybe. εἰ + optative ⇒ 4th, remote.","example":"Col 3:1 · John 5:46 · John 8:51 · 1 Pet 3:14."},{"id":"articular-or-anarthrous","pair":["article-articular","article-anarthrous"],"question":"Articular or anarthrous?","test":"Is there a ὁ, ἡ or τό in front of it?","answer":"There is ⇒ articular, the joint is in place. There is not ⇒ anarthrous, ἀν- plus ἄρθρον. The word only names what is there; what an absence means is the separate three-way question under Poof.","example":"John 1:1 has both in one clause: ὁ λόγος articular, θεός anarthrous."},{"id":"which-case-of-time","pair":["dative-time","genitive-time-place"],"question":"A time expression — which case?","test":"Ask what the phrase is measuring.","answer":"The point when it happened ⇒ dative. What kind of time, or time during which ⇒ genitive. How long it went on ⇒ accusative.","example":"Luke 23:56b–24:1a has all three: τὸ σάββατον (accusative, how long they rested) · τῇ μιᾷ τῶν σαββάτων (dative, the day they came) · ὄρθρου βαθέως (genitive, what kind of hour)."}],"extraQuiz":[{"prompt":"\"Grace, mercy, peace from God our Father\" (1 Tim. 1:2) — all nominative, no verb, opening a letter.","answer":"nominative-absolute","why":"Opening material, tied to nothing. A headline, not a rope."},{"prompt":"\"You call me Teacher and Lord\" (John 13:13) — the titles are nominative where you expected accusative.","answer":"nominative-appellation","why":"A title being used as the name people call him. Badges don't decline."},{"prompt":"\"Son of David, have mercy on us\" (Matt. 9:27).","answer":"nominative-address","why":"He is being called out to, not described."},{"prompt":"\"Paul, a servant of Christ Jesus\" (Rom. 1:1) — two nominatives, no verb.","answer":"nominative-apposition","why":"δοῦλος renames Παῦλος. No verb, so no claim — just a label."},{"prompt":"\"He is our peace\" (Eph. 2:14).","answer":"predicate-nominative","why":"A verb with a nominative each side. αὐτός is a pronoun, so it is the subject; ἡ εἰρήνη is what is said about him."},{"prompt":"\"The good seed — these are the sons of the kingdom\" (Matt. 13:38).","answer":"hanging-nominative","why":"σπέρμα is left dangling, but οὗτοι picks it up. Hanging by a pronoun."},{"prompt":"\"Fight the good fight\" (1 Tim. 1:18).","answer":"cognate-accusative","why":"The object echoes the verb — the same root, even."},{"prompt":"\"He gave his life as a ransom for many\" (Mark 10:45).","answer":"double-accusative-complement","why":"Two accusatives, and “as” slips between them: object + complement. Slip \"as\" between the two accusatives — \"his life AS a ransom\" — so it is the complement, not the person-and-thing double."},{"prompt":"\"They were cut to the heart\" (Acts 2:37) — an inner wound, not a surgical one.","answer":"accusative-respect","why":"Put “with respect to” in front and the sense improves."},{"prompt":"\"Going a little farther, he fell on the ground\" (Mark 14:35).","answer":"accusative-measure","why":"μικρόν answers “how far?” — MMR, one of three."},{"prompt":"\"Being justified freely by his grace\" (Rom. 3:24).","answer":"accusative-manner","why":"δωρεάν answers “how?” — MMR, two of three."},{"prompt":"\"They chose Stephen, a man full of faith\" (Acts 6:5).","answer":"accusative-apposition","why":"ἄνδρα renames the object. Alias."},{"prompt":"An infinitive's subject — the one performing the infinitive's action.","answer":"accusative-subject-infinitive","why":"Finite verbs take a nominative subject. Infinitives take an accusative one."},{"prompt":"\"and the Word was God\" (John 1:1c) — which use is θεός?","answer":"predicate-nominative","why":"ὁ λόγος has the article and wins the pecking order, so θεός is the predicate. No article, and still definite."},{"prompt":"he got into one of the boats","greek":"ἐμβὰς δὲ εἰς ἓν *τῶν πλοίων* (Luke 5:3)","english":"he got into one of the boats","ref":"ch. 3 practice 2","target":"τῶν πλοίων","answer":"genitive-partitive","why":"The boats are the whole; the one boat is the slice.","unofficial":true},{"prompt":"Remember Lot's wife","greek":"μνημονεύετε *τῆς γυναικὸς* Λώτ (Luke 17:32)","english":"Remember Lot's wife","ref":"ch. 3 practice 3","target":"τῆς γυναικός","answer":"genitive-direct-object","why":"μνημονεύω is a verb of memory — sensation — so it takes its object in the genitive.","unofficial":true},{"prompt":"the least … is greater than he","greek":"ὁ δὲ μικρότερος … μείζων *αὐτοῦ* ἐστιν (Matt 11:11)","english":"the least … is greater than he","ref":"ch. 3 practice 1","target":"αὐτοῦ","answer":"genitive-comparison","why":"μείζων is a comparative, so the genitive beside it is the “than”.","unofficial":true},{"prompt":"and Simon the Zealot, and Judas son of James","greek":"καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας *Ἰακώβου* (Acts 1:13)","english":"and Simon the Zealot, and Judas son of James","ref":"ch. 3 practice 4","target":"Ἰακώβου","answer":"genitive-relationship","why":"“Judas [son] of James.” The kin word is left out for you to supply.","unofficial":true},{"prompt":"Λάζαρε, δεῦρο ἔξω (John 11:43) — the underlined Λάζαρε.","answer":"vocative-direct-address","why":"He is being called by name. The vocative has exactly one use, and this is it."},{"prompt":"δὸς δόξαν τῷ θεῷ (John 9:24) — the underlined τῷ θεῷ.","answer":"dative-indirect-object","why":"Glory is handed over, and God is who it goes to. PORT — T."},{"prompt":"κατακόπτων ἑαυτὸν λίθοις (Mark 5:5) — the underlined λίθοις.","answer":"dative-means","why":"Stones are a tool with no will of their own. MAMA — M."},{"prompt":"εἰ δὲ πνεύματι ἄγεσθε (Gal 5:18) — the underlined πνεύματι.","answer":"dative-agency","why":"The Spirit chooses, so it is a personal agent. MAMA — A."},{"prompt":"θεὸς ἦν ὁ λόγος (John 1:1) — why does θεός have no article?","answer":"colwell","why":"A definite predicate nominative in front of the copula usually drops it. Colwell drops."},{"prompt":"τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ (Titus 2:13) — one article over both nouns.","answer":"granville-sharp","why":"Singular, personal, non-proper, same case, joined by καί. Sharp joins them into one person."},{"prompt":"σὺ εἶ ὁ ἅγιος (John 6:69) — the underlined ὁ ἅγιος.","answer":"adj-substantival","why":"An adjective with the article and no noun to describe. It has become the noun. ASAP — S."},{"prompt":"ἡ δὲ ἐλθοῦσα προσεκύνει *αὐτῷ* (Matt 15:25)\nshe came and knelt before him","greek":"ἡ δὲ ἐλθοῦσα προσεκύνει *αὐτῷ* (Matt 15:25)","english":"she came and knelt before him","ref":"ch. 4 practice 1a","target":"αὐτῷ","answer":"dative-direct-object","why":"προσκυνέω is a verb of worshipping, and the chart lists worshipping. BEAD — D, devoted verbs.","unofficial":true},{"prompt":"καὶ εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς *τῷ πνεύματι* αὐτοῦ (Mark 2:8)\nJesus, knowing at once in his spirit","greek":"καὶ εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς *τῷ πνεύματι* αὐτοῦ (Mark 2:8)","english":"Jesus, knowing at once in his spirit","ref":"ch. 4 practice 2","target":"τῷ πνεύματι","answer":"dative-sphere","why":"A realm, not a room — the same construction as the chart's own sphere example in Mark 8:12. HIT — I.","unofficial":true},{"prompt":"ὁ γὰρ ἐσθίων καὶ πίνων κρίμα *ἑαυτῷ* ἐσθίει (1 Cor 11:29)\nhe eats and drinks judgment on himself","greek":"ὁ γὰρ ἐσθίων καὶ πίνων κρίμα *ἑαυτῷ* ἐσθίει (1 Cor 11:29)","english":"he eats and drinks judgment on himself","ref":"ch. 4 practice 3","target":"ἑαυτῷ","answer":"dative-personal-interest","why":"Judgment to his own cost. Personal interest, the disadvantage side. PORT — P.","unofficial":true},{"prompt":"ἐγὼ … *ὕδατι* βαπτίζω ὑμᾶς (Luke 3:16)\nI baptise you with water","greek":"ἐγὼ … *ὕδατι* βαπτίζω ὑμᾶς (Luke 3:16)","english":"I baptise you with water","ref":"ch. 4 practice 4","target":"ὕδατι","answer":"dative-means","why":"Water is a tool with no will of its own. MAMA — M, not agency.","unofficial":true},{"prompt":"τί ποιεῖτε ὃ οὐκ ἔξεστιν *τοῖς σάββασιν*; (Luke 6:2)\nWhy are you doing what is not lawful on the Sabbath?","greek":"τί ποιεῖτε ὃ οὐκ ἔξεστιν *τοῖς σάββασιν*; (Luke 6:2)","english":"Why are you doing what is not lawful on the Sabbath?","ref":"ch. 4 practice 5","target":"τοῖς σάββασιν","answer":"dative-time","why":"A point on the calendar. HIT — T.","unofficial":true},{"prompt":"ἀλλὰ *παρρησίᾳ* περὶ τοῦ πατρὸς ἀπαγγελῶ ὑμῖν (John 16:25)\nbut I will tell you plainly about the Father","greek":"ἀλλὰ *παρρησίᾳ* περὶ τοῦ πατρὸς ἀπαγγελῶ ὑμῖν (John 16:25)","english":"but I will tell you plainly about the Father","ref":"ch. 4 practice 6","target":"παρρησίᾳ","answer":"dative-manner","why":"The same word the chart files under manner at Mark 8:32. A style, not a tool. MAMA — M.","unofficial":true},{"prompt":"ἠκολούθει δὲ *τῷ Ἰησοῦ* Σίμων Πέτρος (John 18:15)\nSimon Peter was following Jesus","greek":"ἠκολούθει δὲ *τῷ Ἰησοῦ* Σίμων Πέτρος (John 18:15)","english":"Simon Peter was following Jesus","ref":"ch. 4 practice 7a","target":"τῷ Ἰησοῦ","answer":"dative-direct-object","why":"ἀκολουθέω is a verb of following, and the chart lists following. BEAD — D.","unofficial":true},{"prompt":"ὁ δὲ μαθητὴς ἐκεῖνος … *συν*εισῆλθεν *τῷ Ἰησοῦ* (John 18:15)\nthat disciple went in with Jesus","greek":"ὁ δὲ μαθητὴς ἐκεῖνος … *συν*εισῆλθεν *τῷ Ἰησοῦ* (John 18:15)","english":"that disciple went in with Jesus","ref":"ch. 4 practice 7b","target":"τῷ Ἰησοῦ","answer":"dative-association","why":"συν- on the verb is the giveaway: he went in alongside Jesus, not using him. MAMA — A.","unofficial":true},{"prompt":"ὥσπερ γὰρ ὑμεῖς ποτε ἠπειθήσατε *τῷ θεῷ* (Rom 11:30)\njust as you once disobeyed God","greek":"ὥσπερ γὰρ ὑμεῖς ποτε ἠπειθήσατε *τῷ θεῷ* (Rom 11:30)","english":"just as you once disobeyed God","ref":"ch. 4 practice 8a","target":"τῷ θεῷ","answer":"dative-direct-object","why":"ἀπειθέω is a verb of obeying — disobeying is the same list. BEAD — D.","unofficial":true},{"prompt":"νῦν δὲ ἠλεήθητε *τῇ τούτων ἀπειθείᾳ* (Rom 11:30)\nnow you have received mercy because of their disobedience","greek":"νῦν δὲ ἠλεήθητε *τῇ τούτων ἀπειθείᾳ* (Rom 11:30)","english":"now you have received mercy because of their disobedience","ref":"ch. 4 practice 8b","target":"τῇ ἀπειθείᾳ","answer":"dative-cause","why":"Slot in “because of” and it holds. BEAD — B.","unofficial":true},{"prompt":"καθὼς θέλετε ἵνα ποιῶσιν *ὑμῖν* οἱ ἄνθρωποι, ποιεῖτε *αὐτοῖς* ὁμοίως (Luke 6:31)\nas you want people to do to you, do the same to them","greek":"καθὼς θέλετε ἵνα ποιῶσιν *ὑμῖν* οἱ ἄνθρωποι, ποιεῖτε *αὐτοῖς* ὁμοίως (Luke 6:31)","english":"as you want people to do to you, do the same to them","ref":"ch. 4 practice 9","target":"ὑμῖν / αὐτοῖς","answer":"dative-indirect-object","why":"The doing lands on them: they are who it is done to. PORT — T.","unofficial":true},{"prompt":"*συν*εζωοποίησεν *τῷ Χριστῷ* (Eph 2:5)\nhe made us alive together with Christ","greek":"*συν*εζωοποίησεν *τῷ Χριστῷ* (Eph 2:5)","english":"he made us alive together with Christ","ref":"ch. 4 practice 10b","target":"τῷ Χριστῷ","answer":"dative-association","why":"συν- again. Alongside Christ, not by means of him. MAMA — A.","unofficial":true},{"prompt":"*χάριτί* ἐστε σεσῳσμένοι (Eph 2:5)\nby grace you have been saved","greek":"*χάριτί* ἐστε σεσῳσμένοι (Eph 2:5)","english":"by grace you have been saved","ref":"ch. 4 practice 10c","target":"χάριτι","answer":"dative-means","why":"Grace is the instrument, not a person acting. MAMA — M.","unofficial":true},{"prompt":"until heaven and earth pass away, not one iota will pass from the law","greek":"ἀμὴν γὰρ λέγω ὑμῖν· ἕως ἂν *παρέλθῃ* ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου (Matt 5:18)","english":"until heaven and earth pass away, not one iota will pass from the law","ref":"ch. 6 practice 1a","target":"παρέλθῃ (ἕως ἄν)","answer":"mood-subj-temporal","why":"Aorist active subjunctive, 3rd singular, παρέρχομαι. ἕως ἄν is one of the “until” words the chart names alongside ὅταν — indefinite temporal.","unofficial":true},{"prompt":"not one iota, not one stroke, will pass from the law","greek":"ἰῶτα ἓν ἢ μία κεραία *οὐ μὴ παρέλθῃ* ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται (Matt 5:18)","english":"not one iota, not one stroke, will pass from the law","ref":"ch. 6 practice 1b","target":"παρέλθῃ (οὐ μή)","answer":"mood-subj-emphatic","why":"Aorist active subjunctive, 3rd singular, παρέρχομαι — the same form as 1a, doing a different job. οὐ μή in front makes it emphatic negation: not “probably not”, but never.","unofficial":true},{"prompt":"Jesus said to her, “Do not cling to me, for I have not yet ascended to the Father”","greek":"λέγει αὐτῇ Ἰησοῦς, μή μου *ἅπτου*, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν πατέρα (John 20:17)","english":"Jesus said to her, “Do not cling to me, for I have not yet ascended to the Father”","ref":"ch. 6 practice 2","target":"ἅπτου","answer":"mood-impv-prohibition","why":"Present middle imperative, 2nd singular, ἅπτομαι. μή plus an imperative is the imperative's prohibition — compare number 3, where μή plus an aorist subjunctive is a different mood doing the same job in English.","unofficial":true},{"prompt":"Do not give what is holy to dogs","greek":"*μὴ δῶτε* τὸ ἅγιον τοῖς κυσὶν μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων (Matt 7:6)","english":"Do not give what is holy to dogs","ref":"ch. 6 practice 3a","target":"δῶτε","answer":"mood-subj-prohibitory","why":"Aorist active subjunctive, 2nd plural, δίδωμι. Both of the chart's conditions are met: the command is negated (μή) and the subjunctive is aorist.","unofficial":true},{"prompt":"nor throw your pearls before pigs","greek":"μὴ δῶτε τὸ ἅγιον τοῖς κυσὶν *μηδὲ βάλητε* τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων (Matt 7:6)","english":"nor throw your pearls before pigs","ref":"ch. 6 practice 3b","target":"βάλητε","answer":"mood-subj-prohibitory","why":"Aorist active subjunctive, 2nd plural, βάλλω. μηδέ carries the negative on from the first clause, and the verb is aorist subjunctive again.","unofficial":true},{"prompt":"He said to the disciples, “Let us go to Judea again”","greek":"λέγει τοῖς μαθηταῖς· *ἄγωμεν* εἰς τὴν Ἰουδαίαν πάλιν (John 11:7)","english":"He said to the disciples, “Let us go to Judea again”","ref":"ch. 6 practice 4","target":"ἄγωμεν","answer":"mood-subj-hortatory","why":"Present active subjunctive, 1st plural, ἄγω. First person plural is the tell: he is going too, so it is hortatory, not an imperative.","unofficial":true},{"prompt":"And behold, Jesus met them and said, “Greetings!”","greek":"καὶ ἰδοὺ Ἰησοῦς ὑπήντησεν αὐταῖς λέγων, *χαίρετε* (Matt 28:9)","english":"And behold, Jesus met them and said, “Greetings!”","ref":"ch. 6 practice 5","target":"χαίρετε","answer":"mood-impv-greeting","why":"Present active imperative, 2nd plural, χαίρω. The chart's own greeting example is the singular Χαῖρε in Matt 26:49; this is the plural of the same frozen form. Nobody is being ordered to rejoice.","unofficial":true},{"prompt":"If anyone sees his brother sinning a sin not leading to death, he will ask and God will give him life","greek":"*ἐάν τις ἴδῃ* τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει καὶ δώσει αὐτῷ ζωήν (1 John 5:16)","english":"If anyone sees his brother sinning a sin not leading to death, he will ask and God will give him life","ref":"ch. 6 practice 6","target":"ἴδῃ","answer":"mood-subj-conditional","why":"Aorist active subjunctive, 3rd singular, ὁράω (εἶδον). ἐάν plus a subjunctive is the protasis of a third class conditional — a real maybe.","unofficial":true},{"prompt":"One of his disciples said to him, “Lord, teach us to pray”","greek":"εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· κύριε, *δίδαξον* ἡμᾶς προσεύχεσθαι (Luke 11:1)","english":"One of his disciples said to him, “Lord, teach us to pray”","ref":"ch. 6 practice 7","target":"δίδαξον","answer":"mood-impv-request","why":"Aorist active imperative, 2nd singular, διδάσκω. The form is a command, but κύριε tells you who is being addressed — you do not order the Lord about, so it lands as a request.","unofficial":true},{"prompt":"May the God of peace himself keep your spirit and soul and body blameless","greek":"αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης … ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως … *τηρηθείη* (1 Thess 5:23)","english":"May the God of peace himself keep your spirit and soul and body blameless","ref":"ch. 6 practice 8","target":"τηρηθείη","answer":"mood-opt-voluntative","why":"Aorist passive optative, 3rd singular, τηρέω. An optative closing a letter is almost always this one — a prayer or benediction. Translate with “may”.","unofficial":true},{"prompt":"Let your word be “yes, yes” or “no, no”","greek":"*ἔστω* δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ (Matt 5:37)","english":"Let your word be “yes, yes” or “no, no”","ref":"ch. 6 practice 9","target":"ἔστω","answer":"mood-impv-command","why":"Present active imperative, 3rd singular
