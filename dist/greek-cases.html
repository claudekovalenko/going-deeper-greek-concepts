    <style>
/* Deliberately a sibling of the seminary-homework-2026 stylesheet: same palette,
   same card/tabbar furniture. Tapping through from one app to the other should
   feel like moving between rooms, not between buildings. */

:root {
  --bg: #0e1016;
  --bg-elev: #171a23;
  --bg-elev-2: #1e222d;
  --line: #272c39;
  --text: #e8eaf2;
  --muted: #9aa1b5;
  --accent: #7b8cff;
  --accent-soft: #2a3160;
  --warn: #efb057;
  --danger: #f0736a;
  --ok: #4fbf8b;
  --nom: #1f9d78;
  --acc: #c8642a;
  --radius: 14px;
  --tabbar: 62px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f9;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0f2f7;
    --line: #e0e3ec;
    --text: #191c25;
    --muted: #6b7285;
    --accent: #4d5fe0;
    --accent-soft: #e4e7ff;
    --nom: #12775a;
    --acc: #a24c1b;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 17px;
  font-weight: 700;
}

.brand strong {
  display: block;
  font-size: 15px;
  letter-spacing: 0.2px;
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

/* The countdown to the day you said you wanted this learned by. */
.brand-right {
  text-align: right;
  font-size: 11px;
  line-height: 1.25;
  color: var(--muted);
}

.brand-right strong {
  display: block;
  font-size: 13px;
  color: var(--text);
}

.brand-right.is-due strong {
  color: var(--warn);
}

/* ---------- layout ---------- */

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}

.card h2 {
  margin: 0 0 10px;
  font-size: 14px;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card h3 {
  margin: 14px 0 8px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.note {
  color: var(--muted);
  font-size: 13px;
  margin: 8px 0 0;
}

.empty {
  color: var(--muted);
  font-size: 13px;
}

.muted {
  color: var(--muted);
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: baseline;
}

/* ---------- buttons ---------- */

.btn {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 13px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.btn:active {
  transform: translateY(1px);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn.small {
  padding: 6px 10px;
  font-size: 12px;
}

.btn.wide {
  width: 100%;
}

.btn.good {
  border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
  color: var(--ok);
}

.btn.bad {
  border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
  color: var(--danger);
}

.btnrow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.btnrow.split > * {
  flex: 1 1 0;
}

/* ---------- the map ---------- */

.hero {
  background: linear-gradient(160deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
  text-align: center;
}

.hero-line {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.hero-mnemonic {
  font-size: 25px;
  font-weight: 700;
  margin: 6px 0 4px;
  letter-spacing: 0.2px;
}

.hero-sub {
  color: var(--muted);
  font-size: 13px;
}

.acro {
  display: grid;
  /* Wider than it was: a tile now carries a letter, a name and a gist. */
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.acro-item {
  /* A tile is only ~76px wide on a small phone, and names like
     "Apollonius's Canon" are longer than that. break-word splits a word only
     when it cannot fit a line by itself — `anywhere` also shrinks the column's
     min-content, which had the grid hyphenating "Possessio/n" for no reason. */
  overflow-wrap: break-word;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 9px 10px;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.acro-letter {
  display: block;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.1;
}

.acro-word {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.set-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}

.set-head h2 {
  margin: 0;
  font-size: 16px;
  text-transform: none;
}

.set-sub {
  color: var(--muted);
  font-size: 12.5px;
  margin: 0 0 10px;
}

.bigidea {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13.5px;
  margin: 10px 0 0;
}

.mnemonic-line {
  font-size: 17px;
  font-weight: 650;
  margin: 2px 0 6px;
}

.mnemonic-why {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
}

/* ---------- cards (Learn) ---------- */

.concept {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-elev);
  overflow: hidden;
}

.concept + .concept {
  margin-top: 8px;
}

.concept > summary {
  list-style: none;
  cursor: pointer;
  padding: 11px 13px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.concept > summary::-webkit-details-marker {
  display: none;
}

.concept-name {
  font-weight: 620;
  flex: 1;
}

.concept-hook {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}

.concept-body {
  padding: 0 13px 13px;
  border-top: 1px solid var(--line);
}

.concept-body > * {
  margin-top: 11px;
}

.label {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}

.hook {
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-elev-2));
  border-left: 3px solid var(--accent);
  border-radius: 0 9px 9px 0;
  padding: 9px 11px;
}

.hook-line {
  font-size: 15.5px;
  font-weight: 650;
}

.hook-why {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.spot {
  background: var(--bg-elev-2);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13.5px;
}

.watch {
  border: 1px dashed color-mix(in srgb, var(--warn) 50%, var(--line));
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;
  color: color-mix(in srgb, var(--warn) 75%, var(--text));
}

.ex {
  border-top: 1px solid var(--line);
  padding-top: 9px;
}

.ex + .ex {
  margin-top: 9px;
}

.ex-ref {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.greek {
  font-family: 'Gentium Plus', 'SBL Greek', 'Palatino Linotype', Palatino, Georgia, serif;
  font-size: 17px;
  line-height: 1.5;
  margin: 3px 0;
}

.ex-en {
  font-size: 13.5px;
}

.ex-note {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
}

mark {
  background: color-mix(in srgb, var(--accent) 28%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 2px;
}

/* ---------- filters ---------- */

.chips {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.chip {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 11px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

.chip.on {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  color: var(--accent);
}

/* ---------- drill ---------- */

.flash {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  text-align: center;
  padding: 22px 16px;
}

.flash-prompt-label {
  font-size: 11px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
}

.flash-prompt {
  font-size: 21px;
  font-weight: 650;
  line-height: 1.35;
}

.flash-prompt.is-small {
  font-size: 16.5px;
  font-weight: 500;
}

.flash-answer {
  border-top: 1px solid var(--line);
  padding-top: 13px;
  text-align: left;
}

.flash-answer .name {
  font-size: 18px;
  font-weight: 650;
}

.flash-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--muted);
}

.box-pips {
  display: inline-flex;
  gap: 3px;
  vertical-align: middle;
}

.pip {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--line);
}

.pip.on {
  background: var(--ok);
}

/* ---------- spot it ---------- */

.q-prompt {
  font-size: 16px;
  line-height: 1.45;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 13px;
}

.option {
  text-align: left;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}

.option.correct {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 16%, var(--bg-elev-2));
}

.option.wrong {
  border-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 14%, var(--bg-elev-2));
}

.option:disabled {
  cursor: default;
  opacity: 0.85;
}

.option.correct:disabled,
.option.wrong:disabled {
  opacity: 1;
}

.verdict {
  margin-top: 12px;
  font-size: 13.5px;
}

.verdict .why {
  color: var(--muted);
  margin-top: 4px;
}

.score {
  font-variant-numeric: tabular-nums;
}

/* ---------- progress ---------- */

.bar {
  height: 7px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0 4px;
}

.bar-fill {
  height: 100%;
  background: var(--ok);
  border-radius: 999px;
  transition: width 0.25s ease;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.stats > div {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stat {
  display: block;
  font-size: 21px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.stats small {
  color: var(--muted);
  font-size: 11px;
}

.mastery {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.mastery:last-child {
  border-bottom: 0;
}

.mastery-name {
  flex: 1;
  font-size: 13.5px;
}

/* ---------- confusion pairs ---------- */

.confusion {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
}

.confusion + .confusion {
  margin-top: 8px;
}

.confusion-q {
  font-weight: 620;
  font-size: 14px;
}

.confusion-test {
  font-size: 13px;
  margin-top: 5px;
}

.confusion-test b {
  color: var(--accent);
}

.confusion-ex {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 5px;
}

/* ---------- back link to the homework app ---------- */

.backlink {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--accent);
  text-decoration: none;
}

.backlink svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- tab bar ---------- */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  background: none;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 10.5px;
  padding: 8px 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}

.tab svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab.on {
  color: var(--accent);
}

/* ---------- installing it ---------- */

.card h2 .dismiss {
  margin-left: auto;
  padding: 3px 8px;
  line-height: 1;
}

.btn.ghost {
  background: none;
  color: var(--muted);
}

.inline-icon {
  width: 15px;
  height: 15px;
  vertical-align: -2px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.btn .inline-icon {
  vertical-align: -3px;
  margin-right: 5px;
}

.steps {
  margin: 10px 0 0;
  padding-left: 20px;
  font-size: 13.5px;
  color: var(--text);
}

.steps li + li {
  margin-top: 6px;
}

.note.ready {
  color: var(--ok);
}

code {
  background: var(--bg-elev-2);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 12.5px;
}

/* ---------- the formula block ----------
   The bare shape of the construction, before a word of prose. */

.formula {
  background: var(--bg-elev-2);
  border-radius: 11px;
  padding: 14px 12px 12px;
  margin-top: 11px;
}

.fcols {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 6px 18px;
  text-align: center;
}

.fcol {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

/* The pattern row: the thing to remember. */
.fpat {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.2;
}

/* The worked row underneath, in the accent so the eye pairs them up. */
.ffill {
  font-size: 13px;
  color: var(--accent);
  line-height: 1.3;
}

.fladder {
  margin: 0;
  padding-left: 22px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
}

.fladder li + li {
  margin-top: 4px;
}

.fnote,
.fcaption {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}

/* A ladder is read down the left edge, so its prose lines up with it. */
.formula.is-ladder .fnote,
.formula.is-ladder .fcaption {
  text-align: left;
}

.fnote + .fcaption {
  margin-top: 5px;
}

.flash .formula {
  background: var(--bg-elev);
  margin-top: 9px;
}

/* ---------- Greek-first quiz prompts ----------
   The exam is on the Greek, so the Greek is the question and the English
   is a gloss you can put away. */

.q-ref {
  font-size: 11px;
  letter-spacing: 0.3px;
  color: var(--muted);
  margin-bottom: 4px;
}

.q-greek {
  font-size: 21px;
  line-height: 1.55;
  margin: 0 0 8px;
}

.q-prompt.is-gloss {
  font-size: 13.5px;
  color: var(--muted);
}

/* Blurred rather than removed, so the layout does not jump when you peek. */
.q-prompt.is-hidden {
  filter: blur(5px);
  user-select: none;
}

.q-prompt + .btn.ghost {
  margin-top: 8px;
}

/* The group's own hook, above its tiles on the map. */
.group-hook {
  margin: -4px 0 8px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}

/* ---------- the like-I'm-five block ----------
   Leads every card. Bigger and warmer than the prose under it, because it is
   the one part you should be able to read at a glance and understand. */

.eli5 {
  background: color-mix(in srgb, var(--warn) 13%, var(--bg-elev-2));
  border-left: 3px solid var(--warn);
  border-radius: 0 11px 11px 0;
  padding: 11px 13px;
  margin-top: 11px;
}

.eli5 .label {
  color: color-mix(in srgb, var(--warn) 78%, var(--text));
}

.eli5 p {

  font-size: 15px;
  line-height: 1.5;
}

.flash .eli5,
.hero + .card .eli5 {
  text-align: left;
}

/* The summary chart's own wording, kept verbatim — the tier you want the night
   before, when the exam will use these words and not mine. */
.bookdef {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;
  color: var(--muted);
}

/* ---------- the person picker ----------
   Top right, always one tap away, because a shared tablet needs it more than
   the person who set the app up does. */

.topbar-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  min-width: 0;
}

.whoami {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 999px;
  padding: 4px 8px;
  font: inherit;
  font-size: 12.5px;
  max-width: 46vw;
  cursor: pointer;
}

.whoami:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.mastery .pill {
  font-size: 10.5px;
}

/* ---------- the cheat sheet ----------
   Every peg in the app, on one screen, at the top of the Map. */

.sheet-set + .sheet-set {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.sheet-case {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.sheet-row {
  display: grid;
  grid-template-columns: minmax(74px, auto) 1fr;
  gap: 4px 12px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 6px 8px;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.sheet-row + .sheet-row {
  margin-top: 4px;
}

.sheet-row:active {
  background: var(--bg-elev-2);
}

.sheet-key {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.sheet-members {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.35;
}

/* Narrow screens stack the peg above what it stands for. */
@media (max-width: 380px) {
  .sheet-row {
    grid-template-columns: 1fr;
  }
}

/* A few plain words under each tile, so the map explains itself. */
.acro-gist {
  display: block;
  font-size: 11.5px;
  line-height: 1.3;
  color: color-mix(in srgb, var(--accent) 80%, var(--text));
  margin-top: 3px;
}

/* The cheat sheet's first strip: what each set does, before any acrostic. */
.sheet-does {
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 4px;
}

.does-row {
  display: grid;
  grid-template-columns: minmax(92px, auto) 1fr;
  gap: 4px 12px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 4px 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.does-name {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13.5px;
  font-weight: 620;
}

.does-what {
  font-size: 12.5px;
  color: var(--muted);
}

@media (max-width: 380px) {
  .does-row {
    grid-template-columns: 1fr;
  }
}

    <script type="module">
globalThis.__CONCEPTS__ = {"book":"Going Deeper with New Testament Greek","chapter":"ch. 2–5 — the five cases, the article and the adjective","course":"Intermediate Greek (GREK 6003), Fall 2026","generated":"2026-08-27","notes":["Every card carries a mnemonic hook, a plain one-line definition, a test you can actually run on a text, and real examples.","eli5: the like-I'm-five line. It leads every card, above the pattern — plain words, a picture you can see, and no grammar terms at all.","formula: the bare pattern, shown before any prose. pattern[]/filled[] render as aligned columns; ladder[] renders as a numbered list. oneLine is the caption underneath it.","Greek is given in the text with the key word marked by * asterisks *, so the app can highlight it without any markup engine.","confusions[] are the pairs that actually get missed on a quiz. They are drilled separately from the cards.","extraQuiz[] are hand-written 'Spot it' items; the rest are generated from each card's examples.","bookDef: the summary chart's own wording, kept verbatim, shown under 'What the book says'. oneLine is the plain-English caption; the two are deliberately different.","classDate on a set is when that chapter is taught. The 'This week' filter is computed from it, so it never goes stale.","key on a group is the bare peg — the acrostic or catchphrase with no sentence round it. The cheat sheet at the top of the Map is built from these.","gist: a few words on the tile itself, so the map is readable without opening anything.","verb / does on a set: the one-word and one-line answer to “what does this case do?”. The hero is built from verb, the cheat sheet's first strip from does."],"sets":[{"id":"nominative","name":"Nominative","verb":"Names","does":"names who or what","subtitle":"The naming case. Who or what the sentence is about.","eli5":"This one names people. Nobody here gets hit or eaten. They just get named.","color":"#1f9d78","classDate":"2026-08-25","bigIdea":"The nominative names. Whoever wears it is being named or called — never done to.","masterMnemonic":"Go to the SPA, then say AAAH.","masterMnemonicWhy":"SPA is the three main uses: Subject, Predicate nominative, Apposition. AAAH is the other four: Address, Appellation, Absolute, Hanging. Seven uses, one silly picture — you sit down in the spa and go aaah.","groups":[{"id":"nominative-major","name":"Major uses — the SPA","key":"SPA","mnemonic":"S-P-A — sit down in the spa.","expand":"Subject · Predicate nominative · Apposition"},{"id":"nominative-other","name":"Other uses — the AAAH","key":"AAAH","mnemonic":"A-A-A-H — then say aaah.","expand":"Address · Appellation · Absolute · Hanging"}]},{"id":"vocative","name":"Vocative","verb":"Calls","does":"calls someone by name","subtitle":"The calling case. One job: naming who you are talking to.","eli5":"This one is for shouting a name. “Lazarus!” That is all it does.","color":"#2f9fc8","classDate":"2026-08-25","bigIdea":"The vocative calls. It is the only case with a single use, so it is the cheapest one you will ever learn.","masterMnemonic":"One case, one job: say the name.","masterMnemonicWhy":"Everything else in the chapter has three, five, seven uses. This one has one. Learn it in ten seconds and spend the time you saved on the accusative.","groups":[{"id":"vocative-uses","name":"Uses of the vocative","key":"Say the name","mnemonic":"Say the name.","expand":"Direct address — and that is the list"}]},{"id":"accusative","name":"Accusative","verb":"Fences","does":"fences the verb in","subtitle":"The fencing case. How far the verb's action goes.","eli5":"This one builds a fence. It says where the doing stops.","color":"#c8642a","classDate":"2026-08-25","bigIdea":"The accusative fences the verb in. It says how far the action reaches — onto whom, how far, in what way.","masterMnemonic":"The object goes on DATES, then gets the MMR shot.","masterMnemonicWhy":"Noun-like: the direct object and its four twists spell DATES — Direct object, Alias, Two, Echo, Sub. Adverb-like: the MMR shot — Measure, Manner, Respect. How far? How? How so?","groups":[{"id":"accusative-overview","name":"The idea","key":"The fence","mnemonic":"The nominative crowns. The accusative fences.","expand":"The nominative crowns. The accusative fences."},{"id":"accusative-substantival","name":"Substantival (noun-like) — DATES","key":"DATES","mnemonic":"D-A-T-E-S — take the object out on five DATES.","expand":"Direct object · Alias (apposition) · Two (double) · Echo (cognate) · Sub (subject of an infinitive)"},{"id":"accusative-adverbial","name":"Adverbial (adverb-like) — the MMR shot","key":"MMR","mnemonic":"M-M-R — one shot, three jabs: how far? how? how so?","expand":"Measure (how far?) · Manner (how?) · Respect (how so?)"}]},{"id":"genitive","name":"Genitive","verb":"Describes","does":"says which kind of “of”","subtitle":"The “of” case. The question is always: which kind of “of”?","eli5":"This one is the “of” word. “The hat OF Dad.” You just say which kind of “of”.","color":"#7a5cc8","classDate":"2026-09-01","bigIdea":"The genitive describes. The nominative names, the accusative fences, the genitive tells you which kind.","masterMnemonic":"Every genitive is an “of”. Ask which kind.","masterMnemonicWhy":"Four drawers. Seven describe a noun and spell SWAMP RD — Source, Whole, Adjective, Made of, Possession, Relationship, Description. Two hide a verb: X does it, or X gets it. Five modify a verb and spell PACTS: Price, Agency, Comparison, Time or place, Separation. Then two oddities: another name, and a direct object that came out genitive.","groups":[{"id":"genitive-adjectival","name":"Adjectival — SWAMP RD","key":"SWAMP RD","mnemonic":"S-W-A-M-P R-D — the genitive lives on Swamp Rd, and whatever falls off the end lands in the Ditch. That is Description, the catch-all.","expand":"Source (from?) · Whole (part of?) · Adjective (what quality?) · Made of? · Possession (whose?) · Relationship (whose kin?) · Description (nothing else fits)"},{"id":"genitive-verbal","name":"Verbal — a verb hiding in the noun","key":"Does it · Gets it","mnemonic":"Does it · Gets it — say the head word as a verb and ask which.","expand":"Subjective (X does it) · Objective (X gets it)"},{"id":"genitive-adverbial","name":"Adverbial — modifies the verb: PACTS","key":"PACTS","mnemonic":"P-A-C-T-S — the adverbial genitive makes PACTS.","expand":"Price · Agency · Comparison · Time or place · Separation"},{"id":"genitive-other","name":"Other — the odd drawer","key":"Nickname · Fussy verb","mnemonic":"A nickname, and a fussy verb.","expand":"Apposition (another name for it) · Direct object (the verb wanted a genitive)"}]},{"id":"dative","name":"Dative","verb":"Gives","does":"gives it, places it, uses it","subtitle":"The to/for, in/at, with/by case.","eli5":"Three coats on one hook. To or for someone. In or at a place. With or by a thing.","color":"#c8547d","classDate":"2026-09-08","bigIdea":"The dative is three old cases wearing one coat: to/for, in/at, with/by. Work out which coat, and the use follows.","masterMnemonic":"To, In, With.","masterMnemonicWhy":"Three families and a leftover drawer. To or for = PORT. In or at = HIT. With or by = MAMA. Then the odd BEADs.","groups":[{"id":"dative-pure","name":"Pure — to or for: PORT","key":"PORT","mnemonic":"P-O-R-T — and the T, plain “to whom”, is the one you meet most.","expand":"Personal interest · Owns (possession) · Re: (reference) · To whom (indirect object)"},{"id":"dative-locative","name":"Locative — in or at: HIT","key":"HIT","mnemonic":"H-I-T — Here, In, Then.","expand":"Here (place) · In what realm (sphere) · Then (time)"},{"id":"dative-instrumental","name":"Instrumental — with or by: MAMA","key":"MAMA","mnemonic":"M-A-M-A — Means, Agency, Manner, Association.","expand":"Means (with what tool) · Agency (by whom) · Manner (in what style) · Association (along with)"},{"id":"dative-other","name":"Other — the odd BEADs","key":"BEAD","mnemonic":"B-E-A-D — Because, Echo, Alias, Devoted.","expand":"Because (cause) · Echo (cognate) · Alias (apposition) · Devoted verbs (direct object)"}]},{"id":"article","name":"Article","verb":"Points","does":"points at one — or vanishes","subtitle":"Greek's “the”. It points — and its absence is not “a”.","eli5":"Greek's “the” is a finger. It points at one thing. Sometimes it stands in for a word, and sometimes it disappears — and gone does not mean “a”.","color":"#c9a227","classDate":"2026-09-15","bigIdea":"The article points. It particularises. And when it is missing, that is information too — not automatically “a”.","masterMnemonic":"Point, Pronoun, Poof.","masterMnemonicWhy":"Three things it does: it Points at something, it stands in as a Pronoun, or it goes Poof and leaves you to work out why. Then three named rules: Sharp joins, Colwell drops, Apollonius matches.","groups":[{"id":"article-uses","name":"What it does — the three P's","key":"Point · Pronoun · Poof","mnemonic":"Point · Pronoun · Poof.","expand":"Points at a thing · stands in as a pronoun · vanishes, and that means something"},{"id":"article-rules","name":"Three men, three rules","key":"Sharp · Colwell · Apollonius","mnemonic":"Sharp joins · Colwell drops · Apollonius matches.","expand":"Granville Sharp · Colwell's Rule · Apollonius's Canon"}]},{"id":"adjective","name":"Adjective","verb":"Colours","does":"colours the noun, in degrees","subtitle":"Four jobs, five degrees.","eli5":"A describing word. It can stick to a noun, become the noun, jump to the doing-word, or make a claim. And it comes in degrees: plain, more, most.","color":"#6b7fd7","classDate":"2026-09-15","bigIdea":"An adjective does one of four jobs, in one of five degrees. Name the job, then name the degree.","masterMnemonic":"Four jobs ASAP, in five degrees of SPECS.","masterMnemonicWhy":"ASAP is what it does: Attributive, Substantival, Adverbial, Predicate. SPECS is how strong: Superlative, Positive, Elative, Comparative, Special cases.","groups":[{"id":"adjective-use","name":"What it does — ASAP","key":"ASAP","mnemonic":"A-S-A-P — Attributive, Substantival, Adverbial, Predicate.","expand":"Sticks to the noun · becomes the noun · jumps to the verb · makes a claim"},{"id":"adjective-degree","name":"How strong — SPECS","key":"SPECS","mnemonic":"S-P-E-C-S — Superlative, Positive, Elative, Comparative, Special cases.","expand":"The ladder is positive → comparative → superlative. Elative turns the volume up without comparing; special cases swap the three around."}]}],"cards":[{"id":"subject","set":"nominative","group":"nominative-major","name":"Subject","eli5":"Who is doing it. “John talks.” Who talks? John.","formula":{"pattern":["X","verbs"],"filled":["John","bears witness"]},"short":"Subject","gist":"does the verb","tile":"S","oneLine":"The one doing the verb.","mnemonic":"The subject wears the crown.","mnemonicWhy":"The nominative names, and the crown sits on whoever the verb is about. One verb, one nominative — that one is wearing it.","spotIt":"Ask the verb: who or what? That is your subject.","bookDef":"The subject of a finite verb.","examples":[{"ref":"John 1:15","greek":"*Ἰωάννης* μαρτυρεῖ περὶ αὐτοῦ","english":"*John* bears witness about him","note":"John is nominative and does the witnessing. As plain as it gets."},{"ref":"English drill","greek":null,"english":"*Ivan* came to class.","note":"One verb, one nominative. Nothing tricky."}],"tags":["nominative","major","ch-2"]},{"id":"predicate-nominative","set":"nominative","group":"nominative-major","name":"Predicate Nominative","eli5":"“X is Y” puts X inside Y, like a box. The Word goes in the God box. Not the other way round.","formula":{"pattern":["X","is","Y"],"filled":["the Word","was","God"]},"short":"Pred. nom.","gist":"X is Y","tile":"P","oneLine":"Two nominatives with “is” between them. The second says what the first is.","mnemonic":"The subject is the small circle; the predicate is the big one.","mnemonicWhy":"“Is” looks like an equals sign, but it only points one way. “The Word was God” puts the Word inside God, not God inside the Word. Small circle inside a big one.","spotIt":"Find a form of “to be” — εἰμί, γίνομαι, ὑπάρχω — with a nominative on each side of it.","bookDef":"Provides further information about the subject as a complement of a copulative verb (expressing a state of being).","examples":[{"ref":"John 1:1c","greek":"καὶ *θεὸς* ἦν ὁ λόγος","english":"and the Word was *God*","note":"ὁ λόγος has the article, so it is the subject. θεός is what is said about it."},{"ref":"1 John 4:8","greek":"ὁ θεὸς *ἀγάπη* ἐστίν","english":"God is *love*","note":"ὁ θεός has the article, so it is the subject. Love is what is said about him."},{"ref":"Eph 2:14","greek":"αὐτὸς γάρ ἐστιν *ἡ εἰρήνη* ἡμῶν","english":"for he himself is *our peace*","note":"αὐτός is a pronoun, so it takes the subject slot. See the pecking order."},{"ref":"John 1:14","greek":"ὁ λόγος *σὰρξ* ἐγένετο","english":"the Word became *flesh*","note":"ἐγένετο is a “became” verb, which counts. σάρξ is what is said about the Word."}],"watchOut":"Apposition looks the same but has no verb. A verb makes a claim. A comma only makes a label.","tags":["nominative","major","john-1-1","ch-2"]},{"id":"pecking-order","set":"nominative","group":"nominative-major","name":"The Pecking Order","eli5":"Two words both look like the doer. Pick like picking teams: “he” words first, then “the” words, then names.","formula":{"ladder":["Is either a pronoun?","Does either have the article?","Is either a proper name?"],"note":"First yes wins. John 1:1c: no pronoun, ὁ λόγος has the article — so it is the subject."},"short":"Pecking order","gist":"which one is the subject","type":"rule","oneLine":"Two nominatives, one “is”. This is how you tell which one is the subject.","mnemonic":"PAP — ask Papa who is in charge.","mnemonicWhy":"Pronoun, then Article, then Proper name. Papa answers in that order every time.","spotIt":"Go down the list and stop at the first yes.","examples":[{"ref":"John 1:1c","greek":"καὶ θεὸς ἦν *ὁ λόγος*","english":"and the Word was God","note":"No pronoun, so the article decides: ὁ λόγος has it and is the subject, which makes θεός the predicate. Not “a god” — Greek can be perfectly definite with no article."},{"ref":"Eph 2:14","greek":"*αὐτὸς* γάρ ἐστιν ἡ εἰρήνη ἡμῶν","english":"for *he himself* is our peace","note":"αὐτός is a pronoun, so it wins — even though ἡ εἰρήνη has the article."}],"watchOut":"No article does not mean “a”. A predicate noun sitting in front of the verb normally drops it.","tags":["nominative","major","john-1-1","ch-2"]},{"id":"nominative-apposition","set":"nominative","group":"nominative-major","name":"Apposition","eli5":"Same person, two stickers. “Andrew, Peter’s brother.” No “is” — just a second sticker.","formula":{"pattern":["X,","Y"],"filled":["Andrew,","the brother of Simon Peter"],"note":"No verb anywhere."},"short":"Apposition (nom.)","gist":"renames it, no verb","tile":"A","oneLine":"Two nominatives side by side, no verb. The second renames the first.","mnemonic":"No verb, just a name tag.","mnemonicWhy":"A sticker slapped on the first word: “Andrew — HELLO MY NAME IS the brother of Simon Peter.” Nothing is claimed; he is just being identified.","spotIt":"Two nominatives, a pause between them, and no “is” anywhere.","bookDef":"Further explains the subject by clarification, description, or identification.","examples":[{"ref":"John 1:40","greek":"Ἀνδρέας *ὁ ἀδελφὸς* Σίμωνος Πέτρου","english":"Andrew, *the brother* of Simon Peter","note":"ἀδελφός renames Andrew. Nothing is being claimed about him."},{"ref":"Rom 1:1","greek":"Παῦλος *δοῦλος* Χριστοῦ Ἰησοῦ","english":"Paul, *a servant* of Christ Jesus","note":"δοῦλος renames Paul."},{"ref":"English drill","greek":null,"english":"Ivan, *the student*, came to class.","note":"A name tag. Compare “Ivan is the student” — that one has a verb, so it is a claim."}],"watchOut":"The only difference from a predicate nominative is the verb. Comma = label. “Is” = claim. And watch the chart: Rom 1:1 is filed here because δοῦλος explains Παῦλος, while the near-identical Titus 1:1 is filed under absolute because there the whole salutation stands alone.","tags":["nominative","major","ch-2"]},{"id":"nominative-address","set":"nominative","group":"nominative-other","name":"Nominative of Address","eli5":"“Hey, Dad!” You are talking TO him, not about him.","formula":{"pattern":["X,","do it!"],"filled":["Husbands,","love your wives"]},"short":"Address","gist":"talking TO them","tile":"A","oneLine":"A nominative used to call out to someone.","mnemonic":"\"Hey, you!\" in a nominative coat.","mnemonicWhy":"He is being spoken to, not described. It looks like a subject and works like a shout.","spotIt":"Try an exclamation mark after it. “Husbands! — love your wives.” If that works, it is address.","bookDef":"Used in the place of a vocative in direct address.","examples":[{"ref":"Matt 9:27","greek":"ἐλέησον ἡμᾶς, *υἱὸς Δαυίδ*","english":"Have mercy on us, *Son of David*","note":"He is being called out to, not described. Nominative shape, vocative job."},{"ref":"Eph 5:25","greek":"*οἱ ἄνδρες*, ἀγαπᾶτε τὰς γυναῖκας","english":"*Husbands*, love your wives","note":"Not a statement about husbands. A shout at them."}],"watchOut":"A subject is talked about. An address is talked to. Same case, opposite direction.","tags":["nominative","other","ch-2"]},{"id":"nominative-appellation","set":"nominative","group":"nominative-other","name":"Nominative of Appellation","eli5":"It is the name on his badge. Everyone says “Teacher”, so that became his name.","formula":{"pattern":["they call me","X"],"filled":["you call me","Teacher"],"note":"X stays nominative."},"short":"Appellation","gist":"a title used as a name","tile":"A","oneLine":"A title used as somebody's name, left in the nominative.","mnemonic":"The title is on the name badge — and badges don't decline.","mnemonicWhy":"Once “Teacher” is what people call him, it stops behaving like a word in a sentence and behaves like the name printed on a badge.","spotIt":"It is a title, it is what someone is called, and it stayed nominative when the sentence wanted an accusative.","bookDef":"Used in conjunction with an address or title where a case other than the nominative would be expected.","examples":[{"ref":"John 13:13","greek":"ὑμεῖς φωνεῖτέ με *ὁ διδάσκαλος* καὶ *ὁ κύριος*","english":"You call me *Teacher* and *Lord*","note":"φωνεῖτέ με wants an accusative after it. The titles stay nominative because they are the name."}],"watchOut":"The easiest of the four. If a nominative is plainly a title-as-name, stop looking for something cleverer.","tags":["nominative","other","ch-2"]},{"id":"nominative-absolute","set":"nominative","group":"nominative-other","name":"Nominative Absolute","eli5":"It is the title on the front of a book. It sits on top and joins nothing.","formula":{"pattern":["X","— and nothing"],"filled":["The beginning of the gospel","— no verb at all"]},"short":"Absolute","gist":"a headline, tied to nothing","tile":"A","oneLine":"A nominative attached to nothing — a heading or a greeting.","mnemonic":"Absolute = the headline.","mnemonicWhy":"A headline floats above the page, tied to nothing. No verb, no clause, no rope.","spotIt":"Opening material — a title, a greeting, a list — with no verb to hook it to.","bookDef":"Grammatically independent use of the nominative in introductory material (such as titles, headings, salutations, or addresses).","examples":[{"ref":"Mark 1:1","greek":"*Ἀρχὴ* τοῦ εὐαγγελίου Ἰησοῦ Χριστοῦ","english":"*The beginning* of the gospel of Jesus Christ","note":"ἀρχή is nominative and stands completely alone. Everything hanging off it is genitive."},{"ref":"1 Tim 1:2","greek":"*χάρις ἔλεος εἰρήνη* ἀπὸ θεοῦ πατρός","english":"*Grace, mercy, peace* from God the Father","note":"All nominative, all opening material, all tied to nothing."},{"ref":"Titus 1:1","greek":"*Παῦλος* δοῦλος θεοῦ","english":"*Paul*, a servant of God","note":"The whole salutation stands alone, and Παῦλος is the word left hanging. Compare Rom 1:1, where the same phrase is filed under apposition."}],"watchOut":"No rope at all. If a pronoun later picks the word back up, it is hanging, not absolute.","tags":["nominative","other","ch-2"]},{"id":"hanging-nominative","set":"nominative","group":"nominative-other","name":"Hanging Nominative","eli5":"You say the thing, then point back at it. “The good seed? THOSE are the king’s kids.”","formula":{"pattern":["X","…","it …"],"filled":["The good seed","—","these are the sons"]},"short":"Hanging","gist":"picked up by a pronoun","tile":"H","oneLine":"A loose nominative that a pronoun picks up later.","mnemonic":"It hangs by a pronoun.","mnemonicWhy":"The pronoun downstream is the rope. Cut it and the word drops — which is exactly what an absolute never had.","spotIt":"Find the loose nominative, then look ahead for the pronoun standing in its place.","bookDef":"The logical rather than syntactical subject at the beginning of a sentence.","examples":[{"ref":"Matt 13:38","greek":"τὸ δὲ καλὸν *σπέρμα*, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας","english":"and the good *seed* — these are the sons of the kingdom","note":"σπέρμα is left dangling, but οὗτοι (“these”) does its job in the main clause. That pronoun is the rope."},{"ref":"Rev 3:12","greek":"*ὁ νικῶν* ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου","english":"*The one who conquers*, I will make him a pillar in the temple of my God","note":"ὁ νικῶν is left dangling, and αὐτόν picks it up. That pronoun is the rope."}],"watchOut":"Absolute = no connection. Hanging = connected in sense, but not in grammar.","tags":["nominative","other","ch-2"]},{"id":"vocative-direct-address","set":"vocative","group":"vocative-uses","name":"Direct Address","eli5":"You call his name. “Lazarus, come out!” The name is just how you got him to look.","formula":{"pattern":["X!","do it"],"filled":["Lazarus,","come out!"],"note":"The name is not the doer. It is who you are shouting at."},"short":"Direct address","gist":"calling them by name","tile":"Say the name","oneLine":"Naming the person or thing you are speaking to.","mnemonic":"Say the name, then say the thing.","mnemonicWhy":"The whole case is one move: get their attention, then tell them. With or without “the” in front — the chart allows both.","spotIt":"Somebody is being called by name or title, and that word is not doing any work in the sentence.","bookDef":"The use of the articular or non-articular vocative to designate the person or thing being addressed.","examples":[{"ref":"John 11:43","greek":"*Λάζαρε*, δεῦρο ἔξω","english":"*Lazarus*, come out!","note":"He is being called, not described. That is the vocative’s only job."}],"watchOut":"When a word does this job but is shaped like a nominative, the chart calls it nominative of address instead. Same job, different clothes.","tags":["vocative","ch-2"]},{"id":"accusative-idea","set":"accusative","group":"accusative-overview","name":"The Case of Limitation","eli5":"Doing-words need a fence. This builds it. The doing stops here.","formula":{"ladder":["Onto whom?  →  direct object","How far?  →  measure","In what way?  →  manner","About what?  →  respect"]},"short":"The idea","gist":"the fence round the verb","type":"rule","oneLine":"The accusative fences the verb in — it says how far the action goes.","mnemonic":"The nominative crowns; the accusative fences.","mnemonicWhy":"Every use is a fence post: onto whom (object), how far (measure), in what way (manner), about what (respect).","spotIt":"Two families. Does it act like a noun, or like an adverb?","examples":[{"ref":"The whole chapter in one line","greek":null,"english":"One object with four twists — Echo, Two, Sub, Alias — then the MMR shot: Measure, Manner, Respect.","note":"Noun-like first, adverb-like second."}],"tags":["accusative","ch-2"]},{"id":"direct-object","set":"accusative","group":"accusative-substantival","name":"Direct Object","eli5":"This is the catcher. “I hit Ivan.” Ivan got hit.","formula":{"pattern":["verb","whom / what?"],"filled":["I hit","Ivan"]},"short":"Direct object","gist":"catches the action","tile":"D","oneLine":"What the verb lands on. By far the most common one.","mnemonic":"DATES — D: the verb throws, the object catches.","mnemonicWhy":"The plain one, and the trunk the other four grow off. Get this solid first.","spotIt":"After the verb, ask: whom? what?","bookDef":"Serves as the recipient of the action.","examples":[{"ref":"English drill","greek":null,"english":"I hit *Ivan*.","note":"Ivan catches the hitting."},{"ref":"John 3:16","greek":"οὕτως γὰρ ἠγάπησεν ὁ θεὸς *τὸν κόσμον*","english":"For God so loved *the world*","note":"The world is what the loving lands on."}],"tags":["accusative","substantival","ch-2"]},{"id":"accusative-apposition","set":"accusative","group":"accusative-substantival","name":"Accusative of Apposition","eli5":"Two stickers again, on the catcher. “They picked Stephen, a good man.”","formula":{"pattern":["verb","X,","Y"],"filled":["they chose","Stephen,","a man full of faith"]},"short":"Apposition","gist":"Alias — renames the object","tile":"A","oneLine":"A second accusative that renames the first. No verb between them.","mnemonic":"DATES — A: alias, the name tag on the object.","mnemonicWhy":"The same sticker you met in the nominative, now stuck on the catcher.","spotIt":"Two accusatives, no verb between them, and the second answers “which one, exactly?”","bookDef":"Two accusatives are juxtaposed, both referring to the same person or thing, with the second accusative further specifying the first accusative.","examples":[{"ref":"Acts 6:5","greek":"ἐξελέξαντο Στέφανον, *ἄνδρα* πλήρη πίστεως","english":"they chose Stephen, *a man* full of faith","note":"Stephen is the object; “a man” renames him."},{"ref":"Matt 2:6","greek":"ποιμανεῖ τὸν λαόν μου *τὸν Ἰσραήλ*","english":"he will shepherd my people, *Israel*","note":"Israel renames “my people”."},{"ref":"Matt 21:5","greek":"καὶ ἐπὶ πῶλον *υἱὸν* ὑποζυγίου","english":"and on a colt, *the foal* of a donkey","note":"υἱόν renames πῶλον. One animal, two names."}],"watchOut":"Not a double accusative. Apposition renames; a complement says something about.","tags":["accusative","substantival","ch-2"]},{"id":"double-accusative","set":"accusative","group":"accusative-substantival","name":"Double Accusative","eli5":"Two catchers. “Ask Dad for bread.” Or “he gave his life as a gift.”","formula":{"ladder":["ask someone something  —  “asks him for bread”","call something a name  —  “gave his life as a ransom”"]},"short":"Double","gist":"Two objects at once","tile":"T","oneLine":"Two accusatives in one clause. Two kinds.","mnemonic":"DATES — T: two catchers.","mnemonicWhy":"Two English frames keep the kinds apart: you ASK a person FOR a thing, and you CALL a thing A NAME.","spotIt":"Try slipping “as” between the two. Fits — object + complement. Doesn't — person + thing.","bookDef":"A verb requires more than one accusative object to complete the thought, taking either (1) a personal and impersonal object or (2) a direct and predicate object.","examples":[{"ref":"Matt 7:9","greek":"ὃν αἰτήσει ὁ υἱὸς *αὐτὸν* *ἄρτον*","english":"if his son asks *him* for *bread*","note":"him (a person) + bread (a thing). You cannot say “asks him as bread”."},{"ref":"Mark 10:45","greek":"δοῦναι *τὴν ψυχὴν* αὐτοῦ *λύτρον* ἀντὶ πολλῶν","english":"to give his *life* as a *ransom* for many","note":"life is the object, ransom says what it was given as. “As” slips right in."},{"ref":"1 Tim 2:6","greek":"ὁ δοὺς *ἑαυτὸν* *ἀντίλυτρον* ὑπὲρ πάντων","english":"who gave *himself* as *a ransom* for all","note":"“As” slips in, so this is object + complement."}],"tags":["accusative","substantival","ch-2"]},{"id":"cognate-accusative","set":"accusative","group":"accusative-substantival","name":"Cognate Accusative","eli5":"The word says the doing-word again. “Sing a song.” “Fight a fight.”","formula":{"pattern":["verb","its own noun"],"filled":["fight","the good fight"]},"short":"Cognate","gist":"Echoes the verb","tile":"E","oneLine":"An object that repeats the verb — same root, or same idea.","mnemonic":"DATES — E: echo, the object repeats the verb.","mnemonicWhy":"Say the verb and hear it come straight back: sing a song, fight a fight, shepherd a flock.","spotIt":"Say the verb and the object out loud. Sounds redundant in English? Cognate.","bookDef":"Aligned with the verb either with regard to the lexical root or the idea conveyed.","examples":[{"ref":"1 Tim 1:18","greek":"στρατεύῃ … *τὴν καλὴν στρατείαν*","english":"fight *the good fight*","note":"The same root twice — the tightest echo there is."},{"ref":"English drill","greek":null,"english":"I shepherd *a flock*.","note":"Not the same root, but the same idea. That counts too."},{"ref":"English drill","greek":null,"english":"I sing *a song*.","note":"The textbook one."}],"watchOut":"Still the direct object. “Cognate” only names the flavour.","tags":["accusative","substantival","ch-2"]},{"id":"accusative-subject-infinitive","set":"accusative","group":"accusative-substantival","name":"Accusative Subject of the Infinitive","eli5":"Usually this one catches. Here it does it. “I want HIM to go.” He goes.","formula":{"pattern":["for","X","to verb"],"filled":["for","him","to go away"],"note":"X is accusative — and X is the one doing it."},"short":"Sub — subj. of inf.","gist":"Subject of the infinitive","tile":"S","oneLine":"An infinitive's subject is accusative, not nominative.","mnemonic":"DATES — S: sub, the infinitive's own subject.","mnemonicWhy":"The odd one out — this accusative is doing the action, not catching it.","spotIt":"Find the infinitive, then the accusative that is doing it rather than receiving it.","bookDef":"Functions as the subject of an infinitive, indicating the agent performing the action conveyed by the infinitive.","examples":[{"ref":"Pattern","greek":null,"english":"…for *him* to go away","note":"“Him” is the one going. In Greek that word is accusative."},{"ref":"John 1:48","greek":"πρὸ τοῦ σε *Φίλιππον* φωνῆσαι … εἶδόν σε","english":"Before *Philip* called you … I saw you","note":"φωνῆσαι is the infinitive, and Philip is the one doing the calling — accusative, but the doer."}],"watchOut":"The only accusative you translate as the doer.","tags":["accusative","substantival","ch-2"]},{"id":"accusative-measure","set":"accusative","group":"accusative-adverbial","name":"Accusative of Measure","eli5":"How far? How long? “He walked a little bit.”","formula":{"pattern":["verb","how far?"],"filled":["going","a little farther"]},"short":"Measure","gist":"how far, how long","tile":"M","oneLine":"How far, how long, how much.","mnemonic":"MMR, shot one: How far?","mnemonicWhy":"The MMR shot, one of three. This is the one with a tape measure on it.","spotIt":"Ask: how far? how long? Does the accusative answer?","bookDef":"Functions in essence like an adverb in that it specifies measure (time or space).","examples":[{"ref":"Matt 26:39 ESV","greek":"καὶ προσελθὼν *μικρόν*, ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ","english":"And going *a little farther* he fell on his face","note":"μικρόν measures the distance. It is not the object of anything."}],"tags":["accusative","adverbial","ch-2"]},{"id":"accusative-manner","set":"accusative","group":"accusative-adverbial","name":"Accusative of Manner","eli5":"How did you do it? “He gave it for free.”","formula":{"pattern":["verb","how?"],"filled":["justified","freely"]},"short":"Manner","gist":"how it was done","tile":"M","oneLine":"How the action is done.","mnemonic":"MMR, shot two: How?","mnemonicWhy":"The MMR shot, two of three. It turns a noun into an adverb: δωρεάν stops being “a gift” and becomes “freely”.","spotIt":"Ask: how? Check that an -ly word is the natural English.","bookDef":"Functions in essence like an adverb in that it specifies manner.","examples":[{"ref":"Rom 3:24","greek":"δικαιούμενοι *δωρεὰν* τῇ αὐτοῦ χάριτι","english":"being justified *freely* by his grace","note":"δωρεάν = freely, as a gift. It describes how the justifying happened."}],"tags":["accusative","adverbial","ch-2"]},{"id":"accusative-respect","set":"accusative","group":"accusative-adverbial","name":"Accusative of Respect","eli5":"Only one bit of you got it. “Cut in the heart” means the heart is the bit that hurt.","formula":{"pattern":["verb","as to what?"],"filled":["pierced","as to the heart"]},"short":"Respect","gist":"true in one way only","tile":"R","oneLine":"In one way only — put “with respect to” in front of it.","mnemonic":"MMR, shot three: How so? — slot in \"as to\".","mnemonicWhy":"The MMR shot, three of three, and the narrowest fence. The verb happened, but only in one respect, and this names which.","spotIt":"Say it with “with respect to” in front. If that rescues the sense, this is it.","bookDef":"Restricts the reference of the verbal action, indicating in what regard an action is represented as true.","examples":[{"ref":"Acts 2:37","greek":"κατενύγησαν *τὴν καρδίαν*","english":"they were pierced *with respect to the heart*","note":"Not a surgical piercing — an inner one. “With respect to” is what keeps it from sounding like an operation."},{"ref":"Acts 2:37","greek":"ἀκούσαντες δὲ κατενύγησαν *τὴν καρδίαν*","english":"When they heard this, they were pierced *to the heart*","note":"The book spells the sense out: “they were pierced with reference to the heart.”"}],"watchOut":"Easy to mistake for the object. If “with respect to” makes it better, it is respect.","tags":["accusative","adverbial","ch-2"]},{"id":"genitive-source","set":"genitive","group":"genitive-adjectival","name":"Source","eli5":"Where it came from. Swap “of” for “from” and see if it still works.","formula":{"pattern":["head noun","of X"],"filled":["the righteousness","of God"],"note":"= that comes FROM X."},"short":"Source","gist":"came from it","tile":"S","oneLine":"Where the head word came from.","mnemonic":"SWAMP RD — S: where it came from.","mnemonicWhy":"Swap “of” for “from” and see whether it still works. “The righteousness from God.”","spotIt":"Try “from” in place of “of”. Still makes sense? Source.","bookDef":"Indicates the origin of the head noun (“from”).","examples":[{"ref":"Rom 10:3","greek":"τὴν *τοῦ θεοῦ* δικαιοσύνην","english":"the righteousness *of God*","note":"The righteousness comes from God. Swap in “from” and it still reads."}],"watchOut":"Separation also translates “from”. Source is where a noun came from; separation is what a verb moves away from.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-partitive","set":"genitive","group":"genitive-adjectival","name":"Partitive","eli5":"The “of” word is the big pile. The other word is your piece. “One of the boats.”","formula":{"pattern":["one","of X"],"filled":["one","of the boats"],"note":"The genitive is the WHOLE. The head noun is the part."},"short":"Partitive","gist":"the Whole, not the slice","tile":"W","oneLine":"The genitive is the whole; the head word is a piece of it.","mnemonic":"SWAMP RD — W: the genitive is the whole pie, the head word your slice.","mnemonicWhy":"Backwards from what you expect: the word in the genitive is the bigger thing, not the smaller one.","spotIt":"Ask: is the genitive word the whole that the other word is a piece of?","bookDef":"Whether by itself or in conjunction with the preposition ἀπό or ἐκ, the articular noun in the genitive denotes the whole of which the head noun is a part.","examples":[{"ref":"Luke 5:3","greek":"ἓν *τῶν πλοίων*","english":"one *of the boats*","note":"The boats are the whole; the one boat is the part."}],"watchOut":"Often turns up with ἀπό or ἐκ, and the genitive noun carries the article.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-attributive","set":"genitive","group":"genitive-adjectival","name":"Attributive","eli5":"“The word of his power” really means “his POWERFUL word.” Squish it into a describing word.","formula":{"pattern":["head noun","of X"],"filled":["the word","of his power"],"note":"→ his POWERFUL word. X becomes the adjective."},"short":"Attributive","gist":"could be an Adjective","tile":"A","oneLine":"A quality of the head word — it could have been an adjective.","mnemonic":"SWAMP RD — A: turn the genitive into an adjective.","mnemonicWhy":"“The word of his power” → “his powerful word.” If the genitive can become the adjective, and saying it that way is stronger, it is attributive.","spotIt":"Try rewriting the genitive as an adjective in front of the head noun. Does it work?","bookDef":"Denotes an attribute or innate quality of the head term, conveying an emphatic adjectival idea.","examples":[{"ref":"Heb 1:3","greek":"τῷ ῥήματι *τῆς δυνάμεως* αὐτοῦ","english":"by his *powerful* word","note":"“Word of power” becomes “powerful word”. That rewrite is the test."}],"watchOut":"Description is the vaguer cousin. Attributive earns its name because the genitive really does become an adjective.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-material","set":"genitive","group":"genitive-adjectival","name":"Material or Content","eli5":"What it is made of, or what is in it. “A cup of water” is full of water.","formula":{"pattern":["head noun","of X"],"filled":["a cup","of water"],"note":"= made of X, or full of X."},"short":"Material","gist":"Made of it, full of it","tile":"M","oneLine":"What it is made of, or what is inside it.","mnemonic":"SWAMP RD — M: made of it, or full of it.","mnemonicWhy":"Cargo of gold is made of gold. A cup of water is full of water. One case, two flavours.","spotIt":"Ask: made of what? or full of what?","bookDef":"Indicates the material of which the head term is made or specifies the content of an object or abstract noun.","examples":[{"ref":"Rev 18:12","greek":"γόμον *χρυσοῦ*","english":"cargo *of gold*","note":"Material — the cargo is made of gold."},{"ref":"Mark 9:41","greek":"ποτήριον *ὕδατος*","english":"a cup *of water*","note":"Content — the cup is full of water."}],"tags":["genitive","adjectival","ch-3"]},{"id":"genitive-possession","set":"genitive","group":"genitive-adjectival","name":"Possession","eli5":"It is his. “The house of Philip” means Philip’s house.","formula":{"pattern":["head noun","of X"],"filled":["the house","of Philip"],"note":"= X’s. Try the apostrophe-s."},"short":"Possession","gist":"belongs to them","tile":"P","oneLine":"It belongs to X.","mnemonic":"SWAMP RD — P: whose? Try the apostrophe-s.","mnemonicWhy":"“The house of Philip” → “Philip’s house.” If the apostrophe-s works and means he owns it, it is possession.","spotIt":"Rewrite it with ’s. Does it mean he owns the thing?","bookDef":"Identifies ownership with regard to the noun it modifies, often employing the use of a possessive pronoun.","examples":[{"ref":"Acts 21:8","greek":"καὶ εἰσελθόντες εἰς τὸν οἶκον *Φιλίππου*","english":"we entered the house *of Philip*","note":"Philip’s house. He owns it."}],"watchOut":"Relationship takes an apostrophe-s too — “Zebedee’s son”. Owning a thing is possession; family is relationship.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-relationship","set":"genitive","group":"genitive-adjectival","name":"Relationship","eli5":"It is family, and Greek left the family word out. “James of Zebedee” means Zebedee’s son.","formula":{"pattern":["head noun","of X"],"filled":["James","of Zebedee"],"note":"→ James, the SON of Zebedee. The kin word is missing."},"short":"Relationship","gist":"family, kin word missing","tile":"R","oneLine":"X’s son, wife or parent — with the family word left out.","mnemonic":"SWAMP RD — R: supply the missing kin word.","mnemonicWhy":"Greek leaves out “son” or “wife” and expects you to know. Ἰάκωβον τὸν τοῦ Ζεβεδαίου is “James the [son] of Zebedee.”","spotIt":"A name in the genitive with no thing to own? Try slotting in “son of” or “wife of”.","bookDef":"Denotes a family relationship such as a person’s parent or spouse. The word indicating the relationship is often omitted and must be inferred.","examples":[{"ref":"Matt 4:21","greek":"Ἰάκωβον τὸν *τοῦ Ζεβεδαίου*","english":"James the son *of Zebedee*","note":"“Son” is nowhere in the Greek. You supply it."}],"watchOut":"Possession is owning a thing. Relationship is family, with the kin word usually left out.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-description","set":"genitive","group":"genitive-adjectival","name":"Description","eli5":"The leftovers bin. It just describes, and no other box fits.","formula":{"pattern":["head noun","of X"],"filled":["a baptism","of repentance"],"note":"Nothing more specific fits."},"short":"Description","gist":"nothing else fits","tile":"D","oneLine":"It describes the head word, and nothing more specific fits.","mnemonic":"SWAMP RD — D: the ditch at the end of the road.","mnemonicWhy":"Walk the ladder first. When nothing more specific fits, this catches it. A baptism of repentance is not owned by repentance, not made of it — just described by it.","spotIt":"Run the ladder. If no other category fits, it is description.","bookDef":"Further limits or describes the head noun, but other common genitival categories do not capture the specific nuance.","examples":[{"ref":"Mark 1:4","greek":"βάπτισμα *μετανοίας*","english":"a baptism *of repentance*","note":"Not possessed, not made of, not from. Just described."}],"watchOut":"Do not reach for this first. It is the bottom of the ladder, not the top.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-subjective","set":"genitive","group":"genitive-verbal","name":"Subjective","eli5":"The “of” word is doing it. “The love of Christ” — Christ is doing the loving.","formula":{"pattern":["head noun","of X"],"filled":["the love","of Christ"],"note":"→ Christ loves. X does the action."},"short":"Subjective","gist":"X does the action","tile":"Does it","oneLine":"X is doing the action hidden in the head word.","mnemonic":"Subject does it.","mnemonicWhy":"Turn the head noun back into a verb. “The love of Christ” → Christ loves. X is the one doing it.","spotIt":"Make the head noun a verb, then ask: is X doing it?","bookDef":"Functions semantically as the subject of the verbal idea implied in the head noun, producing the action.","examples":[{"ref":"Rom 8:35","greek":"τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης *τοῦ Χριστοῦ*;","english":"Who can separate us from the love *of Christ*?","note":"Christ is the one loving. Make the noun a verb and X is doing it."}],"tags":["genitive","verbal","ch-3"]},{"id":"genitive-objective","set":"genitive","group":"genitive-verbal","name":"Objective","eli5":"The “of” word is getting it. “Faith of God” means faith IN God.","formula":{"pattern":["head noun","of X"],"filled":["faith","in God"],"note":"→ you believe God. X receives the action."},"short":"Objective","gist":"X receives the action","tile":"Gets it","oneLine":"X is receiving the action hidden in the head word.","mnemonic":"Object gets it.","mnemonicWhy":"Same move, other direction. “Faith of God” means faith IN God — God is on the receiving end.","spotIt":"Make the head noun a verb, then ask: is X getting it?","bookDef":"Functions semantically as the direct object of the verbal idea implicit in the head noun, receiving the action.","examples":[{"ref":"Mark 11:22","greek":"ἔχετε πίστιν *θεοῦ*","english":"Have faith *in God*","note":"God is believed in, not believing. X is receiving the action."}],"watchOut":"Subjective and objective look identical in Greek. Only the sense decides which one it is.","tags":["genitive","verbal","ch-3"]},{"id":"genitive-price","set":"genitive","group":"genitive-adverbial","name":"Price","eli5":"How much did it cost? “Bought with a price.”","formula":{"pattern":["verb","X (gen.)"],"filled":["bought","with a price"],"note":"for how much?"},"short":"Price","gist":"what it cost","tile":"P","oneLine":"What it cost, or what it is worth.","mnemonic":"PACTS — P: for how much?","mnemonicWhy":"What it cost, or what it is worth.","spotIt":"Ask: at what price? worth how much?","bookDef":"Indicates the price that is paid or the value that attaches to a given item.","examples":[{"ref":"1 Cor 6:20 NASB","greek":"ἠγοράσθητε … *τιμῆς*","english":"you have been bought *with a price*","note":"τιμῆς is what was paid."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-agency","set":"genitive","group":"genitive-adverbial","name":"Means or Agency","eli5":"Who did it, or what did it. “Blessed by my Father.”","formula":{"pattern":["verb","X (gen.)"],"filled":["blessed","by my Father"],"note":"by what? by whom?"},"short":"Means or agency","gist":"by whom, by what","tile":"A","oneLine":"By what, or by whom, the action was done.","mnemonic":"PACTS — A: by what? by whom?","mnemonicWhy":"A thing did it (means) or a person did it (agency). Both come out as “by”.","spotIt":"Ask: by what, or by whom? A thing = means. A person = agency.","bookDef":"Conveys the impersonal means or personal agent by which a given action is carried out (“by”).","examples":[{"ref":"Jas 1:13","greek":"ὁ γὰρ θεὸς ἀπείραστός ἐστιν *κακῶν*","english":"Since God is not tempted *by evil*","note":"Means — evil is a thing, not a person."},{"ref":"Matt 25:34","greek":"δεῦτε, οἱ εὐλογημένοι *τοῦ πατρός μου*","english":"Come, you who are blessed *by my Father*","note":"Agency — the Father is a person."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-comparison","set":"genitive","group":"genitive-adverbial","name":"Comparison","eli5":"Bigger than what? “Greater than our heart.”","formula":{"pattern":["comparative","X (gen.)"],"filled":["greater","than our heart"],"note":"than what?"},"short":"Comparison","gist":"than what","tile":"C","oneLine":"What something is being measured against.","mnemonic":"PACTS — C: than what?","mnemonicWhy":"Find a comparative — greater, better, more — and the genitive beside it is the thing being beaten.","spotIt":"See a comparative adjective? The genitive next to it is the “than”.","bookDef":"Used to denote comparison in conjunction with a comparative adjective (“than”).","examples":[{"ref":"1 John 3:20","greek":"μείζων ἐστὶν ὁ θεὸς *τῆς καρδίας* ἡμῶν","english":"God is greater *than our heart*","note":"μείζων is the comparative; the genitive is what he is greater than."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-time-place","set":"genitive","group":"genitive-adverbial","name":"Time or Place","eli5":"When, or where. “He came at night.”","formula":{"pattern":["verb","X (gen.)"],"filled":["came","at night"],"note":"when? where?"},"short":"Time/Place","gist":"when, where","tile":"T","oneLine":"When or where the action happened.","mnemonic":"PACTS — T: when? where?","mnemonicWhy":"The one with a clock and a map on it. Note the focus is the kind of time, not a point on a clock.","spotIt":"Ask: when did it happen? where did it happen?","bookDef":"Indicates the location in time or space where an action occurs. The focus is on kind or quality.","examples":[{"ref":"John 19:39","greek":"ὁ ἐλθὼν πρὸς αὐτὸν *νυκτὸς* τὸ πρῶτον","english":"who had previously come to him *at night*","note":"Time — night is the kind of time it happened in."},{"ref":"Matt 1:12 NIV","greek":"μετὰ δὲ τὴν μετοικεσίαν *Βαβυλῶνος*","english":"After the exile *to Babylon*","note":"Place — where the exile went."}],"tags":["genitive","adverbial","ch-3"]},{"id":"genitive-separation","set":"genitive","group":"genitive-adverbial","name":"Separation","eli5":"Moving away. “They walked away from the faith.”","formula":{"pattern":["verb","X (gen.)"],"filled":["depart","from the faith"],"note":"away from what?"},"short":"Separation","gist":"away from what","tile":"S","oneLine":"What the action moves away from.","mnemonic":"PACTS — S: away from what?","mnemonicWhy":"Movement away, real or figurative — walking away from a place, or away from the faith.","spotIt":"Ask: away from what? Does “from” fit?","bookDef":"Indicates motion away from or distance, whether literally or figuratively (“from”).","examples":[{"ref":"1 Tim 4:1","greek":"ἀποστήσονταί τινες *τῆς πίστεως*","english":"some will depart *from the faith*","note":"Movement away from — figurative, but still away."}],"watchOut":"Source also translates “from”. Separation moves away from something; source is where a noun came from.","tags":["genitive","adverbial","ch-3"]},{"id":"genitive-apposition","set":"genitive","group":"genitive-other","name":"Apposition","eli5":"Two stickers, third time. “Jeremiah the prophet.” One man, two names.","formula":{"pattern":["head noun,","X (gen.)"],"filled":["Jeremiah","the prophet"],"note":"X is another name for the head noun."},"short":"Apposition (gen.)","gist":"another name for it","tile":"Another name","oneLine":"A second name for the head word.","mnemonic":"The name tag again — third case running.","mnemonicWhy":"You have met this in the nominative and the accusative. Same move: the second word renames the first.","spotIt":"Ask: is the genitive another name for the head noun? “Jeremiah, who is the prophet.” “The gift, which is the Holy Spirit.”","bookDef":"The genitive of apposition provides an alternate designation (simple) of a genitive head noun or provides an explanatory (epexegetical) restatement of a head noun in any case.","examples":[{"ref":"Matt 2:17","greek":"διὰ Ἰερεμίου *τοῦ προφήτου*","english":"through Jeremiah *the prophet*","note":"Simple — the head noun Ἰερεμίου is itself genitive."},{"ref":"Acts 2:38","greek":"τὴν δωρεὰν *τοῦ ἁγίου πνεύματος*","english":"the gift *of the Holy Spirit*","note":"Epexegetical — the gift IS the Spirit. The head noun here is accusative."}],"watchOut":"Simple: the head noun is genitive too. Epexegetical: the head noun can be any case.","tags":["genitive","other","ch-3"]},{"id":"genitive-direct-object","set":"genitive","group":"genitive-other","name":"Direct Object","eli5":"Some doing-words are fussy. Hearing, wanting, sharing, bossing and leaving all want their catcher dressed this way.","formula":{"pattern":["certain verbs","X (gen.)"],"filled":["you did not lack","anything"],"note":"The verb wanted a genitive, not an accusative."},"short":"Direct object (gen.)","gist":"verb wants a genitive","tile":"Genitive DO","oneLine":"The object of a verb that wants the genitive instead of the accusative.","mnemonic":"Feel it, want it, share it, rule it, leave it.","mnemonicWhy":"Six kinds of verb do this: sensation and emotion (feel it), volition (want it), sharing, ruling, separation (leave it). It is a habit of the verb, not a meaning.","spotIt":"A genitive sitting where you expected an accusative? Check the verb: sensing, feeling, wanting, sharing, ruling, separating?","bookDef":"Verbs of sensation, emotion or volition, sharing, ruling, or separation take their direct object in the genitive case (instead of the accusative case).","examples":[{"ref":"Luke 22:35 NASB","greek":"μή *τινος* ὑστερήσατε","english":"you did not lack *anything*, did you?","note":"ὑστερέω takes its object in the genitive."},{"ref":"John 5:25","greek":"οἱ νεκροὶ ἀκούσουσιν *τῆς φωνῆς* τοῦ υἱοῦ τοῦ θεοῦ","english":"the dead will hear *the voice* of the Son of God","note":"Sensation — hearing. Feel it."},{"ref":"Acts 20:33","greek":"*ἀργυρίου* ἢ *χρυσίου* ἢ *ἱματισμοῦ* οὐδενὸς ἐπεθύμησα","english":"I have not coveted anyone’s *silver* or *gold* or *clothing*","note":"Emotion and volition — coveting. Want it."},{"ref":"1 Cor 10:21","greek":"οὐ δύνασθε *τραπέζης* κυρίου μετέχειν","english":"You cannot share in the Lord’s *table*","note":"Sharing. Share it."},{"ref":"Rom 6:14","greek":"ἁμαρτία γὰρ *ὑμῶν* οὐ κυριεύσει","english":"For sin will not rule over *you*","note":"Ruling. Rule it."}],"watchOut":"This one follows a VERB. The objective genitive follows a NOUN.","tags":["genitive","other","ch-3"]},{"id":"dative-personal-interest","set":"dative","group":"dative-pure","name":"Personal Interest","eli5":"Someone gains or someone loses. “A bride dressed up FOR her husband.” “She had it IN for him.”","formula":{"pattern":["verb","X (dat.)"],"filled":["adorned","for her husband"],"note":"Good for X, or bad for X."},"short":"Personal interest","gist":"helps or hurts them","tile":"P","oneLine":"Who benefits, or who suffers.","mnemonic":"PORT — P: for him, or against him.","mnemonicWhy":"Two directions, one use. Rev 21:2 is for somebody; Mark 6:19 is against somebody.","spotIt":"Ask: does this help someone, or hurt someone?","bookDef":"Denotes the person (or rarely, the thing) to whose benefit or detriment a verbal action occurs.","examples":[{"ref":"Rev 21:2","greek":"ὡς νύμφην κεκοσμημένην *τῷ ἀνδρὶ αὐτῆς*","english":"like a bride adorned *for her husband*","note":"Advantage — she is dressed for his benefit."},{"ref":"Mark 6:19","greek":"ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν *αὐτῷ*","english":"So Herodias held a grudge *against him*","note":"Disadvantage — the grudge is to his cost."}],"tags":["dative","pure","ch-4"]},{"id":"dative-possession","set":"dative","group":"dative-pure","name":"Possession","eli5":"It is theirs, said backwards. “To you is the promise” means “you have the promise.”","formula":{"pattern":["X (dat.)","is","the thing"],"filled":["to you","is","the promise"],"note":"= X has it."},"short":"Possession","gist":"they Own it","tile":"O","oneLine":"The dative owns the subject of a to-be verb.","mnemonic":"PORT — O: owns it.","mnemonicWhy":"Greek says “to me is a book” where we say “I have a book”. Flip it round and the owner appears.","spotIt":"A dative sitting next to εἰμί or γίνομαι? Try flipping it into “X has”.","bookDef":"Unique construction in which the dative possesses the subject of an equative verb (such as εἰμι or γίνομαι).","examples":[{"ref":"Acts 2:39","greek":"*ὑμῖν* γάρ ἐστιν ἡ ἐπαγγελία","english":"For the promise is *for you*","note":"“To you is the promise” = you have the promise."}],"watchOut":"It needs the to-be verb. Without one, you are looking at something else.","tags":["dative","pure","ch-4"]},{"id":"dative-reference","set":"dative","group":"dative-pure","name":"Reference or Respect","eli5":"True in one way only. “He died to sin” means dead as far as sin goes.","formula":{"pattern":["verb","X (dat.)"],"filled":["died","to sin"],"note":"= with reference to X."},"short":"Reference","gist":"Re: this only","tile":"R","oneLine":"The one respect in which the statement holds.","mnemonic":"PORT — R: re:, like the subject line of an email.","mnemonicWhy":"“Re: sin — he died.” The dative names what the sentence is about, and the claim is only true about that.","spotIt":"Put “with reference to” in front. Does the sentence stop being odd?","bookDef":"Limits the extent to which something is presented as true, qualifying a statement that would otherwise not be true.","examples":[{"ref":"Rom 6:10","greek":"*τῇ ἁμαρτίᾳ* ἀπέθανεν ἐφάπαξ","english":"he died *to sin* once for all","note":"Not dead altogether — dead with reference to sin."}],"watchOut":"The accusative has a respect use too (Acts 2:37, “cut with respect to the heart”). Same job, different case.","tags":["dative","pure","ch-4"]},{"id":"dative-indirect-object","set":"dative","group":"dative-pure","name":"Indirect Object","eli5":"Who you gave it to. “Give glory to God.” God is the one getting it.","formula":{"pattern":["verb","the thing","to X (dat.)"],"filled":["give","glory","to God"],"note":"The one who receives it."},"short":"Indirect object","gist":"who it goes To","tile":"T","oneLine":"The one to whom, or for whom, the act is done.","mnemonic":"PORT — T: to whom. The plain one.","mnemonicWhy":"The commonest dative there is, and the one English already taught you: you give it TO someone.","spotIt":"A giving or telling verb, a direct object, and a dative — that dative is the receiver.","bookDef":"Indicates the one for whom or in whose interest an act is performed.","examples":[{"ref":"John 9:24","greek":"δὸς δόξαν *τῷ θεῷ*","english":"Give glory *to God*","note":"Glory is what is given; God is who it goes to."}],"tags":["dative","pure","ch-4"]},{"id":"dative-place","set":"dative","group":"dative-locative","name":"Place","eli5":"Where it literally is. “Sitting in a circle.”","formula":{"pattern":["verb","X (dat.)"],"filled":["sitting","in a circle"],"note":"A real spot you could point at."},"short":"Place","gist":"Here, a real spot","tile":"H","oneLine":"The literal physical location.","mnemonic":"HIT — H: here, a real spot.","mnemonicWhy":"If you could stand there, it is place. If you could not, it is sphere.","spotIt":"Ask: could I actually point at this location?","bookDef":"Pinpoints the literal physical location of a noun in the dative case.","examples":[{"ref":"Mark 3:34","greek":"τοὺς περὶ αὐτὸν *κύκλῳ* καθημένους","english":"those sitting *in a circle* around him","note":"A real ring of people on real ground."}],"tags":["dative","locative","ch-4"]},{"id":"dative-sphere","set":"dative","group":"dative-locative","name":"Sphere","eli5":"Where it is, but not really. “Sighing deeply in his spirit” — you cannot point at that.","formula":{"pattern":["verb","X (dat.)"],"filled":["sighing","in his spirit"],"note":"A place you cannot point at."},"short":"Sphere","gist":"In a realm, not a spot","tile":"I","oneLine":"The figurative realm the action happens in.","mnemonic":"HIT — I: in what realm.","mnemonicWhy":"Place is a spot on a map. Sphere is a spot you can only imagine — in the spirit, in the flesh, in Christ.","spotIt":"It reads like a location, but nobody could stand there.","bookDef":"Identifies the figurative or metaphorical location (i.e., sphere or realm) of a noun in the dative case.","examples":[{"ref":"Mark 8:12","greek":"ἀναστενάξας *τῷ πνεύματι* αὐτοῦ","english":"sighing deeply *in* his *spirit*","note":"A realm, not a room."}],"watchOut":"Place and sphere are one word doing literal and figurative duty. The test is whether you could point at it.","tags":["dative","locative","ch-4"]},{"id":"dative-time","set":"dative","group":"dative-locative","name":"Time","eli5":"When it happened. “On the third day.”","formula":{"pattern":["verb","X (dat.)"],"filled":["a wedding took place","on the third day"],"note":"A point in time, not a stretch."},"short":"Time","gist":"Then — when it happened","tile":"T","oneLine":"The point in time at which it happened.","mnemonic":"HIT — T: then.","mnemonicWhy":"Location again, but on a calendar instead of a map. A moment, not a duration.","spotIt":"Ask: when? And check it is a moment rather than a length of time.","bookDef":"Indicates the point in time (location in time) at which the action of a verb is accomplished.","examples":[{"ref":"John 2:1","greek":"καὶ *τῇ ἡμέρᾳ τῇ τρίτῃ* γάμος ἐγένετο","english":"*On the third day*, a wedding took place","note":"A point on the calendar."}],"watchOut":"The accusative measures how long something went on. The dative pins down when it happened.","tags":["dative","locative","ch-4"]},{"id":"dative-means","set":"dative","group":"dative-instrumental","name":"Means","eli5":"The thing you used. “Cutting himself with stones.” The stones did not choose to.","formula":{"pattern":["verb","X (dat.)"],"filled":["cutting himself","with stones"],"note":"A thing, not a person."},"short":"Means","gist":"the tool used","tile":"M","oneLine":"The impersonal thing the action was done with.","mnemonic":"MAMA — M: means, the tool.","mnemonicWhy":"A tool has no will of its own. If the dative could have refused, it is agency, not means.","spotIt":"Ask: with what? And check the answer is a thing.","bookDef":"Denotes the impersonal means by which the action of a given verb is accomplished.","examples":[{"ref":"Mark 5:5","greek":"κατακόπτων ἑαυτὸν *λίθοις*","english":"cutting himself *with stones*","note":"Stones are a tool. They did not decide anything."}],"tags":["dative","instrumental","ch-4"]},{"id":"dative-agency","set":"dative","group":"dative-instrumental","name":"Agency","eli5":"The person who did it. “Led by the Spirit.”","formula":{"pattern":["verb","X (dat.)"],"filled":["led","by the Spirit"],"note":"A person, not a thing."},"short":"Agency","gist":"the person who did it","tile":"A","oneLine":"The personal agent by whom the action was done.","mnemonic":"MAMA — A:
