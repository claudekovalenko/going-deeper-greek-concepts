agency, the doer.","mnemonicWhy":"Same “by”, but somebody chose it. Means is the hammer; agency is the carpenter.","spotIt":"Ask: by whom? And check the answer is a person.","bookDef":"Denotes the personal agency by which the action of a given verb is accomplished.","examples":[{"ref":"Gal 5:18","greek":"εἰ δὲ *πνεύματι* ἄγεσθε","english":"But if you are led *by the Spirit*","note":"The Spirit chooses. That makes it agency."}],"watchOut":"Means and agency are the same shape on the page. The only test is whether the dative has a will.","tags":["dative","instrumental","ch-4"]},{"id":"dative-manner","set":"dative","group":"dative-instrumental","name":"Manner","eli5":"How you did it. “He spoke openly.”","formula":{"pattern":["verb","X (dat.)"],"filled":["spoke","openly"],"note":"Turn it into an -ly word."},"short":"Manner","gist":"the style of it","tile":"M","oneLine":"The style in which the action was done.","mnemonic":"MAMA — M: manner, the how.","mnemonicWhy":"Not what you used, but the style you did it in. If an -ly word is the natural English, this is it.","spotIt":"Ask: how? Check that an -ly adverb fits.","bookDef":"Denotes the manner in which the action of a given verb is accomplished.","examples":[{"ref":"Mark 8:32","greek":"*παρρησίᾳ* τὸν λόγον ἐλάλει","english":"He spoke *openly* about this","note":"Openly is a style, not a tool."}],"watchOut":"Means answers “with what tool”. Manner answers “in what style”.","tags":["dative","instrumental","ch-4"]},{"id":"dative-association","set":"dative","group":"dative-instrumental","name":"Association","eli5":"Who came along. “Buried with him.” You went together.","formula":{"pattern":["verb","X (dat.)"],"filled":["buried","with him"],"note":"Alongside — not used as a tool."},"short":"Association","gist":"who came along","tile":"A","oneLine":"The one the action is done alongside.","mnemonic":"MAMA — A: association, the company.","mnemonicWhy":"Also “with”, but company rather than tool. The verb often starts with συν-, which gives it away.","spotIt":"Ask: with whom, in the sense of together with? Look for a συν- verb.","bookDef":"Denotes the person or thing with which a person is associated or by which a person is accompanied.","examples":[{"ref":"Col 2:12 ESV","greek":"*συν*ταφέντες *αὐτῷ* ἐν τῷ βαπτισμῷ","english":"Having been buried *with him* in baptism","note":"συν- on the verb, and you were buried alongside him, not using him."}],"watchOut":"Three uses come out as “with”: means (a tool), manner (a style), association (company).","tags":["dative","instrumental","ch-4"]},{"id":"dative-cause","set":"dative","group":"dative-other","name":"Cause","eli5":"Why it happened. “I am dying of hunger.” Hunger is the reason.","formula":{"pattern":["verb","X (dat.)"],"filled":["dying","of hunger"],"note":"= because of X."},"short":"Cause","gist":"Because of it","tile":"B","oneLine":"The reason or basis for the action.","mnemonic":"BEAD — B: because.","mnemonicWhy":"Slot “because of” in front and the sense holds. The reason can be outside you or inside you.","spotIt":"Ask: why? Then try “because of”.","bookDef":"Indicates the basis or reason of the action of a given verb, whether external (occasion) or internal (motivation).","examples":[{"ref":"Luke 15:17","greek":"ἐγὼ δὲ *λιμῷ* ὧδε ἀπόλλυμαι","english":"here I am dying [because] *of hunger*!","note":"Hunger is the reason, not the tool."}],"tags":["dative","other","ch-4"]},{"id":"dative-cognate","set":"dative","group":"dative-other","name":"Cognate Dative","eli5":"The word says the doing-word again. “They were astounded with a great astoundment.”","formula":{"pattern":["verb","its own noun (dat.)"],"filled":["they were astounded","with great astoundment"],"note":"Same stem, said twice."},"short":"Cognate","gist":"Echoes its verb","tile":"E","oneLine":"A dative built from the same stem as its verb.","mnemonic":"BEAD — E: echo, second case running.","mnemonicWhy":"You met the echo in the accusative. Greek doubles the word for force where English just says “utterly”.","spotIt":"Say the verb and the dative out loud. Same root, or same idea?","bookDef":"Use of a dative noun that is a cognate (of the same stem) to the verb it modifies either formally or conceptually.","examples":[{"ref":"Mark 5:42","greek":"ἐξέστησαν *ἐκστάσει μεγάλῃ*","english":"they were *utterly* astounded","note":"ἐξέστησαν and ἐκστάσει are the same stem. English flattens it to “utterly”."}],"tags":["dative","other","ch-4"]},{"id":"dative-apposition","set":"dative","group":"dative-other","name":"Apposition","eli5":"Two stickers, fourth time. “Beelzebul, the ruler of the demons.” One person, two names.","formula":{"pattern":["X (dat.),","Y (dat.)"],"filled":["Beelzebul,","the ruler of the demons"],"note":"Same person, second name."},"short":"Apposition","gist":"Alias — another name","tile":"A","oneLine":"A second dative renaming the first.","mnemonic":"BEAD — A: alias, fourth case running.","mnemonicWhy":"Nominative, accusative, genitive, dative — the name tag turns up in all four. Learn it once, keep it forever.","spotIt":"Two datives side by side, no verb between them, both pointing at the same thing.","bookDef":"Two related substantives refer to the same person or thing.","examples":[{"ref":"Matt 12:24","greek":"ἐν τῷ Βεελζεβοὺλ *ἄρχοντι* τῶν δαιμονίων","english":"by Beelzebul, *the ruler* of the demons","note":"ἄρχοντι renames Βεελζεβούλ."}],"tags":["dative","other","ch-4"]},{"id":"dative-direct-object","set":"dative","group":"dative-other","name":"Direct Object","eli5":"Some doing-words want it dressed this way: trusting, obeying, serving, worshipping, thanking, following.","formula":{"pattern":["devoted verb","X (dat.)"],"filled":["we thank","God"],"note":"The dative is the object."},"short":"Direct object","gist":"Devoted verbs","tile":"D","oneLine":"The object of a verb that takes the dative instead of the accusative.","mnemonic":"BEAD — D: devoted verbs.","mnemonicWhy":"Look at the list — trusting, obeying, serving, worshipping, thanking, following. Every one is a verb of devotion. That is the whole category in one word.","spotIt":"A dative where you expected an accusative? Check whether the verb is one of devotion.","bookDef":"The dative occurs after certain verbs of trusting, obeying, serving, worshiping, thanksgiving, or following and functions as the direct object.","examples":[{"ref":"Col 1:3","greek":"εὐχαριστοῦμεν *τῷ θεῷ* … πάντοτε","english":"We always thank *God*","note":"εὐχαριστέω takes its object in the dative."}],"watchOut":"The genitive has a fussy-verb list too — feel it, want it, share it, rule it, leave it. The dative's list is devotion.","tags":["dative","other","ch-4"]},{"id":"article-substantives","set":"article","group":"article-uses","name":"With Substantives","eli5":"It points at one. “The Prophet” is not any prophet. That one.","formula":{"pattern":["ὁ","+ word"],"filled":["the","Prophet"],"note":"Not any one of them. THAT one."},"short":"With substantives","gist":"points at one","tile":"Point","oneLine":"The article picks a thing out, or names the whole class.","mnemonic":"Point — it aims at one.","mnemonicWhy":"Six ways of aiming: at this one (identification), at THE one (par excellence), at the only one (monadic), at the idea itself (abstract), at the one just mentioned (anaphoric), or at all of them at once (generic).","spotIt":"Ask which aim it is taking: one, the best, the only, an idea, the one just named, or the whole class.","bookDef":"The article particularizes a substantive or uses it generically.","examples":[{"ref":"Matt 2:2","greek":"ποῦ ἐστιν *ὁ* τεχθεὶς βασιλεὺς τῶν Ἰουδαίων","english":"Where is *he* who has been born King of the Jews?","note":"Identification — it picks out one particular person."},{"ref":"John 1:21","greek":"*ὁ* προφήτης εἶ σύ;","english":"Are you *the* Prophet?","note":"Par excellence — not a prophet, THE prophet."},{"ref":"John 3:16 ESV","greek":"*τὸν* υἱὸν *τὸν* μονογενῆ ἔδωκεν","english":"that he gave *his* only Son","note":"Monadic — there is only one of him."},{"ref":"John 4:22","greek":"*ἡ* σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν","english":"*salvation* is from the Jews","note":"Abstract — the idea itself, not one instance of it."},{"ref":"John 4:11 ESV","greek":"πόθεν οὖν ἔχεις *τὸ* ὕδωρ τὸ ζῶν","english":"So where do You get *that* ‘living water’?","note":"Anaphoric — the water already mentioned. Translate it “that”."},{"ref":"Matt 7:15","greek":"Προσέχετε ἀπὸ *τῶν* ψευδοπροφητῶν","english":"Be on your guard against *false prophets*","note":"Generic — the whole class of them, not particular ones."}],"tags":["article","uses","ch-5"]},{"id":"article-pronoun","set":"article","group":"article-uses","name":"As a Pronoun","eli5":"It stands in for a word. “They told him” — the “they” is just the article.","formula":{"pattern":["ὁ / οἱ","(no noun)"],"filled":["they","told him"],"note":"The article is naming somebody all by itself."},"short":"As a pronoun","gist":"stands in for a word","tile":"Pronoun","oneLine":"The article doing a pronoun's job.","mnemonic":"Pronoun — the article with nothing to point at.","mnemonicWhy":"Five kinds, and English tells you which: they (personal), who (relative), his (possessive), those (demonstrative), some… others (alternate).","spotIt":"An article with no noun after it. Work out which English pronoun fills the hole.","bookDef":"The article functions as a personal, relative, possessive, demonstrative, or alternate pronoun.","examples":[{"ref":"Matt 2:5","greek":"*οἱ* δὲ εἶπαν αὐτῷ","english":"*They* told him","note":"Personal — the article is the subject on its own."},{"ref":"Matt 5:16 ESV","greek":"τὸν πατέρα ὑμῶν *τὸν* ἐν τοῖς οὐρανοῖς","english":"your Father *who* is in heaven","note":"Relative — the article introduces the clause."},{"ref":"Luke 15:12 ESV","greek":"ὁ δὲ διεῖλεν αὐτοῖς *τὸν* βίον","english":"And he divided *his* property between them","note":"Possessive — no αὐτοῦ needed, the article carries it."},{"ref":"Matt 14:33","greek":"*οἱ* ἐν τῷ πλοίῳ προσεκύνησαν αὐτῷ","english":"*those* in the boat worshiped him","note":"Demonstrative — “those”."},{"ref":"Eph 4:11 NASB","greek":"αὐτὸς ἔδωκεν *τοὺς* μὲν ἀποστόλους","english":"He gave *some* as apostles","note":"Alternate — μέν … δέ, some … others."}],"tags":["article","uses","ch-5"]},{"id":"article-absence","set":"article","group":"article-uses","name":"Absence of the Article","eli5":"No “the” does not mean “a”. It can still mean THE.","formula":{"pattern":["no article","→","a? quality? or still THE?"],"filled":["θεοῦ εἰμι υἱός","→","“I am THE Son of God”"],"note":"Three things it can mean, and only one of them is “a”."},"short":"Absence of article","gist":"missing, and not “a”","tile":"Poof","oneLine":"What a missing article can mean — and it is not always “a”.","mnemonic":"Poof — the article vanishes, the meaning does not.","mnemonicWhy":"Three readings: indefinite (a boat), qualitative (full of grace — the quality itself), or still perfectly definite (Paul, in the Lord, the Son of God).","spotIt":"No article? Ask three questions in order: a? the quality? or still THE?","bookDef":"The absence of the article may convey that a given substantive is non-particular (indefinite or qualitative) or definite. If definite, this may be in conjunction with a proper name, a prepositional object, ordinal numbers, in predicate nominatives, as the complement in an object, complement construction, with monadic (one-of-a-kind) nouns, with abstract or generic nouns, with a pronominal adjective, or with technical expressions.","examples":[{"ref":"Mark 3:9","greek":"ἵνα *πλοιάριον* προσκαρτερῇ αὐτῷ","english":"to have *a small boat* ready for him","note":"Indefinite — genuinely “a”."},{"ref":"John 1:14","greek":"πλήρης *χάριτος* καὶ *ἀληθείας*","english":"full of *grace* and *truth*","note":"Qualitative — the qualities themselves."},{"ref":"Acts 16:25","greek":"*Παῦλος* καὶ *Σιλᾶς* προσευχόμενοι","english":"*Paul* and *Silas* were praying","note":"Definite — a proper name needs no article."},{"ref":"Phil 4:4","greek":"Χαίρετε ἐν *κυρίῳ*","english":"Rejoice in *the Lord*","note":"Definite — object of a preposition."},{"ref":"Matt 27:43 ESV","greek":"θεοῦ εἰμι *υἱός*","english":"I am *the Son* of God!","note":"Definite — a predicate nominative with no article, and still THE Son."}],"watchOut":"This is the row that settles John 1:1. Anarthrous does not mean indefinite.","tags":["article","uses","ch-5"]},{"id":"granville-sharp","set":"article","group":"article-rules","name":"Granville Sharp Rule","eli5":"One “the” over two names joined by “and” — usually one person, not two.","formula":{"pattern":["ὁ","A","καὶ","B"],"filled":["our great","God","and","Savior"],"note":"One article ⇒ one person."},"short":"Granville Sharp","gist":"one article, one person","tile":"Sharp","oneLine":"One article governing two joined substantives points at a single person.","mnemonic":"Sharp joins.","mnemonicWhy":"The conditions are the rule: singular, personal, not proper names, same case, joined by καί. Miss one condition and it does not apply.","spotIt":"One article, then καί, then two singular personal non-proper nouns in the same case.","bookDef":"When a single article governs two singular, personal, non-proper substantives of the same case that are joined by καί, they frequently refer to the same person.","examples":[{"ref":"Titus 2:13","greek":"*τοῦ* μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ","english":"our great *God and Savior*, Jesus Christ","note":"One article covers both, so God and Savior are one person."}],"watchOut":"Proper names are excluded, and so are plurals. The rule is narrow on purpose.","tags":["article","rules","ch-5"]},{"id":"colwell","set":"article","group":"article-rules","name":"Colwell's Rule","eli5":"A “the” word drops its “the” when it comes before “is”.","formula":{"pattern":["Y (no article)","ἦν","ὁ X"],"filled":["θεός","was","ὁ λόγος"],"note":"Definite, and the article is gone anyway."},"short":"Colwell's Rule","gist":"definite drops the article","tile":"Colwell","oneLine":"A definite predicate nominative before the copula usually goes without the article.","mnemonic":"Colwell drops.","mnemonicWhy":"This is why John 1:1 reads θεὸς ἦν ὁ λόγος with nothing in front of θεός — and why “a god” does not follow from the missing article.","spotIt":"A predicate nominative, no article, sitting in front of the to-be verb.","bookDef":"A definite predicate nominative does not usually take the article when preceding the copula (linking verb).","examples":[{"ref":"John 1:1","greek":"*θεὸς* ἦν ὁ λόγος","english":"the Word was *God*","note":"θεός is definite and drops the article because it comes first."}],"watchOut":"Read the rule in the direction it is written. It says definite nouns usually drop the article. It does not say every article-less noun before a copula is definite.","tags":["article","rules","ch-5"]},{"id":"apollonius","set":"article","group":"article-rules","name":"Apollonius's Canon","eli5":"Both wear “the”, or neither does. No mixing.","formula":{"pattern":["ὁ λόγος","τοῦ θεοῦ"],"filled":["both have it","or neither does"],"note":"λόγος θεοῦ works too. One of each does not."},"short":"Apollonius's Canon","gist":"both or neither","tile":"Apollonius","oneLine":"In a genitive chain, head noun and genitive both take the article or both go without.","mnemonic":"Apollonius matches.","mnemonicWhy":"They dress alike. ὁ λόγος τοῦ θεοῦ, or λόγος θεοῦ — you do not get one of each.","spotIt":"A noun with a genitive after it. Check whether both carry the article, or neither.","bookDef":"When two nouns are in a genitive construction, both the head noun and the noun in the genitive case either have or lack the article.","examples":[{"ref":"John 10:35","greek":"ὁ λόγος *τοῦ* θεοῦ","english":"*the* Word of God","note":"Both have the article."},{"ref":"1 Pet 1:23","greek":"λόγος θεοῦ","english":"word of God","note":"Neither has it. Still the same construction."}],"tags":["article","rules","ch-5"]},{"id":"adj-attributive","set":"adjective","group":"adjective-use","name":"Attributive","eli5":"It describes the noun. “The TRUE God.”","formula":{"pattern":["ὁ","adj","noun"],"filled":["the","true","God"],"note":"The adjective sticks to the noun."},"short":"Attributive","gist":"sticks to the noun","tile":"A","oneLine":"The adjective giving the noun a quality.","mnemonic":"ASAP — A: attributive, it sticks to the noun.","mnemonicWhy":"Say adjective and noun together and they still make one phrase: the true God.","spotIt":"Can you say it as “the ___ noun”? Attributive.","bookDef":"An adjective that ascribes a particular quality to a noun or substantive.","examples":[{"ref":"1 John 5:20","greek":"ὁ *ἀληθινὸς* θεός","english":"the *true* God","note":"With the article. One phrase, one idea."},{"ref":"Matt 10:31","greek":"*πολλῶν* στρουθίων διαφέρετε ὑμεῖς","english":"you are worth more than *many* sparrows","note":"Without the article, and still attributive."}],"tags":["adjective","use","ch-5"]},{"id":"adj-substantival","set":"adjective","group":"adjective-use","name":"Substantival","eli5":"The adjective becomes the noun. “The Holy One” — no noun needed.","formula":{"pattern":["ὁ","adj"],"filled":["the","Holy One"],"note":"The noun is missing and nobody minds."},"short":"Substantival","gist":"becomes the noun","tile":"S","oneLine":"The adjective acting as a noun.","mnemonic":"ASAP — S: substantival, it becomes the noun.","mnemonicWhy":"It usually takes the article, and that is the giveaway: ὁ ἅγιος, the Holy One.","spotIt":"An adjective with an article and no noun anywhere for it to describe.","bookDef":"The adjective normally takes on the characteristics of a noun (e.g., the article) and functions as a noun or substantive in a given phrase.","examples":[{"ref":"John 6:69 NASB","greek":"σὺ εἶ *ὁ ἅγιος*","english":"You are *the Holy One*","note":"No noun after it. The adjective is the noun."}],"tags":["adjective","use","ch-5"]},{"id":"adj-adverbial","set":"adjective","group":"adjective-use","name":"Adverbial","eli5":"The adjective jumps to the doing-word. “Going a little farther.”","formula":{"pattern":["verb","adj (neut. acc. sg.)"],"filled":["going","a little farther"],"note":"It modifies the verb, not a noun."},"short":"Adverbial","gist":"jumps to the verb","tile":"A","oneLine":"The adjective modifying a verb.","mnemonic":"ASAP — A: adverbial, it jumps to the verb.","mnemonicWhy":"Usually neuter accusative singular — and you have met this exact word before, as the accusative of measure. Same μικρόν, same verse.","spotIt":"An adjective answering how or how far, describing no noun at all.","bookDef":"Use of an adjective (usually in the neuter accusative singular) to modify a verb rather than noun.","examples":[{"ref":"Matt 26:39","greek":"καὶ προελθὼν *μικρὸν* ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ","english":"Going *a little farther*, he fell facedown","note":"The same word the accusative chapter files under measure. Two chapters, one form."}],"tags":["adjective","use","ch-5"]},{"id":"adj-predicate","set":"adjective","group":"adjective-use","name":"Predicate","eli5":"It says something about the subject. “God is faithful.”","formula":{"pattern":["adj","(is)","noun"],"filled":["faithful","—","ὁ θεός"],"note":"A claim, not a label."},"short":"Predicate","gist":"makes a claim","tile":"P","oneLine":"The adjective asserting a quality of the subject.","mnemonic":"ASAP — P: predicate, it makes a claim.","mnemonicWhy":"Often with a to-be verb, and often with none written at all: πιστὸς ὁ θεός is “God is faithful” with the verb left out.","spotIt":"Does it assert something, or just label something? Assert ⇒ predicate.","bookDef":"An adjective that predicates a certain quality to the subject, frequently by way of a copulative (linking) verb.","examples":[{"ref":"1 Cor 1:9","greek":"*πιστὸς* ὁ θεός","english":"God is *faithful*","note":"No verb written. The adjective still makes the claim."},{"ref":"Rom 4:8 ESV","greek":"*μακάριος* ἀνὴρ οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν","english":"*blessed* is the man against whom the Lord will not count his sin","note":"Without the article, and still a claim."}],"watchOut":"Attributive and predicate is the pair that gets missed. “The true God” labels. “God is true” claims.","tags":["adjective","use","ch-5"]},{"id":"adj-superlative","set":"adjective","group":"adjective-degree","name":"Superlative","eli5":"Best of three or more. “Most High God.”","formula":{"pattern":["adj","-est"],"filled":["ὕψιστος","Most High"],"note":"Three or more in the running."},"short":"Superlative","gist":"best of three or more","tile":"S","oneLine":"Comparing three or more.","mnemonic":"SPECS — S: superlative, the -est.","mnemonicWhy":"Two things get a comparative. Three or more get a superlative.","spotIt":"Ask how many are being compared. Three or more ⇒ superlative.","bookDef":"Compares the qualities of three or more entities.","examples":[{"ref":"Luke 8:28","greek":"Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ *ὑψίστου*","english":"Jesus, Son of the *Most High* God","note":"Highest of all, not higher than one other."}],"tags":["adjective","degree","ch-5"]},{"id":"adj-positive","set":"adjective","group":"adjective-degree","name":"Positive","eli5":"Plain. “The law is spiritual.” Nothing is being compared.","formula":{"pattern":["adj"],"filled":["spiritual"],"note":"Kind, not degree."},"short":"Positive","gist":"plain, no comparing","tile":"P","oneLine":"The plain form, describing kind rather than degree.","mnemonic":"SPECS — P: positive, the plain one.","mnemonicWhy":"No -er, no -est, nothing to measure against. It just says what sort of thing it is.","spotIt":"No comparison anywhere in sight? Positive.","bookDef":"Focuses on the properties of a noun in terms of kind rather than degree.","examples":[{"ref":"Rom 7:14","greek":"ὁ νόμος *πνευματικός* ἐστιν","english":"the law is *spiritual*","note":"Not more spiritual than anything. Just spiritual."}],"tags":["adjective","degree","ch-5"]},{"id":"adj-elative","set":"adjective","group":"adjective-degree","name":"Elative","eli5":"Not comparing at all — just turning it up. “A very large crowd.”","formula":{"pattern":["-er or -est form","= very ___"],"filled":["πλεῖστος","very large"],"note":"No comparison. Just louder."},"short":"Elative","gist":"just means “very”","tile":"E","oneLine":"A comparative or superlative used to intensify, not to compare.","mnemonic":"SPECS — E: elative, the volume knob.","mnemonicWhy":"A -er or -est form with nothing to compare it against. Translate it “very”.","spotIt":"See a comparative or superlative, then look for what it is compared to. Nothing there? Elative.","bookDef":"Use of the comparative or superlative adjective to describe an intensification of the positive notion.","examples":[{"ref":"2 Cor 8:17","greek":"*σπουδαιότερος* … ἐξῆλθεν","english":"[he] being *very diligent*, went out","note":"Comparative form, elative sense — not more diligent than someone."},{"ref":"Mark 4:1","greek":"ὄχλος *πλεῖστος*","english":"a *very large* crowd","note":"Superlative form, elative sense."}],"tags":["adjective","degree","ch-5"]},{"id":"adj-comparative","set":"adjective","group":"adjective-degree","name":"Comparative","eli5":"More than one other. “More powerful than I am.”","formula":{"pattern":["adj","-er than"],"filled":["ἰσχυρότερος","more powerful than I"],"note":"Two in the running."},"short":"Comparative","gist":"more than one other","tile":"C","oneLine":"Comparing two, by degree.","mnemonic":"SPECS — C: comparative, the -er.","mnemonicWhy":"Degree, not kind — and there is something on the other side of the scale.","spotIt":"Ask what it is being compared to. If there is an answer, comparative. If not, look at elative.","bookDef":"Focuses on the properties of a noun in terms of degree rather than kind.","examples":[{"ref":"Mark 1:7","greek":"ἔρχεται ὁ *ἰσχυρότερός* μου ὀπίσω μου","english":"One who is *more powerful* than I am is coming after me","note":"μου is what he is more powerful than."}],"tags":["adjective","degree","ch-5"]},{"id":"adj-special-cases","set":"adjective","group":"adjective-degree","name":"Special Cases","eli5":"The forms swap jobs. A plain word doing a “more” job, or a “more” word doing a “most” job.","formula":{"pattern":["one form","doing another's job"],"filled":["μείζων (“more”)","= “greatest”"],"note":"Everyday speech blurred the three."},"short":"Special cases","gist":"forms swap jobs","tile":"S","oneLine":"One degree standing in for another.","mnemonic":"SPECS — S: special cases, the swaps.","mnemonicWhy":"Three swaps to know: positive for comparative, positive for superlative, and comparative for superlative. 1 Cor 13:13 literally says “more” and means “most”.","spotIt":"The form and the sense disagree. Translate by sense and name the swap.","bookDef":"Instances where popular speech and/or Semitic influence affected the use of the positive, comparative and superlative for one another.","examples":[{"ref":"Matt 18:8","greek":"*καλόν* σοί ἐστιν","english":"It is *better* for you","note":"Positive form, comparative sense."},{"ref":"Matt 22:38","greek":"ἡ *μεγάλη* καὶ πρώτη ἐντολή","english":"the *greatest* and most important command","note":"Positive form, superlative sense."},{"ref":"1 Cor 13:13","greek":"*μείζων* δὲ τούτων ἡ ἀγάπη","english":"but the *greatest* of these is love","note":"Comparative form, superlative sense. Three are in view, so “greater” means “greatest”."}],"tags":["adjective","degree","ch-5"]}],"confusions":[{"id":"pn-vs-apposition","pair":["predicate-nominative","nominative-apposition"],"question":"Predicate nominative or apposition?","test":"Is there a verb?","answer":"Verb ⇒ predicate nominative, a claim. Comma only ⇒ apposition, a label.","example":"“Ivan is the student” (claim) vs “Ivan, the student, came to class” (label)."},{"id":"absolute-vs-hanging","pair":["nominative-absolute","hanging-nominative"],"question":"Absolute or hanging?","test":"Does a pronoun later in the sentence pick the word back up?","answer":"No rope ⇒ absolute. Hangs by a pronoun ⇒ hanging.","example":"Mark 1:1 “The beginning of the gospel…” (a headline) vs Matt. 13:38 “the good seed — THESE are the sons…” (a rope)."},{"id":"address-vs-subject","pair":["nominative-address","subject"],"question":"Address or subject?","test":"Talked about, or talked to?","answer":"About ⇒ subject. To ⇒ address, however much it looks like a subject.","example":"“Husbands love their wives” (subject) vs “Husbands, love your wives” (address)."},{"id":"which-nominative-is-subject","pair":["pecking-order","predicate-nominative"],"question":"Two nominatives, one verb — which is the subject?","test":"Run PAP: pronoun, then article, then proper name.","answer":"First yes wins. In John 1:1c ὁ λόγος has the article, so it is the subject and θεός is the predicate — definite, not “a god”.","example":"καὶ θεὸς ἦν ὁ λόγος."},{"id":"cognate-vs-plain-object","pair":["cognate-accusative","direct-object"],"question":"Cognate or plain direct object?","test":"Does the object echo the verb — same root, or same idea?","answer":"Echo ⇒ cognate. No echo ⇒ just the object. Either way it is still the object.","example":"“Fight the good fight” (echo) vs “I hit Ivan” (no echo)."},{"id":"double-which-kind","pair":["double-accusative","accusative-apposition"],"question":"Two accusatives — which arrangement?","test":"Can you slip “as” between them?","answer":"“As” fits ⇒ object + complement. It doesn't and one is a person ⇒ person + thing. No verb and the second just renames the first ⇒ apposition.","example":"“gave his life AS a ransom” · “asks him for bread” · “chose Stephen, a man full of faith”."},{"id":"respect-vs-object","pair":["accusative-respect","direct-object"],"question":"Accusative of respect or direct object?","test":"Put “with respect to” in front of it.","answer":"Better ⇒ respect. Worse ⇒ direct object.","example":"“pierced WITH RESPECT TO the heart” — better. “I hit WITH RESPECT TO Ivan” — worse."},{"id":"subjective-vs-objective","pair":["genitive-subjective","genitive-objective"],"question":"Subjective or objective?","test":"Turn the head noun into a verb. Is X doing it, or getting it?","answer":"Doing it ⇒ subjective. Getting it ⇒ objective.","example":"“the love of Christ” — Christ loving (subjective) or Christ being loved (objective). The Greek is identical either way."},{"id":"source-vs-separation","pair":["genitive-source","genitive-separation"],"question":"Source or separation? Both say “from”.","test":"Is the “from” attached to a noun or to a verb?","answer":"Where a noun came from ⇒ source. What a verb moves away from ⇒ separation.","example":"“the righteousness from God” (source) vs “depart from the faith” (separation)."},{"id":"gendo-vs-objective","pair":["genitive-direct-object","genitive-objective"],"question":"Genitive direct object or objective genitive?","test":"What is the genitive hanging off — a verb or a noun?","answer":"Off a verb ⇒ genitive direct object. Off a noun ⇒ objective genitive.","example":"“you did not lack anything” (verb) vs “faith in God” (noun)."},{"id":"partitive-whole-or-part","pair":["genitive-partitive","genitive-material"],"question":"Partitive or material/content?","test":"Is the genitive the whole the head noun is a slice of, or the stuff the head noun is made of?","answer":"Whole ⇒ partitive. Stuff ⇒ material or content.","example":"“one of the boats” (a slice of the fleet) vs “a cup of water” (what fills the cup)."},{"id":"possession-vs-relationship","pair":["genitive-possession","genitive-relationship"],"question":"Possession or relationship?","test":"Is the genitive owning a thing, or being kin to a person?","answer":"Owns a thing ⇒ possession. Family, with “son of” or “wife of” left out ⇒ relationship.","example":"“the house of Philip” (owns it) vs “James the [son] of Zebedee” (kin)."},{"id":"attributive-vs-description","pair":["genitive-attributive","genitive-description"],"question":"Attributive or description?","test":"Can the genitive be rewritten as an adjective?","answer":"Becomes a real adjective ⇒ attributive. Nothing more specific fits ⇒ description, the catch-all.","example":"“the word of his power” → “his powerful word” (attributive) vs “a baptism of repentance” (description)."},{"id":"vocative-vs-nominative-address","pair":["vocative-direct-address","nominative-address"],"question":"Vocative, or nominative of address?","test":"What shape is the word in?","answer":"Vocative shape ⇒ vocative of direct address. Nominative shape doing the same job ⇒ nominative of address.","example":"Λάζαρε (vocative) vs οἱ ἄνδρες, “Husbands…” (nominative doing a vocative’s work)."},{"id":"means-vs-agency","pair":["dative-means","dative-agency"],"question":"Means or agency?","test":"Could the dative have refused?","answer":"A thing with no will ⇒ means. A person who chose ⇒ agency.","example":"“cutting himself with stones” (means) vs “led by the Spirit” (agency)."},{"id":"three-withs","pair":["dative-means","dative-association"],"question":"Three uses all come out “with”. Which one?","test":"Tool, style, or company?","answer":"A tool ⇒ means. A style ⇒ manner. Company ⇒ association, often with a συν- verb.","example":"“with stones” · “openly” · “buried with him”."},{"id":"place-vs-sphere","pair":["dative-place","dative-sphere"],"question":"Place or sphere?","test":"Could you point at it?","answer":"A real spot ⇒ place. A realm you can only imagine ⇒ sphere.","example":"“sitting in a circle” (place) vs “sighing in his spirit” (sphere)."},{"id":"indirect-vs-interest","pair":["dative-indirect-object","dative-personal-interest"],"question":"Indirect object or personal interest?","test":"Is the dative receiving a thing, or gaining and losing?","answer":"Receives what was handed over ⇒ indirect object. Benefits or suffers ⇒ personal interest.","example":"“give glory to God” (receives) vs “adorned for her husband” (benefits)."},{"id":"attributive-vs-predicate","pair":["adj-attributive","adj-predicate"],"question":"Attributive or predicate?","test":"Does it label, or does it claim?","answer":"“The true God” labels ⇒ attributive. “God is true” claims ⇒ predicate.","example":"ὁ ἀληθινὸς θεός (label) vs πιστὸς ὁ θεός (claim, with no verb written)."},{"id":"comparative-vs-elative","pair":["adj-comparative","adj-elative"],"question":"Comparative or elative?","test":"Is there anything on the other side of the scale?","answer":"Something to compare against ⇒ comparative. Nothing ⇒ elative, and translate it “very”.","example":"“more powerful than I” (comparative) vs “a very large crowd” (elative)."},{"id":"absence-vs-colwell","pair":["article-absence","colwell"],"question":"No article — indefinite, or Colwell?","test":"Is it a predicate nominative sitting in front of the to-be verb?","answer":"In front of the copula ⇒ Colwell explains the missing article, and the noun can still be definite. Elsewhere, run the three questions: a? quality? or still THE?","example":"θεὸς ἦν ὁ λόγος — Colwell, definite. πλοιάριον in Mark 3:9 — genuinely “a”."}],"extraQuiz":[{"prompt":"\"Grace, mercy, peace from God our Father\" (1 Tim. 1:2) — all nominative, no verb, opening a letter.","answer":"nominative-absolute","why":"Opening material, tied to nothing. A headline, not a rope."},{"prompt":"\"You call me Teacher and Lord\" (John 13:13) — the titles are nominative where you expected accusative.","answer":"nominative-appellation","why":"A title being used as the name people call him. Badges don't decline."},{"prompt":"\"Son of David, have mercy on us\" (Matt. 9:27).","answer":"nominative-address","why":"He is being called out to, not described."},{"prompt":"\"Paul, a servant of Christ Jesus\" (Rom. 1:1) — two nominatives, no verb.","answer":"nominative-apposition","why":"δοῦλος renames Παῦλος. No verb, so no claim — just a label."},{"prompt":"\"He is our peace\" (Eph. 2:14).","answer":"predicate-nominative","why":"A verb with a nominative each side. αὐτός is a pronoun, so it is the subject; ἡ εἰρήνη is what is said about him."},{"prompt":"\"The good seed — these are the sons of the kingdom\" (Matt. 13:38).","answer":"hanging-nominative","why":"σπέρμα is left dangling, but οὗτοι picks it up. Hanging by a pronoun."},{"prompt":"\"Fight the good fight\" (1 Tim. 1:18).","answer":"cognate-accusative","why":"The object echoes the verb — the same root, even."},{"prompt":"\"He gave his life as a ransom for many\" (Mark 10:45).","answer":"double-accusative","why":"Two accusatives, and “as” slips between them: object + complement."},{"prompt":"\"They were cut to the heart\" (Acts 2:37) — an inner wound, not a surgical one.","answer":"accusative-respect","why":"Put “with respect to” in front and the sense improves."},{"prompt":"\"Going a little farther, he fell on the ground\" (Mark 14:35).","answer":"accusative-measure","why":"μικρόν answers “how far?” — MMR, one of three."},{"prompt":"\"Being justified freely by his grace\" (Rom. 3:24).","answer":"accusative-manner","why":"δωρεάν answers “how?” — MMR, two of three."},{"prompt":"\"They chose Stephen, a man full of faith\" (Acts 6:5).","answer":"accusative-apposition","why":"ἄνδρα renames the object. Alias."},{"prompt":"An infinitive's subject — the one performing the infinitive's action.","answer":"accusative-subject-infinitive","why":"Finite verbs take a nominative subject. Infinitives take an accusative one."},{"prompt":"\"and the Word was God\" (John 1:1c) — which use is θεός?","answer":"predicate-nominative","why":"ὁ λόγος has the article and wins the pecking order, so θεός is the predicate. No article, and still definite."},{"prompt":"ἐμβὰς δὲ εἰς ἓν τῶν πλοίων (Luke 5:3) — the underlined τῶν πλοίων.","answer":"genitive-partitive","why":"The boats are the whole; the one boat is the slice. Book practice exercise 2."},{"prompt":"μνημονεύετε τῆς γυναικὸς Λώτ (Luke 17:32) — the underlined τῆς γυναικός.","answer":"genitive-direct-object","why":"μνημονεύω is a verb of memory — sensation — so it takes its object in the genitive. Book practice exercise 3."},{"prompt":"ὁ δὲ μικρότερος … μείζων αὐτοῦ ἐστιν (Matt 11:11) — the underlined αὐτοῦ.","answer":"genitive-comparison","why":"μείζων is a comparative, so the genitive beside it is the “than”. Book practice exercise 1, second underline."},{"prompt":"καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου (Acts 1:13) — the underlined Ἰακώβου.","answer":"genitive-relationship","why":"“Judas [son] of James.” The kin word is left out for you to supply. Book practice exercise 4."},{"prompt":"Λάζαρε, δεῦρο ἔξω (John 11:43) — the underlined Λάζαρε.","answer":"vocative-direct-address","why":"He is being called by name. The vocative has exactly one use, and this is it."},{"prompt":"δὸς δόξαν τῷ θεῷ (John 9:24) — the underlined τῷ θεῷ.","answer":"dative-indirect-object","why":"Glory is handed over, and God is who it goes to. PORT — T."},{"prompt":"κατακόπτων ἑαυτὸν λίθοις (Mark 5:5) — the underlined λίθοις.","answer":"dative-means","why":"Stones are a tool with no will of their own. MAMA — M."},{"prompt":"εἰ δὲ πνεύματι ἄγεσθε (Gal 5:18) — the underlined πνεύματι.","answer":"dative-agency","why":"The Spirit chooses, so it is a personal agent. MAMA — A."},{"prompt":"θεὸς ἦν ὁ λόγος (John 1:1) — why does θεός have no article?","answer":"colwell","why":"A definite predicate nominative in front of the copula usually drops it. Colwell drops."},{"prompt":"τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ (Titus 2:13) — one article over both nouns.","answer":"granville-sharp","why":"Singular, personal, non-proper, same case, joined by καί. Sharp joins them into one person."},{"prompt":"σὺ εἶ ὁ ἅγιος (John 6:69) — the underlined ὁ ἅγιος.","answer":"adj-substantival","why":"An adjective with the article and no noun to describe. It has become the noun. ASAP — S."}]};
/**
 * Greek Cases — mnemonics and drills for Going Deeper with NT Greek, ch. 2.
 *
 * Deliberately one file. The sibling app (seminary-homework-2026) learned the
 * hard way that a module graph behind a service worker can serve a fresh page
 * beside stale code; one file means one cache key, so `?v=vN` invalidates the
 * whole app at once and there is nothing to bundle.
 */

const BUILD = 'v15 · 2026-09-01';

// Where the "back to homework" link points. The seminary app links here; this
// links back, so the two feel like two rooms rather than two buildings.
const HOMEWORK_APP = 'https://claudekovalenko.github.io/seminary-homework-2026/';

/**
 * What a new person is aiming at, until they set their own under Progress.
 * Computed rather than hard-coded: a fixed date silently rots, and a countdown
 * reading "-3 days" is worse than no countdown at all.
 */
function nextSaturday(from = new Date()) {
  const d = new Date(from);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7)); // today, if today is Saturday
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// Where the list of people lives. Each person's progress is a separate entry
// under gdgc.v1:<id>, so switching is just reading a different key — no server,
// no accounts, nothing leaves the device.
const PEOPLE_KEY = 'gdgc.people';
const LEGACY_KEY = 'gdgc.v1';
const stateKey = (id) => `${LEGACY_KEY}:${id}`;
const BOXES = 5; // Leitner boxes; box 4 and up counts as learned.
const LEARNED_AT = 4;

let DATA = null;
let route = parseRoute(location.hash);

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/** Escape, then turn the data files' *asterisk markers* into highlights. */
const mk = (s) => esc(s).replace(/\*([^*]+)\*/g, '<mark>$1</mark>');

/** The same text with the markers simply removed — for quiz prompts. */
const plain = (s) => String(s ?? '').replace(/\*/g, '');

/* ---------------- who is using it ---------------- */

let people = loadPeople();

function loadPeople() {
  try {
    const raw = JSON.parse(localStorage.getItem(PEOPLE_KEY) || 'null');
    if (raw && Array.isArray(raw.list) && raw.list.length) return raw;
  } catch {
    /* fall through and start a fresh list */
  }
  // First run, or an upgrade from the version that only knew one person:
  // whatever progress is already stored belongs to whoever has been using it,
  // so it becomes that person's rather than being orphaned.
  const first = { id: 'p1', name: 'Me' };
  const seeded = { list: [first], active: first.id };
  try {
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy && !localStorage.getItem(stateKey(first.id))) {
      localStorage.setItem(stateKey(first.id), legacy);
    }
    localStorage.setItem(PEOPLE_KEY, JSON.stringify(seeded));
  } catch {
    /* private mode: the picker still works, it just will not be remembered */
  }
  return seeded;
}

function savePeople() {
  try {
    localStorage.setItem(PEOPLE_KEY, JSON.stringify(people));
  } catch {
    /* as above */
  }
}

const activePerson = () => people.list.find((x) => x.id === people.active) || people.list[0];

/** Everything transient belongs to whoever was here a moment ago. Drop it. */
function usePerson(id) {
  if (!people.list.some((x) => x.id === id)) return;
  people.active = id;
  savePeople();
  state = load();
  quiz = null;
  current = null;
  flipped = false;
  render();
}

function addPerson(rawName) {
  const name = String(rawName || '').trim().slice(0, 24);
  if (!name) return;
  const person = { id: `p${Date.now().toString(36)}`, name };
  people.list.push(person);
  usePerson(person.id);
}

function renamePerson(id, rawName) {
  const name = String(rawName || '').trim().slice(0, 24);
  const person = people.list.find((x) => x.id === id);
  if (!person || !name) return;
  person.name = name;
  savePeople();
  render();
}

function removePerson(id) {
  // Never leave the app with nobody in it.
  if (people.list.length < 2) return;
  people.list = people.list.filter((x) => x.id !== id);
  try {
    localStorage.removeItem(stateKey(id));
  } catch {
    /* nothing to clean up */
  }
  savePeople();
  usePerson(people.active === id ? people.list[0].id : people.active);
}

/* ---------------- storage ---------------- */

const blank = () => ({
  cards: {}, // id -> { box, seen, right, wrong, last }
  spot: { asked: 0, right: 0, best: 0, streak: 0 },
  target: nextSaturday(),
  // Which set the Learn/Drill/Spot views were last filtered to, so the app
  // reopens where you left it rather than at the top every time.
  filter: 'all',
  // Set once you have waved away the "add it to your home screen" card. The
  // one in Settings is permanent; this only silences the one on the Map.
  installDismissed: false,
  // Quiz prep: the exam is on the Greek, so you can put the gloss away.
  hideEnglish: false
});

let state = load();

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(stateKey(people.active)) || 'null');
    return raw ? { ...blank(), ...raw, spot: { ...blank().spot, ...(raw.spot || {}) } } : blank();
  } catch {
    return blank();
  }
}

function save() {
  try {
    localStorage.setItem(stateKey(people.active), JSON.stringify(state));
  } catch {
    /* private mode, a full quota — the app still works, it just forgets. */
  }
}

function progressOf(id) {
  return state.cards[id] || { box: 0, seen: 0, right: 0, wrong: 0, last: null };
}

/** Right answer: up a box. Wrong: all the way back to box 1, which is the point. */
function grade(id, correct) {
  const p = { ...progressOf(id) };
  p.seen += 1;
  p.last = Date.now();
  if (correct) {
    p.right += 1;
    p.box = Math.min(BOXES, Math.max(1, p.box) + 1);
  } else {
    p.wrong += 1;
    p.box = 1;
  }
  state.cards[id] = p;
  save();
}

const isLearned = (id) => progressOf(id).box >= LEARNED_AT;

/** Another person's card progress, read without switching to them. */
function personCards(id) {
  if (id === people.active) return state.cards;
  try {
    return JSON.parse(localStorage.getItem(stateKey(id)) || '{}').cards || {};
  } catch {
    return {};
  }
}

/* ---------------- the target date ---------------- */

function parseDay(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysToTarget() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((parseDay(state.target) - today) / 86400000);
}

function targetLabel() {
  const n = daysToTarget();
  if (n > 1) return `${n} days left`;
  if (n === 1) return 'tomorrow';
  if (n === 0) return 'today';
  return 'target passed';
}

/* ---------------- data helpers ---------------- */

const cardById = (id) => DATA.cards.find((c) => c.id === id);
const setById = (id) => DATA.sets.find((s) => s.id === id);
const groupById = (id) => DATA.sets.flatMap((s) => s.groups).find((g) => g.id === id);
const setColor = (id) => setById(id)?.color || 'var(--accent)';

/**
 * Which case is being taught right now: the next class not yet past, or the
 * last one if the term has run out. A hard-coded "this week" tag went stale the
 * moment the calendar moved, so this reads the timetable instead.
 */
function thisWeekSets() {
  const dated = DATA.sets.filter((s) => s.classDate);
  if (!dated.length) return DATA.sets.map((s) => s.id);
  const today = S_startOfToday();
  const byDate = (a, b) => parseDay(a.classDate) - parseDay(b.classDate);
  const ahead = dated.filter((s) => parseDay(s.classDate) >= today).sort(byDate);
  const when = (ahead.length ? ahead[0] : [...dated].sort(byDate).pop()).classDate;
  return dated.filter((s) => s.classDate === when).map((s) => s.id);
}

function S_startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

/** Is this a filter the views know how to apply? */
const isFilter = (arg) => arg === 'all' || arg === 'week' || !!setById(arg) || String(arg).startsWith('tag:');

/** The cards a view is currently working with, honouring set or tag filters. */
function selection(filter = state.filter) {
  if (!filter || filter === 'all') return DATA.cards;
  if (filter === 'week') {
    const ids = thisWeekSets();
    return DATA.cards.filter((c) => ids.includes(c.set));
  }
  if (filter.startsWith('tag:')) {
    const tag = filter.slice(4);
    return DATA.cards.filter((c) => (c.tags || []).includes(tag));
  }
  return DATA.cards.filter((c) => c.set === filter);
}

function filterLabel(filter = state.filter) {
  if (!filter || filter === 'all') return 'Everything';
  if (filter === 'week') {
    const names = thisWeekSets().map((id) => setById(id).name);
    return `This week — ${names.join(', ')}`;
  }
  if (filter.startsWith('tag:')) return `#${filter.slice(4)}`;
  return setById(filter)?.name || filter;
}

/* ---------------- routing ---------------- */

/**
 * `#/learn/nominative`, `#/card/predicate-nominative`, `#/tag/saturday`.
 * Bare `#learn` works too, so a hand-typed or older link still lands somewhere.
 */
function parseRoute(hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [name = 'map', arg = null] = raw.split('/');
  return { name: name || 'map', arg: arg || null };
}

const VIEW_NAMES = new Set(['map', 'learn', 'drill', 'spot', 'progress', 'card', 'tag', 'confusions']);

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

/**
 * A link in from the homework app may carry `?from=<url>`, and we send the user
 * back there rather than guessing. Anything that is not an http(s) URL is
 * ignored — a hash parameter is attacker-supplied by definition.
 */
function returnLink() {
  const from = new URLSearchParams(location.search).get('from');
  if (!from) return HOMEWORK_APP;
  try {
    const url = new URL(from, location.href);
    return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : HOMEWORK_APP;
  } catch {
    return HOMEWORK_APP;
  }
}

const backRow = () => `
  <a class="backlink" href="${esc(returnLink())}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
    Back to Seminary Homework
  </a>`;

/* ---------------- installing it ---------------- */

// Chrome hands us the install prompt instead of showing its own, so we hold on
// to it and put it behind a button. Safari never fires this and has no API for
// it at all — there, all we can do is say where the button is.
let installPrompt = null;
let swReady = false;

const standalone = () =>
  matchMedia('(display-mode: standalone)').matches ||
  matchMedia('(display-mode: minimal-ui)').matches ||
  navigator.standalone === true;

const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  render();
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  render();
});

const ICON_SHARE = `<svg viewBox="0 0 24 24" aria-hidden="true" class="inline-icon"><path d="M12 15V4"/><path d="M8.5 7.5 12 4l3.5 3.5"/><path d="M6 12H4v8h16v-8h-2"/></svg>`;
const ICON_PLUS = `<svg viewBox="0 0 24 24" aria-hidden="true" class="inline-icon"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 9v6M9 12h6"/></svg>`;

/**
 * How to get this onto a home screen, in whichever of the three situations you
 * are actually in. `dismissible` is the copy that lives on the Map and can be
 * waved away; Settings keeps a permanent one.
 */
function installCard({ dismissible = false } = {}) {
  if (dismissible && (state.installDismissed || standalone())) return '';

  const offline = location.protocol === 'file:';

  const body = offline
    ? `<p class="note">This is the single-file copy, opened straight off the disk. It works with no network at all, but a
         browser will not install a <code>file://</code> page to a home screen — for that, open the hosted address instead.</p>`
    : standalone()
      ? `<p class="note">Installed — you are running it from your home screen. It works with no network, and the drill,
           the cards and your progress are all on the device.</p>`
      : installPrompt
        ? `<p class="note">Add it to your home screen and it opens full-screen, with no browser chrome, and works offline.</p>
           <div class="btnrow"><button class="btn primary wide" data-action="install">${ICON_PLUS} Install</button></div>`
        : isIos()
          ? `<p class="note">On iPhone and iPad, Safari puts this behind the Share button:</p>
             <ol class="steps">
               <li>Tap ${ICON_SHARE} <strong>Share</strong> at the bottom of Safari.</li>
               <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
               <li>Tap <strong>Add</strong>.</li>
             </ol>
             <p class="note">It has to be Safari — Chrome on iOS cannot install a web app. Once it is on the home screen it
                opens full-screen and works with no signal.</p>`
          : `<p class="note">Your browser will offer <strong>Install app</strong> in its menu once it has seen the page a
               couple of times — in Chrome it is the ⋮ menu, or an icon in the address bar. Installed, it opens full-screen
               and works offline.</p>`;

  return `
    <section class="card">
      <h2>
        ${standalone() ? 'On your home screen' : 'Put it on your home screen'}
        ${dismissible ? `<button class="btn small ghost dismiss" data-action="dismiss-install" aria-label="Dismiss">✕</button>` : ''}

        offline
          ? ''

}

  return `
    <div class="formula ${f.ladder ? 'is-ladder' : ''}">

      ${caption ? `<p class="fcaption">${esc(card.oneLine)}</p>` : ''}

/* ---------------- view: drill ---------------- */

/**
 * Three ways of asking about one card, so the drill never becomes "recognise
 * the shape of the front of this card". Which one you get depends on how many
 * times you have seen it, so early reps are recognition and later ones recall.
 */
const PROMPTS = [
  { label: 'What is the hook?', front: (c) => c.name, small: false },
  { label: 'Which use is this?', front: (c) => c.mnemonic, small: false },
  { label: 'Which use does this test find?', front: (c) => c.spotIt, small: true }
];

function promptFor(card) {
  return PROMPTS[progressOf(card.id).seen % PROMPTS.length];
}

/**
 * Due order: lowest box first (what you know least), then least recently seen.
 * Nothing here is a real spaced-repetition schedule — there are four days until
 * Saturday, so "show me the shakiest thing I have not just seen" is the whole
 * algorithm.
 */
function deck() {
  return [...selection()].sort((a, b) => {
    const pa = progressOf(a.id);
    const pb = progressOf(b.id);
    return pa.box - pb.box || (pa.last || 0) - (pb.last || 0);
  });
}

let flipped = false;
let current = null;

function viewDrill(arg) {
  if (arg && isFilter(arg)) state.filter = arg;
  const due = deck();
  if (!current || !due.some((c) => c.id === current)) {
    current = due[0]?.id || null;
    flipped = false;
  }
  const card = current && cardById(current);
  if (!card) return `<section class="card"><p class="empty">Nothing in this set.</p></section>`;

  const set = setById(card.set);
  const p = progressOf(card.id);
  const prompt = promptFor(card);
  const learned = selection().filter((c) => isLearned(c.id)).length;

  return `
    <section class="card">
      <h2>Drill — ${esc(filterLabel())}</h2>
      ${filterChips('drill')}
      ${bar(learned, selection().length)}
      <div class="flash-meta">
        <span>${learned} of ${selection().length} in box ${LEARNED_AT}+</span>
        <span>${esc(targetLabel())}</span>
      </div>
    </section>

    <section class="card flash" style="--accent:${esc(set.color)}">
      <div class="flash-prompt-label">${dot(set.color)}${esc(prompt.label)}</div>
      <div class="flash-prompt ${prompt.small ? 'is-small' : ''}">${esc(prompt.front(card))}</div>

      ${
        flipped
          ? `<div class="flash-answer">
               <div class="name">${esc(card.name)}</div>
               ${eli5Block(card.eli5)}
               ${formulaBlock(card)}
               <div class="hook" style="border-left-color:${esc(set.color)};margin-top:9px">
                 <div class="hook-line">${esc(card.mnemonic)}</div>
                 <div class="hook-why">${esc(card.mnemonicWhy)}</div>
               </div>
               <div class="spot" style="margin-top:9px"><span class="label">Spot it</span>${esc(card.spotIt)}</div>
               ${
                 card.examples && card.examples[0]
                   ? `<div class="ex">
                        <div class="ex-ref">${esc(card.examples[0].ref)}</div>
                        ${card.examples[0].greek ? `<div class="greek">${mk(card.examples[0].greek)}</div>` : ''}
                        <div class="ex-en">${mk(card.examples[0].english)}</div>
                      </div>`
                   : ''
               }
             </div>`
          : ''
      }

      <div class="flash-meta">
        <span>${pips(p.box)} box ${p.box || 0}</span>
        <span>seen ${p.seen}×</span>
      </div>

      ${
        flipped
          ? `<div class="btnrow split">
               <button class="btn bad" data-action="grade" data-ok="0">Again</button>
               <button class="btn good" data-action="grade" data-ok="1">Got it</button>
             </div>`
          : `<div class="btnrow"><button class="btn primary wide" data-action="flip">Show the answer</button></div>`
      }
    </section>

    <section class="card">
      <div class="btnrow split">
        <button class="btn small" data-action="goto" data-to="#/card/${esc(card.id)}">Open the full card</button>
        <button class="btn small" data-action="skip">Skip</button>
      </div>
    </section>`;
}

/* ---------------- view: spot it ---------------- */

/**
 * Quiz items: the hand-written ones from the data file, plus one generated from
 * every worked example. Distractors come from the same set — being asked to
 * tell a nominative use from an accusative one is not the exam.
 */
function quizPool() {
  const items = [];

  for (const q of DATA.extraQuiz) {
    const card = cardById(q.answer);
    if (card && card.type !== 'rule' && selection().some((c) => c.id === card.id)) {
      items.push({ id: `x:${q.answer}:${items.length}`, prompt: q.prompt, answer: card.id, why: q.why, set: card.set });
    }
  }

  for (const card of selection()) {
    if (card.type === 'rule') continue;
    for (const [i, ex] of (card.examples || []).entries()) {
      if (!ex.note) continue;
      items.push({
        id: `e:${card.id}:${i}`,
        ref: ex.ref,
        // The exam is on the Greek, so the Greek is the question and the
        // English is a gloss you can put away.
        greek: plain(ex.greek),
        prompt: plain(ex.english),
        answer: card.id,
        why: ex.note,
        set: card.set
      });
    }
  }

  // Greek-bearing items first: an English-only drill is a warm-up, not the exam.
  return items.sort((a, b) => (b.greek ? 1 : 0) - (a.greek ? 1 : 0));
}

function optionsFor(item) {
  const partners = DATA.confusions.filter((c) => c.pair.includes(item.answer)).flatMap((c) => c.pair);
  const sameSet = DATA.cards.filter((c) => c.set === item.set && c.id !== item.answer && c.type !== 'rule');
  const ranked = [
    ...sameSet.filter((c) => partners.includes(c.id)),
    ...shuffle(sameSet.filter((c) => !partners.includes(c.id)))
  ];
  return shuffle([item.answer, ...ranked.slice(0, 3).map((c) => c.id)]);
}

function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let quiz = null; // { item, options, picked }

function nextQuestion() {
  const pool = quizPool();
  if (!pool.length) {
    quiz = null;
    return;
  }
  // Twice the tickets for a card you have not learned, twice again for an item
  // that carries Greek — that is what the quiz is actually on.
  const weighted = pool.flatMap((it) => {
    const tickets = (isLearned(it.answer) ? 1 : 2) * (it.greek ? 2 : 1);
    return Array.from({ length: tickets }, () => it);
  });
  const item = weighted[Math.floor(Math.random() * weighted.length)];
  quiz = { item, options: optionsFor(item), picked: null };
}

function viewSpot(arg) {
  // Only when the filter actually changes. This runs on every render, and
  // blanking the question here threw away the answer you had just given —
  // so answering did nothing at all if you arrived by a #/spot/<set> link.
  if (arg && isFilter(arg)) {
    if (state.filter !== arg) {
      state.filter = arg;
      quiz = null;
    }
  }
  // A question left over from another set is not this set's question.
  if (quiz && !selection().some((c) => c.id === quiz.item.answer)) quiz = null;
  if (!quiz) nextQuestion();
  if (!quiz) return `<section class="card"><p class="empty">No questions in this set.</p></section>`;

  const { item, options, picked } = quiz;
  const s = state.spot;

  return `
    <section class="card">
      <h2>Spot it — ${esc(filterLabel())}</h2>
      ${filterChips('spot')}
      <div class="flash-meta" style="margin-top:10px">
        <span class="score">${s.right} / ${s.asked} right</span>
        <span class="score">streak ${s.streak} · best ${s.best}</span>
      </div>
    </section>

    <section class="card">
      ${item.ref ? `<div class="q-ref">${esc(item.ref)}</div>` : ''}
      ${item.greek ? `<div class="greek q-greek">${esc(item.greek)}</div>` : ''}
      <div class="q-prompt ${item.greek ? 'is-gloss' : ''} ${item.greek && state.hideEnglish ? 'is-hidden' : ''}">
        ${esc(item.prompt)}
      </div>
      ${
        item.greek
          ? `<button class="btn small ghost" data-action="toggle-english">
               ${state.hideEnglish ? 'Show the English' : 'Hide the English'}
             </button>`
          : ''
      }
      <div class="options">
        ${options
          .map((id) => {
            const c = cardById(id);
            const cls = !picked ? '' : id === item.answer ? 'correct' : id === picked ? 'wrong' : '';
            return `<button class="option ${cls}" data-action="answer" data-pick="${esc(id)}" ${picked ? 'disabled' : ''}>
                      ${esc(c.name)}<span class="concept-hook">${esc(c.mnemonic)}</span>
                    </button>`;
          })
          .join('')}
      </div>
      ${
        picked
          ? `<div class="verdict">
               <strong>${picked === item.answer ? 'Right.' : `Not quite — it is ${esc(cardById(item.answer).name)}.`}</strong>
               <div class="why">${esc(item.why)}</div>
               <div class="btnrow split">
                 <button class="btn small" data-action="goto" data-to="#/card/${esc(item.answer)}">Open that card</button>
                 <button class="btn primary" data-action="next-q">Next</button>
               </div>
             </div>`
          : ''
      }
    </section>`;
}

/* ---------------- view: progress ---------------- */

function viewProgress() {
  const learned = DATA.cards.filter((c) => isLearned(c.id));
  const untouched = DATA.cards.filter((c) => progressOf(c.id).seen === 0);
  const shaky = DATA.cards
    .filter((c) => progressOf(c.id).seen > 0 && !isLearned(c.id))
    .sort((a, b) => progressOf(a.id).box - progressOf(b.id).box);
  const s = state.spot;

  return `
    <section class="card">
      <h2>Where you are</h2>
      ${bar(learned.length, DATA.cards.length)}
      <div class="stats">
        <div><span class="stat">${learned.length}</span><small>of ${DATA.cards.length} learned</small></div>
        <div><span class="stat">${s.asked ? Math.round((s.right / s.asked) * 100) : 0}%</span><small>spot-it accuracy</small></div>
        <div>
          <span class="stat">${Math.max(0, daysToTarget())}</span>
          <small>${daysToTarget() < 0 ? 'target has passed' : 'days to target'}</small>
        </div>
      </div>
      <p class="note">A card counts as learned once it has climbed to box ${LEARNED_AT} — four right answers in a row, with any
         wrong answer knocking it back to box 1.</p>
    </section>

    ${
      shaky.length
        ? `<section class="card">
             <h2>Shakiest first</h2>
             ${shaky
               .map(
                 (c) => `
               <div class="mastery">
                 ${dot(setColor(c.set))}
                 <span class="mastery-name">${esc(c.name)}</span>
                 ${pips(progressOf(c.id).box)}
                 <button class="btn small" data-action="goto" data-to="#/card/${esc(c.id)}">Open</button>
               </div>`
               )
               .join('')}
           </section>`
        : ''
    }

    ${
      untouched.length
        ? `<section class="card">
             <h2>Not yet seen (${untouched.length})</h2>
             ${untouched
               .map(
                 (c) => `
               <div class="mastery">
                 ${dot(setColor(c.set))}
                 <span class="mastery-name">${esc(c.name)}</span>
                 <button class="btn small" data-action="goto" data-to="#/card/${esc(c.id)}">Open</button>
               </div>`
               )
               .join('')}
           </section>`
        : ''
    }

    ${
      learned.length
        ? `<section class="card">
             <h2>Learned (${learned.length})</h2>
             ${learned
               .map(
                 (c) => `
               <div class="mastery">
                 ${dot(setColor(c.set))}
                 <span class="mastery-name">${esc(c.name)}</span>
                 ${pips(progressOf(c.id).box)}
               </div>`
               )
               .join('')}
           </section>`
        : ''
    }

    <section class="card">
      <h2>Who is using this</h2>
      <p class="note" style="margin-top:0">Each person gets their own boxes, their own scores and their own target date.
         Nothing is shared, and nothing leaves this device.</p>
      ${people.list
        .map(
          (x) => `
        <div class="mastery">
          <span class="mastery-name">${x.id === people.active ? '<strong>' : ''}${esc(x.name)}${
            x.id === people.active ? '</strong>' : ''
          }</span>
          <span class="muted" style="font-size:12px">${
            Object.keys(personCards(x.id)).length
          } cards started</span>
          ${
            x.id === people.active
              ? '<span class="pill">here now</span>'
              : `<button class="btn small" data-action="use-person" data-person="${esc(x.id)}">Switch</button>`
          }
          <button class="btn small ghost" data-action="rename-person" data-person="${esc(x.id)}">Rename</button>
          ${
            people.list.length > 1
              ? `<button class="btn small ghost" data-action="remove-person" data-person="${esc(x.id)}">Remove</button>`
              : ''
          }
        </div>`
        )
        .join('')}
      <div class="btnrow">
        <button class="btn small" data-action="add-person">Add someone</button>
      </div>
    </section>

    <section class="card">
      <h2>Settings for ${esc(activePerson().name)}</h2>
      <div class="mastery">
        <span class="mastery-name">Learn it all by</span>
        <input type="date" id="target-date" value="${esc(state.target)}" />
      </div>
      <div class="btnrow">
        <button class="btn small" data-action="reset">Reset all progress</button>
      </div>
      <p class="note">Progress lives in this browser's local storage. Nothing is uploaded anywhere.</p>
      ${backRow()}
    </section>

    ${installCard()}

    <section class="card">
      <h2>App version</h2>
      <p class="note">Running <strong>${esc(BUILD)}</strong>${standalone() ? ' from the home screen' : ''}.</p>
      <p class="note">If a device is stuck on an old version, this throws away its offline copy and fetches the app again.</p>
      <div class="btnrow"><button class="btn small" data-action="clear-cache">Clear the offline copy</button></div>
    </section>`;
}

/* ---------------- render ---------------- */

const VIEWS = {
  map: viewMap,
  learn: viewLearn,
  card: viewCard,
  drill: viewDrill,
  spot: viewSpot,
  progress: viewProgress,
  confusions: () => `<section class="card"><h2>Confusion pairs</h2>${DATA.confusions.map(confusionRow).join('')}</section>`
};

function render() {
  route = parseRoute(location.hash);
  if (!VIEW_NAMES.has(route.name)) route = { name: 'map', arg: null };

  // `#/tag/saturday` is Learn with a tag filter, not a view of its own.
  if (route.name === 'tag') {
    state.filter = `tag:${route.arg}`;
    route = { name: 'learn', arg: state.filter };
  }

  $('#app').innerHTML = (VIEWS[route.name] || viewMap)(route.arg);

  const tabFor = route.name === 'card' ? 'learn' : route.name === 'confusions' ? 'map' : route.name;
  $$('.tab').forEach((el) => el.classList.toggle('on', el.dataset.view === tabFor));

  const who = $('#whoami');
  if (who) {
    who.innerHTML = `
      ${people.list
        .map((x) => `<option value="${esc(x.id)}" ${x.id === people.active ? 'selected' : ''}>${esc(x.name)}</option>`)
        .join('')}
      <option value="__add">＋ Add someone…</option>`;
  }

  const due = daysToTarget();
  const target = $('#target');
  if (target) {
    target.classList.toggle('is-due', due <= 1);
    target.innerHTML = `<strong>${esc(targetLabel())}</strong>${esc(
      parseDay(state.target).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
    )}`;
  }

  document.title = route.name === 'map' ? 'Greek Cases — Mnemonics' : `Greek Cases — ${route.name}`;
  window.scrollTo(0, 0);
}

/* ---------------- events ---------------- */

document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) return go(`#/${tab.dataset.view}`);

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action } = el.dataset;

  if (action === 'goto') return go(el.dataset.to);
  if (action === 'open-card') return go(`#/card/${el.dataset.card}`);

  if (action === 'filter') {
    state.filter = el.dataset.filter;
    save();
    quiz = null;
    current = null;
    flipped = false;
    return go(`#/${el.dataset.base}/${state.filter}`);
  }

  if (action === 'flip') {
    flipped = true;
    return render();
  }

  if (action === 'grade') {
    grade(current, el.dataset.ok === '1');
    current = null;
    flipped = false;
    return render();
  }

  if (action === 'skip') {
    // Push it to the back of the queue without pretending you answered it.
    const p = { ...progressOf(current), last: Date.now() };
    state.cards[current] = p;
    save();
    current = null;
    flipped = false;
    return render();
  }

  if (action === 'answer') {
    if (quiz.picked) return;
    const pick = el.dataset.pick;
    quiz.picked = pick;
    const correct = pick === quiz.item.answer;
    grade(quiz.item.answer, correct);
    const s = state.spot;
    s.asked += 1;
    if (correct) {
      s.right += 1;
      s.streak += 1;
      s.best = Math.max(s.best, s.streak);
    } else {
      s.streak = 0;
    }
    save();
    return render();
  }

  if (action === 'toggle-english') {
    state.hideEnglish = !state.hideEnglish;
    save();
    return render();
  }

  if (action === 'next-q') {
    nextQuestion();
    return render();
  }

  if (action === 'dismiss-install') {
    state.installDismissed = true;
    save();
    return render();
  }

  if (action === 'install') {
    if (!installPrompt) return;
    const prompt = installPrompt;
    installPrompt = null;
    prompt.prompt();
    // Whatever they choose, the event is spent — Chrome will fire a fresh one
    // later if they dismiss it, so there is nothing to hold on to here.
    prompt.userChoice.finally(() => render());
    return;
  }

  if (action === 'clear-cache') {
    if (!confirm('Throw away the offline copy and fetch the app again? Your progress is kept.')) return;
    (async () => {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      } catch (err) {
        console.warn('Could not clear the offline copy', err);
      }
      location.reload();
    })();
    return;
  }

  if (action === 'use-person') return usePerson(el.dataset.person);

  if (action === 'add-person') return addPerson(prompt('Who is this for? (a first name is plenty)', ''));

  if (action === 'rename-person') {
    const person = people.list.find((x) => x.id === el.dataset.person);
    return renamePerson(el.dataset.person, prompt('Call them what?', person ? person.name : ''));
  }

  if (action === 'remove-person') {
    const person = people.list.find((x) => x.id === el.dataset.person);
    if (!person) return;
    if (!confirm(`Remove ${person.name}, and throw away everything they have learned here?`)) return;
    return removePerson(el.dataset.person);
  }

  if (action === 'reset') {
    if (!confirm(`Clear every box and score for ${activePerson().name}, and start over?`)) return;
    const target = state.target;
    state = blank();
    state.target = target;
    save();
    quiz = null;
    current = null;
    return render();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'whoami') {
    if (e.target.value === '__add') {
      // Put the picker back where it was first: if they cancel the prompt,
      // the dropdown must not be left sitting on "Add someone".
      e.target.value = people.active;
      addPerson(prompt('Who is this for? (a first name is plenty)', ''));
      return;
    }
    return usePerson(e.target.value);
  }
  if (e.target.id !== 'target-date') return;
  state.target = e.target.value || nextSaturday();
  save();
  render();
});

// Space flips, 1/2 grade — for anyone drilling at a desk rather than on a phone.
document.addEventListener('keydown', (e) => {
  if (route.name !== 'drill' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!flipped) {
      flipped = true;
      render();
    }
  } else if (flipped && (e.key === '1' || e.key === '2')) {
    grade(current, e.key === '2');
    current = null;
    flipped = false;
    render();
  }
});

window.addEventListener('hashchange', render);

/* ---------------- boot ---------------- */

async function loadData() {
  // The single-file build embeds the cards here so it works with no server.
  if (globalThis.__CONCEPTS__) return globalThis.__CONCEPTS__;
  const res = await fetch('./data/concepts.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(`Could not load the cards (${res.status})`);
  return res.json();
}

async function boot() {
  try {
    DATA = await loadData();
  } catch (err) {
    $('#app').innerHTML = `<section class="card"><p class="empty">${esc(err.message)}</p></section>`;
    return;
  }
  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker
      .register('./sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => {
        swReady = true;
        render();
      })
      .catch(() => {});
  }
}

boot();

</script>
  </body>
</html>
