    <style>
/* Deliberately a sibling of the seminary-homework-2026 stylesheet: same palette,
   same card/tabbar furniture. Tapping through from one app to the other should
   feel like moving between rooms, not between buildings. */

:root {
  --bg: #0e1016;
  --bg-elev: #171a23;
  --bg-elev-2: #1e222d;
  --line: #272c39;
  --text: #e8eaf2;
  --muted: #9aa1b5;
  --accent: #7b8cff;
  --accent-soft: #2a3160;
  --warn: #efb057;
  --danger: #f0736a;
  --ok: #4fbf8b;
  --nom: #1f9d78;
  --acc: #c8642a;
  --radius: 14px;
  --tabbar: 62px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f9;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0f2f7;
    --line: #e0e3ec;
    --text: #191c25;
    --muted: #6b7285;
    --accent: #4d5fe0;
    --accent-soft: #e4e7ff;
    --nom: #12775a;
    --acc: #a24c1b;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 17px;
  font-weight: 700;
}

.brand strong {
  display: block;
  font-size: 15px;
  letter-spacing: 0.2px;
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

/* The countdown to the day you said you wanted this learned by. */
.brand-right {
  text-align: right;
  font-size: 11px;
  line-height: 1.25;
  color: var(--muted);
}

.brand-right strong {
  display: block;
  font-size: 13px;
  color: var(--text);
}

.brand-right.is-due strong {
  color: var(--warn);
}

/* ---------- layout ---------- */

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}

.card h2 {
  margin: 0 0 10px;
  font-size: 14px;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card h3 {
  margin: 14px 0 8px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.note {
  color: var(--muted);
  font-size: 13px;
  margin: 8px 0 0;
}

.empty {
  color: var(--muted);
  font-size: 13px;
}

.muted {
  color: var(--muted);
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: baseline;
}

/* ---------- buttons ---------- */

.btn {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 13px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.btn:active {
  transform: translateY(1px);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn.small {
  padding: 6px 10px;
  font-size: 12px;
}

.btn.wide {
  width: 100%;
}

.btn.good {
  border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
  color: var(--ok);
}

.btn.bad {
  border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
  color: var(--danger);
}

.btnrow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.btnrow.split > * {
  flex: 1 1 0;
}

/* ---------- the map ---------- */

.hero {
  background: linear-gradient(160deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
  text-align: center;
}

.hero-line {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.hero-mnemonic {
  font-size: 25px;
  font-weight: 700;
  margin: 6px 0 4px;
  letter-spacing: 0.2px;
}

.hero-sub {
  color: var(--muted);
  font-size: 13px;
}

.acro {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.acro-item {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 9px 10px;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.acro-letter {
  display: block;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.1;
}

.acro-word {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.set-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}

.set-head h2 {
  margin: 0;
  font-size: 16px;
  text-transform: none;
}

.set-sub {
  color: var(--muted);
  font-size: 12.5px;
  margin: 0 0 10px;
}

.bigidea {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13.5px;
  margin: 10px 0 0;
}

.mnemonic-line {
  font-size: 17px;
  font-weight: 650;
  margin: 2px 0 6px;
}

.mnemonic-why {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
}

/* ---------- cards (Learn) ---------- */

.concept {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-elev);
  overflow: hidden;
}

.concept + .concept {
  margin-top: 8px;
}

.concept > summary {
  list-style: none;
  cursor: pointer;
  padding: 11px 13px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.concept > summary::-webkit-details-marker {
  display: none;
}

.concept-name {
  font-weight: 620;
  flex: 1;
}

.concept-hook {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}

.concept-body {
  padding: 0 13px 13px;
  border-top: 1px solid var(--line);
}

.concept-body > * {
  margin-top: 11px;
}

.label {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}

.hook {
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-elev-2));
  border-left: 3px solid var(--accent);
  border-radius: 0 9px 9px 0;
  padding: 9px 11px;
}

.hook-line {
  font-size: 15.5px;
  font-weight: 650;
}

.hook-why {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.spot {
  background: var(--bg-elev-2);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13.5px;
}

.watch {
  border: 1px dashed color-mix(in srgb, var(--warn) 50%, var(--line));
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;
  color: color-mix(in srgb, var(--warn) 75%, var(--text));
}

.ex {
  border-top: 1px solid var(--line);
  padding-top: 9px;
}

.ex + .ex {
  margin-top: 9px;
}

.ex-ref {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.greek {
  font-family: 'Gentium Plus', 'SBL Greek', 'Palatino Linotype', Palatino, Georgia, serif;
  font-size: 17px;
  line-height: 1.5;
  margin: 3px 0;
}

.ex-en {
  font-size: 13.5px;
}

.ex-note {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
}

mark {
  background: color-mix(in srgb, var(--accent) 28%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 2px;
}

/* ---------- filters ---------- */

.chips {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.chip {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 11px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

.chip.on {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  color: var(--accent);
}

/* ---------- drill ---------- */

.flash {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  text-align: center;
  padding: 22px 16px;
}

.flash-prompt-label {
  font-size: 11px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
}

.flash-prompt {
  font-size: 21px;
  font-weight: 650;
  line-height: 1.35;
}

.flash-prompt.is-small {
  font-size: 16.5px;
  font-weight: 500;
}

.flash-answer {
  border-top: 1px solid var(--line);
  padding-top: 13px;
  text-align: left;
}

.flash-answer .name {
  font-size: 18px;
  font-weight: 650;
}

.flash-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--muted);
}

.box-pips {
  display: inline-flex;
  gap: 3px;
  vertical-align: middle;
}

.pip {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--line);
}

.pip.on {
  background: var(--ok);
}

/* ---------- spot it ---------- */

.q-prompt {
  font-size: 16px;
  line-height: 1.45;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 13px;
}

.option {
  text-align: left;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}

.option.correct {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 16%, var(--bg-elev-2));
}

.option.wrong {
  border-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 14%, var(--bg-elev-2));
}

.option:disabled {
  cursor: default;
  opacity: 0.85;
}

.option.correct:disabled,
.option.wrong:disabled {
  opacity: 1;
}

.verdict {
  margin-top: 12px;
  font-size: 13.5px;
}

.verdict .why {
  color: var(--muted);
  margin-top: 4px;
}

.score {
  font-variant-numeric: tabular-nums;
}

/* ---------- progress ---------- */

.bar {
  height: 7px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0 4px;
}

.bar-fill {
  height: 100%;
  background: var(--ok);
  border-radius: 999px;
  transition: width 0.25s ease;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.stats > div {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stat {
  display: block;
  font-size: 21px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.stats small {
  color: var(--muted);
  font-size: 11px;
}

.mastery {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.mastery:last-child {
  border-bottom: 0;
}

.mastery-name {
  flex: 1;
  font-size: 13.5px;
}

/* ---------- confusion pairs ---------- */

.confusion {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
}

.confusion + .confusion {
  margin-top: 8px;
}

.confusion-q {
  font-weight: 620;
  font-size: 14px;
}

.confusion-test {
  font-size: 13px;
  margin-top: 5px;
}

.confusion-test b {
  color: var(--accent);
}

.confusion-ex {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 5px;
}

/* ---------- back link to the homework app ---------- */

.backlink {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--accent);
  text-decoration: none;
}

.backlink svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- tab bar ---------- */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  background: none;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 10.5px;
  padding: 8px 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}

.tab svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab.on {
  color: var(--accent);
}

/* ---------- installing it ---------- */

.card h2 .dismiss {
  margin-left: auto;
  padding: 3px 8px;
  line-height: 1;
}

.btn.ghost {
  background: none;
  color: var(--muted);
}

.inline-icon {
  width: 15px;
  height: 15px;
  vertical-align: -2px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.btn .inline-icon {
  vertical-align: -3px;
  margin-right: 5px;
}

.steps {
  margin: 10px 0 0;
  padding-left: 20px;
  font-size: 13.5px;
  color: var(--text);
}

.steps li + li {
  margin-top: 6px;
}

.note.ready {
  color: var(--ok);
}

code {
  background: var(--bg-elev-2);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 12.5px;
}

/* ---------- the formula block ----------
   The bare shape of the construction, before a word of prose. */

.formula {
  background: var(--bg-elev-2);
  border-radius: 11px;
  padding: 14px 12px 12px;
  margin-top: 11px;
}

.fcols {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 6px 18px;
  text-align: center;
}

.fcol {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

/* The pattern row: the thing to remember. */
.fpat {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.2;
}

/* The worked row underneath, in the accent so the eye pairs them up. */
.ffill {
  font-size: 13px;
  color: var(--accent);
  line-height: 1.3;
}

.fladder {
  margin: 0;
  padding-left: 22px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
}

.fladder li + li {
  margin-top: 4px;
}

.fnote,
.fcaption {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}

/* A ladder is read down the left edge, so its prose lines up with it. */
.formula.is-ladder .fnote,
.formula.is-ladder .fcaption {
  text-align: left;
}

.fnote + .fcaption {
  margin-top: 5px;
}

.flash .formula {
  background: var(--bg-elev);
  margin-top: 9px;
}

/* ---------- Greek-first quiz prompts ----------
   The exam is on the Greek, so the Greek is the question and the English
   is a gloss you can put away. */

.q-ref {
  font-size: 11px;
  letter-spacing: 0.3px;
  color: var(--muted);
  margin-bottom: 4px;
}

.q-greek {
  font-size: 21px;
  line-height: 1.55;
  margin: 0 0 8px;
}

.q-prompt.is-gloss {
  font-size: 13.5px;
  color: var(--muted);
}

/* Blurred rather than removed, so the layout does not jump when you peek. */
.q-prompt.is-hidden {
  filter: blur(5px);
  user-select: none;
}

.q-prompt + .btn.ghost {
  margin-top: 8px;
}

/* The group's own hook, above its tiles on the map. */
.group-hook {
  margin: -4px 0 8px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}

/* ---------- the like-I'm-five block ----------
   Leads every card. Bigger and warmer than the prose under it, because it is
   the one part you should be able to read at a glance and understand. */

.eli5 {
  background: color-mix(in srgb, var(--warn) 13%, var(--bg-elev-2));
  border-left: 3px solid var(--warn);
  border-radius: 0 11px 11px 0;
  padding: 11px 13px;
  margin-top: 11px;
}

.eli5 .label {
  color: color-mix(in srgb, var(--warn) 78%, var(--text));
}

.eli5 p {
  margin: 0;
  font-size: 15px;
  line-height: 1.5;
}

.flash .eli5,
.hero + .card .eli5 {
  text-align: left;
}

</style>

  <body>

    <script type="module">
globalThis.__CONCEPTS__ = {"book":"Going Deeper with New Testament Greek","chapter":"ch. 2–3 — Nominative, Accusative, Genitive","course":"Intermediate Greek (GREK 6003), Fall 2026","generated":"2026-08-27","notes":["Every card carries a mnemonic hook, a plain one-line definition, a test you can actually run on a text, and real examples.","eli5: the like-I'm-five line. It leads every card, above the pattern — plain words, a picture you can see, and no grammar terms at all.","formula: the bare pattern, shown before any prose. pattern[]/filled[] render as aligned columns; ladder[] renders as a numbered list. oneLine is the caption underneath it.","Greek is given in the text with the key word marked by * asterisks *, so the app can highlight it without any markup engine.","confusions[] are the pairs that actually get missed on a quiz. They are drilled separately from the cards.","extraQuiz[] are hand-written 'Spot it' items; the rest are generated from each card's examples."],"sets":[{"id":"nominative","name":"Nominative","subtitle":"The naming case. Who or what the sentence is about.","eli5":"This is the who-is-it case. It sticks a name tag on somebody. Nobody wearing it ever gets hit, eaten or carried — they just get named, or shouted at.","color":"#1f9d78","bigIdea":"The nominative names. Whoever wears it is being named or called — never done to.","masterMnemonic":"Go to the SPA, then say AAAH.","masterMnemonicWhy":"SPA is the three main uses: Subject, Predicate nominative, Apposition. AAAH is the other four: Address, Appellation, Absolute, Hanging. Seven uses, one silly picture — you sit down in the spa and go aaah.","groups":[{"id":"nominative-major","name":"Major uses — the SPA","mnemonic":"S-P-A","expand":"Subject · Predicate nominative · Apposition"},{"id":"nominative-other","name":"Other uses — the AAAH","mnemonic":"A-A-A-H","expand":"Address · Appellation · Absolute · Hanging"}]},{"id":"accusative","name":"Accusative","subtitle":"The fencing case. How far the verb's action goes.","eli5":"This is the how-far case. Verbs would run on forever, so this builds a fence: who got hit, how far you walked, how you did it.","color":"#c8642a","bigIdea":"The accusative fences the verb in. It says how far the action reaches — onto whom, how far, in what way.","masterMnemonic":"One object with four twists, then the MMR shot.","masterMnemonicWhy":"Noun-like: the direct object plus four twists on it — Echo, Two, Sub, Alias. Adverb-like: the MMR shot — Measure, Manner, Respect. How far? How? How so?","groups":[{"id":"accusative-overview","name":"The idea","mnemonic":"The fence","expand":"The nominative crowns. The accusative fences."},{"id":"accusative-substantival","name":"Substantival (noun-like) — one object, four twists","mnemonic":"Echo · Two · Sub · Alias","expand":"Direct object, then Echo (cognate), Two (double), Sub (subject of an infinitive), Alias (apposition)"},{"id":"accusative-adverbial","name":"Adverbial (adverb-like) — the MMR shot","mnemonic":"M-M-R","expand":"Measure (how far?) · Manner (how?) · Respect (how so?)"}]},{"id":"genitive","name":"Genitive","subtitle":"The “of” case. The question is always: which kind of “of”?","eli5":"This is the “of” case. Any time you say “the something OF something”, the second one lives here. Your only job is working out which kind of “of” it is.","color":"#7a5cc8","bigIdea":"The genitive describes. The nominative names, the accusative fences, the genitive tells you which kind.","masterMnemonic":"Every genitive is an “of”. Ask which kind.","masterMnemonicWhy":"Four drawers. Seven describe a noun — walk the “of” ladder and stop at the first yes, with Description catching whatever falls off the bottom. Two hide a verb: X does it, or X gets it. Five modify a verb and spell PACTS: Price, Agency, Comparison, Time or place, Separation. Then two oddities: another name, and a direct object that came out genitive.","groups":[{"id":"genitive-adjectival","name":"Adjectival — the “of” ladder","mnemonic":"Whose? Whose kin? From? Made of? Part of? What quality? Or just describing.","expand":"Walk down and stop at the first yes: Possession · Relationship · Source · Material or content · Partitive · Attributive · Description (the catch-all)"},{"id":"genitive-verbal","name":"Verbal — a verb hiding in the noun","mnemonic":"Does it · Gets it","expand":"Subjective (X does it) · Objective (X gets it)"},{"id":"genitive-adverbial","name":"Adverbial — modifies the verb: PACTS","mnemonic":"P-A-C-T-S","expand":"Price · Agency · Comparison · Time or place · Separation"},{"id":"genitive-other","name":"Other — the odd drawer","mnemonic":"Another name · Genitive object","expand":"Apposition · Direct object"}]}],"cards":[{"id":"subject","set":"nominative","group":"nominative-major","name":"Subject","eli5":"Somebody is doing something, and this word is the somebody. “John talks.” Who talks? John. John is it.","formula":{"pattern":["X","verbs"],"filled":["John","bears witness"]},"short":"Subject","tile":"S","oneLine":"The one doing the verb.","mnemonic":"The subject wears the crown.","mnemonicWhy":"The nominative names, and the crown sits on whoever the verb is about. One verb, one nominative — that one is wearing it.","spotIt":"Ask the verb: who or what? That is your subject.","examples":[{"ref":"John 1:15","greek":"*Ἰωάννης* μαρτυρεῖ περὶ αὐτοῦ","english":"*John* bears witness about him","note":"John is nominative and does the witnessing. As plain as it gets."},{"ref":"English drill","greek":null,"english":"*Ivan* came to class.","note":"One verb, one nominative. Nothing tricky."}],"tags":["nominative","major","saturday"]},{"id":"predicate-nominative","set":"nominative","group":"nominative-major","name":"Predicate Nominative","eli5":"Two name tags with “is” in the middle. Think of “is” as a box: the first thing goes inside the second. “The Word was God” puts the Word inside the God-box. It does not squeeze all of God into the Word.","formula":{"pattern":["X","is","Y"],"filled":["the Word","was","God"]},"short":"Pred. nom.","tile":"P","oneLine":"Two nominatives with “is” between them. The second says what the first is.","mnemonic":"The subject is the small circle; the predicate is the big one.","mnemonicWhy":"“Is” looks like an equals sign, but it only points one way. “The Word was God” puts the Word inside God, not God inside the Word. Small circle inside a big one.","spotIt":"Find a form of “to be” — εἰμί, γίνομαι, ὑπάρχω — with a nominative on each side of it.","examples":[{"ref":"John 1:1c","greek":"καὶ *θεὸς* ἦν ὁ λόγος","english":"and the Word was *God*","note":"ὁ λόγος has the article, so it is the subject. θεός is what is said about it."},{"ref":"1 John 4:8","greek":"ὁ θεὸς *ἀγάπη* ἐστίν","english":"God is *love*","note":"ὁ θεός has the article, so it is the subject. Love is what is said about him."},{"ref":"Eph. 2:14","greek":"αὐτὸς γάρ ἐστιν *ἡ εἰρήνη* ἡμῶν","english":"for he himself is *our peace*","note":"αὐτός is a pronoun, so it takes the subject slot. See the pecking order."}],"watchOut":"Apposition looks the same but has no verb. A verb makes a claim. A comma only makes a label.","tags":["nominative","major","john-1-1","saturday"]},{"id":"pecking-order","set":"nominative","group":"nominative-major","name":"The Pecking Order","eli5":"Sometimes two words both look like the doer and you have to pick one. It works like picking teams. A “he” or “she” word gets picked first. If there isn’t one, the word wearing “the” gets picked. If there isn’t one of those either, the name gets picked.","formula":{"ladder":["Is either a pronoun?","Does either have the article?","Is either a proper name?"],"note":"First yes wins. John 1:1c: no pronoun, ὁ λόγος has the article — so it is the subject."},"short":"Pecking order","type":"rule","oneLine":"Two nominatives, one “is”. This is how you tell which one is the subject.","mnemonic":"PAP — ask Papa who is in charge.","mnemonicWhy":"Pronoun, then Article, then Proper name. Papa answers in that order every time.","spotIt":"Go down the list and stop at the first yes.","examples":[{"ref":"John 1:1c","greek":"καὶ θεὸς ἦν *ὁ λόγος*","english":"and the Word was God","note":"No pronoun, so the article decides: ὁ λόγος has it and is the subject, which makes θεός the predicate. Not “a god” — Greek can be perfectly definite with no article."},{"ref":"Eph. 2:14","greek":"*αὐτὸς* γάρ ἐστιν ἡ εἰρήνη ἡμῶν","english":"for *he himself* is our peace","note":"αὐτός is a pronoun, so it wins — even though ἡ εἰρήνη has the article."}],"watchOut":"No article does not mean “a”. A predicate noun sitting in front of the verb normally drops it.","tags":["nominative","major","john-1-1","saturday"]},{"id":"nominative-apposition","set":"nominative","group":"nominative-major","name":"Apposition","eli5":"Same person, two stickers. “Andrew, the brother of Peter.” You didn’t say anything new about Andrew — you just added a second sticker so people know which Andrew. No “is” anywhere.","formula":{"pattern":["X,","Y"],"filled":["Andrew,","the brother of Simon Peter"],"note":"No verb anywhere."},"short":"Apposition (nom.)","tile":"A","oneLine":"Two nominatives side by side, no verb. The second renames the first.","mnemonic":"No verb, just a name tag.","mnemonicWhy":"A sticker slapped on the first word: “Andrew — HELLO MY NAME IS the brother of Simon Peter.” Nothing is claimed; he is just being identified.","spotIt":"Two nominatives, a pause between them, and no “is” anywhere.","examples":[{"ref":"John 1:40","greek":"Ἀνδρέας *ὁ ἀδελφὸς* Σίμωνος Πέτρου","english":"Andrew, *the brother* of Simon Peter","note":"ἀδελφός renames Andrew. Nothing is being claimed about him."},{"ref":"Rom. 1:1","greek":"Παῦλος *δοῦλος* Χριστοῦ Ἰησοῦ","english":"Paul, *a servant* of Christ Jesus","note":"δοῦλος renames Paul."},{"ref":"English drill","greek":null,"english":"Ivan, *the student*, came to class.","note":"A name tag. Compare “Ivan is the student” — that one has a verb, so it is a claim."}],"watchOut":"The only difference from a predicate nominative is the verb. Comma = label. “Is” = claim.","tags":["nominative","major","saturday"]},{"id":"nominative-address","set":"nominative","group":"nominative-other","name":"Nominative of Address","eli5":"You’re calling someone. “Hey, Dad!” You are not talking ABOUT Dad, you are talking TO Dad. That’s the whole thing.","formula":{"pattern":["X,","do it!"],"filled":["Husbands,","love your wives"]},"short":"Address","tile":"A","oneLine":"A nominative used to call out to someone.","mnemonic":"\"Hey, you!\" in a nominative coat.","mnemonicWhy":"He is being spoken to, not described. It looks like a subject and works like a shout.","spotIt":"Try an exclamation mark after it. “Husbands! — love your wives.” If that works, it is address.","examples":[{"ref":"Matt. 9:27","greek":"ἐλέησον ἡμᾶς, *υἱὸς Δαυίδ*","english":"Have mercy on us, *Son of David*","note":"He is being called out to, not described. Nominative shape, vocative job."},{"ref":"Eph. 5:25","greek":"*οἱ ἄνδρες*, ἀγαπᾶτε τὰς γυναῖκας","english":"*Husbands*, love your wives","note":"Not a statement about husbands. A shout at them."}],"watchOut":"A subject is talked about. An address is talked to. Same case, opposite direction.","tags":["nominative","other","saturday"]},{"id":"nominative-appellation","set":"nominative","group":"nominative-other","name":"Nominative of Appellation","eli5":"It’s the name on his badge. Everybody calls him “Teacher”, so “Teacher” turned into his name — the way you call your dad “Dad” instead of his real name.","formula":{"pattern":["they call me","X"],"filled":["you call me","Teacher"],"note":"X stays nominative."},"short":"Appellation","tile":"A","oneLine":"A title used as somebody's name, left in the nominative.","mnemonic":"The title is on the name badge — and badges don't decline.","mnemonicWhy":"Once “Teacher” is what people call him, it stops behaving like a word in a sentence and behaves like the name printed on a badge.","spotIt":"It is a title, it is what someone is called, and it stayed nominative when the sentence wanted an accusative.","examples":[{"ref":"John 13:13","greek":"ὑμεῖς φωνεῖτέ με *ὁ διδάσκαλος* καὶ *ὁ κύριος*","english":"You call me *Teacher* and *Lord*","note":"φωνεῖτέ με wants an accusative after it. The titles stay nominative because they are the name."}],"watchOut":"The easiest of the four. If a nominative is plainly a title-as-name, stop looking for something cleverer.","tags":["nominative","other","saturday"]},{"id":"nominative-absolute","set":"nominative","group":"nominative-other","name":"Nominative Absolute","eli5":"It’s the title on the front of the book. It isn’t part of a sentence. It just sits at the top and announces what’s coming: “The Beginning of the Good News.”","formula":{"pattern":["X","— and nothing"],"filled":["The beginning of the gospel","— no verb at all"]},"short":"Absolute","tile":"A","oneLine":"A nominative attached to nothing — a heading or a greeting.","mnemonic":"Absolute = the headline.","mnemonicWhy":"A headline floats above the page, tied to nothing. No verb, no clause, no rope.","spotIt":"Opening material — a title, a greeting, a list — with no verb to hook it to.","examples":[{"ref":"Mark 1:1","greek":"*Ἀρχὴ* τοῦ εὐαγγελίου Ἰησοῦ Χριστοῦ","english":"*The beginning* of the gospel of Jesus Christ","note":"ἀρχή is nominative and stands completely alone. Everything hanging off it is genitive."},{"ref":"1 Tim. 1:2","greek":"*χάρις ἔλεος εἰρήνη* ἀπὸ θεοῦ πατρός","english":"*Grace, mercy, peace* from God the Father","note":"All nominative, all opening material, all tied to nothing."}],"watchOut":"No rope at all. If a pronoun later picks the word back up, it is hanging, not absolute.","tags":["nominative","other","saturday"]},{"id":"hanging-nominative","set":"nominative","group":"nominative-other","name":"Hanging Nominative","eli5":"You say the thing first, then point back at it. “The good seed? THOSE are the king’s kids.” The pointing word is the string that ties it on.","formula":{"pattern":["X","…","it …"],"filled":["The good seed","—","these are the sons"]},"short":"Hanging","tile":"H","oneLine":"A loose nominative that a pronoun picks up later.","mnemonic":"It hangs by a pronoun.","mnemonicWhy":"The pronoun downstream is the rope. Cut it and the word drops — which is exactly what an absolute never had.","spotIt":"Find the loose nominative, then look ahead for the pronoun standing in its place.","examples":[{"ref":"Matt. 13:38","greek":"τὸ δὲ καλὸν *σπέρμα*, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας","english":"and the good *seed* — these are the sons of the kingdom","note":"σπέρμα is left dangling, but οὗτοι (“these”) does its job in the main clause. That pronoun is the rope."}],"watchOut":"Absolute = no connection. Hanging = connected in sense, but not in grammar.","tags":["nominative","other","saturday"]},{"id":"accusative-idea","set":"accusative","group":"accusative-overview","name":"The Case of Limitation","eli5":"Doing-words would go on forever if nothing stopped them. This builds the fence and says: the action goes THIS far, and stops here.","formula":{"ladder":["Onto whom?  →  direct object","How far?  →  measure","In what way?  →  manner","About what?  →  respect"]},"short":"The idea","type":"rule","oneLine":"The accusative fences the verb in — it says how far the action goes.","mnemonic":"The nominative crowns; the accusative fences.","mnemonicWhy":"Every use is a fence post: onto whom (object), how far (measure), in what way (manner), about what (respect).","spotIt":"Two families. Does it act like a noun, or like an adverb?","examples":[{"ref":"The whole chapter in one line","greek":null,"english":"One object with four twists — Echo, Two, Sub, Alias — then the MMR shot: Measure, Manner, Respect.","note":"Noun-like first, adverb-like second."}],"tags":["accusative","saturday"]},{"id":"direct-object","set":"accusative","group":"accusative-substantival","name":"Direct Object","eli5":"Somebody throws, somebody catches. This is the catcher. “I hit Ivan.” Ivan got hit. Ivan is the catcher.","formula":{"pattern":["verb","whom / what?"],"filled":["I hit","Ivan"]},"short":"Direct object","tile":"DO","oneLine":"What the verb lands on. By far the most common one.","mnemonic":"The verb throws; the object catches.","mnemonicWhy":"Every other noun-like use is a twist on this one throw, so get this one solid first.","spotIt":"After the verb, ask: whom? what?","examples":[{"ref":"English drill","greek":null,"english":"I hit *Ivan*.","note":"Ivan catches the hitting."}],"tags":["accusative","substantival","saturday"]},{"id":"cognate-accusative","set":"accusative","group":"accusative-substantival","name":"Cognate Accusative","eli5":"The word echoes the doing-word. “Sing a song.” “Fight a fight.” You could just have said “sing”, but you said it twice.","formula":{"pattern":["verb","its own noun"],"filled":["fight","the good fight"]},"short":"Cognate","tile":"Echo","oneLine":"An object that repeats the verb — same root, or same idea.","mnemonic":"Echo — the object echoes the verb.","mnemonicWhy":"Twist one of four. Say the verb and hear it come straight back: sing a song, fight a fight, shepherd a flock.","spotIt":"Say the verb and the object out loud. Sounds redundant in English? Cognate.","examples":[{"ref":"1 Tim. 1:18","greek":"στρατεύῃ … *τὴν καλὴν στρατείαν*","english":"fight *the good fight*","note":"The same root twice — the tightest echo there is."},{"ref":"English drill","greek":null,"english":"I shepherd *a flock*.","note":"Not the same root, but the same idea. That counts too."},{"ref":"English drill","greek":null,"english":"I sing *a song*.","note":"The textbook one."}],"watchOut":"Still the direct object. “Cognate” only names the flavour.","tags":["accusative","substantival","saturday"]},{"id":"double-accusative","set":"accusative","group":"accusative-substantival","name":"Double Accusative","eli5":"Two catchers instead of one. Either you ask a person for a thing — “ask Dad for bread” — or you call a thing a name — “he gave his life as a payment”. If “as” fits in the middle, it’s the second kind.","formula":{"ladder":["ask someone something  —  “asks him for bread”","call something a name  —  “gave his life as a ransom”"]},"short":"Double","tile":"Two","oneLine":"Two accusatives in one clause. Two kinds.","mnemonic":"Two — \"ask someone something\" vs \"call someone something\".","mnemonicWhy":"Twist two of four. Two English frames keep them apart: you ASK a person FOR a thing, and you CALL a thing A NAME.","spotIt":"Try slipping “as” between the two. Fits — object + complement. Doesn't — person + thing.","examples":[{"ref":"Matt. 7:9","greek":"ὃν αἰτήσει ὁ υἱὸς *αὐτὸν* *ἄρτον*","english":"if his son asks *him* for *bread*","note":"him (a person) + bread (a thing). You cannot say “asks him as bread”."},{"ref":"Mark 10:45","greek":"δοῦναι *τὴν ψυχὴν* αὐτοῦ *λύτρον* ἀντὶ πολλῶν","english":"to give his *life* as a *ransom* for many","note":"life is the object, ransom says what it was given as. “As” slips right in."}],"tags":["accusative","substantival","saturday"]},{"id":"accusative-subject-infinitive","set":"accusative","group":"accusative-substantival","name":"Accusative Subject of the Infinitive","eli5":"Usually this one is the catcher. Not here. Here it’s the doer — but only because there’s a “to do” word next to it. “I want HIM to go.” He’s the one going.","formula":{"pattern":["for","X","to verb"],"filled":["for","him","to go away"],"note":"X is accusative — and X is the one doing it."},"short":"Subj. of inf.","tile":"Sub","oneLine":"An infinitive's subject is accusative, not nominative.","mnemonic":"Sub — finite verbs pay in nominative, infinitives pay in accusative.","mnemonicWhy":"Twist three of four, and the odd one out — this accusative is doing the action, not catching it.","spotIt":"Find the infinitive, then the accusative that is doing it rather than receiving it.","examples":[{"ref":"Pattern","greek":null,"english":"…for *him* to go away","note":"“Him” is the one going. In Greek that word is accusative."}],"watchOut":"The only accusative you translate as the doer.","tags":["accusative","substantival","saturday"]},{"id":"accusative-apposition","set":"accusative","group":"accusative-substantival","name":"Accusative of Apposition","eli5":"The two-sticker trick again, but now on the catcher. “They picked Stephen, a good man.” Stephen and the good man are one person.","formula":{"pattern":["verb","X,","Y"],"filled":["they chose","Stephen,","a man full of faith"]},"short":"Apposition (acc.)","tile":"Alias","oneLine":"A second accusative that renames the first. No verb between them.","mnemonic":"Alias — the name tag, now on the object.","mnemonicWhy":"Twist four of four. The same name tag as before, now stuck on the object.","spotIt":"Two accusatives, no verb between them, and the second answers “which one, exactly?”","examples":[{"ref":"Acts 6:5","greek":"ἐξελέξαντο Στέφανον, *ἄνδρα* πλήρη πίστεως","english":"they chose Stephen, *a man* full of faith","note":"Stephen is the object; “a man” renames him."},{"ref":"Matt. 2:6","greek":"ποιμανεῖ τὸν λαόν μου *τὸν Ἰσραήλ*","english":"he will shepherd my people, *Israel*","note":"Israel renames “my people”."}],"watchOut":"Not a double accusative. Apposition renames; a complement says something about.","tags":["accusative","substantival","saturday"]},{"id":"accusative-measure","set":"accusative","group":"accusative-adverbial","name":"Accusative of Measure","eli5":"How far, or how long? “He walked a little bit.” The “a little bit” is this one.","formula":{"pattern":["verb","how far?"],"filled":["going","a little farther"]},"short":"Measure","tile":"M","oneLine":"How far, how long, how much.","mnemonic":"MMR, shot one: How far?","mnemonicWhy":"The MMR shot, one of three. This is the one with a tape measure on it.","spotIt":"Ask: how far? how long? Does the accusative answer?","examples":[{"ref":"Mark 14:35","greek":"προελθὼν *μικρὸν*","english":"going *a little* farther","note":"μικρόν measures the distance. It is not the object of anything."}],"tags":["accusative","adverbial","saturday"]},{"id":"accusative-manner","set":"accusative","group":"accusative-adverbial","name":"Accusative of Manner","eli5":"How did you do it? “He gave it for free.” The “for free” is this one.","formula":{"pattern":["verb","how?"],"filled":["justified","freely"]},"short":"Manner","tile":"M","oneLine":"How the action is done.","mnemonic":"MMR, shot two: How?","mnemonicWhy":"The MMR shot, two of three. It turns a noun into an adverb: δωρεάν stops being “a gift” and becomes “freely”.","spotIt":"Ask: how? Check that an -ly word is the natural English.","examples":[{"ref":"Rom. 3:24","greek":"δικαιούμενοι *δωρεὰν* τῇ αὐτοῦ χάριτι","english":"being justified *freely* by his grace","note":"δωρεάν = freely, as a gift. It describes how the justifying happened."}],"tags":["accusative","adverbial","saturday"]},{"id":"accusative-respect","set":"accusative","group":"accusative-adverbial","name":"Accusative of Respect","eli5":"Only one part of you got it. “They were cut in the heart” doesn’t mean somebody used a knife. It means the part that hurt was the heart. Say “as to the” in front and it makes sense.","formula":{"pattern":["verb","as to what?"],"filled":["pierced","as to the heart"]},"short":"Respect","tile":"R","oneLine":"In one way only — put “with respect to” in front of it.","mnemonic":"MMR, shot three: How so? — slot in \"as to\".","mnemonicWhy":"The MMR shot, three of three, and the narrowest fence. The verb happened, but only in one respect, and this names which.","spotIt":"Say it with “with respect to” in front. If that rescues the sense, this is it.","examples":[{"ref":"Acts 2:37","greek":"κατενύγησαν *τὴν καρδίαν*","english":"they were pierced *with respect to the heart*","note":"Not a surgical piercing — an inner one. “With respect to” is what keeps it from sounding like an operation."}],"watchOut":"Easy to mistake for the object. If “with respect to” makes it better, it is respect.","tags":["accusative","adverbial","saturday"]},{"id":"genitive-possession","set":"genitive","group":"genitive-adjectival","name":"Possession","eli5":"It’s his. “The house of Philip” just means “Philip’s house.” If you can say it with an apostrophe-s and it means he owns it, this is the one.","formula":{"pattern":["head noun","of X"],"filled":["the house","of Philip"],"note":"= X’s. Try the apostrophe-s."},"short":"Possession","tile":"Whose","oneLine":"Identifies ownership with regard to the noun it modifies, often employing the use of a possessive pronoun.","mnemonic":"Whose? Try the apostrophe-s.","mnemonicWhy":"“The house of Philip” → “Philip’s house.” If the apostrophe-s works and means he owns it, it is possession.","spotIt":"Rewrite it with ’s. Does it mean he owns the thing?","examples":[{"ref":"Acts 21:8","greek":"καὶ εἰσελθόντες εἰς τὸν οἶκον *Φιλίππου*","english":"we entered the house *of Philip*","note":"Philip’s house. He owns it."}],"watchOut":"Relationship takes an apostrophe-s too — “Zebedee’s son”. Owning a thing is possession; family is relationship.","tags":["genitive","adjectival","quiz"]},{"id":"genitive-relationship","set":"genitive","group":"genitive-adjectival","name":"Relationship","eli5":"It’s family, and Greek left the family word out. “James of Zebedee” means “James, Zebedee’s SON.” Greek expects you to put “son” back in yourself.","formula":{"pattern":["head noun","of X"],"filled":["James","of Zebedee"],"note":"→ James, the SON of Zebedee. The kin word is missing."},"short":"Relationship","tile":"Whose kin","oneLine":"Denotes a family relationship such as a person’s parent or spouse. The word indicating the relationship is often omitted and must be inferred.","mnemonic":"Supply the missing kin word.","mnemonicWhy":"Greek leaves out “son” or “wife” and expects you to know. Ἰάκωβον τὸν τοῦ Ζεβεδαίου is “James the [son] of Zebedee.”","spotIt":"A name in the genitive with no thing to own? Try slotting in “son of” or “wife of”.","examples":[{"ref":"Matt 4:21","greek":"Ἰάκωβον τὸν *τοῦ Ζεβεδαίου*","english":"James the son *of Zebedee*","note":"“Son” is nowhere in the Greek. You supply it."}],"watchOut":"Possession is owning a thing. Relationship is family, with the kin word usually left out.","tags":["genitive","adjectival","quiz"]},{"id":"genitive-source","set":"genitive","group":"genitive-adjectival","name":"Source","eli5":"Where did it come from? “The righteousness of God” came FROM God. Swap “of” for “from” and see if it still sounds right.","formula":{"pattern":["head noun","of X"],"filled":["the righteousness","of God"],"note":"= that comes FROM X."},"short":"Source","tile":"From","oneLine":"Indicates the origin of the head noun (“from”).","mnemonic":"Source = where it came from.","mnemonicWhy":"Swap “of” for “from” and see whether it still works. “The righteousness from God.”","spotIt":"Try “from” in place of “of”. Still makes sense? Source.","examples":[{"ref":"Rom 10:3","greek":"τὴν *τοῦ θεοῦ* δικαιοσύνην","english":"the righteousness *of God*","note":"The righteousness comes from God. Swap in “from” and it still reads."}],"watchOut":"Separation also translates “from”. Source is where a noun came from; separation is what a verb moves away from.","tags":["genitive","adjectival","quiz"]},{"id":"genitive-material","set":"genitive","group":"genitive-adjectival","name":"Material or Content","eli5":"What is it made of, or what’s inside it? “Cargo of gold” is made of gold. “A cup of water” is full of water.","formula":{"pattern":["head noun","of X"],"filled":["a cup","of water"],"note":"= made of X, or full of X."},"short":"Material","tile":"Made of","oneLine":"Indicates the material of which the head term is made or specifies the content of an object or abstract noun.","mnemonic":"Made of it, or full of it.","mnemonicWhy":"Cargo of gold is made of gold. A cup of water is full of water. One case, two flavours.","spotIt":"Ask: made of what? or full of what?","examples":[{"ref":"Rev 18:12","greek":"γόμον *χρυσοῦ*","english":"cargo *of gold*","note":"Material — the cargo is made of gold."},{"ref":"Mark 9:41","greek":"ποτήριον *ὕδατος*","english":"a cup *of water*","note":"Content — the cup is full of water."}],"tags":["genitive","adjectival","quiz"]},{"id":"genitive-partitive","set":"genitive","group":"genitive-adjectival","name":"Partitive","eli5":"The “of” word is the big pile, and the other word is the piece you took. “One of the boats” — the boats are the pile, the one is your piece. It feels backwards: the little word comes first.","formula":{"pattern":["one","of X"],"filled":["one","of the boats"],"note":"The genitive is the WHOLE. The head noun is the part."},"short":"Partitive","tile":"Part of","oneLine":"Whether by itself or in conjunction with the preposition ἀπό or ἐκ, the articular noun in the genitive denotes the whole of which the head noun is a part.","mnemonic":"The genitive is the whole pie. The head noun is your slice.","mnemonicWhy":"Backwards from what you expect: the word in the genitive is the bigger thing, not the smaller one.","spotIt":"Ask: is the genitive word the whole that the other word is a piece of?","examples":[{"ref":"Luke 5:3","greek":"ἓν *τῶν πλοίων*","english":"one *of the boats*","note":"The boats are the whole; the one boat is the part."}],"watchOut":"Often turns up with ἀπό or ἐκ, and the genitive noun carries the article.","tags":["genitive","adjectival","quiz"]},{"id":"genitive-attributive","set":"genitive","group":"genitive-adjectival","name":"Attributive","eli5":"You could have just used a describing word. “The word of his power” really means “his POWERFUL word.” If the “of” word squishes down into a describing word, this is the one.","formula":{"pattern":["head noun","of X"],"filled":["the word","of his power"],"note":"→ his POWERFUL word. X becomes the adjective."},"short":"Attributive","tile":"What quality","oneLine":"Denotes an attribute or innate quality of the head term, conveying an emphatic adjectival idea.","mnemonic":"Turn the genitive into an adjective.","mnemonicWhy":"“The word of his power” → “his powerful word.” If the genitive can become the adjective, and saying it that way is stronger, it is attributive.","spotIt":"Try rewriting the genitive as an adjective in front of the head noun. Does it work?","examples":[{"ref":"Heb 1:3","greek":"τῷ ῥήματι *τῆς δυνάμεως* αὐτοῦ","english":"by his *powerful* word","note":"“Word of power” becomes “powerful word”. That rewrite is the test."}],"watchOut":"Description is the vaguer cousin. Attributive earns its name because the genitive really does become an adjective.","tags":["genitive","adjectival","quiz"]},{"id":"genitive-description","set":"genitive","group":"genitive-adjectival","name":"Description","eli5":"The leftovers bin. It describes the thing, but none of the other boxes fit. “A baptism of repentance” — nobody owns it, it isn’t made of it, it didn’t come from it. It just describes it.","formula":{"pattern":["head noun","of X"],"filled":["a baptism","of repentance"],"note":"Nothing more specific fits."},"short":"Description","tile":"Just describes","oneLine":"Further limits or describes the head noun, but other common genitival categories do not capture the specific nuance.","mnemonic":"The catch-all at the bottom of the ladder.","mnemonicWhy":"Walk the ladder first. When nothing more specific fits, this catches it. A baptism of repentance is not owned by repentance, not made of it — just described by it.","spotIt":"Run the ladder. If no other category fits, it is description.","examples":[{"ref":"Mark 1:4","greek":"βάπτισμα *μετανοίας*","english":"a baptism *of repentance*","note":"Not possessed, not made of, not from. Just described."}],"watchOut":"Do not reach for this first. It is the bottom of the ladder, not the top.","tags":["genitive","adjectival","quiz"]},{"id":"genitive-subjective","set":"genitive","group":"genitive-verbal","name":"Subjective","eli5":"The “of” word is the DOER. “The love of Christ” means Christ is the one doing the loving.","formula":{"pattern":["head noun","of X"],"filled":["the love","of Christ"],"note":"→ Christ loves. X does the action."},"short":"Subjective","tile":"Does it","oneLine":"Functions semantically as the subject of the verbal idea implied in the head noun, producing the action.","mnemonic":"Subject does it.","mnemonicWhy":"Turn the head noun back into a verb. “The love of Christ” → Christ loves. X is the one doing it.","spotIt":"Make the head noun a verb, then ask: is X doing it?","examples":[{"ref":"Rom 8:35","greek":"τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης *τοῦ Χριστοῦ*;","english":"Who can separate us from the love *of Christ*?","note":"Christ is the one loving. Make the noun a verb and X is doing it."}],"tags":["genitive","verbal","quiz"]},{"id":"genitive-objective","set":"genitive","group":"genitive-verbal","name":"Objective","eli5":"The “of” word is the one it’s done TO. “Faith of God” means faith IN God. God is getting the believing, not doing it.","formula":{"pattern":["head noun","of X"],"filled":["faith","in God"],"note":"→ you believe God. X receives the action."},"short":"Objective","tile":"Gets it","oneLine":"Functions semantically as the direct object of the verbal idea implicit in the head noun, receiving the action.","mnemonic":"Object gets it.","mnemonicWhy":"Same move, other direction. “Faith of God” means faith IN God — God is on the receiving end.","spotIt":"Make the head noun a verb, then ask: is X getting it?","examples":[{"ref":"Mark 11:22","greek":"ἔχετε πίστιν *θεοῦ*","english":"Have faith *in God*","note":"God is believed in, not believing. X is receiving the action."}],"watchOut":"Subjective and objective look identical in Greek. Only the sense decides which one it is.","tags":["genitive","verbal","quiz"]},{"id":"genitive-price","set":"genitive","group":"genitive-adverbial","name":"Price","eli5":"How much did it cost? “You were bought with a price.” The price part is this one.","formula":{"pattern":["verb","X (gen.)"],"filled":["bought","with a price"],"note":"for how much?"},"short":"Price","tile":"P","oneLine":"Indicates the price that is paid or the value that attaches to a given item.","mnemonic":"PACTS — P: for how much?","mnemonicWhy":"What it cost, or what it is worth.","spotIt":"Ask: at what price? worth how much?","examples":[{"ref":"1 Cor 6:20 NASB","greek":"ἠγοράσθητε … *τιμῆς*","english":"you have been bought *with a price*","note":"τιμῆς is what was paid."}],"tags":["genitive","adverbial","quiz"]},{"id":"genitive-agency","set":"genitive","group":"genitive-adverbial","name":"Means or Agency","eli5":"Who did it, or what did it? “Blessed by my Father” — a person did it. “Tempted by evil” — a thing did it. Either way it’s “by”.","formula":{"pattern":["verb","X (gen.)"],"filled":["blessed","by my Father"],"note":"by what? by whom?"},"short":"Means/Agency","tile":"A","oneLine":"Conveys the impersonal means or personal agent by which a given action is carried out (“by”).","mnemonic":"PACTS — A: by what? by whom?","mnemonicWhy":"A thing did it (means) or a person did it (agency). Both come out as “by”.","spotIt":"Ask: by what, or by whom? A thing = means. A person = agency.","examples":[{"ref":"Jas 1:13","greek":"ὁ γὰρ θεὸς ἀπείραστός ἐστιν *κακῶν*","english":"Since God is not tempted *by evil*","note":"Means — evil is a thing, not a person."},{"ref":"Matt 25:34","greek":"δεῦτε, οἱ εὐλογημένοι *τοῦ πατρός μου*","english":"Come, you who are blessed *by my Father*","note":"Agency — the Father is a person."}],"tags":["genitive","adverbial","quiz"]},{"id":"genitive-comparison","set":"genitive","group":"genitive-adverbial","name":"Comparison","eli5":"Something is bigger. This is the thing it’s bigger THAN. “God is greater than our heart.” The heart part is this one.","formula":{"pattern":["comparative","X (gen.)"],"filled":["greater","than our heart"],"note":"than what?"},"short":"Comparison","tile":"C","oneLine":"Used to denote comparison in conjunction with a comparative adjective (“than”).","mnemonic":"PACTS — C: than what?","mnemonicWhy":"Find a comparative — greater, better, more — and the genitive beside it is the thing being beaten.","spotIt":"See a comparative adjective? The genitive next to it is the “than”.","examples":[{"ref":"1 John 3:20","greek":"μείζων ἐστὶν ὁ θεὸς *τῆς καρδίας* ἡμῶν","english":"God is greater *than our heart*","note":"μείζων is the comparative; the genitive is what he is greater than."}],"tags":["genitive","adverbial","quiz"]},{"id":"genitive-time-place","set":"genitive","group":"genitive-adverbial","name":"Time or Place","eli5":"When did it happen, or where? “He came at night.” The “at night” is this one.","formula":{"pattern":["verb","X (gen.)"],"filled":["came","at night"],"note":"when? where?"},"short":"Time/Place","tile":"T","oneLine":"Indicates the location in time or space where an action occurs. The focus is on kind or quality.","mnemonic":"PACTS — T: when? where?","mnemonicWhy":"The one with a clock and a map on it. Note the focus is the kind of time, not a point on a clock.","spotIt":"Ask: when did it happen? where did it happen?","examples":[{"ref":"John 19:39","greek":"ὁ ἐλθὼν πρὸς αὐτὸν *νυκτὸς* τὸ πρῶτον","english":"who had previously come to him *at night*","note":"Time — night is the kind of time it happened in."},{"ref":"Matt 1:12 NIV","greek":"μετὰ δὲ τὴν μετοικεσίαν *Βαβυλῶνος*","english":"After the exile *to Babylon*","note":"Place — where the exile went."}],"tags":["genitive","adverbial","quiz"]},{"id":"genitive-separation","set":"genitive","group":"genitive-adverbial","name":"Separation","eli5":"Moving away. “They walked away from the faith.” Whatever you’re moving away from is this one.","formula":{"pattern":["verb","X (gen.)"],"filled":["depart","from the faith"],"note":"away from what?"},"short":"Separation","tile":"S","oneLine":"Indicates motion away from or distance, whether literally or figuratively (“from”).","mnemonic":"PACTS — S: away from what?","mnemonicWhy":"Movement away, real or figurative — walking away from a place, or away from the faith.","spotIt":"Ask: away from what? Does “from” fit?","examples":[{"ref":"1 Tim 4:1","greek":"ἀποστήσονταί τινες *τῆς πίστεως*","english":"some will depart *from the faith*","note":"Movement away from — figurative, but still away."}],"watchOut":"Source also translates “from”. Separation moves away from something; source is where a noun came from.","tags":["genitive","adverbial","quiz"]},{"id":"genitive-apposition","set":"genitive","group":"genitive-other","name":"Apposition","eli5":"The two-sticker trick, third time now. “Jeremiah the prophet.” One man, two names.","formula":{"pattern":["head noun,","X (gen.)"],"filled":["Jeremiah","the prophet"],"note":"X is another name for the head noun."},"short":"Apposition (gen.)","tile":"Another name","oneLine":"The genitive of apposition provides an alternate designation (simple) of a genitive head noun or provides an explanatory (epexegetical) restatement of a head noun in any case.","mnemonic":"The name tag again — third case running.","mnemonicWhy":"You have met this in the nominative and the accusative. Same move: the second word renames the first.","spotIt":"Ask: is the genitive another name for the head noun? “Jeremiah, who is the prophet.” “The gift, which is the Holy Spirit.”","examples":[{"ref":"Matt 2:17","greek":"διὰ Ἰερεμίου *τοῦ προφήτου*","english":"through Jeremiah *the prophet*","note":"Simple — the head noun Ἰερεμίου is itself genitive."},{"ref":"Acts 2:38","greek":"τὴν δωρεὰν *τοῦ ἁγίου πνεύματος*","english":"the gift *of the Holy Spirit*","note":"Epexegetical — the gift IS the Spirit. The head noun here is accusative."}],"watchOut":"Simple: the head noun is genitive too. Epexegetical: the head noun can be any case.","tags":["genitive","other","quiz"]},{"id":"genitive-direct-object","set":"genitive","group":"genitive-other","name":"Direct Object","eli5":"Some doing-words are just picky. Most of them want their catcher dressed the usual way, but a few — hearing, wanting, sharing, bossing, leaving — want it dressed like this instead. It isn’t about meaning. It’s just what those words like.","formula":{"pattern":["certain verbs","X (gen.)"],"filled":["you did not lack","anything"],"note":"The verb wanted a genitive, not an accusative."},"short":"Direct object (gen.)","tile":"Genitive DO","oneLine":"Verbs of sensation, emotion or volition, sharing, ruling, or separation take their direct object in the genitive case (instead of the accusative case).","mnemonic":"Feel it, want it, share it, rule it, leave it.","mnemonicWhy":"Six kinds of verb do this: sensation and emotion (feel it), volition (want it), sharing, ruling, separation (leave it). It is a habit of the verb, not a meaning.","spotIt":"A genitive sitting where you expected an accusative? Check the verb: sensing, feeling, wanting, sharing, ruling, separating?","examples":[{"ref":"Luke 22:35 NASB","greek":"μή *τινος* ὑστερήσατε","english":"you did not lack *anything*, did you?","note":"ὑστερέω takes its object in the genitive."},{"ref":"John 5:25","greek":"οἱ νεκροὶ ἀκούσουσιν *τῆς φωνῆς* τοῦ υἱοῦ τοῦ θεοῦ","english":"the dead will hear *the voice* of the Son of God","note":"Sensation — hearing. Feel it."},{"ref":"Acts 20:33","greek":"*ἀργυρίου* ἢ *χρυσίου* ἢ *ἱματισμοῦ* οὐδενὸς ἐπεθύμησα","english":"I have not coveted anyone’s *silver* or *gold* or *clothing*","note":"Emotion and volition — coveting. Want it."},{"ref":"1 Cor 10:21","greek":"οὐ δύνασθε *τραπέζης* κυρίου μετέχειν","english":"You cannot share in the Lord’s *table*","note":"Sharing. Share it."},{"ref":"Rom 6:14","greek":"ἁμαρτία γὰρ *ὑμῶν* οὐ κυριεύσει","english":"For sin will not rule over *you*","note":"Ruling. Rule it."}],"watchOut":"This one follows a VERB. The objective genitive follows a NOUN.","tags":["genitive","other","quiz"]}],"confusions":[{"id":"pn-vs-apposition","pair":["predicate-nominative","nominative-apposition"],"question":"Predicate nominative or apposition?","test":"Is there a verb?","answer":"Verb ⇒ predicate nominative, a claim. Comma only ⇒ apposition, a label.","example":"“Ivan is the student” (claim) vs “Ivan, the student, came to class” (label)."},{"id":"absolute-vs-hanging","pair":["nominative-absolute","hanging-nominative"],"question":"Absolute or hanging?","test":"Does a pronoun later in the sentence pick the word back up?","answer":"No rope ⇒ absolute. Hangs by a pronoun ⇒ hanging.","example":"Mark 1:1 “The beginning of the gospel…” (a headline) vs Matt. 13:38 “the good seed — THESE are the sons…” (a rope)."},{"id":"address-vs-subject","pair":["nominative-address","subject"],"question":"Address or subject?","test":"Talked about, or talked to?","answer":"About ⇒ subject. To ⇒ address, however much it looks like a subject.","example":"“Husbands love their wives” (subject) vs “Husbands, love your wives” (address)."},{"id":"which-nominative-is-subject","pair":["pecking-order","predicate-nominative"],"question":"Two nominatives, one verb — which is the subject?","test":"Run PAP: pronoun, then article, then proper name.","answer":"First yes wins. In John 1:1c ὁ λόγος has the article, so it is the subject and θεός is the predicate — definite, not “a god”.","example":"καὶ θεὸς ἦν ὁ λόγος."},{"id":"cognate-vs-plain-object","pair":["cognate-accusative","direct-object"],"question":"Cognate or plain direct object?","test":"Does the object echo the verb — same root, or same idea?","answer":"Echo ⇒ cognate. No echo ⇒ just the object. Either way it is still the object.","example":"“Fight the good fight” (echo) vs “I hit Ivan” (no echo)."},{"id":"double-which-kind","pair":["double-accusative","accusative-apposition"],"question":"Two accusatives — which arrangement?","test":"Can you slip “as” between them?","answer":"“As” fits ⇒ object + complement. It doesn't and one is a person ⇒ person + thing. No verb and the second just renames the first ⇒ apposition.","example":"“gave his life AS a ransom” · “asks him for bread” · “chose Stephen, a man full of faith”."},{"id":"respect-vs-object","pair":["accusative-respect","direct-object"],"question":"Accusative of respect or direct object?","test":"Put “with respect to” in front of it.","answer":"Better ⇒ respect. Worse ⇒ direct object.","example":"“pierced WITH RESPECT TO the heart” — better. “I hit WITH RESPECT TO Ivan” — worse."},{"id":"subjective-vs-objective","pair":["genitive-subjective","genitive-objective"],"question":"Subjective or objective?","test":"Turn the head noun into a verb. Is X doing it, or getting it?","answer":"Doing it ⇒ subjective. Getting it ⇒ objective.","example":"“the love of Christ” — Christ loving (subjective) or Christ being loved (objective). The Greek is identical either way."},{"id":"source-vs-separation","pair":["genitive-source","genitive-separation"],"question":"Source or separation? Both say “from”.","test":"Is the “from” attached to a noun or to a verb?","answer":"Where a noun came from ⇒ source. What a verb moves away from ⇒ separation.","example":"“the righteousness from God” (source) vs “depart from the faith” (separation)."},{"id":"gendo-vs-objective","pair":["genitive-direct-object","genitive-objective"],"question":"Genitive direct object or objective genitive?","test":"What is the genitive hanging off — a verb or a noun?","answer":"Off a verb ⇒ genitive direct object. Off a noun ⇒ objective genitive.","example":"“you did not lack anything” (verb) vs “faith in God” (noun)."},{"id":"partitive-whole-or-part","pair":["genitive-partitive","genitive-material"],"question":"Partitive or material/content?","test":"Is the genitive the whole the head noun is a slice of, or the stuff the head noun is made of?","answer":"Whole ⇒ partitive. Stuff ⇒ material or content.","example":"“one of the boats” (a slice of the fleet) vs “a cup of water” (what fills the cup)."},{"id":"possession-vs-relationship","pair":["genitive-possession","genitive-relationship"],"question":"Possession or relationship?","test":"Is the genitive owning a thing, or being kin to a person?","answer":"Owns a thing ⇒ possession. Family, with “son of” or “wife of” left out ⇒ relationship.","example":"“the house of Philip” (owns it) vs “James the [son] of Zebedee” (kin)."},{"id":"attributive-vs-description","pair":["genitive-attributive","genitive-description"],"question":"Attributive or description?","test":"Can the genitive be rewritten as an adjective?","answer":"Becomes a real adjective ⇒ attributive. Nothing more specific fits ⇒ description, the catch-all.","example":"“the word of his power” → “his powerful word” (attributive) vs “a baptism of repentance” (description)."}],"extraQuiz":[{"prompt":"\"Grace, mercy, peace from God our Father\" (1 Tim. 1:2) — all nominative, no verb, opening a letter.","answer":"nominative-absolute","why":"Opening material, tied to nothing. A headline, not a rope."},{"prompt":"\"You call me Teacher and Lord\" (John 13:13) — the titles are nominative where you expected accusative.","answer":"nominative-appellation","why":"A title being used as the name people call him. Badges don't decline."},{"prompt":"\"Son of David, have mercy on us\" (Matt. 9:27).","answer":"nominative-address","why":"He is being called out to, not described."},{"prompt":"\"Paul, a servant of Christ Jesus\" (Rom. 1:1) — two nominatives, no verb.","answer":"nominative-apposition","why":"δοῦλος renames Παῦλος. No verb, so no claim — just a label."},{"prompt":"\"He is our peace\" (Eph. 2:14).","answer":"predicate-nominative","why":"A verb with a nominative each side. αὐτός is a pronoun, so it is the subject; ἡ εἰρήνη is what is said about him."},{"prompt":"\"The good seed — these are the sons of the kingdom\" (Matt. 13:38).","answer":"hanging-nominative","why":"σπέρμα is left dangling, but οὗτοι picks it up. Hanging by a pronoun."},{"prompt":"\"Fight the good fight\" (1 Tim. 1:18).","answer":"cognate-accusative","why":"The object echoes the verb — the same root, even."},{"prompt":"\"He gave his life as a ransom for many\" (Mark 10:45).","answer":"double-accusative","why":"Two accusatives, and “as” slips between them: object + complement."},{"prompt":"\"They were cut to the heart\" (Acts 2:37) — an inner wound, not a surgical one.","answer":"accusative-respect","why":"Put “with respect to” in front and the sense improves."},{"prompt":"\"Going a little farther, he fell on the ground\" (Mark 14:35).","answer":"accusative-measure","why":"μικρόν answers “how far?” — MMR, one of three."},{"prompt":"\"Being justified freely by his grace\" (Rom. 3:24).","answer":"accusative-manner","why":"δωρεάν answers “how?” — MMR, two of three."},{"prompt":"\"They chose Stephen, a man full of faith\" (Acts 6:5).","answer":"accusative-apposition","why":"ἄνδρα renames the object. Alias."},{"prompt":"An infinitive's subject — the one performing the infinitive's action.","answer":"accusative-subject-infinitive","why":"Finite verbs take a nominative subject. Infinitives take an accusative one."},{"prompt":"\"and the Word was God\" (John 1:1c) — which use is θεός?","answer":"predicate-nominative","why":"ὁ λόγος has the article and wins the pecking order, so θεός is the predicate. No article, and still definite."},{"prompt":"ἐμβὰς δὲ εἰς ἓν τῶν πλοίων (Luke 5:3) — the underlined τῶν πλοίων.","answer":"genitive-partitive","why":"The boats are the whole; the one boat is the slice. Book practice exercise 2."},{"prompt":"μνημονεύετε τῆς γυναικὸς Λώτ (Luke 17:32) — the underlined τῆς γυναικός.","answer":"genitive-direct-object","why":"μνημονεύω is a verb of memory — sensation — so it takes its object in the genitive. Book practice exercise 3."},{"prompt":"ὁ δὲ μικρότερος … μείζων αὐτοῦ ἐστιν (Matt 11:11) — the underlined αὐτοῦ.","answer":"genitive-comparison","why":"μείζων is a comparative, so the genitive beside it is the “than”. Book practice exercise 1, second underline."},{"prompt":"καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου (Acts 1:13) — the underlined Ἰακώβου.","answer":"genitive-relationship","why":"“Judas [son] of James.” The kin word is left out for you to supply. Book practice exercise 4."}]};
/**
 * Greek Cases — mnemonics and drills for Going Deeper with NT Greek, ch. 2.
 *
 * Deliberately one file. The sibling app (seminary-homework-2026) learned the
 * hard way that a module graph behind a service worker can serve a fresh page
 * beside stale code; one file means one cache key, so `?v=vN` invalidates the
 * whole app at once and there is nothing to bundle.
 */

const BUILD = 'v7 · 2026-08-27';

// Where the "back to homework" link points. The seminary app links here; this
// links back, so the two feel like two rooms rather than two buildings.
const HOMEWORK_APP = 'https://claudekovalenko.github.io/seminary-homework-2026/';

// What you said you wanted these learned by. Editable under Progress.
const DEFAULT_TARGET = '2026-08-29';

const KEY = 'gdgc.v1';
const BOXES = 5; // Leitner boxes; box 4 and up counts as learned.
const LEARNED_AT = 4;

let DATA = null;
let route = parseRoute(location.hash);

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/** Escape, then turn the data files' *asterisk markers* into highlights. */
const mk = (s) => esc(s).replace(/\*([^*]+)\*/g, '<mark>$1</mark>');

/** The same text with the markers simply removed — for quiz prompts. */
const plain = (s) => String(s ?? '').replace(/\*/g, '');

/* ---------------- storage ---------------- */

const blank = () => ({
  cards: {}, // id -> { box, seen, right, wrong, last }
  spot: { asked: 0, right: 0, best: 0, streak: 0 },
  target: DEFAULT_TARGET,
  // Which set the Learn/Drill/Spot views were last filtered to, so the app
  // reopens where you left it rather than at the top every time.
  filter: 'all',
  // Set once you have waved away the "add it to your home screen" card. The
  // one in Settings is permanent; this only silences the one on the Map.
  installDismissed: false,
  // Quiz prep: the exam is on the Greek, so you can put the gloss away.
  hideEnglish: false
});

let state = load();

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    return raw ? { ...blank(), ...raw, spot: { ...blank().spot, ...(raw.spot || {}) } } : blank();
  } catch {
    return blank();
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    /* private mode, a full quota — the app still works, it just forgets. */
  }
}

function progressOf(id) {
  return state.cards[id] || { box: 0, seen: 0, right: 0, wrong: 0, last: null };
}

/** Right answer: up a box. Wrong: all the way back to box 1, which is the point. */
function grade(id, correct) {
  const p = { ...progressOf(id) };
  p.seen += 1;
  p.last = Date.now();
  if (correct) {
    p.right += 1;
    p.box = Math.min(BOXES, Math.max(1, p.box) + 1);
  } else {
    p.wrong += 1;
    p.box = 1;
  }
  state.cards[id] = p;
  save();
}

const isLearned = (id) => progressOf(id).box >= LEARNED_AT;

/* ---------------- the target date ---------------- */

function parseDay(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysToTarget() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((parseDay(state.target) - today) / 86400000);
}

function targetLabel() {
  const n = daysToTarget();
  if (n > 1) return `${n} days left`;
  if (n === 1) return 'tomorrow';
  if (n === 0) return 'today';
  return 'target passed';
}

/* ---------------- data helpers ---------------- */

const cardById = (id) => DATA.cards.find((c) => c.id === id);
const setById = (id) => DATA.sets.find((s) => s.id === id);
const groupById = (id) => DATA.sets.flatMap((s) => s.groups).find((g) => g.id === id);
const setColor = (id) => setById(id)?.color || 'var(--accent)';

/** The cards a view is currently working with, honouring set or tag filters. */
function selection(filter = state.filter) {
  if (!filter || filter === 'all') return DATA.cards;
  if (filter.startsWith('tag:')) {
    const tag = filter.slice(4);
    return DATA.cards.filter((c) => (c.tags || []).includes(tag));
  }
  return DATA.cards.filter((c) => c.set === filter);
}

function filterLabel(filter = state.filter) {
  if (!filter || filter === 'all') return 'Everything';
  if (filter.startsWith('tag:')) return `#${filter.slice(4)}`;
  return setById(filter)?.name || filter;
}

/* ---------------- routing ---------------- */

/**
 * `#/learn/nominative`, `#/card/predicate-nominative`, `#/tag/saturday`.
 * Bare `#learn` works too, so a hand-typed or older link still lands somewhere.
 */
function parseRoute(hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [name = 'map', arg = null] = raw.split('/');
  return { name: name || 'map', arg: arg || null };
}

const VIEW_NAMES = new Set(['map', 'learn', 'drill', 'spot', 'progress', 'card', 'tag', 'confusions']);

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

/**
 * A link in from the homework app may carry `?from=<url>`, and we send the user
 * back there rather than guessing. Anything that is not an http(s) URL is
 * ignored — a hash parameter is attacker-supplied by definition.
 */
function returnLink() {
  const from = new URLSearchParams(location.search).get('from');
  if (!from) return HOMEWORK_APP;
  try {
    const url = new URL(from, location.href);
    return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : HOMEWORK_APP;
  } catch {
    return HOMEWORK_APP;
  }
}

const backRow = () => `
  <a class="backlink" href="${esc(returnLink())}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
    Back to Seminary Homework
  </a>`;

/* ---------------- installing it ---------------- */

// Chrome hands us the install prompt instead of showing its own, so we hold on
// to it and put it behind a button. Safari never fires this and has no API for
// it at all — there, all we can do is say where the button is.
let installPrompt = null;
let swReady = false;

const standalone = () =>
  matchMedia('(display-mode: standalone)').matches ||
  matchMedia('(display-mode: minimal-ui)').matches ||
  navigator.standalone === true;

const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  render();
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  render();
});

const ICON_SHARE = `<svg viewBox="0 0 24 24" aria-hidden="true" class="inline-icon"><path d="M12 15V4"/><path d="M8.5 7.5 12 4l3.5 3.5"/><path d="M6 12H4v8h16v-8h-2"/></svg>`;
const ICON_PLUS = `<svg viewBox="0 0 24 24" aria-hidden="true" class="inline-icon"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 9v6M9 12h6"/></svg>`;

/**
 * How to get this onto a home screen, in whichever of the three situations you
 * are actually in. `dismissible` is the copy that lives on the Map and can be
 * waved away; Settings keeps a permanent one.
 */
function installCard({ dismissible = false } = {}) {
  if (dismissible && (state.installDismissed || standalone())) return '';

  const offline = location.protocol === 'file:';

  const body = offline
    ? `<p class="note">This is the single-file copy, opened straight off the disk. It works with no network at all, but a
         browser will not install a <code>file://</code> page to a home screen — for that, open the hosted address instead.</p>`
    : standalone()
      ? `<p class="note">Installed — you are running it from your home screen. It works with no network, and the drill,
           the cards and your progress are all on the device.</p>`
      : installPrompt
        ? `<p class="note">Add it to your home screen and it opens full-screen, with no browser chrome, and works offline.</p>
           <div class="btnrow"><button class="btn primary wide" data-action="install">${ICON_PLUS} Install</button></div>`
        : isIos()
          ? `<p class="note">On iPhone and iPad, Safari puts this behind the Share button:</p>
             <ol class="steps">
               <li>Tap ${ICON_SHARE} <strong>Share</strong> at the bottom of Safari.</li>
               <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
               <li>Tap <strong>Add</strong>.</li>
             </ol>
             <p class="note">It has to be Safari — Chrome on iOS cannot install a web app. Once it is on the home screen it
                opens full-screen and works with no signal.</p>`
          : `<p class="note">Your browser will offer <strong>Install app</strong> in its menu once it has seen the page a
               couple of times — in Chrome it is the ⋮ menu, or an icon in the address bar. Installed, it opens full-screen
               and works offline.</p>`;

  return `
    <section class="card">
      <h2>
        ${standalone() ? 'On your home screen' : 'Put it on your home screen'}
        ${dismissible ? `<button class="btn small ghost dismiss" data-action="dismiss-install" aria-label="Dismiss">✕</button>` : ''}
      </h2>
      ${body}
      ${
        offline
          ? ''
          : `<p class="note ${swReady ? 'ready' : ''}">${
              swReady ? 'Ready to use offline — the whole app is cached on this device.' : 'Caching for offline use…'
            }</p>`
      }
    </section>`;
}

/* ---------------- shared bits ---------------- */

const dot = (color) => `<span class="dot" style="background:${esc(color)}"></span>`;

function pips(box) {
  return `<span class="box-pips">${Array.from({ length: BOXES }, (_, i) => `<span class="pip ${i < box ? 'on' : ''}"></span>`).join(
    ''
  )}</span>`;
}

function bar(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return `<div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;
}

/** The set / tag chips that every drilling view shares. */
function filterChips(base) {
  const opts = [
    { id: 'all', label: 'Everything' },
    ...DATA.sets.map((s) => ({ id: s.id, label: s.name }))
  ];
  return `<div class="chips">${opts
    .map(
      (o) =>
        `<button class="chip ${state.filter === o.id ? 'on' : ''}" data-action="filter" data-filter="${esc(o.id)}" data-base="${esc(
          base
        )}">${esc(o.label)}</button>`
    )
    .join('')}</div>`;
}

/* ---------------- view: map ---------------- */

/** The acrostic, split into one tappable tile per letter. */
function acroTiles(set) {
  const cards = DATA.cards.filter((c) => c.set === set.id && c.type !== 'rule');
  return set.groups
    .map((g) => {
      const mine = cards.filter((c) => c.group === g.id);
      if (!mine.length) return '';
      return `
        <div>
          <h3>${esc(g.name)}</h3>
          ${g.mnemonic ? `<p class="group-hook">${esc(g.mnemonic)}</p>` : ''}
          <div class="acro">
            ${mine
              .map(
                (c) => `
              <button class="acro-item" data-action="open-card" data-card="${esc(c.id)}"
                      style="border-left-color:${esc(set.color)}">
                <span class="acro-letter">${esc(c.tile || c.short.slice(0, 1))}</span>
                <span class="acro-word">${esc(c.short)}</span>
              </button>`
              )
              .join('')}
          </div>
        </div>`;
    })
    .join('');
}

function viewMap() {
  const learned = DATA.cards.filter((c) => isLearned(c.id)).length;

  return `
    <section class="hero">
      <div class="hero-line">The whole chapter in two sentences</div>
      <div class="hero-mnemonic">Go to the SPA, say AAAH.</div>
      <div class="hero-sub">One object with four twists, then the MMR shot.</div>
      ${bar(learned, DATA.cards.length)}
      <div class="hero-sub">${learned} of ${DATA.cards.length} learned · ${esc(targetLabel())}</div>
      <div class="btnrow split">
        <button class="btn primary" data-action="goto" data-to="#/drill">Drill</button>
        <button class="btn" data-action="goto" data-to="#/spot">Spot it</button>
      </div>
    </section>

    ${DATA.sets
      .map(
        (set) => `
      <section class="card" style="--accent:${esc(set.color)}">
        <div class="set-head">
          <h2>${dot(set.color)}${esc(set.name)}</h2>
          <span class="muted" style="font-size:12px">${DATA.cards.filter((c) => c.set === set.id && isLearned(c.id)).length}/${
            DATA.cards.filter((c) => c.set === set.id).length
          }</span>
        </div>
        <p class="set-sub">${esc(set.subtitle)}</p>
        ${eli5Block(set.eli5)}
        <div class="hook" style="border-left-color:${esc(set.color)}">
          <div class="hook-line">${esc(set.masterMnemonic)}</div>
          <div class="hook-why">${esc(set.masterMnemonicWhy)}</div>
        </div>
        <p class="bigidea">${esc(set.bigIdea)}</p>
        ${acroTiles(set)}
        <div class="btnrow">
          <button class="btn small" data-action="goto" data-to="#/learn/${esc(set.id)}">Read the cards</button>
          <button class="btn small" data-action="goto" data-to="#/drill/${esc(set.id)}">Drill this set</button>
        </div>
      </section>`
      )
      .join('')}

    <section class="card">
      <h2>The pairs that get missed</h2>
      <p class="note" style="margin-top:0">Nearly every wrong answer is one of these seven. Each one comes down to a single test.</p>
      ${DATA.confusions.map(confusionRow).join('')}
    </section>

    ${installCard({ dismissible: true })}

    <section class="card">${backRow()}</section>`;
}

function confusionRow(c) {
  return `
    <div class="confusion">
      <div class="confusion-q">${esc(c.question)}</div>
      <div class="confusion-test"><b>Test:</b> ${esc(c.test)}</div>
      <div class="confusion-test">${esc(c.answer)}</div>
      <div class="confusion-ex">${esc(c.example)}</div>
    </div>`;
}

/**
 * The plain-words version, in front of everything else. Whatever else a card
