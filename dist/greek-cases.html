    <style>
/* Deliberately a sibling of the seminary-homework-2026 stylesheet: same palette,
   same card/tabbar furniture. Tapping through from one app to the other should
   feel like moving between rooms, not between buildings. */

:root {
  --bg: #0e1016;
  --bg-elev: #171a23;
  --bg-elev-2: #1e222d;
  --line: #272c39;
  --text: #e8eaf2;
  --muted: #9aa1b5;
  --accent: #7b8cff;
  --accent-soft: #2a3160;
  --warn: #efb057;
  --danger: #f0736a;
  --ok: #4fbf8b;
  --nom: #1f9d78;
  --acc: #c8642a;
  --radius: 14px;
  --tabbar: 62px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f9;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0f2f7;
    --line: #e0e3ec;
    --text: #191c25;
    --muted: #6b7285;
    --accent: #4d5fe0;
    --accent-soft: #e4e7ff;
    --nom: #12775a;
    --acc: #a24c1b;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 17px;
  font-weight: 700;
}

.brand strong {
  display: block;
  font-size: 15px;
  letter-spacing: 0.2px;
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

/* The countdown to the day you said you wanted this learned by. */
.brand-right {
  text-align: right;
  font-size: 11px;
  line-height: 1.25;
  color: var(--muted);
}

.brand-right strong {
  display: block;
  font-size: 13px;
  color: var(--text);
}

.brand-right.is-due strong {
  color: var(--warn);
}

/* ---------- layout ---------- */

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}

.card h2 {
  margin: 0 0 10px;
  font-size: 14px;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card h3 {
  margin: 14px 0 8px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.note {
  color: var(--muted);
  font-size: 13px;
  margin: 8px 0 0;
}

.empty {
  color: var(--muted);
  font-size: 13px;
}

.muted {
  color: var(--muted);
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: baseline;
}

/* ---------- buttons ---------- */

.btn {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 13px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.btn:active {
  transform: translateY(1px);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn.small {
  padding: 6px 10px;
  font-size: 12px;
}

.btn.wide {
  width: 100%;
}

.btn.good {
  border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
  color: var(--ok);
}

.btn.bad {
  border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
  color: var(--danger);
}

.btnrow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.btnrow.split > * {
  flex: 1 1 0;
}

/* ---------- the map ---------- */

.hero {
  background: linear-gradient(160deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
  text-align: center;
}

.hero-line {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.hero-mnemonic {
  font-size: 25px;
  font-weight: 700;
  margin: 6px 0 4px;
  letter-spacing: 0.2px;
}

.hero-sub {
  color: var(--muted);
  font-size: 13px;
}

.acro {
  display: grid;
  /* Wider than it was: a tile now carries a letter, a name and a gist. */
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.acro-item {
  /* A tile is only ~76px wide on a small phone, and names like
     "Apollonius's Canon" are longer than that. break-word splits a word only
     when it cannot fit a line by itself — `anywhere` also shrinks the column's
     min-content, which had the grid hyphenating "Possessio/n" for no reason. */
  overflow-wrap: break-word;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 9px 10px;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.acro-letter {
  display: block;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.1;
}

.acro-word {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.set-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}

.set-head h2 {
  margin: 0;
  font-size: 16px;
  text-transform: none;
}

.set-sub {
  color: var(--muted);
  font-size: 12.5px;
  margin: 0 0 10px;
}

.bigidea {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13.5px;
  margin: 10px 0 0;
}

.mnemonic-line {
  font-size: 17px;
  font-weight: 650;
  margin: 2px 0 6px;
}

.mnemonic-why {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
}

/* ---------- cards (Learn) ---------- */

.concept {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-elev);
  overflow: hidden;
}

.concept + .concept {
  margin-top: 8px;
}

.concept > summary {
  list-style: none;
  cursor: pointer;
  padding: 11px 13px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.concept > summary::-webkit-details-marker {
  display: none;
}

.concept-name {
  font-weight: 620;
  flex: 1;
}

.concept-hook {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}

.concept-body {
  padding: 0 13px 13px;
  border-top: 1px solid var(--line);
}

.concept-body > * {
  margin-top: 11px;
}

.label {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}

.hook {
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-elev-2));
  border-left: 3px solid var(--accent);
  border-radius: 0 9px 9px 0;
  padding: 9px 11px;
}

.hook-line {
  font-size: 15.5px;
  font-weight: 650;
}

.hook-why {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.spot {
  background: var(--bg-elev-2);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13.5px;
}

.watch {
  border: 1px dashed color-mix(in srgb, var(--warn) 50%, var(--line));
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;
  color: color-mix(in srgb, var(--warn) 75%, var(--text));
}

.ex {
  border-top: 1px solid var(--line);
  padding-top: 9px;
}

.ex + .ex {
  margin-top: 9px;
}

.ex-ref {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.greek {
  font-family: 'Gentium Plus', 'SBL Greek', 'Palatino Linotype', Palatino, Georgia, serif;
  font-size: 17px;
  line-height: 1.5;
  margin: 3px 0;
}

.ex-en {
  font-size: 13.5px;
}

.ex-note {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
}

mark {
  background: color-mix(in srgb, var(--accent) 28%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 2px;
}

/* ---------- filters ---------- */

.chips {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.chip {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 11px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

.chip.on {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  color: var(--accent);
}

/* ---------- drill ---------- */

.flash {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  text-align: center;
  padding: 22px 16px;
}

.flash-prompt-label {
  font-size: 11px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
}

.flash-prompt {
  font-size: 21px;
  font-weight: 650;
  line-height: 1.35;
}

.flash-prompt.is-small {
  font-size: 16.5px;
  font-weight: 500;
}

.flash-answer {
  border-top: 1px solid var(--line);
  padding-top: 13px;
  text-align: left;
}

.flash-answer .name {
  font-size: 18px;
  font-weight: 650;
}

.flash-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--muted);
}

.box-pips {
  display: inline-flex;
  gap: 3px;
  vertical-align: middle;
}

.pip {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--line);
}

.pip.on {
  background: var(--ok);
}

/* ---------- spot it ---------- */

.q-prompt {
  font-size: 16px;
  line-height: 1.45;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 13px;
}

.option {
  text-align: left;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}

.option.correct {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 16%, var(--bg-elev-2));
}

.option.wrong {
  border-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 14%, var(--bg-elev-2));
}

.option:disabled {
  cursor: default;
  opacity: 0.85;
}

.option.correct:disabled,
.option.wrong:disabled {
  opacity: 1;
}

.verdict {
  margin-top: 12px;
  font-size: 13.5px;
}

.verdict .why {
  color: var(--muted);
  margin-top: 4px;
}

.score {
  font-variant-numeric: tabular-nums;
}

/* ---------- progress ---------- */

.bar {
  height: 7px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0 4px;
}

.bar-fill {
  height: 100%;
  background: var(--ok);
  border-radius: 999px;
  transition: width 0.25s ease;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.stats > div {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stat {
  display: block;
  font-size: 21px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.stats small {
  color: var(--muted);
  font-size: 11px;
}

.mastery {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.mastery:last-child {
  border-bottom: 0;
}

.mastery-name {
  flex: 1;
  font-size: 13.5px;
}

/* ---------- confusion pairs ---------- */

.confusion {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
}

.confusion + .confusion {
  margin-top: 8px;
}

.confusion-q {
  font-weight: 620;
  font-size: 14px;
}

.confusion-test {
  font-size: 13px;
  margin-top: 5px;
}

.confusion-test b {
  color: var(--accent);
}

.confusion-ex {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 5px;
}

/* ---------- back link to the homework app ---------- */

.backlink {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--accent);
  text-decoration: none;
}

.backlink svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- tab bar ---------- */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: grid;
  /* Six tabs now. auto-fit keeps them even without hard-coding the count. */
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

.tab {
  background: none;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 10.5px;
  padding: 8px 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}

.tab svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab.on {
  color: var(--accent);
}

/* ---------- installing it ---------- */

.card h2 .dismiss {
  margin-left: auto;
  padding: 3px 8px;
  line-height: 1;
}

.btn.ghost {
  background: none;
  color: var(--muted);
}

.inline-icon {
  width: 15px;
  height: 15px;
  vertical-align: -2px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.btn .inline-icon {
  vertical-align: -3px;
  margin-right: 5px;
}

.steps {
  margin: 10px 0 0;
  padding-left: 20px;
  font-size: 13.5px;
  color: var(--text);
}

.steps li + li {
  margin-top: 6px;
}

.note.ready {
  color: var(--ok);
}

code {
  background: var(--bg-elev-2);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 12.5px;
}

/* ---------- the formula block ----------
   The bare shape of the construction, before a word of prose. */

.formula {
  background: var(--bg-elev-2);
  border-radius: 11px;
  padding: 14px 12px 12px;
  margin-top: 11px;
}

.fcols {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 6px 18px;
  text-align: center;
}

.fcol {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

/* The pattern row: the thing to remember. */
.fpat {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.2;
}

/* The worked row underneath, in the accent so the eye pairs them up. */
.ffill {
  font-size: 13px;
  color: var(--accent);
  line-height: 1.3;
}

.fladder {
  margin: 0;
  padding-left: 22px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
}

.fladder li + li {
  margin-top: 4px;
}

.fnote,
.fcaption {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}

/* A ladder is read down the left edge, so its prose lines up with it. */
.formula.is-ladder .fnote,
.formula.is-ladder .fcaption {
  text-align: left;
}

.fnote + .fcaption {
  margin-top: 5px;
}

.flash .formula {
  background: var(--bg-elev);
  margin-top: 9px;
}

/* ---------- Greek-first quiz prompts ----------
   The exam is on the Greek, so the Greek is the question and the English
   is a gloss you can put away. */

.q-ref {
  font-size: 11px;
  letter-spacing: 0.3px;
  color: var(--muted);
  margin-bottom: 4px;
}

.q-greek {
  font-size: 21px;
  line-height: 1.55;
  margin: 0 0 8px;
}

.q-prompt.is-gloss {
  font-size: 13.5px;
  color: var(--muted);
}

/* Blurred rather than removed, so the layout does not jump when you peek. */
.q-prompt.is-hidden {
  filter: blur(5px);
  user-select: none;
}

.q-prompt + .btn.ghost {
  margin-top: 8px;
}

/* The group's own hook, above its tiles on the map. */
.group-hook {
  margin: -4px 0 8px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}

/* ---------- the like-I'm-five block ----------
   Leads every card. Bigger and warmer than the prose under it, because it is
   the one part you should be able to read at a glance and understand. */

.eli5 {
  background: color-mix(in srgb, var(--warn) 13%, var(--bg-elev-2));
  border-left: 3px solid var(--warn);
  border-radius: 0 11px 11px 0;
  padding: 11px 13px;
  margin-top: 11px;
}

.eli5 .label {

}

.eli5 p {

}

.flash .eli5,
.hero + .card .eli5 {

/* The summary chart's own wording, kept verbatim — the tier you want the night

.bookdef {

  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;

}

/* ---------- the person picker ----------

  align-items: flex-end;

  min-width: 0;
}

.whoami {

  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 999px;
  padding: 4px 8px;
  font: inherit;
  font-size: 12.5px;
  max-width: 46vw;

}

.whoami:focus-visible {

}

.mastery .pill {

}

/* ---------- the cheat sheet ----------
   Every peg in the app, on one screen, at the top of the Map. */

.sheet-set + .sheet-set {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.sheet-case {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  letter-spacing: 0.5px;

  color: var(--muted);
  margin-bottom: 6px;
}

.sheet-row {
  display: grid;
  grid-template-columns: minmax(74px, auto) 1fr;
  gap: 4px 12px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 6px 8px;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.sheet-row + .sheet-row {

}

.sheet-row:active {

}

.sheet-key {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.sheet-members {
  font-size: 12.5px;
  color: var(--muted);

}

/* Narrow screens stack the peg above what it stands for. */
@media (max-width: 380px) {
  .sheet-row {
    grid-template-columns: 1fr;

}

/* A few plain words under each tile, so the map explains itself. */
.acro-gist {

}

.does-row {

  gap: 4px 12px;

.does-name {

/* ---------- pictures ----------
   One emoji per card, standing next to the plain words so the two are learned
   together. It never appears on the front of a drill card: recognising the
   picture is not the same as recalling the answer. */

.eli5 {
  display: flex;

.eli5-pic {
  font-size: 30px;

}

  font-size: 19px;

}

.acro-pic {
  display: block;
  font-size: 19px;
  line-height: 1.1;
  margin-bottom: 2px;

.flash .eli5-pic {
  font-size: 34px;
}

/* Which word the question is actually about. */
.q-target {
  font-size: 13px;
  color: var(--muted);

}

/* An answer that is reasoned rather than the book's, and says so. */

/* ---------- the peg ----------
   One shape for "which letter of the key is this card", used at three sizes:
   peg-lg heads the card and the drill answer, peg-mini rides the collapsed
   row, peg-chip labels a group. The lit slot is the card; the dim ones are
   the letters either side of it, which is the part that was missing — a
   letter on its own is not a peg, a letter with its neighbours is. */

.peg-key {
  display: inline-flex;
  align-items: baseline;
  /* Word keys can run to five slots ("Aim · Outcome · If · Whoever · Whenever"),
     which will not fit one phone line. Let them wrap rather than overflow. */
  flex-wrap: wrap;
  gap: 3px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.peg-part {
  color: color-mix(in srgb, var(--muted) 72%, transparent);
  transition: none;
}

.peg-part.on {
  color: var(--accent);
}

.peg-gap {
  width: 7px;
}

.peg-lg {
  font-size: 25px;
  line-height: 1;
}

.peg-lg .peg-part.on {

  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 6px;
  padding: 1px 5px;
  margin: 0 2px;
}

.peg-mini {
  font-size: 11px;
  letter-spacing: 1px;
  gap: 1.5px;
  flex: 0 0 auto;
  align-self: center;
}

.peg-mini .peg-part.on {
  color: var(--accent);
}

.peg-mini.is-extra .peg-part {
  color: color-mix(in srgb, var(--muted) 50%, transparent);
}

.peg-chip {
  font-size: 13px;
  letter-spacing: 1.2px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  background: color-mix(in srgb, var(--accent) 10%, transparent);
}

.peg-chip .peg-part {
  color: color-mix(in srgb, var(--accent) 85%, var(--text));
}

.peghead {
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-elev-2));
  border-left: 3px solid var(--accent);
  border-radius: 0 11px 11px 0;

}

.peghead .peg-of {
  font-size: 12px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--accent) 60%, var(--text));
  font-weight: 700;
  margin-top: 7px;
}

.peghead .hook-line {
  margin-top: 3px;
}

.peghead.is-extra {
  background: var(--bg-elev-2);
  border-left-color: var(--line);

  color: var(--muted);
}

.flash-answer .peghead {
  margin-top: 9px;
}

.group-head {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.group-head {
  margin: 14px 0 8px;
}

.group-head h3 {
  margin: 0;
}

.acro-letter.is-extra {

  color: var(--muted);

  display: flex;
  justify-content: center;
  font-size: 40px;
  margin: 6px 0;

.peg-front .peg-part.on {
  padding: 2px 8px;
}

on the towel."},{"id":"nominative-other","name":"Other uses — the AAAH","key":"AAAH","mnemonic":"A-A-A-H — then say aaah.","expand":"Address · Appellation · Absolute · Hanging","spot":"🧖","scene":"In the steam room you say aaah: someone calls out 📣, a badge 📛 gives them a title, a headline 📖 hangs over the door tied to nothing, and a knot 🪢 dangles until a pronoun picks it up."}],"place":"🛁","placeName":"The Spa","scene":"Sit in the tub 🛁 — that is SPA — then lie in the steam room 🧖 and say aaah."},{"id":"vocative","name":"Vocative","verb":"Calls","does":"calls someone by name","subtitle":"The calling case. One job: naming who you are talking to.","eli5":"This one is for shouting a name. “Lazarus!” That is all it does.","color":"#2f9fc8","classDate":"2026-08-25","bigIdea":"The vocative calls. It is the only case with a single use, so it is the cheapest one you will ever learn.","masterMnemonic":"One case, one job: say the name.","masterMnemonicWhy":"Everything else in the chapter has three, five, seven uses. This one has one. Learn it in ten seconds and spend the time you saved on the accusative.","groups":[{"id":"vocative-uses","name":"Uses of the vocative","key":"Say the name","mnemonic":"Say the name.","expand":"Direct address — and that is the list","spot":"📣","scene":"One man on the doorstep, shouting one name 🗣️. Nothing else lives here."}],"place":"📣","placeName":"The Doorstep","scene":"You stop at one door and shout one name 🗣️. That is the whole stop."},{"id":"accusative","name":"Accusative","verb":"Fences","does":"fences the verb in","subtitle":"The fencing case. How far the verb's action goes.","eli5":"This one builds a fence. It says where the doing stops.","color":"#c8642a","classDate":"2026-08-25","bigIdea":"The accusative fences the verb in. It says how far the action reaches — onto whom, how far, in what way.","masterMnemonic":"The object joins the CADETS, then gets the MMR shot.","masterMnemonicWhy":"Noun-like: the CADETS — Complement, Alias, Direct object, Echo, Two, Sub. Adverb-like: the MMR shot — Measure, Manner, Respect. How far? How? How so?","groups":[{"id":"accusative-overview","name":"The idea","key":"The fence","mnemonic":"The nominative crowns. The accusative fences.","expand":"The nominative crowns. The accusative fences.","spot":"🚧","scene":"The fence 🚧 round the yard. The verb runs until it hits the fence, and that is where the accusative stands."},{"id":"accusative-substantival","name":"Substantival (noun-like) — CADETS","key":"CADETS","mnemonic":"C-A-D-E-T-S — six cadets line up, and the object is one of them.","expand":"Complement (calls it something) · Alias (apposition) · Direct object · Echo (cognate) · Two (person + thing) · Sub (subject of an infinitive)","spot":"🪖","scene":"Six cadets on parade in the yard: one wears a medal 🎖️ that says what he is called, one wears a name tag 🏷️, one holds a glove 🧤 to catch what is thrown, one shouts his own name back 🔁, one 2️⃣ is handed two things at once, and one breaks rank and runs 🏃 — the only one giving orders instead of taking them."},{"id":"accusative-adverbial","name":"Adverbial (adverb-like) — the MMR shot","key":"MMR","mnemonic":"M-M-R — one shot, three jabs: how far? how? how so?","expand":"Measure (how far?) · Manner (how?) · Respect (how so?)","spot":"💉","scene":"Then the jab, three needles in one shot: a tape measure 📏 for how far, a mask 🎭 for how, a target 🎯 for how so."}],"place":"🚧","placeName":"The Fenced Yard","scene":"Everything happens inside the fence 🚧. In the yard six CADETS 🪖 line up for inspection, then take the MMR jab 💉."},{"id":"genitive","name":"Genitive","verb":"Describes","does":"says which kind of “of”","subtitle":"The “of” case. The question is always: which kind of “of”?","eli5":"This one is the “of” word. “The hat OF Dad.” You just say which kind of “of”.","color":"#7a5cc8","classDate":"2026-09-01","bigIdea":"The genitive describes. The nominative names, the accusative fences, the genitive tells you which kind.","masterMnemonic":"Every genitive is an “of”. Ask which kind.","masterMnemonicWhy":"Four drawers. Seven describe a noun and spell SWAMP RD — Source, Whole, Adjective, Made of, Possession, Relationship, Description. Two hide a verb: X does it, or X gets it. Five modify a verb and spell PACTS: Price, Agency, Comparison, Time or place, Separation. Then two oddities: another name, and a direct object that came out genitive.","groups":[{"id":"genitive-adjectival","name":"Adjectival — SWAMP RD","key":"SWAMP RD","mnemonic":"S-W-A-M-P R-D — the genitive lives on Swamp Rd, and whatever falls off the end lands in the Ditch. That is Description, the catch-all.","expand":"Source (from?) · Whole (part of?) · Adjective (what quality?) · Made of? · Possession (whose?) · Relationship (whose kin?) · Description (nothing else fits)","spot":"🛣️","scene":"Drive down Swamp Rd: a spring ⛲ where it came from, a pizza 🍕 you take one slice of, a paintbrush 🖌️ that could just be an adjective, a glass of milk 🥛 for what it is made of, a key 🔑 for who owns it, a father and son 👨‍👦 for kin — and whatever falls off the end lands in the bin 🗑️ at the bottom of the road."},{"id":"genitive-verbal","name":"Verbal — a verb hiding in the noun","key":"Does it · Gets it","mnemonic":"Does it · Gets it — say the head word as a verb and ask which.","expand":"Subjective (X does it) · Objective (X gets it)","spot":"↔️","scene":"Where the road crosses, two arrows on one post: ➡️ does it, ⬅️ gets it. Say the head word as a verb and see which way it points."},{"id":"genitive-adverbial","name":"Adverbial — modifies the verb: PACTS","key":"PACTS","mnemonic":"P-A-C-T-S — the adverbial genitive makes PACTS.","expand":"Price · Agency · Comparison · Time or place · Separation","spot":"🤝","scene":"At the table where the pacts get signed: money 💰 for the price, a hand ✋ for by whom, scales ⚖️ for than what, a clock 🕐 for when and where, a door 🚪 for away from."},{"id":"genitive-other","name":"Other — the odd drawer","key":"Nickname · Fussy verb","mnemonic":"A nickname, and a fussy verb.","expand":"Apposition (another name for it) · Direct object (the verb wanted a genitive)","spot":"🗄️","scene":"The odd drawer at the end of the road: a name tag 🏷️ for a second name, and a magnet 🧲 for the verbs that pull a genitive object to themselves."}],"place":"🛣️","placeName":"Swamp Road","scene":"Drive the whole of Swamp Rd 🛣️, stop where the two arrows cross ↔️, sign the PACTS 🤝, and check the odd drawer 🗄️ on the way out."},{"id":"dative","name":"Dative","verb":"Gives","does":"gives it, places it, uses it","subtitle":"The to/for, in/at, with/by case.","eli5":"Three coats on one hook. To or for someone. In or at a place. With or by a thing.","color":"#c8547d","classDate":"2026-09-08","bigIdea":"The dative is three old cases wearing one coat: to/for, in/at, with/by. Work out which coat, and the use follows.","masterMnemonic":"To, In, With.","masterMnemonicWhy":"Three families and a leftover drawer. To or for = PORT. In or at = HIT. With or by = MAMA. Then the odd BEADs.","groups":[{"id":"dative-pure","name":"Pure — to or for: PORT","key":"PORT","mnemonic":"P-O-R-T — and the T, plain “to whom”, is the one you meet most.","expand":"Personal interest · Owns (possession) · Re: (reference) · To whom (indirect object)","spot":"⚓","scene":"Down at the port: a heart-wrapped gift 💝 for whose interest it serves, a key 🔑 for who owns it, an envelope ✉️ marked Re: for what it is about, and a parcel 🎁 for who it goes to."},{"id":"dative-locative","name":"Locative — in or at: HIT","key":"HIT","mnemonic":"H-I-T — Here, In, Then.","expand":"Here (place) · In what realm (sphere) · Then (time)","spot":"🥊","scene":"Take the hit on the way up: a pin 📍 for here, a cloud ☁️ for in, a clock 🕐 for then."},{"id":"dative-instrumental","name":"Instrumental — with or by: MAMA","key":"MAMA","mnemonic":"M-A-M-A — Means, Agency, Manner, Association.","expand":"Means (with what tool) · Agency (by whom) · Manner (in what style) · Association (along with)","spot":"👩‍🔧","scene":"Mama's workshop: a hammer 🔨 is the tool it was done with, a hand ✋ is the person who did it, a mask 🎭 is the style it was done in, and two friends 👫 came along for the ride."},{"id":"dative-other","name":"Other — the odd BEADs","key":"BEAD","mnemonic":"B-E-A-D — Because, Echo, Alias, Devoted.","expand":"Because (cause) · Echo (cognate) · Alias (apposition) · Devoted verbs (direct object)","spot":"📿","scene":"Four beads left over on a string: fire 🔥 because, a loop 🔁 echo, a tag 🏷️ alias, hands 🙏 devoted."}],"place":"⚓","placeName":"The Harbour","scene":"Sail into PORT ⚓, take the HIT 🥊 on the way up the hill, call on MAMA 👩‍🔧 in her workshop, and string the leftover BEADs 📿."},{"id":"article","name":"Article","verb":"Points","does":"points at one — or vanishes","subtitle":"Greek's “the”. It points — and its absence is not “a”.","eli5":"Greek's “the” is a finger. It points at one thing. Sometimes it stands in for a word, and sometimes it disappears — and gone does not mean “a”.","color":"#c9a227","classDate":"2026-09-15","bigIdea":"The article points. It particularises. And when it is missing, that is information too — not automatically “a”.","masterMnemonic":"Point, Pronoun, Poof.","masterMnemonicWhy":"First the two words: ἄρθρον is a joint, so articular has the article and anarthrous has none. Then three things it does — it Points at something, six ways, and a MAGPIE remembers them; it stands in as a Pronoun in five flavours; or it goes Poof and leaves you three readings to choose between. Then three named rules: Sharp joins, Colwell drops, Apollonius matches.","groups":[{"id":"article-terms","name":"The two words for it","key":"Articular · Anarthrous","mnemonic":"ἄρθρον is a joint. With it, articular. Without it, anarthrous.","expand":"Articular — the article is there · Anarthrous — it is not","spot":"🦴","scene":"Before you read the post at all, two labels 🦴: a bone with its joint for articular, and a hole 🕳️ where the joint should be for anarthrous."},{"id":"article-point","name":"Point — particularising, and generic","key":"MAGPIE","mnemonic":"M-A-G-P-I-E — a magpie on the signpost, picking out the one shiny thing.","expand":"Monadic · Abstract · Generic · Par excellence · Identification · Earlier (anaphoric)","spot":"🐦","scene":"A magpie 🐦 on the post picks out one shiny thing at a time: the only one there is 🌑, the idea itself 💭, the whole class at once 🗂️, the one that deserves the crown 👑, just this one here 🔦, and the one it was talking about a moment ago ↩️."},{"id":"article-pronoun-kinds","name":"Pronoun — five words it stands in for","key":"Personal · Relative · Possessive · Demonstrative · Alternate","mnemonic":"They · who · his · those · some…others — five English words, five kinds.","expand":"ὁ δέ (he) · ὁ ἐν … (who) · τὸν βίον (his) · οἱ ἐν τῷ πλοίῳ (those) · ὁ μέν … ὁ δέ (some … others)","spot":"🧩","scene":"A puzzle piece 🧩 with five shapes: a man 🧔 for he, a chain ⛓️ for who, a briefcase 💼 for his, a finger 👆 for those, and two friends 👬 for some and others."},{"id":"article-absence-kinds","name":"Poof — gone, and gone is not “a”","key":"Indefinite · Qualitative · Definite","mnemonic":"Ask three things in order: a? the quality? or still THE?","expand":"Non-particular — indefinite or qualitative · or definite anyway, in nine standard places","spot":"👻","scene":"Where the finger vanished 👻, three things it can mean: genuinely “a” 🫥, the quality itself 💎, or still THE 🔒 — and that last one has nine places it happens."},{"id":"article-rules","name":"Three men, three rules","key":"Sharp · Colwell · Apollonius","mnemonic":"Sharp joins · Colwell drops · Apollonius matches.","expand":"Granville Sharp · Colwell's Rule · Apollonius's Canon","spot":"👨‍⚖️","scene":"Three men under the post: Sharp holding a chain 🔗 that joins two into one, Colwell with an arrow ⬇️ showing the article dropped off, Apollonius with an equals sign 🟰 — both of them or neither."}],"place":"👉","placeName":"The Signpost","scene":"One finger on a post 👉 with a magpie 🐦 sitting on it, three men 👨‍⚖️ underneath arguing about what it means, and two labels 🦴 nailed to the post naming what is and is not there."},{"id":"adjective","name":"Adjective","verb":"Colours","does":"colours the noun, in degrees","subtitle":"Match it, place it. Then four jobs, five degrees.","eli5":"A describing word. It can stick to a noun, become the noun, jump to the doing-word, or make a claim. And it comes in degrees: plain, more, most.","color":"#6b7fd7","classDate":"2026-09-15","bigIdea":"First it has to match its noun in case, number and gender. Then look at where the article sits. Then: an adjective does one of four jobs, in one of five degrees.","masterMnemonic":"Four jobs ASAP, in five degrees of SPECS.","masterMnemonicWhy":"Agreement first — case, number, gender, all three — then position, because where the article sits is what separates attributive from predicate. Only then four jobs, ASAP: Attributive, Substantival, Adverbial, Predicate. Then five degrees, SPECS: Superlative, Positive, Elative, Comparative, Special cases.","groups":[{"id":"adjective-agreement","name":"Before anything else — match it, then place it","key":"Agreement · Position","mnemonic":"Match it in case, number and gender. Then look at where the article sits.","expand":"Agreement — case, number, gender · Position — where the article sits decides attributive or predicate","spot":"🎰","scene":"At the door of the paint shop a fruit machine 🎰 with three reels — case, number, gender — and beside it a compass 🧭 for reading where the article sits. Nothing inside counts until both are done."},{"id":"adjective-use","name":"What it does — ASAP","key":"ASAP","mnemonic":"A-S-A-P — Attributive, Substantival, Adverbial, Predicate.","expand":"Sticks to the noun · becomes the noun · jumps to the verb · makes a claim","spot":"⏱️","scene":"Four jobs ASAP: a brush 🖌️ sticks the colour to the noun, a figure 🧍 becomes the noun, a kangaroo 🦘 jumps across to the verb, a speech bubble 💬 makes the claim."},{"id":"adjective-degree","name":"How strong — SPECS","key":"SPECS","mnemonic":"S-P-E-C-S — Superlative, Positive, Elative, Comparative, Special cases.","expand":"The ladder is positive → comparative → superlative. Elative turns the volume up without comparing; special cases swap the three around.","spot":"👓","scene":"Then try the specs on: a gold medal 🥇 best of the lot, a 1️⃣ plain, a speaker 🔊 that only means “very”, a 2️⃣ more than one other, and a shuffle 🔀 where the forms swap jobs."}],"place":"🎨","placeName":"The Paint Shop","scene":"Four jobs to do ASAP ⏱️, five strengths of paint you try on through the SPECS 👓 — and a fruit machine 🎰 at the door that will not let you in until case, number and gender line up."},{"id":"pronoun","name":"Pronoun","verb":"Replaces","does":"stands in for a noun","subtitle":"Seven kinds of stand-in. Ask what job the stand-in is doing.","eli5":"A word that stands in for a name so you do not have to keep saying it. “Mum made tea. SHE drank IT.”","color":"#b84a4a","classDate":"2026-09-22","bigIdea":"Every pronoun stands in for a noun. The seven kinds differ only in what they add while standing in: who is talking, which one is pointed at, which one is linked back to, who is being asked about, somebody unnamed, the self, or each other.","masterMnemonic":"Me · This · Who · Who? · Anyone · Myself · Each other.","masterMnemonicWhy":"Seven English words, one per kind, in the chart’s own order: Personal, Demonstrative, Relative, Interrogative, Indefinite, Reflexive, Reciprocal. Say the English and you have named the kind. The one trap is the pair in the middle — τίς with its accent asks “who?”, τις without one means “anyone”.","place":"🎭","placeName":"The Theatre","scene":"Backstage at the theatre 🎭, where every part has an understudy ready to stand in for it.","groups":[{"id":"pronoun-kinds","name":"The seven stand-ins","key":"Me · This · Who · Who? · Anyone · Myself · Each other","mnemonic":"Me · This · Who · Who? · Anyone · Myself · Each other — seven understudies, one line each.","expand":"Personal · Demonstrative · Relative · Interrogative · Indefinite · Reflexive · Reciprocal","spot":"🎭","scene":"Seven understudies in the wings 🎭: one says “me” 🙋, one points 👉 at “this”, one holds a rope 🪢 back to “who” was just named, one raises a question mark ❓, one wears a mask 🎭 — “anyone” —, one stares in a mirror 🪞, and two shake hands 🤝 with each other."}]},{"id":"preposition","name":"Preposition","verb":"Positions","does":"places one thing against another","subtitle":"Seventeen little words, and the case that comes after each.","eli5":"Little words that say where one thing is next to another. In the box. Out of the house. Through the door.","color":"#3d6fa6","classDate":"2026-09-22","bigIdea":"A preposition plus its object makes a phrase, and the phrase does one of three jobs: tells you how or where about a verb, tells you which one about a noun, or stands as the noun itself. The preposition’s meaning shifts with the case of its object.","masterMnemonic":"How · Which · What — then one case, two cases, three.","masterMnemonicWhy":"First the phrase’s job: How (adverbial, it hangs on a verb), Which (adjectival, it hangs on a noun), What (substantival, it is the noun). Then the seventeen, sorted by how many cases they take: eight take one, six take two, and the three P’s — ἐπί, παρά, πρός — take all three.","place":"🌉","placeName":"The Bridge","scene":"A bridge 🌉 with everything happening around it: over it, under it, through it, from it, beside it.","groups":[{"id":"prep-function","name":"What the phrase does","key":"How · Which · What","mnemonic":"How · Which · What — hangs on a verb, hangs on a noun, or is the noun.","expand":"Adverbial (modifies a verb) · Adjectival (modifies a noun) · Substantival (acts as a noun)","spot":"🧩","scene":"Three signs on the bridge 🧩: an arrow ➡️ to the verb for how, a label 🏷️ on the noun for which, and a crate 📦 that simply is the thing.","quizApart":true},{"id":"prep-one-case","name":"Takes one case","key":"ἀνά · ἀντί · ἀπό · εἰς · ἐκ · ἐν · πρό · σύν","mnemonic":"Eight take one case. Genitive ones go away, accusative ones go toward, dative ones stay put.","expand":"Genitive: ἀντί, ἀπό, ἐκ, πρό · Accusative: ἀνά, εἰς · Dative: ἐν, σύν","spot":"1️⃣","scene":"Eight on the bridge, each holding one case 1️⃣: four walking off it with the genitive (from, out of, instead of, before) 🚶, two walking onto it with the accusative (into, up) ➡️, two sitting still on it with the dative (in, with) 🪑."},{"id":"prep-two-cases","name":"Takes two cases","key":"διά · κατά · μετά · περί · ὑπέρ · ὑπό","mnemonic":"Six take two, and always the same two: genitive and accusative.","expand":"διά through / because of · κατά against / according to · μετά with / after · περί concerning / around · ὑπέρ for, above · ὑπό by, under","spot":"2️⃣","scene":"Six with two faces each 2️⃣ — genitive on one side, accusative on the other. None of the six ever takes a dative."},{"id":"prep-three-cases","name":"Takes three cases","key":"ἐπί · παρά · πρός","mnemonic":"The three P’s take all three cases: ἐπί, παρά, πρός.","expand":"ἐπί on / upon / against · παρά from / with / beside · πρός for / at / to","spot":"3️⃣","scene":"Three at the end of the bridge 3️⃣, every one with a π in it, every one taking genitive, dative and accusative."}]},{"id":"conjunction","name":"Conjunction","verb":"Joins","does":"joins words, clauses and sentences","subtitle":"Joiners. Either two equals side by side, or one clause hung on another.","eli5":"Glue words. “And”, “but”, “so”, “because”, “if”. They stick two bits of a sentence together and say how the bits fit.","color":"#4f9a4a","classDate":"2026-09-22","bigIdea":"Two kinds of joint. A coordinating conjunction joins equals — and, or, but, so, for. A subordinating one hangs a clause on another and says why: purpose, result, cause, comparison, condition, concession, content, time or place.","masterMnemonic":"And · Or · But · So · For — then the nine ways to hang one clause on another.","masterMnemonicWhy":"The five coordinating types are just the five English joiners: And (copulative), Or (disjunctive), But (adversative), So (inferential), For (explanatory). The nine subordinating ones are the English you would use: In order that, So that, Because, As, If, Even if, That, When, Where.","place":"🚉","placeName":"The Junction","scene":"A railway junction 🚉, where lines join. Some run side by side as equals; some branch off the main line.","groups":[{"id":"conj-coordinating","name":"Side by side — coordinating","key":"And · Or · But · So · For","mnemonic":"And · Or · But · So · For — five joiners, two equal clauses.","expand":"Copulative (and) · Disjunctive (or) · Adversative (but) · Inferential (so) · Explanatory (for)","spot":"🛤️","scene":"Two tracks side by side 🛤️: a coupling ➕ and, points 🔀 or, a buffer 🛑 but, a signal ➡️ so, and a timetable 📋 for — here is why."},{"id":"conj-subordinating","name":"Branch lines — subordinating","key":"In order that · So that · Because · As · If · Even if · That · When · Where","mnemonic":"In order that · So that · Because · As · If · Even if · That · When · Where — nine branch lines off the main one.","expand":"Purpose · Result · Causal · Comparative · Conditional · Concessive · Declarative · Temporal · Local","spot":"🔀","scene":"Nine branch lines 🔀: a target 🎯 in order that, a crash 💥 so that, a root 🌱 because, twins 👯 as, a fork 🚦 if, a shrug 🤷 even if, a speech bubble 💬 that, a clock ⏰ when, a pin 📍 where."}]},{"id":"adverb","name":"Adverb","verb":"Modifies","does":"tells when, how much, how and where","subtitle":"Says more about a verb, an adjective, or another adverb.","eli5":"A word that tells you more about the doing. Did it SECRETLY. Came AFTERWARD. Sit HERE. Or it turns up the volume on a describing word: VERY early.","color":"#6d7f8f","classDate":"2026-09-22","bigIdea":"An adverb answers one of four questions — when, how much, how, where — about a verb, an adjective or another adverb. And now and then, with an article, it borrows a noun’s or an adjective’s job.","masterMnemonic":"When · How much · How · Where.","masterMnemonicWhy":"Four questions, four uses, in the chart’s order: Time, Degree, Manner, Place. Before that, ask what it hangs on — a verb in any mood, an adjective, or another adverb. After it, one twist: put an article in front and an adverb can act as a noun or an adjective.","place":"🧰","placeName":"The Toolbox","scene":"A toolbox 🧰 of adjusters: a clock, a volume knob, a spirit level and a map pin, for tuning whatever you fit them to.","groups":[{"id":"adv-modifies","name":"What it hangs on","key":"Verb · Adjective · Adverb","mnemonic":"Verb · Adjective · Adverb — it tunes a doing-word, a describing word, or another tuner.","expand":"A verb in any mood · an adjective · another adverb","spot":"🔧","scene":"Three things on the workbench 🔧: a motor ⚙️ (a verb, in any mood), a paint tin 🎨 (an adjective), and a spare knob 🎛️ (another adverb)."},{"id":"adv-uses","name":"The question it answers","key":"When · How much · How · Where","mnemonic":"When · How much · How · Where — four questions an adverb answers.","expand":"Time · Degree · Manner · Place","spot":"❔","scene":"Four gauges on the lid ❔: a clock 🕰️ when, a volume knob 🔊 how much, a spirit level 🎚️ how, and a map pin 📌 where."},{"id":"adv-other-hat","name":"Wearing another hat","key":"Noun · Adjective","mnemonic":"Noun · Adjective — with an article in front, an adverb can do either job.","expand":"Substantival (τὸ ἐκτός, “the outside”) · Adjectival (ἐν τῷ νῦν καιρῷ, “at the present time”)","spot":"🎩","scene":"Two borrowed hats 🎩 on the peg: an article turns ἐκτός “outside” into a thing, the outside 📦, and tucks νῦν “now” between article and noun, where only an adjective ever sits 🏷️."}]},{"id":"particle","name":"Particle","verb":"Cries","does":"says yes, amen, look, woe","subtitle":"Little words that add force, or grab your attention.","eli5":"Tiny words you would shout. “Yes!” “Amen!” “Look!” “Oh!” They do not change what the sentence says; they change how loud it is.","color":"#b0762a","classDate":"2026-09-22","bigIdea":"A particle adds force or grabs attention, and leaves the grammar of the sentence alone. Intensifying particles say “yes, truly”; attention particles say “look!” and are really interjections.","masterMnemonic":"Yes! · Look!","masterMnemonicWhy":"Two kinds, two shouts. Yes! — intensification: ναί, ἀμήν, γέ. Look! — attention: ἰδού, οὐαί, ὦ.","place":"🔔","placeName":"The Town Crier","scene":"The town crier rings his bell 🔔 and shouts. He adds nothing to the news — he only makes you hear it.","groups":[{"id":"particle-kinds","name":"The two shouts","key":"Yes · Look","mnemonic":"Yes · Look — turn it up, or turn your head.","expand":"Intensification (ναί, ἀμήν, γέ) · Attention (ἰδού, οὐαί, ὦ)","spot":"🔔","scene":"The crier has two shouts 🔔: “Yes! Amen!” 🙌 to turn the volume up, and “Look! Woe! O!” 👀 to make the crowd turn round."}]}],"cards":[{"id":"subject","set":"nominative","group":"nominative-major","name":"Subject","pic":"👑","eli5":"Who is doing it. “John talks.” Who talks? John.","formula":{"pattern":["X","verbs"],"filled":["John","bears witness"]},"short":"Subject","gist":"does the verb","tile":"S","oneLine":"The one doing the verb.","mnemonic":"The subject wears the crown.","mnemonicWhy":"The nominative names, and the crown sits on whoever the verb is about. One verb, one nominative — that one is wearing it.","spotIt":"Ask the verb: who or what? That is your subject.","bookDef":"The subject of a finite verb.","examples":[{"ref":"John 1:15","greek":"*Ἰωάννης* μαρτυρεῖ περὶ αὐτοῦ","english":"*John* bears witness about him","note":"John is nominative and does the witnessing. As plain as it gets."},{"ref":"English drill","greek":null,"english":"*Ivan* came to class.","note":"One verb, one nominative. Nothing tricky."}],"tags":["nominative","major","ch-2"]},{"id":"predicate-nominative","set":"nominative","group":"nominative-major","name":"Predicate Nominative","pic":"📦","eli5":"“X is Y” puts X inside Y, like a box. The Word goes in the God box. Not the other way round.","formula":{"pattern":["X","is","Y"],"filled":["the Word","was","God"]},"short":"Pred. nom.","gist":"X is Y","tile":"P","oneLine":"Two nominatives with “is” between them. The second says what the first is.","mnemonic":"The subject is the small circle; the predicate is the big one.","mnemonicWhy":"“Is” looks like an equals sign, but it only points one way. “The Word was God” puts the Word inside God, not God inside the Word. Small circle inside a big one.","spotIt":"Find a form of “to be” — εἰμί, γίνομαι, ὑπάρχω — with a nominative on each side of it.","bookDef":"Provides further information about the subject as a complement of a copulative verb (expressing a state of being).","examples":[{"ref":"John 1:1c","greek":"καὶ *θεὸς* ἦν ὁ λόγος","english":"and the Word was *God*","note":"ὁ λόγος has the article, so it is the subject. θεός is what is said about it."},{"ref":"1 John 4:8","greek":"ὁ θεὸς *ἀγάπη* ἐστίν","english":"God is *love*","note":"ὁ θεός has the article, so it is the subject. Love is what is said about him."},{"ref":"Eph 2:14","greek":"αὐτὸς γάρ ἐστιν *ἡ εἰρήνη* ἡμῶν","english":"for he himself is *our peace*","note":"αὐτός is a pronoun, so it takes the subject slot. See the pecking order."},{"ref":"John 1:14","greek":"ὁ λόγος *σὰρξ* ἐγένετο","english":"the Word became *flesh*","note":"ἐγένετο is a “became” verb, which counts. σάρξ is what is said about the Word."}],"watchOut":"Apposition looks the same but has no verb. A verb makes a claim. A comma only makes a label.","tags":["nominative","major","john-1-1","ch-2"]},{"id":"pecking-order","set":"nominative","group":"nominative-major","name":"The Pecking Order","pic":"🪜","eli5":"Two words both look like the doer. Pick like picking teams: “he” words first, then “the” words, then names.","formula":{"ladder":["Is either a pronoun?","Does either have the article?","Is either a proper name?"],"note":"First yes wins. John 1:1c: no pronoun, ὁ λόγος has the article — so it is the subject."},"short":"Pecking order","gist":"which one is the subject","type":"rule","oneLine":"Two nominatives, one “is”. This is how you tell which one is the subject.","mnemonic":"PAP — ask Papa who is in charge.","mnemonicWhy":"Pronoun, then Article, then Proper name. Papa answers in that order every time.","spotIt":"Go down the list and stop at the first yes.","examples":[{"ref":"John 1:1c","greek":"καὶ θεὸς ἦν *ὁ λόγος*","english":"and the Word was God","note":"No pronoun, so the article decides: ὁ λόγος has it and is the subject, which makes θεός the predicate. Not “a god” — Greek can be perfectly definite with no article."},{"ref":"Eph 2:14","greek":"*αὐτὸς* γάρ ἐστιν ἡ εἰρήνη ἡμῶν","english":"for *he himself* is our peace","note":"αὐτός is a pronoun, so it wins — even though ἡ εἰρήνη has the article."}],"watchOut":"No article does not mean “a”. A predicate noun sitting in front of the verb normally drops it.","tags":["nominative","major","john-1-1","ch-2"]},{"id":"nominative-apposition","set":"nominative","group":"nominative-major","name":"Apposition","pic":"🏷️","eli5":"Same person, two stickers. “Andrew, Peter’s brother.” No “is” — just a second sticker.","formula":{"pattern":["X,","Y"],"filled":["Andrew,","the brother of Simon Peter"],"note":"No verb anywhere."},"short":"Apposition (nom.)","gist":"renames it, no verb","tile":"A","oneLine":"Two nominatives side by side, no verb. The second renames the first.","mnemonic":"No verb, just a name tag.","mnemonicWhy":"A sticker slapped on the first word: “Andrew — HELLO MY NAME IS the brother of Simon Peter.” Nothing is claimed; he is just being identified.","spotIt":"Two nominatives, a pause between them, and no “is” anywhere.","bookDef":"Further explains the subject by clarification, description, or identification.","examples":[{"ref":"John 1:40","greek":"Ἀνδρέας *ὁ ἀδελφὸς* Σίμωνος Πέτρου","english":"Andrew, *the brother* of Simon Peter","note":"ἀδελφός renames Andrew. Nothing is being claimed about him."},{"ref":"Rom 1:1","greek":"Παῦλος *δοῦλος* Χριστοῦ Ἰησοῦ","english":"Paul, *a servant* of Christ Jesus","note":"δοῦλος renames Paul."},{"ref":"English drill","greek":null,"english":"Ivan, *the student*, came to class.","note":"A name tag. Compare “Ivan is the student” — that one has a verb, so it is a claim."}],"watchOut":"The only difference from a predicate nominative is the verb. Comma = label. “Is” = claim. And watch the chart: Rom 1:1 is filed here because δοῦλος explains Παῦλος, while the near-identical Titus 1:1 is filed under absolute because there the whole salutation stands alone.","tags":["nominative","major","ch-2"]},{"id":"nominative-address","set":"nominative","group":"nominative-other","name":"Nominative of Address","pic":"📣","eli5":"“Hey, Dad!” You are talking TO him, not about him.","formula":{"pattern":["X,","do it!"],"filled":["Husbands,","love your wives"]},"short":"Address","gist":"talking TO them","tile":"A","oneLine":"A nominative used to call out to someone.","mnemonic":"\"Hey, you!\" in a nominative coat.","mnemonicWhy":"He is being spoken to, not described. It looks like a subject and works like a shout.","spotIt":"Try an exclamation mark after it. “Husbands! — love your wives.” If that works, it is address.","bookDef":"Used in the place of a vocative in direct address.","examples":[{"ref":"Matt 9:27","greek":"ἐλέησον ἡμᾶς, *υἱὸς Δαυίδ*","english":"Have mercy on us, *Son of David*","note":"He is being called out to, not described. Nominative shape, vocative job."},{"ref":"Eph 5:25","greek":"*οἱ ἄνδρες*, ἀγαπᾶτε τὰς γυναῖκας","english":"*Husbands*, love your wives","note":"Not a statement about husbands. A shout at them."}],"watchOut":"A subject is talked about. An address is talked to. Same case, opposite direction.","tags":["nominative","other","ch-2"]},{"id":"nominative-appellation","set":"nominative","group":"nominative-other","name":"Nominative of Appellation","pic":"📛","eli5":"It is the name on his badge. Everyone says “Teacher”, so that became his name.","formula":{"pattern":["they call me","X"],"filled":["you call me","Teacher"],"note":"X stays nominative."},"short":"Appellation","gist":"a title used as a name","tile":"A","oneLine":"A title used as somebody's name, left in the nominative.","mnemonic":"The title is on the name badge — and badges don't decline.","mnemonicWhy":"Once “Teacher” is what people call him, it stops behaving like a word in a sentence and behaves like the name printed on a badge.","spotIt":"It is a title, it is what someone is called, and it stayed nominative when the sentence wanted an accusative.","bookDef":"Used in conjunction with an address or title where a case other than the nominative would be expected.","examples":[{"ref":"John 13:13","greek":"ὑμεῖς φωνεῖτέ με *ὁ διδάσκαλος* καὶ *ὁ κύριος*","english":"You call me *Teacher* and *Lord*","note":"φωνεῖτέ με wants an accusative after it. The titles stay nominative because they are the name."}],"watchOut":"The easiest of the four. If a nominative is plainly a title-as-name, stop looking for something cleverer.","tags":["nominative","other","ch-2"]},{"id":"nominative-absolute","set":"nominative","group":"nominative-other","name":"Nominative Absolute","pic":"📖","eli5":"It is the title on the front of a book. It sits on top and joins nothing.","formula":{"pattern":["X","— and nothing"],"filled":["The beginning of the gospel","— no verb at all"]},"short":"Absolute","gist":"a headline, tied to nothing","tile":"A","oneLine":"A nominative attached to nothing — a heading or a greeting.","mnemonic":"Absolute = the headline.","mnemonicWhy":"A headline floats above the page, tied to nothing. No verb, no clause, no rope.","spotIt":"Opening material — a title, a greeting, a list — with no verb to hook it to.","bookDef":"Grammatically independent use of the nominative in introductory material (such as titles, headings, salutations, or addresses).","examples":[{"ref":"Mark 1:1","greek":"*Ἀρχὴ* τοῦ εὐαγγελίου Ἰησοῦ Χριστοῦ","english":"*The beginning* of the gospel of Jesus Christ","note":"ἀρχή is nominative and stands completely alone. Everything hanging off it is genitive."},{"ref":"1 Tim 1:2","greek":"*χάρις ἔλεος εἰρήνη* ἀπὸ θεοῦ πατρός","english":"*Grace, mercy, peace* from God the Father","note":"All nominative, all opening material, all tied to nothing."},{"ref":"Titus 1:1","greek":"*Παῦλος* δοῦλος θεοῦ","english":"*Paul*, a servant of God","note":"The whole salutation stands alone, and Παῦλος is the word left hanging. Compare Rom 1:1, where the same phrase is filed under apposition."}],"watchOut":"No rope at all. If a pronoun later picks the word back up, it is hanging, not absolute.","tags":["nominative","other","ch-2"],"kindsLabel":"Where introductory material turns up","kinds":[{"name":"Titles","note":"the heading of a book or section"},{"name":"Headings","note":"a label over what follows"},{"name":"Salutations","note":"the opening of a letter"},{"name":"Addresses","note":"the name on the outside"}]},{"id":"hanging-nominative","set":"nominative","group":"nominative-other","name":"Hanging Nominative","pic":"🪢","eli5":"You say the thing, then point back at it. “The good seed? THOSE are the king’s kids.”","formula":{"pattern":["X","…","it …"],"filled":["The good seed","—","these are the sons"]},"short":"Hanging","gist":"picked up by a pronoun","tile":"H","oneLine":"A loose nominative that a pronoun picks up later.","mnemonic":"It hangs by a pronoun.","mnemonicWhy":"The pronoun downstream is the rope. Cut it and the word drops — which is exactly what an absolute never had.","spotIt":"Find the loose nominative, then look ahead for the pronoun standing in its place.","bookDef":"The logical rather than syntactical subject at the beginning of a sentence.","examples":[{"ref":"Matt 13:38","greek":"τὸ δὲ καλὸν *σπέρμα*, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας","english":"and the good *seed* — these are the sons of the kingdom","note":"σπέρμα is left dangling, but οὗτοι (“these”) does its job in the main clause. That pronoun is the rope."},{"ref":"Rev 3:12","greek":"*ὁ νικῶν* ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου","english":"*The one who conquers*, I will make him a pillar in the temple of my God","note":"ὁ νικῶν is left dangling, and αὐτόν picks it up. That pronoun is the rope."}],"watchOut":"Absolute = no connection. Hanging = connected in sense, but not in grammar.","tags":["nominative","other","ch-2"]},{"id":"vocative-direct-address","set":"vocative","group":"vocative-uses","name":"Direct Address","pic":"🗣️","eli5":"You call his name. “Lazarus, come out!” The name is just how you got him to look.","formula":{"pattern":["X!","do it"],"filled":["Lazarus,","come out!"],"note":"The name is not the doer. It is who you are shouting at."},"short":"Direct address","gist":"calling them by name","tile":"Say the name","oneLine":"Naming the person or thing you are speaking to.","mnemonic":"Say the name, then say the thing.","mnemonicWhy":"The whole case is one move: get their attention, then tell them. With or without “the” in front — the chart allows both.","spotIt":"Somebody is being called by name or title, and that word is not doing any work in the sentence.","bookDef":"The use of the articular or non-articular vocative to designate the person or thing being addressed.","examples":[{"ref":"John 11:43","greek":"*Λάζαρε*, δεῦρο ἔξω","english":"*Lazarus*, come out!","note":"He is being called, not described. That is the vocative’s only job."}],"watchOut":"When a word does this job but is shaped like a nominative, the chart calls it nominative of address instead. Same job, different clothes.","tags":["vocative","ch-2"],"kindsLabel":"Dressed either way","kinds":[{"name":"Non-articular","note":"the bare vocative — Κύριε"},{"name":"Articular","note":"with the article — ὁ πατήρ, used as a vocative"}]},{"id":"accusative-idea","set":"accusative","group":"accusative-overview","name":"The Case of Limitation","pic":"🚧","eli5":"Doing-words need a fence. This builds it. The doing stops here.","formula":{"ladder":["Onto whom?  →  direct object","How far?  →  measure","In what way?  →  manner","About what?  →  respect"]},"short":"The idea","gist":"the fence round the verb","type":"rule","oneLine":"The accusative fences the verb in — it says how far the action goes.","mnemonic":"The nominative crowns; the accusative fences.","mnemonicWhy":"Every use is a fence post: onto whom (object), how far (measure), in what way (manner), about what (respect).","spotIt":"Two families. Does it act like a noun, or like an adverb?","examples":[{"ref":"The whole chapter in one line","greek":null,"english":"One object with four twists — Echo, Two, Sub, Alias — then the MMR shot: Measure, Manner, Respect.","note":"Noun-like first, adverb-like second."}],"tags":["accusative","ch-2"],"tile":"The fence"},{"id":"double-accusative-complement","set":"accusative","group":"accusative-substantival","name":"Double Accusative — Object and Complement","pic":"🎖️","eli5":"You call the thing a name. “He gave his life AS a ransom.” The word “as” slips right in.","formula":{"pattern":["verb","the thing","what you call it"],"filled":["he gave","his life","as a ransom"],"note":"Both are accusative. The second one is not a second victim — it is a label."},"short":"Complement","gist":"Calls it something","tile":"C","oneLine":"Two accusatives, where the second says what the first is called or made.","mnemonic":"CADETS — C: complement, you Call it something.","mnemonicWhy":"One test, one word: put “as” between the two accusatives. “His life AS a ransom.” “You AS friends.” If “as” fits, the second one is the complement.","spotIt":"Two accusatives with no “and” between them, and “as” slips in: object + complement.","bookDef":"A verb requires more than one accusative object to complete the thought, taking either (1) a personal and impersonal object or (2) a direct and predicate object.","examples":[{"ref":"Mark 10:45","greek":"δοῦναι *τὴν ψυχὴν* αὐτοῦ *λύτρον* ἀντὶ πολλῶν","english":"to give his *life* as a *ransom* for many","note":"life is the object, ransom is what it was given as. “As” slips right in."},{"ref":"John 15:15","greek":"οὐκέτι λέγω *ὑμᾶς* *δούλους* … *ὑμᾶς* δὲ εἴρηκα *φίλους*","english":"I no longer call *you* *servants* … but I have called *you* *friends*","note":"Same construction twice in one verse. You are the object; servants and friends are what you get called."},{"ref":"1 Tim 2:6","greek":"ὁ δοὺς *ἑαυτὸν* *ἀντίλυτρον* ὑπὲρ πάντων","english":"who gave *himself* as *a ransom* for all","note":"himself is the object, ransom is the label."}],"watchOut":"Not apposition. Apposition renames something by what it already is; a complement says what it is being called, made or given as — and there is a verb doing the calling.","tags":["accusative","substantival","ch-2"]},{"id":"accusative-apposition","set":"accusative","group":"accusative-substantival","name":"Accusative of Apposition","pic":"🏷️","eli5":"Two stickers again, on the catcher. “They picked Stephen, a good man.”","formula":{"pattern":["verb","X,","Y"],"filled":["they chose","Stephen,","a man full of faith"]},"short":"Apposition","gist":"Alias — renames the object","tile":"A","oneLine":"A second accusative that renames the first. No verb between them.","mnemonic":"CADETS — A: alias, the name tag on the object.","mnemonicWhy":"The same sticker you met in the nominative, now stuck on the catcher.","spotIt":"Two accusatives, no verb between them, and the second answers “which one, exactly?”","bookDef":"Two accusatives are juxtaposed, both referring to the same person or thing, with the second accusative further specifying the first accusative.","examples":[{"ref":"Acts 6:5","greek":"ἐξελέξαντο Στέφανον, *ἄνδρα* πλήρη πίστεως","english":"they chose Stephen, *a man* full of faith","note":"Stephen is the object; “a man” renames him."},{"ref":"Matt 2:6","greek":"ποιμανεῖ τὸν λαόν μου *τὸν Ἰσραήλ*","english":"he will shepherd my people, *Israel*","note":"Israel renames “my people”."},{"ref":"Matt 21:5","greek":"καὶ ἐπὶ πῶλον *υἱὸν* ὑποζυγίου","english":"and on a colt, *the foal* of a donkey","note":"υἱόν renames πῶλον. One animal, two names."}],"watchOut":"Not a complement. Apposition has no verb doing the naming: the two words simply sit side by side and the second one says which one, exactly.","tags":["accusative","substantival","ch-2"]},{"id":"direct-object","set":"accusative","group":"accusative-substantival","name":"Direct Object","pic":"🧤","eli5":"This is the catcher. “I hit Ivan.” Ivan got hit.","formula":{"pattern":["verb","whom / what?"],"filled":["I hit","Ivan"]},"short":"Direct object","gist":"catches the action","tile":"D","oneLine":"What the verb lands on. By far the most common one.","mnemonic":"CADETS — D: the verb throws, the object catches.","mnemonicWhy":"The plain one, and the trunk the other four grow off. Get this solid first.","spotIt":"After the verb, ask: whom? what?","bookDef":"Serves as the recipient of the action.","examples":[{"ref":"English drill","greek":null,"english":"I hit *Ivan*.","note":"Ivan catches the hitting."},{"ref":"John 3:16","greek":"οὕτως γὰρ ἠγάπησεν ὁ θεὸς *τὸν κόσμον*","english":"For God so loved *the world*","note":"The world is what the loving lands on."},{"ref":"Mark 1:16","greek":"εἶδεν *Σίμωνα*","english":"he saw *Simon*","note":"Ask the verb “whom?” and the accusative answers."}],"tags":["accusative","substantival","ch-2"],"watchOut":"A few verbs take their object in the genitive or the dative instead — ἀκούω, κρατέω, προσκυνέω. The case follows the verb, not the meaning."},{"id":"cognate-accusative","set":"accusative","group":"accusative-substantival","name":"Cognate Accusative","pic":"🔁","eli5":"The word says the doing-word again. “Sing a song.” “Fight a fight.”","formula":{"pattern":["verb","its own noun"],"filled":["fight","the good fight"]},"short":"Cognate","gist":"Echoes the verb","tile":"E","oneLine":"An object that repeats the verb — same root, or same idea.","mnemonic":"CADETS — E: echo, the object repeats the verb.","mnemonicWhy":"Say the verb and hear it come straight back: sing a song, fight a fight, shepherd a flock.","spotIt":"Say the verb and the object out loud. Sounds redundant in English? Cognate.","bookDef":"Aligned with the verb either with regard to the lexical root or the idea conveyed.","examples":[{"ref":"1 Tim 1:18","greek":"στρατεύῃ … *τὴν καλὴν στρατείαν*","english":"fight *the good fight*","note":"The same root twice — the tightest echo there is."},{"ref":"Matt 2:10","greek":"ἐχάρησαν *χαρὰν μεγάλην* σφόδρα","english":"they rejoiced *with great joy* exceedingly","note":"ἐχάρησαν and χαράν are the same root. The echo is the whole point — it turns the volume up."},{"ref":"English drill","greek":null,"english":"I shepherd *a flock*.","note":"Not the same root, but the same idea. That counts too."},{"ref":"English drill","greek":null,"english":"I sing *a song*.","note":"The textbook one."}],"watchOut":"Still the direct object. “Cognate” only names the flavour.","tags":["accusative","substantival","ch-2"]},{"id":"double-accusative-person-thing","set":"accusative","group":"accusative-substantival","name":"Double Accusative — Person and Thing","pic":"2️⃣","eli5":"Two catchers, and one of them is a person. “Ask Dad for bread.” Dad and bread both catch it.","formula":{"pattern":["verb","the person","the thing"],"filled":["he asks","him","for bread"],"note":"Both are accusative. Neither one is a label — they are two real objects."},"short":"Two — person + thing","gist":"Ask him for bread","tile":"T","oneLine":"Two accusatives: somebody, and the thing done to them.","mnemonic":"CADETS — T: two catchers, a person and a thing.","mnemonicWhy":"You ASK a person FOR a thing. You TEACH a person A LESSON. Two objects, and “as” will not go between them — “asks him as bread” is nonsense.","spotIt":"Two accusatives, one of them a person, and “as” will not fit between them.","bookDef":"A verb requires more than one accusative object to complete the thought, taking either (1) a personal and impersonal object or (2) a direct and predicate object.","examples":[{"ref":"Matt 7:9","greek":"ὃν αἰτήσει ὁ υἱὸς *αὐτὸν* *ἄρτον*","english":"if his son asks *him* for *bread*","note":"him (a person) + bread (a thing). “Asks him as bread” is nonsense, so it is not a complement."},{"ref":"John 14:26","greek":"ἐκεῖνος *ὑμᾶς* διδάξει *πάντα*","english":"he will teach *you* *all things*","note":"you (person) + all things (thing). Teaching verbs do this constantly."},{"ref":"English drill","greek":null,"english":"They taught *the class* *Greek*.","note":"Two objects, no label. The class is not “being called” Greek."}],"watchOut":"The usual verbs are asking, teaching, reminding, clothing and anointing — verbs that naturally take somebody and something.","tags":["accusative","substantival","ch-2"],"kindsLabel":"The verbs that take a person and a thing","kinds":[{"name":"Asking","note":"αἰτέω — asks him for bread"},{"name":"Teaching","note":"διδάσκω — teaches you all things"},{"name":"Reminding","note":"ὑπομιμνῄσκω"},{"name":"Clothing and anointing","note":"ἐνδύω, χρίω"}]},{"id":"accusative-subject-infinitive","set":"accusative","group":"accusative-substantival","name":"Accusative Subject of the Infinitive","pic":"🏃","eli5":"Usually this one catches the ball. Not here — here it throws. “I want HIM to go.” He is the one going.","formula":{"pattern":["for","X","to verb"],"filled":["for","him","to go away"],"note":"X is accusative — and X is the one doing it."},"short":"Sub — subj. of inf.","gist":"Subject of the infinitive","tile":"S","oneLine":"An infinitive's subject is accusative, not nominative.","mnemonic":"CADETS — S: sub, the infinitive's own subject.","mnemonicWhy":"The odd one out — this accusative is doing the action, not catching it.","spotIt":"Find the infinitive, then the accusative that is doing it rather than receiving it.","bookDef":"Functions as the subject of an infinitive, indicating the agent performing the action conveyed by the infinitive.","examples":[{"ref":"Pattern","greek":null,"english":"…for *him* to go away","note":"“Him” is the one going. In Greek that word is accusative."},{"ref":"John 1:48","greek":"πρὸ τοῦ σε *Φίλιππον* φωνῆσαι … εἶδόν σε","english":"Before *Philip* called you … I saw you","note":"φωνῆσαι is the infinitive, and Philip is the one doing the calling — accusative, but the doer."},{"ref":"Acts 1:3","greek":"παρέστησεν *ἑαυτὸν* ζῶντα","english":"he presented *himself* alive","note":"Careful — this one is a plain object, not a subject. There is no infinitive for it to be the subject of."}],"watchOut":"The only accusative you translate as the doer — and only when there is an infinitive for it to be the subject of. No infinitive, no sub.","tags":["accusative","substantival","ch-2"]},{"id":"accusative-measure","set":"accusative","group":"accusative-adverbial","name":"Accusative of Measure","pic":"📏","eli5":"How far? How long? “He walked a little bit.”","formula":{"pattern":["verb","how far?"],"filled":["going","a little farther"]},"short":"Measure","gist":"how far, how long","tile":"M","oneLine":"How far, how long, how much.","mnemonic":"MMR, shot one: How far?","mnemonicWhy":"The MMR shot, one of three. This is the one with a tape measure on it.","spotIt":"Ask: how far? how long? Does the accusative answer?","bookDef":"Functions in essence like an adverb in that it specifies measure (time or space).","examples":[{"ref":"Matt 26:39 ESV","greek":"καὶ προσελθὼν *μικρόν*, ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ","english":"And going *a little farther* he fell on his face","note":"μικρόν measures the distance. It is not the object of anything."}],"tags":["accusative","adverbial","ch-2"]},{"id":"accusative-manner","set":"accusative","group":"accusative-adverbial","name":"Accusative of Manner","pic":"🎭","eli5":"How did you do it? “He gave it for free.”","formula":{"pattern":["verb","how?"],"filled":["justified","freely"]},"short":"Manner","gist":"how it was done","tile":"M","oneLine":"How the action is done.","mnemonic":"MMR, shot two: How?","mnemonicWhy":"The MMR shot, two of three. It turns a noun into an adverb: δωρεάν stops being “a gift” and becomes “freely”.","spotIt":"Ask: how? Check that an -ly word is the natural English.","bookDef":"Functions in essence like an adverb in that it specifies manner.","examples":[{"ref":"Rom 3:24","greek":"δικαιούμενοι *δωρεὰν* τῇ αὐτοῦ χάριτι","english":"being justified *freely* by his grace","note":"δωρεάν = freely, as a gift. It describes how the justifying happened."}],"tags":["accusative","adverbial","ch-2"]},{"id":"accusative-respect","set":"accusative","group":"accusative-adverbial","name":"Accusative of Respect","pic":"🎯","eli5":"Only one part of you is meant. “Cut to the heart” — the heart is the part that hurt, not your skin.","formula":{"pattern":["verb","as to what?"],"filled":["pierced","as to the heart"]},"short":"Respect","gist":"true in one way only","tile":"R","oneLine":"In one way only — put “with respect to” in front of it.","mnemonic":"MMR, shot three: How so? — slot in \"as to\".","mnemonicWhy":"The MMR shot, three of three, and the narrowest fence. The verb happened, but only in one respect, and this names which.","spotIt":"Say it with “with respect to” in front. If that rescues the sense, this is it.","bookDef":"Restricts the reference of the verbal action, indicating in what regard an action is represented as true.","examples":[{"ref":"Acts 2:37","greek":"ἀκούσαντες δὲ κατενύγησαν *τὴν καρδίαν*","english":"when they heard this they were pierced *to the heart*","note":"Not a surgical piercing but an inner one: the book spells the sense out as “pierced with reference to the heart”, and “with respect to” is what keeps it from sounding like an operation."}],"watchOut":"Easy to mistake for the object. If “with respect to” makes it better, it is respect.","tags":["accusative","adverbial","ch-2"]},{"id":"genitive-source","set":"genitive","group":"genitive-adjectival","name":"Source","pic":"⛲","eli5":"It flowed out of that. “Righteousness of God” means righteousness FROM God.","formula":{"pattern":["head noun","of X"],"filled":["the righteousness","of God"],"note":"= that comes FROM X."},"short":"Source","gist":"came from it","tile":"S","oneLine":"Where the head word came from.","mnemonic":"SWAMP RD — S: where it came from.","mnemonicWhy":"Swap “of” for “from” and see whether it still works. “The righteousness from God.”","spotIt":"Try “from” in place of “of”. Still makes sense? Source.","bookDef":"Indicates the origin of the head noun (“from”).","examples":[{"ref":"Rom 10:3","greek":"τὴν *τοῦ θεοῦ* δικαιοσύνην","english":"the righteousness *of God*","note":"The righteousness comes from God. Swap in “from” and it still reads."}],"watchOut":"Separation also translates “from”. Source is where a noun came from; separation is what a verb moves away from.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-partitive","set":"genitive","group":"genitive-adjectival","name":"Partitive","pic":"🍕","eli5":"The “of” word is the big pile. The other word is your piece. “One of the boats.”","formula":{"pattern":["one","of X"],"filled":["one","of the boats"],"note":"The genitive is the WHOLE. The head noun is the part."},"short":"Partitive","gist":"the Whole, not the slice","tile":"W","oneLine":"The genitive is the whole; the head word is a piece of it.","mnemonic":"SWAMP RD — W: the genitive is the whole pie, the head word your slice.","mnemonicWhy":"Backwards from what you expect: the word in the genitive is the bigger thing, not the smaller one.","spotIt":"Ask: is the genitive word the whole that the other word is a piece of?","bookDef":"Whether by itself or in conjunction with the preposition ἀπό or ἐκ, the articular noun in the genitive denotes the whole of which the head noun is a part.","examples":[{"ref":"Luke 5:3","greek":"ἓν *τῶν πλοίων*","english":"one *of the boats*","note":"The boats are the whole; the one boat is the part."}],"watchOut":"Often turns up with ἀπό or ἐκ, and the genitive noun carries the article.","tags":["genitive","adjectival","ch-3"],"kindsLabel":"How it gets written","kinds":[{"name":"On its own","note":"the bare genitive: “one of the boats”"},{"name":"With ἀπό or ἐκ","note":"the same idea, spelled out with a preposition"}]},{"id":"genitive-attributive","set":"genitive","group":"genitive-adjectival","name":"Attributive","pic":"🖌️","eli5":"“The word of his power” really means “his POWERFUL word.” Squish it into a describing word.","formula":{"pattern":["head noun","of X"],"filled":["the word","of his power"],"note":"→ his POWERFUL word. X becomes the adjective."},"short":"Attributive","gist":"could be an Adjective","tile":"A","oneLine":"A quality of the head word — it could have been an adjective.","mnemonic":"SWAMP RD — A: turn the genitive into an adjective.","mnemonicWhy":"“The word of his power” → “his powerful word.” If the genitive can become the adjective, and saying it that way is stronger, it is attributive.","spotIt":"Try rewriting the genitive as an adjective in front of the head noun. Does it work?","bookDef":"Denotes an attribute or innate quality of the head term, conveying an emphatic adjectival idea.","examples":[{"ref":"Heb 1:3","greek":"τῷ ῥήματι *τῆς δυνάμεως* αὐτοῦ","english":"by his *powerful* word","note":"“Word of power” becomes “powerful word”. That rewrite is the test."}],"watchOut":"Description is the vaguer cousin. Attributive earns its name because the genitive really does become an adjective.","tags":["genitive","adjectival","ch-3"]},{"id":"genitive-material","set":"genitive","group":"genitive-adjectival","name":"Material or Content","pic":"🥛","eli5":"What it is made of, or what is in it. “A cup of water” is full of water.","formula":{"pattern":["head noun","of X"],"filled":["a cup","of water"],"note":"= made of X, or full of X."},"short":"Material","gist":"Made of it, full of it","tile":"M","oneLine":"What it is made of, or what is inside it.","mnemonic":"SWAMP RD — M: made of it, or full of it.","mnemonicWhy":"Cargo of gold is made of gold. A cup of water is full of water. One case, two flavours.","spotIt":"Ask: made of what? or full of what?","bookDef":"Indicates the material of which the head term is made or specifies the content of an object or abstract noun.","examples":[{"ref":"Rev 18:12","greek":"γόμον *χρυσοῦ*","english":"cargo *of gold*","note":"Material — the cargo is made of gold."},{"ref":"Mark 9:41","greek":"ποτήριον *ὕδατος*","english":"a cup *of water*","note":"Content — the cup is full of water."}],"tags":["genitive","adjectival","ch-3"],"kindsLabel":"What it can say","kinds":[{"name":"Made of it","note":"the material the head noun is made from"},{"name":"Full of it","note":"the content of a container or an abstract noun"}]},{"id":"genitive-possession","set":"genitive","group":"genitive-adjectival","name":"Possession","pic":"🔑","eli5":"It is his. “The house of Philip” means Philip’s house.","formula":{"pattern":["head noun","of X"],"filled":["the house","of Philip"],"note":"= X’s. Try the apostrophe-s."},"short":"Possession","gist":"belongs to them","tile":"P","oneLine":"It belongs to X.","mnemonic":"SWAMP RD — P: whose? Try the apostrophe-s.","mnemonicWhy":"“The house of Philip” → “Philip’s house.” If the apostrophe-s works and means he owns it, it is possession.","spotIt":"Rewrite it with ’s. Does it mean he owns the thing?","bookDef":"Identifies ownership with regard to the noun it modifies, often employing the use of a possessive pronoun.","examples":[{"ref":"Acts 21:8","greek":"καὶ εἰσελθόντες εἰς τὸν οἶκον *Φιλίππου*","english":"we entered the house *of Philip*","note":"Philip’s house. He owns it."}],"watchOut":"Relationship takes an apostrophe-s too — “Zebedee’s son”. Owning a thing
